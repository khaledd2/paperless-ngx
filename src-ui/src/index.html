<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <title>شفت</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#17541f" />
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <pngx-root></pngx-root>
  <script>
    // Pages served by Django get their stylesheet from documents/views.py, which
    // knows the language of the signed-in user. This is Angular's own index.html,
    // used by `ng serve` and by any deploy that serves it directly, so it has to
    // swap in the right-to-left bundle itself. Only ever one of the two applies:
    // a mirrored utility such as `.ms-2` sets margin-right in the RTL build but
    // margin-left in the default one, so loading both would apply both.
    if (document.documentElement.dir === 'rtl') {
      const ltr = document.querySelector(
        'link[rel="stylesheet"][href="styles.css"]'
      )
      if (ltr) {
        ltr.disabled = true
        const rtl = document.createElement('link')
        rtl.rel = 'stylesheet'
        rtl.href = 'styles-rtl.css'
        document.head.appendChild(rtl)
      }
    }
  </script>
</body>
</html>
