*Show … lines** value\n    so there is less to read.\n\n## Reading the lines\n\nThe log is shown in a dark, evenly spaced panel, and each line is shaded\naccording to how serious it is:\n\n| Marked as | Meaning |\n| --- | --- |\n| **DEBUG** | Detail intended for troubleshooting; usually safe to ignore. |\n| plain lines | Ordinary information: something was done, or is about to be. |\n| **WARNING** | Something unexpected happened, but the work continued. |\n| **ERROR** | Something failed. This is where to start reading. |\n| **CRITICAL** | The failure was serious enough that part of the installation stopped. |\n\nA line normally records the time, the part of the system that wrote it, and the\nmessage. A failure is usually followed by the reason, and sometimes by a\nlonger technical explanation on the lines beneath it.\n\n!!! warning\n\n    Log lines are written for administrators. They can contain file names,\n    document titles, e-mail subjects and addresses, and other details about your\n    archive's contents, so treat a copied log the same way you would treat the\n    documents themselves.\n\n## A quick example\n\nKarim's team reported that supplier invoices stopped arriving from the mailbox\nduring the night.\n\nHe opens **Logs** and picks the **mail.log** tab. He switches **Auto refresh**\noff, sets **Show** to a few hundred **lines**, and reads the last entries: every\ncheck of the account for several hours ends with an **ERROR** line, and the line\nbelow it names the reason — the mailbox has stopped accepting the saved password.\n\nHe confirms the same thing from the [Tasks](tasks.md) page, where the mail\nfetching tasks are listed as needing attention, and tells his colleague to\ncreate a new password for the mailbox in [Mail](../automation/mail.md). The next morning the\n**mail.log** tab shows successful checks again, and the invoices are back in the\narchive.\n\nIf the reason had not been obvious in the log, Karim would have copied the last\nfew **ERROR** lines into a message to whoever maintains the server.\n","ar":"---\ntitle: السجلات\n---\n\n# السجلات (Logs)\n\nتيح لك **Logs** قراءة ما كان التثبيت يكتبه أثناء عمله. وهي أول مكان تنظر فيه\nعندما لا يحدث شيء كما توقّعت وتريد معرفة السبب. وتقع في الشريط الجانبي تحت\n**Administration**، وتصف نفسها بأنها *Review the log files for the application\nand for email checking.*\n\n!!! note\n\n    يظهر **Logs** للمدراء وحدهم. وإن لم يكن في الشريط الجانبي بند **Logs** فحسابك\n    لا يملك حقّ قراءتها.\n\n## السجلات الثلاثة (The three logs)\n\nكل سجلّ تبويبة مستقلة في أعلى الصفحة، مسمّاة باسم السجلّ الذي تعرضه. ولا تحصل على\nتبويبة إلا السجلات الموجودة فعلًا في تثبيتك.\n\n| التبويبة | ما يُكتب فيها |\n| --- | --- |\n| **paperless.log** | السجلّ الرئيسي للتطبيق: معالجة المستندات وترتيبها، وتطبيق سير العمل والقواعد، وكل خطأ يقع في الطريق. |\n| **mail.log** | ما جرى في كل مرّة فُحص فيها حساب بريد: أي الرسائل نُظر فيها، وأيها استُورد، وأيها رُفض أو فشل. |\n| **celery.log** | العمّال العاملون في الخلفية والذين ينفّذون العمل — معالجة الملفات، وإرسال البريد، وتشغيل المهام المجدولة والفحوص الدورية. |\n\n## عناصر التحكم (The controls)\n\n| العنصر | ما يفعله |\n| --- | --- |\n| **Show** _number_ **lines** | كم من السجلّ يُقرأ، محسوبًا من أحدث سطر إلى الخلف. والقيمة الابتدائية 5000، ويمكنك زيادتها أو إنقاصها بمئات. |\n| **Auto refresh** | مُشغَّل افتراضيًا. تُعيد الصفحة قراءة السجلّ كل بضع ثوانٍ، فتظهر الأسطر الجديدة من تلقاء نفسها بينما تراقب. |\n| **Jump to bottom** | زرّ عائم يظهر بمجرد أن تمرّر بعيدًا عن أحدث سطر. والضغط عليه يعيدك إلى النهاية ويستأنف المتابعة. |\n\nوأثناء جلب السجلّ تقول الصفحة **Loading...**.\n\n!!! tip\n\n    أحدث المدخلات في أسفل الصفحة. وإن كنت تتبع مشكلة وقعت في وقت معروف، فأوقف\n    **Auto refresh** أولًا حتى تتوقّف الصفحة عن الحركة تحت مؤشّرك، وأنقص قيمة\n    **Show … lines** فيقلّ ما تقرأه.\n\n## قراءة السطور (Reading the lines)\n\nيُعرض السجلّ في لوحة داكنة متساوية التباعد، ويُظلّل كل سطر حسب جسامة الأمر:\n\n| مُعلَّم بـ | المعنى |\n| --- | --- |\n| **DEBUG** | تفاصيل مخصّصة لاستكشاف الأخطاء؛ يمكن تجاهلها عادةً. |\n| الأسطر العادية | معلومات اعتيادية: شيء جرى، أو على وشك أن يجري. |\n| **WARNING** | وقع شيء غير متوقّع، لكن العمل استمر. |\n| **ERROR** | فشل شيء. ومن هنا يبدأ القراءة. |\n| **CRITICAL** | كان الفشل جسيمًا بما يكفي ليتوقّف جزء من التثبيت. |\n\nويسجّل السطر عادةً الوقت، والجزء الذي كتبه، والرسالة. ويتبع الفشلَ عادةً سببه،\nوأحيانًا شرح تقني أطول في الأسطر تحته.\n\n!!! warning\n\n    سطور السجلّ مكتوبة للمدراء. وقد تحتوي أسماء ملفات وعناوين مستندات ومواضيع\n    بريد وعناوين إلكترونية وغيرها من تفاصيل محتوى أرشيفك، فتعامل مع السجلّ المنسوخ\n    كما تتعامل مع المستندات نفسها.\n\n## مثال سريع\n\nأبلغ فريق كريم أن فواتير المورّدين توقّفت عن الوصول من صندوق البريد أثناء الليل.\n\nيفتح **Logs** ويختار تبويبة **mail.log**. يوقف **Auto refresh**، ويضبط **Show** على\nبضع مئات من **lines**، ويقرأ المدخلات الأخيرة: كل فحص للحساب على مدى ساعات ينتهي\nبسطر **ERROR**، والسطر تحته يذكر السبب — توقّف صندوق البريد عن قبول كلمة السرّ\nالمحفوظة.\n\nويتأكّد من الأمر نفسه في صفحة [المهام (Tasks)](tasks.md) حيث تُدرج مهام جلب البريد\nبين ما يحتاج انتباهه، ويطلب من زميله إنشاء كلمة سرّ جديدة لصندوق البريد في\n[البريد (Mail)](../automation/mail.md). وفي صباح اليوم التالي تُظهر تبويبة **mail.log**\nفحوصًا ناجحة من جديد، وقد عادت الفواتير إلى الأرشيف.\n\nولو لم يكن السبب واضحًا في السجلّ لنسخ كريم أسطر **ERROR** الأخيرة في رسالة إلى\nمن يدير خادمه.\n"},{"id":"tasks","title":{"en":"Tasks","ar":"المهام"},"fileEn":"administration/tasks.md","fileAr":"administration/tasks.ar.md","en":"---\ntitle: Tasks\n---\n\n# Tasks\n\n**Tasks** is the record of everything the installation has been asked to do, and\nwhat came of it. It lives in the sidebar under **Administration**, and the page\ndescribes itself as *Tasks shows detailed information about document consumption\nand system tasks.*\n\nReading it tells you why a document you were expecting is not in the archive\nyet, whether an overnight mail check did anything, and what a failure was. The\nsidebar entry also carries a red badge with the number of tasks that need\nattention, so you can see at a glance that something went wrong even when you are\nnot on the page.\n\n## The sections\n\nThe list is split into sections, chosen with the buttons at the top left of the\npage. Each button carries the number of tasks in that section when it is not\nempty.\n\n| Section | Contains |\n| --- | --- |\n| **All** | Everything, grouped by section. |\n| **Needs attention** | Tasks that failed or were stopped before they finished. The count sits in a red badge, and it is also the number on the sidebar entry. |\n| **In progress** | Tasks that are waiting to start or are running right now. |\n| **Recently completed** | Tasks that finished successfully. |\n\n## Narrowing the list\n\n| Control | What it does |\n| --- | --- |\n| **Filter by** — the type menu | Shows only one kind of task. It opens with **All types**; see the list of types below. |\n| **Filter by** — the source menu | Shows only tasks that came from one place. It opens with **All sources**; see the list of sources below. |\n| The search box | Looks for text either in the **Name** of the task or in its **Result**, which you choose on the small menu to the left of the box. A search starts once you have typed at least three characters; pressing Enter applies it immediately and Escape clears it. |\n| **Reset filters** | Appears as soon as any filter is in use, and clears all of them. |\n| **Auto refresh** | On by default; the list is rebuilt every few seconds while you are on the page. |\n| The page numbers | The list shows 25 tasks at a time. |\n\nWith nothing left to show, the page says **No tasks match the current filters.**\n\n## The list\n\n| Column | Meaning |\n| --- | --- |\n| The tick box | Selects a task, so that you can dismiss several at once. The tick box at the top of a column selects every task in that section. |\n| **Name** | The name of the file for an incoming document, or the kind of task otherwise. The small line beneath it names the type of task and where it came from. |\n| **Created** | When the task was queued. |\n| **Results** | What happened. Long results are shortened in the column; hover to read more, or press to open the full detail. |\n| **Info** | On a narrow screen this replaces the **Results** column, and opens the detail. |\n| **Actions** | **Dismiss** removes the entry from the list. **Open Document** appears when the task produced a document and opens it. |\n\nOpening the detail of a task shows:\n\n| Part | Meaning |\n| --- | --- |\n| **Result message** | The same outcome as in the column, in full. |\n| **Duplicate** | When a file was recognised as one the archive already has, the document it matches, with an **Open** button. |\n| **Input data** | What the task was given — for a document, its file name and the options that were used. |\n| **Result data** | The technical outcome: the new document's number, a reason, or the error. |\n\nCommon result messages you will see are *Success. New document id N created*,\n*Duplicate of document #N*, or the reason the document was not added at all.\n\n## Dismissing tasks\n\nThe list is meant for looking, not for keeping. Once you have read a task you can\nput it away:\n\n1. Either tick the tasks you want to put away, or leave the list unticked to work\n   on everything currently visible.\n2. Press the blue button at the top right. It reads **Dismiss visible** when\n   nothing is selected and **Dismiss selected** when something is.\n3. If more than one task is about to be dismissed, a window asks **Confirm\n   Dismiss** with the question *Dismiss N tasks?* — press **Dismiss** to go\n   ahead.\n\nWhile something is selected, a **Clear selection** button appears next to it to\nundo the ticks.\n\n!!! warning\n\n    Dismissing a task only removes the entry from this list. It does not undo\n    what the task did: a document that was imported stays imported, and one that\n    failed is not tried again by dismissing it. To have a document processed\n    again, use the document's own actions — see\n    [Working with many documents at once](../documents/bulk.md).\n\n## The kinds of task\n\n| Type | What it does |\n| --- | --- |\n| **Consume File** | Adds a file to the archive: reading it, running text recognition, and applying automatic matching. |\n| **Train Classifier** | Re-learns your filing habits from the documents you have already named and tagged, so that suggestions improve. |\n| **Sanity Check** | The periodic check for damaged documents and other inconsistencies. |\n| **Mail Fetch** | Checks a mail account and imports whatever its rules match. |\n| **LLM Index** | Prepares the index used by the optional AI features. |\n| **Empty Trash** | The scheduled removal of documents that have been in the trash long enough. |\n| **Check Workflows** | Runs the workflows that are due. |\n| **Bulk Update** | Applies a change to many documents at once. |\n| **Reprocess Document** | Runs one document through processing again. |\n| **Build Share Link** | Prepares a public share link and the copy of the document it serves. |\n| **Bulk Delete** | Removes many documents at once. |\n\n## Where tasks come from\n\n| Source | Meaning |\n| --- | --- |\n| **Scheduled** | The installation did it by itself, on its own timetable. |\n| **Web UI** | Somebody asked for it in the web interface. |\n| **API Upload** | A file arrived from another program that is allowed to add documents. |\n| **Folder Consume** | A file appeared in a folder the installation watches. |\n| **Email Consume** | A message was imported from a mail account. |\n| **System** | The installation's own housekeeping. |\n| **Manual** | Somebody started it directly. |\n\n## A quick example\n\nEvery Monday morning Mounir checks the archive for the weekend's post.\n\nThe sidebar shows a red badge next to **Tasks**, so he opens it. **Needs\nattention** holds two entries. He sets **Filter by** to **Consume File** and\nreads them: both are scans that the office sent on Saturday, and both carry the\nresult *Duplicate of document #N* with a **Duplicate** panel he can open.\n\nUnder **Recently completed** he finds the rest of the weekend's work, and the\n**Mail Fetch** entries tell him the supplier mailbox was checked as usual. He\nopts to show only **Mail Fetch** tasks for that, then presses **Dismiss visible**\nto clear them out of the way. Finally he selects the two duplicates, presses\n**Dismiss selected**, and confirms **Dismiss** — the archive stays as it is, and\nthe list is now empty of everything he has read.\n","ar":"---\ntitle: المهام\n---\n\n# المهام (Tasks)\n\n**Tasks** هو سجلّ كل ما طُلب من التثبيت فعله، وما آل إليه. ويقع في الشريط الجانبي\nتحت **Administration**، وتصف الصفحة نفسها بأنها *Tasks shows detailed information\nabout document consumption and system tasks.*\n\nوقراءتها تخبرك لماذا لم يصل بعد مستند كنت تنتظره، وهل فعل فحص البريد الليلي\nشيئًا، وما كان سبب فشل وقع. ويحمل بند الشريط الجانبي أيضًا شارة حمراء بعدد\nالمهام التي تحتاج انتباهك، فترى بنظرة أن شيئًا ساء حتى وأنت خارج الصفحة.\n\n## الأقسام (The sections)\n\nتُقسَّم القائمة إلى أقسام تُختار بالأزرار في أعلى يسار الصفحة. ويحمل كل زرّ عدد\nالمهام فيه عندما لا يكون فارغًا.\n\n| القسم | ما يحتوي |\n| --- | --- |\n| **All** | كل شيء، مرتَّبًا بحسب الأقسام. |\n| **Needs attention** | المهام التي فشلت أو أُوقفت قبل أن تكتمل. ويقع العدد في شارة حمراء، وهو العدد نفسه الظاهر على بند الشريط الجانبي. |\n| **In progress** | المهام التي تنتظر البدء أو تعمل الآن. |\n| **Recently completed** | المهام التي انتهت بنجاح. |\n\n## تضييق القائمة (Narrowing the list)\n\n| العنصر | ما يفعله |\n| --- | --- |\n| قائمة **Filter by** للنوع | تعرض نوعًا واحدًا من المهام. وتُفتح على **All types**؛ راجع قائمة الأنواع أدناه. |\n| قائمة **Filter by** للمصدر | تعرض المهام التي جاءت من مكان واحد فقط. وتُفتح على **All sources**؛ راجع قائمة المصادر أدناه. |\n| صندوق البحث | يبحث عن نصّ في **Name** المهمة أو في **Result**، وأنت تختار أيّهما من القائمة الصغيرة على يسار الصندوق. ويبدأ البحث بعد كتابة ثلاثة أحرف على الأقل؛ ويُطبّقه Enter فورًا، ويمسحه Escape. |\n| **Reset filters** | يظهر بمجرد استعمال أي مرشّح، ويمسحها كلها. |\n| **Auto refresh** | مُشغَّل افتراضيًا؛ وتُبنى القائمة من جديد كل بضع ثوانٍ وأنت في الصفحة. |\n| أرقام الصفحات | تعرض القائمة 25 مهمّة في المرة الواحدة. |\n\nوإذا لم يبقَ ما يُعرض تقول الصفحة **No tasks match the current filters.**\n\n## القائمة (The list)\n\n| العمود | معناه |\n| --- | --- |\n| مربّع العلامة | يحدّد مهمّة، حتى تُخفي عدة مهام معًا. ويمثّل مربّع العلامة في أعلى العمود تحديدًا لكل مهام ذلك القسم. |\n| **Name** | اسم الملفّ في حال مستند وارد، أو نوع المهمّة فيما عدا ذلك. ويسمّي السطر الصغير تحته نوع المهمّة ومصدرها. |\n| **Created** | متى وُضعت المهمّة في قائمة الانتظار. |\n| **Results** | ما جرى. وتُختصر النتائج الطويلة في العمود؛ مرّر المؤشّر لقراءة المزيد، أو انقر لفتح التفصيل كاملًا. |\n| **Info** | على شاشة ضيّقة يحلّ هذا العمود محلّ **Results**، ويفتح التفصيل. |\n| **Actions** | **Dismiss** يحذف المدخل من القائمة. ويظهر **Open Document** عندما أنتجت المهمّة مستندًا، فيفتحه. |\n\nويفتح تفصيل المهمّة ما يلي:\n\n| الجزء | معناه |\n| --- | --- |\n| **Result message** | النتيجة نفسها التي في العمود، لكن كاملة. |\n| **Duplicate** | عندما يُتعرَّف على ملفّ بأن الأرشيف لديه مثله، يظهر المستند المطابق مع زرّ **Open**. |\n| **Input data** | ما أُعطي للمهمّة — وفي حال مستند، اسم ملفّه والخيارات التي استُعملت. |\n| **Result data** | النتيجة التقنية: رقم المستند الجديد، أو سبب، أو الخطأ. |\n\nومن الرسائل الشائعة التي تراها *Success. New document id N created*، أو\n*Duplicate of document #N*، أو سبب عدم إضافة المستند أصلًا.\n\n## إخفاء المهام (Dismissing tasks)\n\nالقائمة للنظر لا للحفظ. فمتى قرأت مهمّة يمكنك إبعادها:\n\n1. إمّا أن تعلّم المهام التي تريد إبعادها، وإمّا أن تترك القائمة بلا تعليم لتتعامل\n   مع كل ما هو ظاهر الآن.\n2. اضغط الزرّ الأزرق في أعلى اليمين. يقرأ **Dismiss visible** عندما لا شيء\n   محدَّد، و**Dismiss selected** عندما يكون هناك تحديد.\n3. وإذا كانت أكثر من مهمّة على وشك الإخفاء، تسأل نافذة **Confirm Dismiss** مع\n   السؤال *Dismiss N tasks?* — اضغط **Dismiss** للمتابعة.\n\nوأثناء وجود تحديد يظهر بجانبه زرّ **Clear selection** لإلغاء التعليمات.\n\n!!! warning\n\n    إخفاء مهمّة يحذف المدخل من هذه القائمة فقط. وهو لا يتراجع عمّا فعلته المهمّة:\n    فالمستند الذي استُورد يبقى مستوردًا، والمهمّة التي فشلت لا تُعاد بمجرد إخفائها.\n    ولإعادة معالجة مستند استعمل إجراءات المستند نفسه — راجع\n    [العمل على عدة مستندات معًا (Working with many documents at once)](../documents/bulk.md).\n\n## أنواع المهام (The kinds of task)\n\n| النوع | ما يفعله |\n| --- | --- |\n| **Consume File** | يضيف ملفًا إلى الأرشيف: قراءته، وتشغيل التعرّف على النصّ، وتطبيق المطابقة التلقائية. |\n| **Train Classifier** | يعيد تعلّم عادات ترتيبك من المستندات التي سمّيتها ووسمتها، فتتحسّن الاقتراحات. |\n| **Sanity Check** | الفحص الدوري عن المستندات التالفة وغيرها من التناقضات. |\n| **Mail Fetch** | يفحص حساب بريد ويستورد ما تطابقه قواعده. |\n| **LLM Index** | يهيّئ الفهرس الذي تستعمله ميزات الذكاء الاصطناعي الاختيارية. |\n| **Empty Trash** | الإزالة المجدولة للمستندات التي طال بقاؤها في المهملات. |\n| **Check Workflows** | يشغّل سير العمل المستحقّ. |\n| **Bulk Update** | يطبّق تغييرًا على عدة مستندات معًا. |\n| **Reprocess Document** | يعيد معالجة مستند واحد من جديد. |\n| **Build Share Link** | يهيّئ رابط مشاركة عامًّا والنسخة التي يقدّمها من المستند. |\n| **Bulk Delete** | يحذف عدة مستندات معًا. |\n\n## من أين تأتي المهام (Where tasks come from)\n\n| المصدر | معناه |\n| --- | --- |\n| **Scheduled** | فعله التثبيت بنفسه وفق جدوله الزمني. |\n| **Web UI** | طلبه أحدهم من واجهة الويب. |\n| **API Upload** | وصل ملفّ من برنامج آخر مسموح له بإضافة المستندات. |\n| **Folder Consume** | ظهر ملفّ في مجلّد يراقبه التثبيت. |\n| **Email Consume** | استُوردت رسالة من حساب بريد. |\n| **System** | أعمال الصيانة الداخلية للتثبيت. |\n| **Manual** | بدأها أحدهم مباشرة. |\n\n## مثال سريع\n\nيتفقّد منير الأرشيف كل صباح اثنين بحثًا عن بريد نهاية الأسبوع.\n\nيظهر في الشريط الجانبي شارة حمراء بجانب **Tasks**، فيفتحه. ويضمّ **Needs\nattention** مدخلين. يضبط **Filter by** على **Consume File** فيقرأهما: كلاهما\nمسحتان أرسلهما المكتب يوم السبت، وكلتاهما تحمل النتيجة *Duplicate of document\n#N* مع لوحة **Duplicate** يمكنه فتحها.\n\nوفي **Recently completed** يجد بقية عمل نهاية الأسبوع، ومدخلات **Mail Fetch**\nتخبره أن صندوق بريد المورّد فُحص كما هو معتاد. فيختار عرض مهام **Mail Fetch**\nوحدها لذلك، ثم يضغط **Dismiss visible** لإبعادها عن طريقه. وأخيرًا يحدّد\nالمكرّرين معًا ويضغط **Dismiss selected** ويؤكّد **Dismiss** — فيبقى الأرشيف كما\nهو، وتخلو القائمة من كل ما قرأه.\n"},{"id":"backup","title":{"en":"Backup and restore","ar":"النسخ الاحتياطي والاستعادة"},"fileEn":"administration/backup.md","fileAr":"administration/backup.ar.md","en":"---\ntitle: Backup and Restore\n---\n\n# Backup and Restore\n\nPaperless-ngx is your archive, and an archive is only as good as its backup. This\npage explains what a complete backup of Paperless-ngx has to contain, how the\nbuilt-in export and import fit into that, and what is *not* a backup.\n\n!!! note\n\n    There is no **Backup** button in the web interface. Backups are made by the\n    person who installed and maintains your server — either with the export\n    tool that comes with Paperless-ngx, or by copying the storage areas, or\n    both. If you are an everyday user rather than the administrator, this page\n    is worth reading so that you know what to ask for; then hand the work on.\n\n## What a backup has to contain\n\nThree things together make a complete backup of a Paperless-ngx installation:\n\n| Part | What it holds |\n| --- | --- |\n| The documents themselves | Every stored file, including the originals and, where applicable, the archived versions and thumbnails. |\n| The archive's records | Everything you have built up around the files: titles, dates, tags, correspondents, document types, storage paths, custom fields, notes, saved views, workflows, mail accounts and rules, share links, and the users, groups and permissions. |\n| The auxiliary data | The smaller working files the installation keeps beside the documents. The search index can be rebuilt from the documents if it cannot be saved, but the rest cannot. |\n\nCopying only the document files is therefore not enough: you would get the paper\nback, but none of the ordering, naming or access rules that make it an archive.\n\n## The three ways to back up\n\nWhich route is available depends on how your installation is run.\n\n| How Paperless-ngx runs | How to back it up |\n| --- | --- |\n| In containers | Copy the storage areas the containers are given. There are usually three or four of them: the documents, the auxiliary data, and — if a database server is run the same way — the database itself. This is the simplest route, because it is a plain copy of everything. |\n| Directly on a computer | Copy the whole Paperless-ngx folder, and, if the installation uses a separate database server, a copy of that database as well. Put it back the way it was and the installation works again. |\n| Any installation | Use the built-in exporter, described next. It needs no knowledge of where things are stored and produces something you can read, keep and move. |\n\nIf the server is run the first or second way, the copy has to include the working\ndata as well as the documents. Whichever route you use, keep the finished backup\nsomewhere other than the machine the archive runs on — a second disk, a network\nlocation, or wherever your organisation keeps its other backups.\n\n## The built-in exporter and importer\n\nPaperless-ngx ships with two utilities that are run by the administrator from\noutside the web interface:\n\n- the **document exporter**, which writes the whole installation out to a folder\n  you choose, or to a single packaged file;\n- the **document importer**, which reads that output back into a fresh\n  installation.\n\nWhat is worth knowing about them:\n\n- An export contains the documents, their files, their metadata and the\n  configuration around them — so it is both a backup and a way to move an archive\n  to another computer or into another document system.\n- An export is an exact picture of **one version** of Paperless-ngx. Export and\n  import must be done with the same version; an export taken before an upgrade\n  cannot be read back after it.\n- The export deliberately leaves out the **API tokens** that programs use to talk\n  to the archive. Those have to be created again after an import, in\n  [Authentication, users, groups & permissions](../getting-started/authentication.md).\n- Running the exporter again over an export you already have updates it rather\n  than starting from the beginning, so a backup can be refreshed cheaply and kept\n  in step with the archive.\n- There is a variant that exports the records only, without the document files.\n  It exists for the case where you are moving between database programs and for\n  other special situations.\n- An import has to go into a **completely empty** installation — no documents\n  and no records at all.\n\n!!! danger\n\n    An import is not a merge. Pointing the importer at a running installation\n    that already has documents in it is not a way to add the contents of a backup\n    to what is already there. Restore into an empty installation instead, or ask\n    the administrator to do it for you.\n\n## Before and after\n\n1. Make sure nothing is being added at the time: ask everyone to stop uploading\n   for a few minutes while the backup runs, so that a document is not caught\n   half-finished.\n2. Take the backup.\n3. Satisfy yourself that it worked: the backup should be roughly as large as the\n   documents it contains, and the newest files in it should be from today.\n4. Move the backup off the machine the archive runs on.\n5. If you used the exporter, keep the version of Paperless-ngx it was taken from\n   written down with it. That note is what makes it possible to restore it.\n\n## What is not a backup\n\nIt is easy to mistake a convenient feature for a backup. None of these replaces\none:\n\n| Not a backup | Why |\n| --- | --- |\n| Downloading documents from the web interface, one by one or in bulk | You get the files, but not the titles, dates, tags, owners, notes or share links. See [Working with many documents at once](../documents/bulk.md). |\n| A public share link | It points at a document inside the archive and stops working when the link expires. It is a way of showing a document, not of keeping a copy. See [Sharing and permissions](../documents/sharing.md). |\n| A saved view | Only a filter. It stores no documents at all. See [Saved Views](../automation/saved-views.md). |\n| A copy kept on the same computer as the archive | Survives a mistake, but not a failed disk, a fire, or a theft. |\n\nAnd one thing to keep clear in the other direction: whatever is sitting in the\ntrash is on its way out, because the installation empties the trash by itself\nafter a set delay. If you want something kept, restore it — see\n[Deleting and restoring documents](../documents/trash.md) — before you rely on the\narchive as your backup.\n\n## Restoring\n\nA restore is done by whoever maintains the server, and which of the three routes\nyou used decides how it goes:\n\n- **From a copy of the storage areas or the whole folder**, put the copy back\n  where it came from and start the installation again. If a database server was\n  part of the copy, restore that too.\n- **From an export**, import it into a completely empty installation of the same\n  version, and then create the API tokens again.\n\n!!! note\n\n    Try a restore before you need one. A backup that has never been read back is\n    only a hope; reading an export into a test installation once is the surest\n    way to know that your routine works, and it tells you how long a real restore\n    would take.\n\n## A quick example\n\nNadia administers the archive at a clinic. The clinic runs Paperless-ngx on one\nsmall server, and the scans, the invoices and fifteen years of patient\ncorrespondence live in it.\n\nOnce a week, on Sunday evening when nobody is uploading, she takes an export of\nthe whole installation onto an external disk, and writes the version number of\nPaperless-ngx on the label. The same disk copy is then mirrored to the clinic's\nnetwork backup, so two copies exist outside the server. Once a month she copies\nthe newest export into a test installation on her own laptop and opens a handful\nof documents to be sure the backup really reads back.\n\nOne Tuesday the server's disk fails. Because the previous Sunday's export is\nintact and its version number is recorded, she rebuilds the installation on a new\nmachine from that export, creates the API tokens again for the two programs that\nfeed the archive, and by the next morning the clinic is working from a complete\narchive — including the tags, correspondents and permissions, which no amount of\ndownloading files by hand would have brought back.\n","ar":"---\ntitle: النسخ الاحتياطي والاستعادة\n---\n\n# النسخ الاحتياطي والاستعادة (Backup and Restore)\n\nPaperless-ngx هو أرشيفك، والأرشيف لا يساوي أكثر من نسخته الاحتياطية. تشرح هذه\nالصفحة ما يجب أن يشمله النسخ الاحتياطي الكامل لـ Paperless-ngx، وكيف يندرج\nالتصدير والاستيراد المدمجان في ذلك، وما **ليس** نسخًا احتياطيًا.\n\n!!! note\n\n    لا يوجد زرّ **Backup** في واجهة الويب. فالنسخ الاحتياطي يقوم به من ثبّت خادمك\n    ويديره — إمّا بأداة التصدير التي تأتي مع Paperless-ngx، وإمّا بنسخ أماكن\n    التخزين، وإمّا بالاثنين معًا. وإن كنت مستخدمًا عاديًا لا مديرًا فقراءة هذه\n    الصفحة تفيدك لتعرف ما تطلبه؛ ثم سلّم العمل لغيره.\n\n## ما يجب أن يشمله النسخ الاحتياطي (What a backup has to contain)\n\nثلاثة أشياء معًا تصنع نسخة احتياطية كاملة لتثبيت Paperless-ngx:\n\n| الجزء | ما يضمّه |\n| --- | --- |\n| المستندات نفسها | كل ملفّ مخزَّن، بما فيه الملفّات الأصلية والنسخ المؤرشفة والصور المصغّرة حيث تنطبق. |\n| سجلّات الأرشيف | كل ما بنيته حول الملفّات: العناوين والتواريخ والوسوم والمراسلون وأنواع المستندات ومسارات التخزين والحقول المخصّصة والملاحظات والعروض المحفوظة وسير العمل وحسابات البريد وقواعده وروابط المشاركة والمستخدمون والمجموعات والصلاحيات. |\n| البيانات المساعدة | الملفّات العاملة الأصغر التي يحتفظ بها التثبيت بجانب المستندات. ويمكن إعادة بناء فهرس البحث من المستندات إن تعذّر حفظه، أما الباقي فلا. |\n\nونسخ ملفّات المستندات وحدها لا يكفي: فتستعيد الورق، لكن من دون الترتيب والتسمية\nوقواعد الوصول التي تجعله أرشيفًا.\n\n## الطرق الثلاث للنسخ الاحتياطي (The three ways to back up)\n\nتتوقّف الطريقة المتاحة على كيفية تشغيل تثبيتك.\n\n| كيف يعمل Paperless-ngx | كيف يُنسخ احتياطيًا |\n| --- | --- |\n| في حاويات (containers) | انسخ أماكن التخزين الممنوحة للحاويات. وهي عادةً ثلاثة أو أربعة: المستندات، والبيانات المساعدة، وقاعدة البيانات نفسها إن كانت تُشغَّل بالطريقة نفسها. وهذه أبسط طريقة، لأنها نسخ صِرف لكل شيء. |\n| مباشرةً على حاسوب | انسخ مجلّد Paperless-ngx كله، ومعه نسخة من قاعدة البيانات إن كان التثبيت يستعمل خادم قاعدة بيانات مستقلًا. وأعِدْه كما كان فيعمل التثبيت من جديد. |\n| أي تثبيت | استعمل المُصدِّر المدمج الموصوف تاليًا. فهو لا يحتاج معرفة أين تُخزَّن الأشياء، وينتج شيئًا يمكنك قراءته وحفظه ونقله. |\n\nوإذا كان الخادم يُدار بالطريقة الأولى أو الثانية، فعلى النسخة أن تشمل بيانات\nالعمل كما تشمل المستندات. وأيّ الطرق استعملت، فاحفظ النسخة الجاهزة في مكان غير\nالحاسوب الذي يعمل عليه الأرشيف — قرص ثانٍ، أو موقع على الشبكة، أو حيث تحفظ\nمؤسّستك نسخها الأخرى.\n\n## المُصدِّر والمستورد المدمجان (The built-in exporter and importer)\n\nيأتي Paperless-ngx بأداتين يشغّلهما المدير من خارج واجهة الويب:\n\n- **مُصدِّر المستندات (document exporter)**، ويكتب التثبيت كله في مجلّد تختاره، أو\n  في ملفّ واحد مُحزَّم؛\n- **مستورد المستندات (document importer)**، ويقرأ ذلك الناتج إلى تثبيت جديد.\n\nوما يستحقّ معرفته عنهما:\n\n- يحتوي التصدير على المستندات وملفّاتها وبياناتها الوصفية والإعدادات المحيطة بها —\n  فهو إذن نسخة احتياطية وطريقة لنقل أرشيف إلى حاسوب آخر أو إلى نظام مستندات آخر.\n- التصدير صورة مطابقة لـ**إصدار واحد** من Paperless-ngx. فيجب أن يجري التصدير\n  والاستيراد بالإصدار نفسه؛ فتصدير أُخذ قبل الترقية لا يمكن قراءته بعدها.\n- يترك التصدير قصدًا **رموز API** التي تستعملها البرامج للتخاطب مع الأرشيف. ويجب\n  إنشاؤها من جديد بعد الاستيراد، في\n  [المصادقة والمستخدمون والمجموعات والصلاحيات (Authentication, users, groups & permissions)](../getting-started/authentication.md).\n- وتشغيل المُصدِّر مرّة أخرى على تصدير لديك يحدّثه بدل أن يبدأ من الصفر، فيمكن\n  تحديث النسخة الاحتياطية بتكلفة زهيدة وإبقاؤها مواكبة للأرشيف.\n- وهناك صيغة تُصدِّر السجلّات وحدها من دون ملفّات المستندات. وهي موجودة لحال\n  الانتقال بين برامج قواعد بيانات ولأحوال خاصة أخرى.\n- ويجب أن يذهب الاستيراد إلى تثبيت **فارغ تمامًا** — بلا مستندات وبلا سجلّات.\n\n!!! danger\n\n    الاستيراد ليس دمجًا. فإحالة المستورد على تثبيت قائم فيه مستندات ليست طريقة\n    لإضافة محتوى نسخة احتياطية إلى ما هو موجود. استعد إلى تثبيت فارغ بدلًا من ذلك،\n    أو اطلب من المدير أن يفعلها لك.\n\n## قبل النسخ وبعده (Before and after)\n\n1. تأكّد من أن لا شيء يُضاف في وقت النسخ: اطلب من الجميع التوقّف عن الرفع لبضع\n   دقائق حتى لا يُلتقط مستند نصف معالَج.\n2. خُذ النسخة الاحتياطية.\n3. تأكّد من نجاحها: ينبغي أن تكون بحجم المستندات التي تحتويها تقريبًا، وأن تكون\n   أحدث ملفّاتها بتاريخ اليوم.\n4. انقل النسخة إلى مكان غير الحاسوب الذي يعمل عليه الأرشيف.\n5. وإن استعملت المُصدِّر، فاكتب معه إصدار Paperless-ngx الذي أُخذ منه. فهذه\n   الملاحظة هي ما يجعل استعادته ممكنة.\n\n## ما ليس نسخًا احتياطيًا (What is not a backup)\n\nمن السهل أن يُلتبس عليك أمر ميزة مريحة فتظنّها نسخة احتياطية. ولا شيء من هذه يحلّ\nمحلّها:\n\n| ليس نسخًا احتياطيًا | لماذا |\n| --- | --- |\n| تنزيل المستندات من واجهة الويب، واحدًا واحدًا أو دفعةً واحدة | تحصل على الملفّات، لكن بلا العناوين والتواريخ والوسوم والمالكين والملاحظات وروابط المشاركة. راجع [العمل على عدة مستندات معًا (Working with many documents at once)](../documents/bulk.md). |\n| رابط مشاركة عامّ | إنه يدلّ على مستند داخل الأرشيف ويتوقّف عن العمل عند انتهاء الرابط. فهو طريقة لعرض مستند، لا لحفظ نسخة. راجع [المشاركة والصلاحيات (Sharing and permissions)](../documents/sharing.md). |\n| عرض محفوظ | مجرّد مرشّح. وهو لا يخزّن أي مستند. راجع [العروض المحفوظة (Saved Views)](../automation/saved-views.md). |\n| نسخة محفوظة على الحاسوب نفسه الذي يعمل عليه الأرشيف | تنجو من خطأ، لكن لا من قرص تالف أو حريق أو سرقة. |\n\nوأمر يجب إيضاحه في الاتجاه المقابل: ما يجلس في المهملات في طريقه إلى الزوال، لأن\nالتثبيت يُفرّغ المهملات بنفسه بعد مهلة محدَّدة. فإن أردت بقاء شيء فاستعده — راجع\n[حذف المستندات واستعادتها (Deleting and restoring documents)](../documents/trash.md)\n— قبل أن تعتمد على الأرشيف كنسخة احتياطية.\n\n## الاستعادة (Restoring)\n\nيقوم بالاستعادة من يدير الخادم، وأيّ الطرق الثلاث استعملت يحدّد كيف تجري:\n\n- **من نسخة لأماكن التخزين أو للمجلّد كله**: أعِد النسخة إلى مكانها وشغّل التثبيت\n  من جديد. وإن كان خادم قاعدة بيانات جزءًا من النسخة فأعِده أيضًا.\n- **من تصدير**: استورده إلى تثبيت فارغ تمامًا بالإصدار نفسه، ثم أنشئ رموز API من\n  جديد.\n\n!!! note\n\n    جرّب الاستعادة قبل أن تحتاجها. فالنسخة التي لم تُقرأ مرة لم تكن إلا أملًا؛\n    وقراءة تصدير في تثبيت تجريبي مرّة واحدة هي أضمن طريقة للتأكّد من أن روتينك\n    يعمل، وهي تخبرك كذلك كم تستغرق استعادة حقيقية.\n\n## مثال سريع\n\nتدير نادية الأرشيف في عيادة. تشغّل العيادة Paperless-ngx على خادم صغير واحد، وفيه\nالمسحات والفواتير وخمسة عشر عامًا من مراسلات المرضى.\n\nمرّة في الأسبوع، مساء الأحد حين لا يرفع أحد شيئًا، تأخذ تصديرًا للتثبيت كله إلى\nقرص خارجي، وتكتب رقم إصدار Paperless-ngx على الملصق. ثم تُنسخ النسخة ذاتها إلى\nنسخ العيادة الاحتياطية على الشبكة، فتوجد نسختان خارج الخادم. ومرّة في الشهر تنسخ\nأحدث تصدير إلى تثبيت تجريبي على حاسوبها المحمول وتفتح عددًا من المستندات لتتأكّد\nأن النسخة تُقرأ فعلًا.\n\nوفي أحد الثلاثاءات يتلف قرص الخادم. ولأن تصدير الأحد الماضي سليم ورقم إصداره\nمسجّل، تبني التثبيت من جديد على حاسوب جديد من ذلك التصدير، وتنشئ رموز API من جديد\nللبرنامجين الذي يغذّي الأرشيف، فيعمل العيادة صباح اليوم التالي من أرشيف كامل —\nبما فيه الوسوم والمراسلون والصلاحيات، وهو ما لم يكن تنزيل الملفّات يدويًا ليعيده.\n"}]},{"id":"advanced","title":{"en":"Optional & Advanced","ar":"اختياري ومتقدّم"},"items":[{"id":"ai","title":{"en":"AI features","ar":"ميزات الذكاء الاصطناعي"},"fileEn":"advanced/ai.md","fileAr":"advanced/ai.ar.md","en":"---\ntitle: AI Features\n---\n\n# AI Features\n\nPaperless-ngx can borrow a *large language model* — the kind of AI behind modern\nchat assistants — to help you work with your archive. Two things use it:\n\n- **the chat**, a button in the top bar that answers questions about your\n  documents in plain language;\n- **AI suggestions**, which propose a title, tags, a correspondent, and a\n  document type for a document you are filing.\n\nBoth are optional, and both stay away until an administrator turns them on.\nNothing about your day-to-day work changes while they are off.\n\n!!! warning \"Your documents leave the server\"\n\n    While the AI features are on, the text of the documents involved is sent to\n    the AI provider your installation is set up to use. That provider may be a\n    model running on your own server, but it is often a hosted, paid service on\n    the internet. Treat the AI features the way you would treat uploading the\n    documents to that provider yourself, and ask your administrator which\n    provider is in use.\n\n## The chat in the top bar\n\nWhen the AI features are on, a chat-shaped button appears in the top bar, just\nleft of the **Notifications** bell. It is there on every page of the app.\n\n1. Click the button. A small panel opens holding the conversation so far and a\n   text box.\n2. Type a question and press `Enter`, or click **Send**.\n3. The answer is written out as it is produced, with a blinking cursor at the\n   end while the assistant is still typing, so you can read along instead of\n   waiting.\n4. Beneath an answer, the documents the assistant used are listed as links.\n   Clicking one opens it, so you can check the answer against the original.\n\nThe box waits for one answer at a time: it is disabled until the answer being\nwritten has finished.\n\n### One document, or all of them\n\nThe chat follows the page you are on, and the text box tells you which it is:\n\n| Where you are | What the box says | What the chat answers from |\n| --- | --- | --- |\n| The documents list, the dashboard, or anywhere else | **Ask a question about a document...** | Every document you are allowed to view |\n| A single document is open | **Ask a question about this document...** | That document only |\n\nThe conversation already on screen stays as it is when you move around; the\nquestions you ask from a document belong to that document.\n\n!!! note\n\n    The chat can only read what you can read. Answers about the whole archive are\n    built from documents you have permission to view, and asking about one\n    document requires permission to view that document. If you cannot see a\n    document in the app, the chat will not show it to you either.\n\nIf an answer cannot be produced, the panel shows **Error receiving response.**\nTry the question again, and tell your administrator if it keeps happening.\n\n## AI suggestions while you file a document\n\nSuggestions themselves are not new. A Paperless-ngx installation has always been\nable to propose a title, tags, a correspondent, a document type, and a date by\nlearning from the way you have filed your existing documents. The AI features add\na second engine for the same job, which reads the document's own text instead of\ncomparing it with your past filings. You do not have to choose between them: the\nbutton behaves the same way either way, and what changes is only where the answer\ncomes from.\n\nOpen a document and look at the buttons above the form on the **Details** tab:\n\n- **Suggest** asks for suggestions. The number on the button is how many were\n  found, and a small spinner replaces the label while the answer is on its way.\n- The arrow beside it opens the list, described as **Show suggestions**. The\n  results are grouped under **Tags**, **Document Types**, and **Correspondents**:\n  click a suggestion to apply it. Anything already on the document is left out,\n  and when there is nothing new the menu says **No novel suggestions**.\n\nNothing is stored until you press **Save**, so a suggestion you do not like costs\nnothing — ignore it, or press **Discard**.\n\n!!! tip\n\n    A freshly imported document that still carries an inbox tag has its\n    suggestions fetched for you, so the count is often already there by the time\n    you open it. See [Editing Document Details](../documents/editing.md) for the\n    rest of that form.\n\nIf suggestions cannot be retrieved, the app reports **Error retrieving\nsuggestions.** Nothing is lost; simply try again, or fill the fields in by hand.\n\n## The index that makes answers good\n\nAn assistant can only answer from what it has been given. Alongside the AI\nfeatures, an installation can build an index of the text and details of every\ndocument and keep it up to date. When answering, the chat looks up the most\nrelevant passages first, which usually makes its answers shorter and far more\ntrustworthy than handing it a single document.\n\nThe index is refreshed on a schedule, normally once a day. Administrators can\nwatch it on the [System Status](../administration/system-status.md) page, where it appears as\n**AI Index** with its **Last Run** time, and can press **Run Task** to build it\nagain straight away — for example after importing a large batch of documents.\n\n## Turning the AI features on and off\n\nAdministrators manage this on the **Configuration** page, under\n**Administration** in the sidebar. The page explains that its options apply to\n**every** user of the installation, and that the value chosen there takes\nprecedence over settings made elsewhere.\n\nThe **AI Settings** tab holds these cards:\n\n| Card | What it decides |\n| --- | --- |\n| **AI Enabled** | The master switch. Until it is on, the chat button does not appear for anyone and suggestions come from the ordinary classifier. |\n| **LLM Backend** | Which kind of AI is used: a hosted service that follows the common OpenAI style, or a model running on your own machine. |\n| **LLM Model** | Which model answers — for example a larger one for better answers, or a smaller one for speed and lower cost. |\n| **LLM API Key** | The credential used to reach a hosted provider. |\n| **LLM Endpoint** | The web address of the provider, or of the model running on your own machine. |\n| **LLM Embedding Backend** | Which kind of model turns document text into the index described above. |\n| **LLM Embedding Model** | The model used for that index. |\n\nEach card carries an information button that opens the online documentation for\nthat setting, and **Reset** to put it back to its default. Changes are kept only\nwhen you press **Save**; **Cancel** leaves everything as it was. The **AI\nEnabled** card carries the reminder that enabling AI has privacy consequences,\nespecially with a model that runs somewhere else.\n\n!!! warning\n\n    A hosted AI provider is usually a paid service. What it charges your account,\n    and the terms on which it handles what you send, are outside Paperless-ngx.\n    Every question and every document handed to it is subject to those terms.\n\n## A quick example\n\nLayla is asked what her electricity provider charged over the last two years. She\ndoes not want to open six bills one by one, so she stays on the documents list\nand opens the chat.\n\nThe box says **Ask a question about a document...**, a reminder that the whole\narchive is within reach. She types *\"How much did we pay the electricity company\neach year since 2025?\"* and reads the answer as it streams in. Two document\ntitles appear underneath it; she clicks the older one and checks the figure\nagainst the bill itself.\n\nLater she opens a freshly scanned invoice and presses **Suggest**. The menu\nproposes the correspondent “Northwind Energy” and the tag “Invoice”, and she\napplies both with two clicks before saving. She never has to know which engine\nproduced them — the classifier or the AI — because from her side the button works\nthe same way.\n\nIf the answers had been vague, she would have told her administrator, who can\ncheck the **AI Index** on the [System Status](../administration/system-status.md) page and\npress **Run Task** to rebuild it.\n","ar":"---\ntitle: ميزات الذكاء الاصطناعي\n---\n\n# ميزات الذكاء الاصطناعي (AI Features)\n\nيستطيع Paperless-ngx أن يستعير *نموذجًا لغويًا كبيرًا* — من نوع الذكاء الاصطناعي\nالذي يقف خلف مساعدي المحادثة الحديثين — لمساعدتك في العمل على أرشيفك. ويستفيد منه\nأمران:\n\n- **المحادثة (chat)**، وهي زرّ في الشريط العلوي يجيب عن أسئلتك حول مستنداتك\n  بلغة عادية؛\n- **اقتراحات الذكاء الاصطناعي**، التي تقترح عنوانًا ووسومًا ومراسلًا ونوع مستند\n  للمستند الذي تعمل على ترتيبه.\n\nوكلاهما اختياري، وكلاهما لا يعمل حتى يُشغّله مدير النظام. ولا يتغيّر شيء في عملك\nاليومي ما دام معطَّلًا.\n\n!!! warning \"مستنداتك تخرج من الخادم\"\n\n    ما دامت ميزات الذكاء الاصطناعي مُشغَّلة، يُرسَل نصّ المستندات المعنية إلى\n    مزوّد الذكاء الاصطناعي الذي ضُبط تثبيتك عليه. وقد يكون ذلك المزوّد نموذجًا\n    يعمل على خادمك أنت، لكنه غالبًا خدمة مستضافة مدفوعة على الإنترنت. فتعامل مع\n    ميزات الذكاء الاصطناعي كما تتعامل مع رفع المستندات إلى ذلك المزوّد بنفسك،\n    واسأل مديرك عن المزوّد المستخدم.\n\n## المحادثة في الشريط العلوي\n\nعند تشغيل ميزات الذكاء الاصطناعي يظهر زرّ بشكل فقاعة محادثة في الشريط العلوي،\nإلى يسار جرس **Notifications**. وهو موجود في كل صفحات التطبيق.\n\n1. اضغط الزرّ. تُفتح لوحة صغيرة تضمّ المحادثة حتى الآن وصندوق نصّ.\n2. اكتب سؤالك واضغط `Enter`، أو اضغط **Send**.\n3. تُكتب الإجابة أثناء إنتاجها، ويظهر مؤشّر وامض في آخرها ما دام المساعد يكتب،\n   فتقرأ معه بدل الانتظار.\n4. وتحت الإجابة تُدرج المستندات التي استعان بها المساعد على شكل روابط. والضغط\n   على أحدها يفتحه، فتقابل الإجابة بأصلها.\n\nوينتظر الصندوق إجابة واحدة في كل مرة: فهو معطَّل حتى تنتهي الإجابة الجارية.\n\n### مستند واحد أم كل المستندات\n\nتتبع المحادثة الصفحة التي أنت فيها، وصندوق النصّ نفسه يخبرك بأيّهما:\n\n| موضعك | ما يقوله الصندوق | ما تجيب منه المحادثة |\n| --- | --- | --- |\n| قائمة المستندات أو لوحة المعلومات أو أي مكان آخر | **Ask a question about a document...** | كل مستند يُسمح لك بعرضه |\n| مستند واحد مفتوح | **Ask a question about this document...** | ذلك المستند وحده |\n\nوتبقى المحادثة المعروضة على الشاشة كما هي عند تنقّلك؛ والأسئلة التي تسألها من\nداخل مستند تخصّ ذلك المستند.\n\n!!! note\n\n    لا تقرأ المحادثة إلا ما تقرأه أنت. فالإجابات عن الأرشيف كلّه تُبنى من\n    المستندات التي تملك صلاحية عرضها، والسؤال عن مستند واحد يتطلّب صلاحية عرض\n    ذلك المستند. وإن لم تستطع رؤية مستند في التطبيق فلن تعرضه لك المحادثة أيضًا.\n\nوإن تعذّر إنتاج إجابة، تعرض اللوحة **Error receiving response.** فأعد السؤال،\nوأخبر مديرك إن تكرّر الأمر.\n\n## اقتراحات الذكاء الاصطناعي أثناء ترتيب المستند\n\nالاقتراحات نفسها ليست جديدة. فثبيت Paperless-ngx كان يستطيع دائمًا أن يقترح\nعنوانًا ووسومًا ومراسلًا ونوع مستند وتاريخًا بأن يتعلّم من طريقة ترتيبك لمستنداتك\nالموجودة. وتضيف ميزات الذكاء الاصطناعي محرّكًا ثانيًا للمهمة نفسها، يقرأ نصّ\nالمستند ذاته بدل مقارنته بترتيباتك السابقة. ولست مضطرًّا للاختيار بينهما: فالزرّ\nيتصرّف بالطريقة نفسها في الحالتين، ولا يتغيّر إلا مصدر الإجابة.\n\nافتح مستندًا وانظر إلى الأزرار فوق النموذج في تبويبة **Details**:\n\n- **Suggest** يطلب الاقتراحات. والرقم على الزرّ هو عدد ما وُجد منها، ويدور مؤشّر\n  صغير مكان الكلمة أثناء انتظار الإجابة.\n- والسهم بجانبه يفتح القائمة الموصوفة بـ **Show suggestions**. وتُجمَّع النتائج\n  تحت **Tags** و**Document Types** و**Correspondents**: فاضغط أيّ اقتراح لتطبيقه.\n  ويُستبعد كل ما هو موجود على المستند بالفعل، وإن لم يكن هناك جديد قالت القائمة\n  **No novel suggestions**.\n\nولا يُخزَّن شيء حتى تضغط **Save**، فاقتراح لا يعجبك لا يكلّفك شيئًا — تجاهله أو\nاضغط **Discard**.\n\n!!! tip\n\n    المستند المستورد حديثًا والذي لا يزال يحمل وسم البريد الوارد تُجلب له\n    الاقتراحات تلقائيًا، فيكون العدد جاهزًا غالبًا قبل أن تفتحه. راجع\n    [تعديل تفاصيل المستند (Editing Document Details)](../documents/editing.ar.md)\n    لبقية ذلك النموذج.\n\nوإن تعذّر جلب الاقتراحات، أبلغك التطبيق بـ **Error retrieving suggestions.** ولم\nيضِع شيء؛ فأعد المحاولة، أو املأ الحقول بيدك.\n\n## الفهرس الذي يجعل الإجابات جيدة\n\nلا يجيب أيّ مساعد إلا من المعطيات التي أُعطيت له. وإلى جانب ميزات الذكاء\nالاصطناعي، يستطيع التثبيت أن يبني فهرسًا لنصوص كلّ المستندات وتفاصيلها ويبقيه\nمحدّثًا. وحين يجيب، تبحث المحادثة أولًا عن أقرب المقاطع صلة بالسؤال، وهذا يجعل\nإجاباتها في الغالب أقصر وأجدر بالثقة بكثير من إعطائها مستندًا واحدًا.\n\nويُحدَّث الفهرس وفق جدول، مرة كل يوم عادةً. ويستطيع المدراء متابعته في صفحة\n[حالة النظام (System Status)](../administration/system-status.ar.md) حيث يظهر باسم **AI\nIndex** مع وقت **Last Run**، والضغط على **Run Task** لإعادة بنائه فورًا — مثلًا\nبعد استيراد دفعة كبيرة من المستندات.\n\n## تشغيل ميزات الذكاء الاصطناعي وإيقافها\n\nيدير المدراء ذلك في صفحة **Configuration** تحت **Administration** في الشريط\nالجانبي. وتوضّح الصفحة أن خياراتها تنطبق على **كل** مستخدمي التثبيت، وأن القيمة\nالمختارة فيها تتقدّم على الإعدادات المضبوطة في مكان آخر.\n\nوتضمّ تبويبة **AI Settings** هذه البطاقات:\n\n| البطاقة | ما تحدّده |\n| --- | --- |\n| **AI Enabled** | المفتاح الرئيسي. وقبل تشغيله لا يظهر زرّ المحادثة لأحد، وتأتي الاقتراحات من المصنّف الاعتيادي. |\n| **LLM Backend** | نوع الذكاء الاصطناعي المستخدم: خدمة مستضافة تتبع النمط الشائع لدى OpenAI، أو نموذج يعمل على جهازك. |\n| **LLM Model** | النموذج الذي يجيب — مثلًا نموذج أكبر لإجابات أفضل، أو أصغر للسرعة وتقليل الكلفة. |\n| **LLM API Key** | بيانات الاعتماد المستخدمة للوصول إلى مزوّد مستضاف. |\n| **LLM Endpoint** | عنوان الويب للمزوّد، أو للنموذج الذي يعمل على جهازك. |\n| **LLM Embedding Backend** | نوع النموذج الذي يحوّل نصوص المستندات إلى الفهرس المذكور أعلاه. |\n| **LLM Embedding Model** | النموذج المستخدم لذلك الفهرس. |\n\nوعلى كل بطاقة زرّ معلومات يفتح الوثائق الإلكترونية الخاصة بذلك الإعداد، وزرّ\n**Reset** لإعادته إلى قيمته الافتراضية. ولا تُحفظ التغييرات إلا عند الضغط على\n**Save**؛ أما **Cancel** فيترك كل شيء كما كان. وتحمل بطاقة **AI Enabled** تنبيهًا\nبأن تشغيل الذكاء الاصطناعي له تبعات على الخصوصية، ولا سيّما مع نموذج يعمل في مكان\nآخر.\n\n!!! warning\n\n    مزوّد الذكاء الاصطناعي المستضاف خدمة مدفوعة عادةً. وما يحمّله على حسابك،\n    والشروط التي يتعامل بها مع ما ترسله، أمور خارج نطاق Paperless-ngx. وكل سؤال\n    وكل مستند يُسلَّم إليه يخضع لتلك الشروط.\n\n## مثال سريع\n\nيُسأل سامر عن المبلغ الذي استهلكته شركة الكهرباء في السنتين الأخيرتين. ولا يريد\nفتح ستّ فواتير واحدة واحدة، فيبقى في قائمة المستندات ويفتح المحادثة.\n\nيقول الصندوق **Ask a question about a document...**، وهو تذكير بأن الأرشيف كلّه في\nمتناول يده. فيكتب *«كم دفعنا لشركة الكهرباء في كل سنة منذ 2025؟»* ويقرأ الإجابة\nوهي تُكتب. ويظهر تحتها عنوانا مستندين؛ فيضغط الأقدم منهما ويقابل الرقم بالفاتورة\nنفسها.\n\nوبعد ذلك يفتح فاتورة ممسوحة حديثًا ويضغط **Suggest**. فتقترح القائمة المراسل\n“Northwind Energy” والوسم “Invoice”، ويطبّق الاثنين بنقرتين قبل الحفظ. ولا يحتاج\nإلى معرفة أيّ محرّك أنتجها — المصنّف أم الذكاء الاصطناعي — لأن الزرّ من جهته يعمل\nبالطريقة نفسها.\n\nولو كانت الإجابات غامضة لأخبر مديره، وهو يستطيع التحقّق من **AI Index** في صفحة\n[حالة النظام (System Status)](../administration/system-status.ar.md) والضغط على **Run Task**\nلإعادة بنائه.\n"},{"id":"barcodes-asn","title":{"en":"Barcodes and ASN","ar":"الباركود ورقم ASN"},"fileEn":"advanced/barcodes-asn.md","fileAr":"advanced/barcodes-asn.ar.md","en":"---\ntitle: Barcodes and Archive Serial Numbers\n---\n\n# Barcodes and Archive Serial Numbers\n\nA printed barcode is a note to Paperless-ngx that travels with the paper. When a\npage carrying one is scanned, the installation reads it and acts on it: it can\nbreak a stack of scans into separate documents, give a document its archive\nserial number, and attach tags — all without anyone typing a thing.\n\nBarcodes are read while a document is being imported, so they work wherever the\nfile came from: a scan in the consume folder, an upload in the browser, or a\nscan sent from the scanner. They are off until an administrator turns them on, and\nthey are read from PDF files — and from TIFF images as well, when that is switched\non with them.\n\nThe *kind* of barcode does not matter — a QR square, the striped code on a\nproduct, a patch-code sheet. Only what the barcode *says* is used.\n\n## The archive serial number (ASN)\n\nThe archive serial number is the number you would write on the paper original if\nyou were keeping a paper archive. You write it once, store that sheet in a binder\nin number order, and from then on the number is the fastest way back from the\ndigital copy to the sheet of paper in your hand.\n\nIn the app the number lives in a few places:\n\n| Where | What it looks like |\n| --- | --- |\n| The **Details** tab of a document | The **Archive serial number** box. The **+1** button beside it fills in the next free number for you. |\n| The documents list | An **ASN** column, once you tick it in **Show**. |\n| **Sort** | Sorting by **ASN** puts your documents in binder order. |\n| The filter bar | Choose **ASN** as the search target and pick **equals**, **is empty**, **is not empty**, **greater than**, or **less than**. |\n\nAn ASN is always a whole number of 1 or more, and it belongs to exactly one\ndocument. Two documents cannot share one.\n\n!!! warning \"A number that is already taken\"\n\n    If a scan arrives carrying a number that another document already uses, the\n    document is *not* imported and an error is recorded — check the\n    [Tasks](../administration/tasks.md) page to see it. A number that is still held by a\n    document in the [trash](../documents/trash.md) counts as taken as well. Numbers\n    outside the allowed range are refused for the same reason.\n\n    Nothing is lost: the file is still there, and it can be imported again after\n    the number is corrected or the other document is emptied from the trash.\n\nIf you do not keep the paper, you never have to fill this in. Nothing in the app\nrequires it.\n\n## Reading a number from a barcode\n\nWhen ASN barcodes are switched on, an administrator also sets a short prefix. A\nbarcode is treated as a number when it starts with that prefix; the prefix is\nthen removed and anything that is not a digit after it is ignored. With the usual\nprefix `ASN`, a barcode reading `ASN00123` gives the document the number **123**.\n\n- Put the barcode on the first page, next to or above the content, the way a\n  library stamp would sit.\n- The page carrying the barcode stays part of the document. This is deliberate:\n  you can stick an ASN label on a page of the document itself and that page is\n  kept.\n- If a file carries several ASN barcodes, each one starts a new document, and the\n  page with the barcode becomes the first page of the document that follows it.\n- A file with no ASN barcode at all is imported as usual, with no number.\n\n!!! note \"Which barcodes can be read\"\n\n    The reader understands the common printed kinds: **Code 39**, **Code 93**,\n    **Code 128**, **Codabar**, **Interleaved 2 of 5**, **EAN-8**, **UPC-A** and\n    **UPC-E**, **QR codes**, and **SQ codes**. Any of them can carry an ASN, a\n    separator, or a tag; you are free to use whichever your label printer or\n    label sheet already offers.\n\n## Splitting a stack with separator barcodes\n\nA separator barcode is a barcode printed on a page of its own, used to tell the\napp \"the next pages belong to a new document\". The usual way to do this is a\nsheet of pre-printed separator pages, such as the PATCH-T pages, whose default\ncode word the installation already knows.\n\nScan a stack with a separator sheet in front of each document and one file comes\nout of the scanner containing several documents. Paperless-ngx splits it:\n\n- the pages *after* a separator sheet become a document of their own;\n- the separator sheet itself is thrown away, so it does not litter your archive\n  with a page of stripes;\n- a stack with no separator in it is imported as a single document, exactly as\n  before.\n\nThere is one alternative arrangement. If an administrator turns on **Retain Split\nPages**, the separator page is kept instead of discarded, and it becomes the\n**first** page of the document it introduces. That suits a scan where the marker\npage carries something you want to read — a cover sheet with a title, for\ninstance.\n\n## Tagging with barcodes\n\nTag barcodes attach tags while the document is being imported, which saves you\nfrom filing a stack by hand afterwards. A tag barcode has to match a pattern the\nadministrator has set up. The pattern that ships with the app is the word `TAG:`\nfollowed by the tag name, so a barcode reading `TAG:invoice` puts the tag\n**invoice** on the document.\n\n- Several barcodes on one line, separated by commas, are all read.\n- Matching ignores upper and lower case.\n- A tag that does not exist yet is created, so a new barcode is enough to start\n  using a new tag.\n- Only the barcodes on a document's own pages are applied to it, which is what\n  makes splitting and tagging work together.\n\n### Splitting on tag barcodes\n\nNormally tag barcodes only tag: they do not separate documents. An administrator\ncan change that with **Split on Tag Barcodes**, which makes a tag barcode behave\nlike an ASN barcode as well:\n\n- the page carrying the tag barcode is kept, and becomes the first page of the\n  document it introduces;\n- each resulting document receives only the tags found on its own pages;\n- several tag barcodes in one stack produce several splits.\n\nThat is useful for a batch scan: put a page with `TAG:invoice` in front of the\ninvoices and one with `TAG:receipt` in front of the receipts, and the single scan\narrives as properly separated, properly tagged documents.\n\n## How the pieces work together\n\n| Combination | What happens |\n| --- | --- |\n| ASN barcodes only | Each ASN barcode starts a new document, and the page carrying it stays with that document. |\n| Separator barcodes only | Each separator sheet starts a new document with the pages after it, and is then discarded. |\n| ASN and separators together | The stack is split first; the number is then read from each part separately. |\n| Tag barcodes with splitting | Each part gets its own tags, and its own ASN if it carries one. |\n\n## The settings, for administrators\n\nAll of this is configured on the **Configuration** page, under **Administration**\nin the sidebar, on the **Barcode Settings** tab. Each option is a card with a\nswitch, a box, or a number, and an information button that opens the online\ndocumentation for that setting; changes are kept with **Save** and dropped with\n**Cancel**.\n\n| Setting | What it does |\n| --- | --- |\n| **Enable Barcodes** | Turns on reading and splitting by separator barcodes. |\n| **Enable TIFF Support** | Also reads TIFF image files, converting them so their barcodes can be found. |\n| **Barcode String** | The code word that counts as a separator. It is already set to the value used by PATCH-T separator sheets, so it normally needs no change. |\n| **Retain Split Pages** | Keeps the separator page and makes it the first page of the new document instead of discarding it. |\n| **Enable ASN** | Turns on reading archive serial numbers from barcodes. |\n| **ASN Prefix** | The short text that marks a barcode as containing an ASN. |\n| **Enable Tag Detection** | Turns on reading tags from barcodes. |\n| **Tag Mapping** | The rules that decide which barcodes count as tags and what tag name each one produces. |\n| **Split on Tag Barcodes** | Makes tag barcodes split documents as well as tag them. |\n| **Upscale** | Enlarges each page before looking for barcodes, for small or fine ones. Only takes effect above 1.0. |\n| **DPI** | The resolution used when a PDF page is turned into an image for reading. Higher values help with small barcodes and cost more time. |\n| **Max Pages** | Limits reading to the first pages of a file, to keep very long scans quick. It is off by default, so every page is checked. |\n\nThe option cards are only shown to someone who is allowed to change them, and the\npage makes clear that a value set there applies to **every** user of the\ninstallation.\n\n## Tips that save trouble\n\n- **Number first, scan second.** Writing or sticking the number on the sheet\n  before it goes through the scanner is what makes the digital copy and the paper\n  copy line up. The label sheet that prints ASN and separator barcodes is the\n  simplest way to do it.\n- **Keep the numbering in one series.** The value of the number is that it sorts:\n  binder order, list order, and shopping for a document all follow it.\n- **Leave the next number to the button.** Pressing **+1** beside **Archive\n  serial number** fills in a number that is free right now, which avoids the\n  collision described above.\n- **Give the reader a clean page.** A barcode that is skewed, faded, creased, or\n  printed very small is missed. Scanning at a higher resolution, or asking an\n  administrator to raise **DPI** or **Upscale**, is the usual cure.\n- **Expect the whole stack to be one file.** Splitting depends on the separator\n  barcode being read; a file with no separator in it is filed as one document.\n- **Barcodes are read on the way in.** Turning the feature on does not renumber\n  or split documents that are already in the archive, so import the affected\n  scans again if you need them numbered.\n- **A blocked import is not a lost file.** When a number is already taken, the\n  file stays where it is and the reason is recorded — read it on the\n  [Tasks](../administration/tasks.md) page, and ask an administrator for the\n  [logs](../administration/logs.md) if it is not clear.\n\n## A quick example\n\nOmar keeps his paper in binders and wants the archive to follow the same order.\nHe prints a sheet of labels with an `ASN` barcode on each, and writes the next\nfree number of his current binder where he sticks each one.\n\nHe scans a bundle of five pages in a single file: a sheet carrying the label\n**1041** followed by the two pages of a service contract, then a sheet carrying\n**1042** followed by an invoice. He drops the resulting PDF into the watched\nfolder.\n\nA few minutes later the archive holds two documents instead of one: the contract\nwith ASN **1041** and the invoice with ASN **1042** — the numbers he wrote on the\npaper. Nothing has to be filed twice, and when a client asks about invoice 1042 he\ntypes the number into the filter bar, chooses **ASN** and **equals**, and the\ndocument is in front of him. When he wants a stack split without numbering it, he\nputs a PATCH-T separator sheet in front of it instead of a numbered label.\n\nWeeks later a colleague scans a page whose label says **1043** by mistake. That\nimport fails instead of silently overwriting the document that already owns the\nnumber he wrote; Omar sees it on the **Tasks** page, corrects the label, and scans\nthe sheet again.\n","ar":"---\ntitle: الباركود ورقم التسلسل الأرشيفي\n---\n\n# الباركود ورقم التسلسل الأرشيفي (Barcodes and Archive Serial Numbers)\n\nالباركود المطبوع رسالة إلى Paperless-ngx تسافر مع الورق. فحين تُمسح صفحة تحمله،\nيقرأه التثبيت ويتصرّف بمقتضاه: يفصل رزمة المسوحات إلى مستندات مستقلة، ويمنح\nالمستند رقمه التسلسلي الأرشيفي، ويُلحق به وسومًا — كل ذلك دون أن يكتب أحد شيئًا.\n\nويُقرأ الباركود أثناء استيراد المستند، فيعمل حيثما جاء الملف: من مسح في مجلّد\nالمعالجة، أو رفع في المتصفح، أو مسح مُرسَل من الماسح. وهو معطَّل حتى يُشغّله مدير\nالنظام، ويُقرأ من ملفات PDF — ومن صور TIFF كذلك، متى شُغّلت قراءتها معه.\n\nولا يهمّ *نوع* الباركود — مربّع QR، أو الرمز المخطّط على المنتجات، أو ورقة\npatch-code. فالمستخدَم هو ما *يقوله* الباركود فقط.\n\n## رقم التسلسل الأرشيفي (ASN)\n\nرقم التسلسل الأرشيفي هو الرقم الذي كنت ستكتبه على الأصل الورقي لو كنت تحتفظ\nبأرشيف ورقي. تكتبه مرّة واحدة، وتحفظ الورقة في ملفّ مرتّبة أرقامه، ومن ثم يصير\nالرقم أسرع طريق من النسخة الرقمية إلى الورقة التي في يدك.\n\nويعيش الرقم في التطبيق في مواضع قليلة:\n\n| الموضع | كيف يظهر |\n| --- | --- |\n| تبويبة **Details** في المستند | صندوق **Archive serial number**. وزرّ **+1** بجانبه يملأ لك الرقم الحرّ التالي. |\n| قائمة المستندات | عمود **ASN**، بعد تأشيره في **Show**. |\n| **Sort** | الترتيب حسب **ASN** يضع مستنداتك بترتيب الملفّات الورقية. |\n| شريط المرشّحات | اختر **ASN** هدفًا للبحث، واختر **equals** أو **is empty** أو **is not empty** أو **greater than** أو **less than**. |\n\nوالرقم دائمًا عدد صحيح لا يقلّ عن 1، ويخصّ مستندًا واحدًا فقط. ولا يمكن أن يتقاسمه\nمستندان.\n\n!!! warning \"رقم محجوز بالفعل\"\n\n    إن وصل مسح يحمل رقمًا يستعمله مستند آخر، فلا يُستورد المستند بل يُسجَّل خطأ —\n    راجع صفحة [المهام (Tasks)](../administration/tasks.ar.md) لرؤيته. والرقم الذي لا يزال\n    مستند في [المهملات (trash)](../documents/trash.ar.md) يحتفظ به يُعدّ محجوزًا هو\n    أيضًا. وتُرفض الأرقام الخارجة عن النطاق المسموح للسبب نفسه.\n\n    ولم يضِع شيء: فالملف لا يزال موجودًا، ويمكن استيراده من جديد بعد تصحيح الرقم\n    أو تفريغ المستند الآخر من المهملات.\n\nوإن كنت لا تحتفظ بالورق فلست مضطرًّا أبدًا إلى ملء هذا الحقل، ولا يفرضه عليك شيء في\nالتطبيق.\n\n## قراءة الرقم من الباركود\n\nعند تشغيل باركودات ASN يضبط مدير النظام كذلك بادئة قصيرة. ويُعدّ الباركود رقمًا\nإذا بدأ بتلك البادئة؛ فتُنزع البادئة ويُهمَل ما ليس رقمًا بعدها. وبالبادئة المعتادة\n`ASN`، يمنح الباركود `ASN00123` المستند الرقم **123**.\n\n- ضع الباركود في الصفحة الأولى، قرب المحتوى أو أعلاه، كما يجلس ختم المكتبة.\n- والصفحة الحاملة للباركود تبقى جزءًا من المستند. وهذا مقصود: فيمكنك لصق ملصق ASN\n  على صفحة من المستند نفسه وتبقى تلك الصفحة.\n- وإن حمل الملف عدة باركودات ASN، بدأ كل واحد منها مستندًا جديدًا، وصارت الصفحة\n  الحاملة للباركود أول صفحة من المستند الذي يليها.\n- والملف الذي لا يحمل باركود ASN يُستورد كالمعتاد، بلا رقم.\n\n!!! note \"أي باركودات يمكن قراءتها\"\n\n    يفهم القارئ الأنواع المطبوعة الشائعة: **Code 39** و**Code 93** و**Code 128**\n    و**Codabar** و**Interleaved 2 of 5** و**EAN-8** و**UPC-A** و**UPC-E**\n    و**QR codes** و**SQ codes**. وأيّ منها يحمل رقم ASN أو فاصلًا أو وسمًا؛ فلك أن\n    تستخدم ما توفّره طابعة الملصقات أو ورقة الملصقات لديك.\n\n## فصل الرزمة بباركودات الفصل\n\nباركود الفصل باركود مطبوع على صفحة مستقلة، يُستعمل لإخبار التطبيق بأن «الصفحات\nالتالية تخصّ مستندًا جديدًا». والطريقة المعتادة هي ورقة صفحات فصل مطبوعة مسبقًا،\nمثل صفحات PATCH-T، فالتثبيت يعرف كلمة الرمز الافتراضية الخاصة بها.\n\nامسح رزمة وفي أوّلها ورقة فصل لكل مستند، فيخرج من الماسح ملف واحد يضمّ عدة\nمستندات. ويفصله Paperless-ngx هكذا:\n\n- الصفحات *التي بعد* ورقة الفصل تصبح مستندًا مستقلًا؛\n- وورقة الفصل نفسها تُهمَل، فلا تُشوّش أرشيفك بصفحة مخطّطة؛\n- والرزمة التي لا فصل فيها تُستورد مستندًا واحدًا، كما كان الحال تمامًا.\n\nوهناك ترتيب بديل واحد. فإن شغّل مدير النظام **Retain Split Pages** بقيَت صفحة\nالفصل بدل إهمالها، وصارت **أول** صفحة من المستند الذي تقدّمه. وهذا يناسب مسحًا\nتحمل فيه صفحة العلامة شيئًا تريد قراءته — صفحة غلاف بعنوان مثلًا.\n\n## الوسم بالباركودات\n\nتُلحق باركودات الوسوم الوسوم أثناء استيراد المستند، فتوفّر عليك ترتيب الرزمة بيدك\nبعد ذلك. ويجب أن يطابق باركود الوسم نمطًا ضبطه مدير النظام. والنمط الذي يأتي مع\nالتطبيق هو كلمة `TAG:` متبوعة باسم الوسم، فالباركود `TAG:invoice` يضع الوسم\n**invoice** على المستند.\n\n- وتُقرأ كذلك عدة باركودات في سطر واحد تفصل بينها فواصل.\n- والمطابقة لا تفرّق بين الحروف الكبيرة والصغيرة.\n- والوسم غير الموجود يُنشأ، فيكفي باركود جديد لبدء استعمال وسم جديد.\n- ولا تُطبَّق على المستند إلا باركودات صفحاته هو، وهذا ما يجعل الفصل والوسم\n  يعملان معًا.\n\n### الفصل على باركودات الوسوم\n\nفي الأصل تكتفي باركودات الوسوم بالوسم ولا تفصل المستندات. ويستطيع مدير النظام\nتغيير ذلك بـ **Split on Tag Barcodes**، فيتصرّف باركود الوسم كباركود ASN أيضًا:\n\n- الصفحة الحاملة لباركود الوسم تبقى، وتصير أول صفحة من المستند الذي تقدّمه؛\n- وكل مستند ناتج يتلقّى الوسوم الموجودة في صفحاته هو فقط؛\n- وتُنتج عدة باركودات وسوم في رزمة واحدة عدة عمليات فصل.\n\nوهذا مفيد في مسح دفعة: ضع صفحة عليها `TAG:invoice` أمام الفواتير وأخرى عليها\n`TAG:receipt` أمام الإيصالات، فيصل المسح الواحد مستندات مفصولة وموسومة كما ينبغي.\n\n## كيف تعمل الأجزاء معًا\n\n| التركيب | ما يحدث |\n| --- | --- |\n| باركودات ASN وحدها | كل باركود ASN يبدأ مستندًا جديدًا، وتبقى الصفحة الحاملة له مع ذلك المستند. |\n| باركودات الفصل وحدها | كل ورقة فصل تبدأ مستندًا جديدًا بالصفحات التي بعدها، ثم تُهمَل. |\n| ASN والفصل معًا | تُفصل الرزمة أولًا، ثم يُقرأ الرقم من كل جزء على حدة. |\n| باركودات الوسوم مع الفصل | كل جزء يتلقّى وسومه هو، ورقمه هو إن حمل باركود ASN. |\n\n## الإعدادات، للمدراء\n\nيُضبط كل ما سبق في صفحة **Configuration** تحت **Administration** في الشريط\nالجانبي، في تبويبة **Barcode Settings**. وكل خيار بطاقة فيها مفتاح أو صندوق أو\nرقم، وزرّ معلومات يفتح الوثائق الإلكترونية الخاصة بذلك الإعداد؛ وتُحفظ التغييرات\nبـ **Save** وتُلغى بـ **Cancel**.\n\n| الإعداد | ما يفعله |\n| --- | --- |\n| **Enable Barcodes** | يشغّل القراءة والفصل بباركودات الفصل. |\n| **Enable TIFF Support** | يقرأ ملفات صور TIFF أيضًا، ويحوّلها ليُعثر على باركوداتها. |\n| **Barcode String** | كلمة الرمز التي تُعدّ فاصلًا. وهي مضبوطة أصلًا على القيمة التي تستعملها صفحات فصل PATCH-T، فلا تحتاج تغييرًا عادةً. |\n| **Retain Split Pages** | يُبقي صفحة الفصل ويجعلها أول صفحة من المستند الجديد بدل إهمالها. |\n| **Enable ASN** | يشغّل قراءة أرقام التسلسل الأرشيفي من الباركودات. |\n| **ASN Prefix** | النصّ القصير الذي يدلّ على أن الباركود يحمل رقم ASN. |\n| **Enable Tag Detection** | يشغّل قراءة الوسوم من الباركودات. |\n| **Tag Mapping** | القواعد التي تحدّد أيّ الباركودات تُعدّ وسومًا وما اسم الوسم الذي ينتجه كل واحد. |\n| **Split on Tag Barcodes** | يجعل باركودات الوسوم تفصل المستندات كما توسمها. |\n| **Upscale** | يكبّر كل صفحة قبل البحث عن الباركودات، للباركودات الصغيرة أو الدقيقة. ولا يعمل إلا فوق 1.0. |\n| **DPI** | الدقّة المستخدمة عند تحويل صفحة PDF إلى صورة للقراءة. والقيم الأعلى تساعد في الباركودات الصغيرة وتكلّف وقتًا أكثر. |\n| **Max Pages** | يحدّ القراءة بأول صفحات الملف، ليبقى المسح الطويل سريعًا. وهو معطَّل افتراضيًا، فتُفحص كل الصفحات. |\n\nولا تظهر بطاقات الخيارات إلا لمن يملك حقّ تغييرها، وتوضّح الصفحة أن القيمة\nالمضبوطة هناك تنطبق على **كل** مستخدمي التثبيت.\n\n## نصائح توفّر المتاعب\n\n- **رقّم أولًا ثم امسح.** كتابة الرقم على الورقة أو لصقه عليها قبل مرورها بالماسح\n  هو ما يجعل النسخة الرقمية والنسخة الورقية متطابقتين. وورقة الملصقات التي تطبع\n  باركودات ASN والفصل هي أسهل طريقة لذلك.\n- **احتفظ بسلسلة ترقيم واحدة.** قيمة الرقم أنه يرتّب: فترتيب الملفّات وترتيب\n  القائمة والبحث عن مستند كلها تتبعه.\n- **اترك الرقم التالي للزرّ.** الضغط على **+1** بجانب **Archive serial number**\n  يملأ رقمًا حرًّا في اللحظة نفسها، فيتجنّب التعارض المذكور أعلاه.\n- **أعطِ القارئ صفحة نظيفة.** الباركود المائل أو الباهت أو المثنّي أو الصغير جدًا\n  يُفوَّت. والمسح بدقّة أعلى، أو طلب رفع **DPI** أو **Upscale** من مدير النظام، هو\n  العلاج المعتاد.\n- **توقّع أن تكون الرزمة ملفًا واحدًا.** فالفصل يتوقّف على قراءة باركود الفصل؛\n  والملف الذي لا فصل فيه يُرتَّب مستندًا واحدًا.\n- **تُقرأ الباركودات عند الدخول.** فتشغيل الميزة لا يعيد ترقيم أو فصل المستندات\n  الموجودة في الأرشيف، فاستورد المسوحات المعنية من جديد إن أردت ترقيمها.\n- **الاستيراد المتوقّف لا يعني ضياع الملف.** فحين يكون الرقم محجوزًا يبقى الملف\n  مكانه ويُسجَّل السبب — اقرأه في صفحة [المهام (Tasks)](../administration/tasks.ar.md)، واطلب\n  من مدير النظام [السجلات (Logs)](../administration/logs.ar.md) إن لم يكن واضحًا.\n\n## مثال سريع\n\nيحفظ عمر ورقَه في ملفّات وريدًا أن يتبع الأرشيف الترتيب نفسه. فيطبع ورقة ملصقات في\nكل واحد منها باركود `ASN`، ويكتب رقم ملفّه الحالي الحرّ التالي حيث يلصق كل ملصق.\n\nيمسح رزمة من خمس صفحات في ملفّ واحد: ورقة تحمل الملصق **1041** تليها صفحتا عقد\nخدمة، ثم ورقة تحمل **1042** تليها فاتورة. ويُسقط ملف PDF الناتج في المجلّد\nالمراقَب.\n\nوبعد دقائق يحمل الأرشيف مستندين بدل واحد: العقد برقم ASN **1041** والفاتورة برقم\nASN **1042** — وهما الرقمان اللذان كتبهما على الورق. فلا يلزم ترتيب شيء مرتين،\nوحين يسأل عميل عن الفاتورة 1042 يكتب الرقم في شريط المرشّحات، ويختار **ASN**\nو**equals**، فيكون المستند أمامه. وإذا أراد فصل رزمة بلا ترقيم وضع ورقة فصل\nPATCH-T في أوّلها بدل ملصق مرقّم.\n\nوبعد أسابيع يمسح زميل صفحة ملصقها **1043** بالخطأ. فيفشل ذلك الاستيراد بدل أن\nيستبدل صامتًا المستند الذي يملك الرقم الذي كتبه؛ ويرى عمر ذلك في صفحة **Tasks**،\nويصحّح الملصق، ويمسح الورقة من جديد.\n"},{"id":"consume-folder","title":{"en":"The consume folder","ar":"مجلّد المعالجة"},"fileEn":"advanced/consume-folder.md","fileAr":"advanced/consume-folder.ar.md","en":"---\ntitle: The Consume Folder\n---\n\n# The Consume Folder\n\nPaperless-ngx has a doorway that does not need a browser: a folder on the server\nthat it watches. Any file that appears in that folder is picked up and imported\non its own. In the documentation it is also called the *consumption directory*,\nand you will hear people call it the *watched folder*.\n\nIt is the standard way to bring in paper. A scanner or a multifunction printer is\nset to save to that folder — over a network share, over FTP, or with a\n\"scan to folder\" button — and that is the whole routine: the sheets go through\nthe scanner, and the documents appear in the archive a little later.\n\nNobody signs in to use it. Where the folder is, and who is allowed to write to\nit, is decided by the administrator who set the installation up.\n\n!!! note \"The folder is a doorway, not a shelf\"\n\n    Files sit in the consume folder only long enough to be imported. Once a\n    document has been consumed, its file is removed from the folder and lives\n    inside the archive, where the app manages it. The folder is expected to be\n    empty between scans, and it is not a backup of anything.\n\n## Getting a file into the folder\n\nEverything that can save a file can feed the folder:\n\n| Way | Typical use |\n| --- | --- |\n| A network share | A scanner or a computer saves straight into the folder over the local network. |\n| An FTP or SFTP server | Older scanners and appliances that upload rather than write to a share. |\n| Copying by hand | Dragging a file with a file manager, or copying it to a mapped drive. |\n| File syncing or a scanner's own cloud app | The synced copy lands in the folder and is imported. |\n\nYou can drop several files at once, and you can keep adding more while earlier\nones are still being processed; they queue up and are worked through one after\nanother.\n\n### What it accepts\n\nThe folder is read for the document formats the archive understands — PDF files,\nimages such as TIFF, JPEG and PNG, plain text files, and Office documents (Word,\nExcel, PowerPoint, and their LibreOffice equivalents).\n\nFiles with any other extension are left alone, as are the small housekeeping files\nthat computers scatter everywhere: `.DS_Store` and `._` files from macOS,\n`Thumbs.db` and `desktop.ini` from Windows, and folders that sync tools and NAS\ndevices use for their own bookkeeping. None of those ever becomes a document.\n\n### Subfolders\n\nBy default only the files directly in the folder are picked up. An administrator\ncan switch on watching of subfolders as well, and can go one step further: with\n*subfolders as tags*, the name of each folder a file was saved in becomes a tag on\nthe document. Files in `Bills/2026/` then arrive tagged **Bills** and **2026**,\nwith any missing tag created on the spot.\n\nThat is a neat trick for a scanner or a phone app that gives you no way to tag\nbefore scanning: sort the files into folders when you copy them, and the tags come\nalong by themselves. Such folders are never removed.\n\n## What happens after a file lands\n\n1. **The file is left alone for a moment.** The installation waits until the file\n   has stopped changing before it starts, so that a scan that is still being\n   written is never read half-finished.\n2. **The file is read.** Its text is extracted, and scans are put through OCR so\n   the pages become searchable. A long-term archive copy is prepared alongside the\n   original.\n3. **It is filed.** The document is stored with the filename and folder layout\n   built from the storage paths and settings of the installation, and matching\n   may attach tags, a correspondent, or a document type — including any barcodes\n   it carries (see [Barcodes and Archive Serial Numbers](barcodes-asn.md)).\n4. **The file leaves the folder.** Once the import has succeeded, the file is\n   removed from the consume folder. The archive keeps its own copies, so nothing\n   is lost by this.\n\nProgress and results appear in the app like any other import: the notification\nbell in the top bar, and the [Tasks](../administration/tasks.md) page for the details.\n\n### A file that has been imported before\n\nIf a file with exactly the same content was already imported, the new document is\nkept but flagged as a duplicate, with the copies linked to each other — open the\n**Duplicates** tab to compare them (see\n[Adding Documents](../documents/adding.md)). An administrator can instead have such a\nfile deleted from the folder without being imported at all, which keeps a repeated\nscan out of the archive entirely.\n\n## When something goes wrong\n\nA file that cannot be imported is not deleted. It stays where it is, and the\nfailure is recorded: the notification bell shows it, the [Tasks](../administration/tasks.md)\npage lists what went wrong, and an administrator can read the reason in\n[Logs](../administration/logs.md). Correct the file — or have the administrator correct the\nsetting — and save it into the folder again to make another attempt.\n\nThe causes are usually one of these:\n\n| What you see | What it usually means |\n| --- | --- |\n| The file never moves | The format is not one the archive understands, or the file is a housekeeping file the folder ignores. |\n| The file stays after an error | The document could not be read at all, for example a PDF that needs a password, or a truncated scan. Password-protected files are best added through the app, where **Enter Password** can be answered. |\n| An error naming an archive serial number | The scan carries a barcode for a number that is already used. See [Barcodes and Archive Serial Numbers](barcodes-asn.md). |\n| The document arrives but not where you expected | The storage path that decides the filename and folder did not match, so the document was filed in the default place. |\n\n!!! tip\n\n    A password-protected PDF, and a file you want to check before importing, are\n    both easier to handle in the browser: drag the file onto any page of the app\n    instead, as described in [Adding Documents](../documents/adding.md).\n\n## Habits that keep the folder healthy\n\n- **Let the scanner finish.** The short wait before a file is read covers most\n  cases, but a very slow or interrupted transfer can still produce an unreadable\n  file. If that happens often, ask an administrator to lengthen the waiting time\n  or to have the installation poll the folder on a schedule.\n- **One document per file, or separator sheets.** A stacked scan becomes one\n  document unless it carries separator barcodes — see\n  [Barcodes and Archive Serial Numbers](barcodes-asn.md).\n- **Do not edit a file in the folder.** Changing it while it is being read is the\n  surest way to a failed import.\n- **Copy rather than move when in doubt.** A copy leaves you the original until\n  you have seen the document appear in the archive.\n- **Use subfolders for tags** if the folder watching is set up that way.\n- **Do not use the folder as storage.** It holds nothing for long, and anything\n  you leave in it will be imported.\n\n## How the folder is set up, for administrators\n\nAll of this lives outside the web interface, in the installation's configuration,\nand is described here in plain language:\n\n- where the folder is, and whether the folder watching is switched on at all — an\n  installation that only uses browser uploads and e-mail can switch it off to save\n  work;\n- whether subfolders are watched, and whether their names become tags;\n- how the folder is noticed: immediately, when the operating system reports a\n  change, or by looking at it every few seconds when the folder lives on a network\n  drive that reports changes poorly;\n- how long a file must stay unchanged before it is read;\n- which extra files to ignore, in addition to the housekeeping files already\n  skipped;\n- whether a file that has already been imported once is deleted from the folder\n  instead of being imported again;\n- which scripts, if any, run before and after each file is consumed.\n\nThe folder itself needs to be readable and writable by the installation and by\nwhatever saves files into it, and only those. If scanner and server disagree about\npermissions, the usual symptom is a file that appears in the folder and stays\nthere.\n\n## A quick example\n\nThe office multifunction printer has a \"scan to network folder\" button that the\nadministrator has pointed at the consume folder. Nadia scans a signed lease: four\npages, saved as one PDF.\n\nTwo minutes later the notification bell tells her that a document finished\nprocessing. She opens it, corrects the title, tags it **Lease**, and saves. The\nfile is gone from the folder, and a copy of the original and a long-term archive\nversion are both inside the archive.\n\nThat afternoon she copies the year's utility bills into a subfolder of the\nconsume folder named `Bills`. When the documents appear, each of them already\ncarries the tag **Bills** — the folder name did the filing for her.\n","ar":"---\ntitle: مجلّد المعالجة\n---\n\n# مجلّد المعالجة (The Consume Folder)\n\nلـ Paperless-ngx بابٌ لا يحتاج إلى متصفّح: مجلّد على الخادم يراقبه. فكل ملف يظهر\nفي ذلك المجلّد يُلتقط ويُستورد من تلقاء نفسه. وتسمّيه الوثائق أيضًا *دليل\nالاستهلاك (consumption directory)*، ويسمّيه الناس *المجلّد المراقَب*.\n\nوهو الطريقة المعتادة لإدخال الورق. فيُضبط ماسح أو طابعة متعدّدة الوظائف ليحفظ في\nذلك المجلّد — عبر مشاركة شبكية أو FTP أو زرّ «المسح إلى مجلّد» — وهذا كل الروتين:\nت
