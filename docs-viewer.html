the **Dashboard**, find the **Upload documents** widget and click it. A file\npicker opens; select one or more files and confirm. The widget says\n**or drop files anywhere**, which is a reminder that you are not limited to the\nbutton.\n\n### Drag and drop anywhere\n\nDrag files from your computer onto any page of Paperless-ngx. The whole screen\nturns into a drop zone and shows **Drop files to begin upload**; let go of the\nfiles to start. This works from the document list, a single document, or the\ndashboard.\n\n### The watched folder\n\nIf your installation uses a watched folder (sometimes called the *consume\nfolder*), any file that lands in it is imported automatically. This is the usual\nway to bring in documents from a scanner. You do not need to sign in for this;\nyour administrator decides where the folder is and who can write to it. See\n[The Consume Folder](../advanced/consume-folder.md) for how the folder behaves and what to\ndo when a file is refused.\n\n### By e-mail\n\nAdministrators can connect mail accounts and write **Mail rules** that import\nattachments automatically. See the **Mail** section of the sidebar for the\naccounts and rules that are set up on your system.\n\n## What happens after you add a file\n\nPaperless-ngx does far more than store the file:\n\n1. **It reads the file.** Text is extracted, and for scans or photographs the\n   text is recognised with OCR so the page becomes searchable and selectable.\n2. **It creates a long-term copy.** Alongside your untouched original, an\n   archived version is prepared for safe, long-term storage.\n3. **It tries to help.** If machine learning or AI features are switched on, the\n   app may propose a title, tags, a correspondent, or a document type for you.\n\nWhile this happens, a status card appears in the corner of the screen showing\nprogress. When the document is ready the card offers **Open document**. Use\n**Dismiss completed** to clear the finished messages from the dashboard.\n\nIf you close the browser, nothing is lost: the work continues in the background.\nThe bell-shaped **Notifications** button in the top bar and the **Tasks** page\n(both described in [The Dashboard and Navigating the Interface](../getting-started/dashboard.md))\nshow what finished and what failed.\n\n## Supported file types\n\n- PDF documents — the ideal format, and the one that can be edited in the app.\n- Images — for example JPG, PNG, and TIFF files from a camera or phone.\n- Plain text files.\n- Office documents — Word, Excel, PowerPoint, and their LibreOffice\n  equivalents.\n\n!!! note\n\n    What you can *see* in a preview and what you can *edit* are two different\n    things. Many formats preview nicely but cannot be annotated or rotated\n    inside Paperless-ngx.\n\n### Files that ask for a password\n\nSome PDFs are protected. When you open one, a small prompt asks you to\n**Enter Password** before the pages are shown. If you own the document and you\nhave the password, the **Remove Password** action in the **Actions** menu saves\nan unprotected copy so you do not have to type it again.\n\n## Adding the same file twice\n\nPaperless-ngx checks the content of every new file. If an identical file has\nalready been imported, the new document is flagged and the **Duplicates** tab\nappears on its detail page with the heading **Duplicate documents detected:**.\nEach entry links to the other copy, and shows an **In trash** badge if that copy\nhas been deleted. Open the tab, compare the two, and keep the one you want.\n\n## Adding another version of an existing document\n\nWhen a contract is renewed or a scan needs replacing, do not create a second\ndocument — add a version instead. Open the document, click **Versions** above the\npreview, type an optional **Label**, and choose **Add new version**. See\n[Viewing a Document](viewing.md) for the full details.\n\n## If something goes wrong\n\n- A failed import is reported in the document progress card, in\n  **Notifications**, and on the **Tasks** page.\n- Ask an administrator to look at **Logs** if the message is unclear.\n- If a scan arrived but the text is unreadable, open the document and use\n  **Actions → Reprocess** to extract the text again — for example after the OCR\n  language was corrected.\n\n## A quick example\n\nOmar receives a five-page insurance policy as a PDF attachment. He saves it to\nhis computer and drags the file onto the **Documents** page. The drop overlay\nappears, he releases the file, and a progress card reports that text is being\nextracted.\n\nWhile he waits, he scans a paper receipt with his phone and drags the photo in\nas well. Both documents finish processing within a minute. Omar clicks\n**Open document** on the policy, adds a tag, and saves. Later, the same policy\narrives again by post and he scans it: when he opens the new document,\n**Duplicate documents detected:** lists both copies, so he deletes the poorer\nscan and keeps the cleaner one.\n","ar":"---\ntitle: إضافة المستندات\n---\n\n# إضافة المستندات\n\nكل شيء في Paperless-ngx يبدأ من ملف. يوضّح هذا الدليل الطرق المختلفة لإدخال\nالملفات إلى أرشيفك، وما يحدث لها بعد ذلك، وكيف تتعامل مع المشكلات التي قد\nتظهر.\n\n## طرق إضافة مستند\n\n| الطريقة | الأفضل لـ | مكان وجودها |\n| --- | --- | --- |\n| **Upload documents** | إضافة ملف أو عدة ملفات يدويًا | الأداة (widget) في **Dashboard** |\n| **Drag and drop** | إضافة ملفات مفتوحة على حاسبك بسرعة | أي صفحة في التطبيق |\n| المجلد المراقَب | الماسحات الضوئية والبرامج التي تحفظ الملفات في مجلد مشترك | يُهيّئه مدير النظام |\n| **Mail** | الفواتير والكشوفات التي تصل بالبريد الإلكتروني | قسم **Mail** في الشريط الجانبي |\n\n### الرفع من لوحة المعلومات\n\nفي **Dashboard**، ابحث عن أداة **Upload documents** واضغط عليها. ستُفتح نافذة\nاختيار الملفات؛ اختر ملفًا واحدًا أو أكثر ثم أكّد. وتقول الأداة\n**or drop files anywhere** تذكيرًا بأنّك غير مقيّد بالزر وحده.\n\n### السحب والإفلات في أي مكان\n\nاسحب الملفات من حاسبك وأفلتها على أي صفحة من Paperless-ngx. تتحوّل الشاشة كلها\nإلى منطقة إفلات وتظهر عبارة **Drop files to begin upload**؛ أفلت الملفات\nلبدء الرفع. يعمل ذلك من قائمة المستندات أو من داخل مستند واحد أو من لوحة\nالمعلومات.\n\n### المجلد المراقَب\n\nإذا كان تثبيتك يستخدم مجلدًا مراقَبًا (يُسمى أحيانًا *مجلد الاستهلاك*)، فإن أي\nملف يصل إليه يُستورد تلقائيًا. هذه هي الطريقة المعتادة لإدخال المستندات من\nالماسح الضوئي. ولا تحتاج إلى تسجيل الدخول لذلك؛ فمدير النظام هو من يحدّد مكان\nالمجلد ومن يستطيع الكتابة فيه. راجع\n[مجلّد المعالجة (The Consume Folder)](../advanced/consume-folder.ar.md) لمعرفة كيف يتصرّف\nالمجلد وما يُفعل حين يُرفض ملف.\n\n### عبر البريد الإلكتروني\n\nيستطيع المديرون ربط حسابات البريد وكتابة **Mail rules** لاستيراد المرفقات\nتلقائيًا. راجع قسم **Mail** في الشريط الجانبي لمعرفة الحسابات والقواعد\nالمُهيّأة في نظامك.\n\n## ما يحدث بعد إضافة ملف\n\nلا يكتفي Paperless-ngx بتخزين الملف، بل:\n\n1. **يقرأ الملف.** يُستخرج النص، وفي حالة الصور أو المسح الضوئي يُتعرَّف على\n   النص بتقنية OCR ليصبح قابلاً للبحث والتحديد.\n2. **ينشئ نسخة طويلة الأمد.** إلى جانب ملفك الأصلي دون تغيير، تُهيّأ نسخة\n   أرشيفية للحفظ الآمن على المدى الطويل.\n3. **يحاول المساعدة.** إذا كانت ميزات التعلّم الآلي أو الذكاء الاصطناعي\n   مُفعّلة، فقد يقترح التطبيق عليك عنوانًا أو وسومًا أو مراسلاً أو نوع مستند.\n\nأثناء ذلك تظهر بطاقة حالة في زاوية الشاشة تُبيّن التقدّم. وعندما يصبح المستند\nجاهزًا تعرض البطاقة زر **Open document**. واستخدم **Dismiss completed**\nلمسح الرسائل المنتهية من لوحة المعلومات.\n\nوإذا أغلقت المتصفّح لن يضيع شيء: يستمر العمل في الخلفية. ويوضّح زر\n**Notifications** بشكل الجرس في الشريط العلوي وصفحة **Tasks** (المشروحَين في\n[لوحة المعلومات والتنقّل في الواجهة](../getting-started/dashboard.ar.md)) ما انتهى وما فشل.\n\n## أنواع الملفات المدعومة\n\n- مستندات PDF — الصيغة المثالية، وهي الوحيدة التي يمكن تعديلها داخل التطبيق.\n- الصور — مثل ملفات JPG وPNG وTIFF من الكاميرا أو الهاتف.\n- ملفات النص العادي.\n- مستندات Office — Word وExcel وPowerPoint وما يقابلها من LibreOffice.\n\n!!! note\n\n    ما تستطيع *مشاهدته* في المعاينة يختلف عمّا تستطيع *تعديله*. فكثير من\n    الصيغ تُعرض بشكل جيد لكن لا يمكن إضافة ملاحظات عليها أو تدويرها داخل\n    Paperless-ngx.\n\n### الملفات التي تطلب كلمة مرور\n\nبعض ملفات PDF محمية. وعند فتح أحدها يظهر طلب صغير بعبارة **Enter Password**\nقبل عرض الصفحات. وإذا كنت مالك المستند وتعرف كلمة المرور، فإن إجراء\n**Remove Password** في قائمة **Actions** يحفظ نسخة غير محمية فلا تحتاج إلى\nكتابتها مرة أخرى.\n\n## إضافة الملف نفسه مرتين\n\nيفحص Paperless-ngx محتوى كل ملف جديد. وإذا سبق استيراد ملف مطابق، يُعلَّم\nالمستند الجديد وتظهر في صفحته بطاقة **Duplicates** بالعنوان\n**Duplicate documents detected:**. ويؤدي كل سطر إلى النسخة الأخرى، ويعرض شارة\n**In trash** إن كانت تلك النسخة محذوفة. افتح البطاقة، وقارن النسختين، واحتفظ\nبما تريد.\n\n## إضافة إصدار آخر من مستند موجود\n\nعند تجديد عقد أو الحاجة إلى استبدال مسح ضوئي، لا تُنشئ مستندًا ثانيًا، بل أضف\nإصدارًا (version). افتح المستند، واضغط **Versions** فوق المعاينة، واكتب\n**Label** إن أردت، ثم اختر **Add new version**. راجع\n[عرض المستند](viewing.ar.md) للتفاصيل الكاملة.\n\n## إذا حدث خطأ ما\n\n- يُبلَّغ عن أي استيراد فاشل في بطاقة تقدّم المستند، وفي **Notifications**،\n  وفي صفحة **Tasks**.\n- اطلب من مدير النظام مراجعة **Logs** إن كانت الرسالة غير واضحة.\n- إذا وصل المسح الضوئي لكن النص غير مقروء، افتح المستند واستخدم\n  **Actions → Reprocess** لاستخراج النص مرة أخرى — مثلاً بعد تصحيح لغة OCR.\n\n## مثال سريع\n\nيستلم عمر وثيقة تأمين من خمس صفحات كمرفق PDF. يحفظ الملف على حاسبه ثم يسحبه\nويُفلته على صفحة **Documents**. تظهر طبقة الإفلات، يُفلت الملف، وتُخبره بطاقة\nالتقدّم بأن النص يجري استخراجه.\n\nوبينما ينتظر، يمسح إيصالاً ورقيًا بهاتفه ويسحب الصورة أيضًا. يكتمل تجهيز\nالمستندين خلال دقيقة. يفتح عمر **Open document** على وثيقة التأمين، ويضيف\nوسمًا، ثم يحفظ. لاحقًا تصل الوثيقة نفسها بالبريد الورقي فيمسحها: وعند فتح\nالمستند الجديد تسرد **Duplicate documents detected:** النسختين، فيحذف المسح\nالأسوأ ويُبقي الأنظف.\n"},{"id":"browsing","title":{"en":"Browsing, filtering and searching","ar":"تصفّح المستندات وتصفيتها والبحث فيها"},"fileEn":"documents/browsing.md","fileAr":"documents/browsing.ar.md","en":"---\ntitle: Browsing, Filtering and Searching Documents\n---\n\n# Browsing, Filtering and Searching Documents\n\nThe **Documents** page is where you will spend most of your time. This guide\ncovers the toolbar above the list, the filters that narrow it down, the ways to\nsort and arrange what you see, and how to keep a useful set of filters as a saved\nview.\n\n## Getting to the list\n\nChoose **Documents** in the sidebar. The page always shows a filtered list —\nPaperless-ngx remembers *how* you were looking at your documents, not just where\nyou were, so you usually land straight back on the view you last used.\n\nAbove the list is a bar with three groups of controls: **Select:**, the display\nand sort buttons, and **Views**. Under it sits the filter bar.\n\n## Selecting documents\n\n| Control | What it does |\n| --- | --- |\n| **Select: None** | Clears the selection |\n| **Select: Page** | Selects every document on the current page |\n| **Select: All** | Selects every document matching the current filters, not only the visible page |\n\nOnce something is selected, the filter bar is replaced by the bulk editing bar\n(described in [Working with Many Documents at Once](bulk.md)) and the count above\nthe list reads **Selected N of M documents**, with a **Clear selection** link\nbeside it.\n\n## Choosing what each row shows\n\nClick **Show** to tick the fields you want to see: **Title**, **Created**,\n**Added**, **Tags**, **Correspondent**, **Document type**, **Storage path**,\n**Notes**, **Owner**, **Shared**, **ASN**, and **Pages**. Your choice is\nremembered for next time.\n\nThe three small buttons next to **Show** switch between the ways the results are\ndrawn:\n\n- a **list** (a table whose columns you can sort by),\n- **small cards** (compact tiles, good for scanning many documents), and\n- **large cards** (a preview thumbnail with more detail — useful for image\n  documents).\n\n## Sorting\n\nClick **Sort** and choose a field. The two buttons at the top of the menu decide\nthe direction (A → Z or Z → A). You can sort by **ASN**, **Correspondent**,\n**Title**, **Document type**, **Created**, **Added**, **Modified**, **Notes**,\n**Owner**, and **Pages**. In the list view you can also click a column heading to\nsort by that column. When you have searched with **Advanced search**, an extra\noption appears: **Search score**, which puts the best matches first.\n\n## Searching\n\nThe quickest search is the **Search** box in the top bar. Anything you type there\ncan be turned into a document filter, and the **Full search links to** setting\ndecides whether pressing enter gives you a title-and-content search or an\nadvanced query.\n\nOn the **Documents** page itself, the filter bar starts with a text box whose\nleft-hand button chooses what you are matching against:\n\n| Target | Matches |\n| --- | --- |\n| **Title** | The title only |\n| **Title & content** | The title and the extracted text |\n| **ASN** | The archive serial number |\n| **File type** | The kind of file, for example a PDF or an image |\n| **Advanced search** | A full search query that you type yourself |\n\nFor **ASN** you also get a word before the box — **equals**, **is empty**,\n**is not empty**, **greater than**, or **less than** — so you can find \"every\ndocument numbered above 5000\" without writing a query.\n\n### Filtering\n\nTo the right of the text box are the filter buttons. Inside each one is a\n**Filter …** box for finding the value you want:\n\n- **Tags**, **Correspondent**, **Document type**, and **Storage path**.\n- **Custom fields** — pick a field and a condition; combine several conditions\n  with **All** or **Any**.\n- **Dates** — filter by **Created** or **Added** date, either with **From** and\n  **To** dates or by picking a quick range from **Relative dates**: **Within\n  1 week**, **Within 1 month**, **Within 3 months**, **Within 1 year**,\n  **This year**, **This month**, **Today**, **Yesterday**, **Previous week**,\n  **Previous month**, **Previous quarter**, or **Previous year**.\n- **Permissions** — **All**, **My documents**, **Shared with me**,\n  **Shared by me**, **Unowned**, **Hide unowned**, or a particular person chosen\n  in the **Users** box.\n\nThe line above the list tells you how many documents you are looking at, together\nwith **(filtered)** when filters are active. **Reset filters** clears everything\nat once and is also offered as a small link next to the count.\n\n!!! tip\n\n    Once the filter bar is on screen you can open the common filters with a\n    single key: **T** for Tags, **Y** for Correspondent, **U** for Document\n    type, and **I** for Storage path.\n\n### A note about how filters combine\n\nFilters from different buttons are combined with \"and\": a document has to match\nevery one of them. Inside a single button the values you tick can be combined\neither with \"all\" or with \"any\", depending on the setting offered in that menu.\n\n## Filtering from what you can see\n\nMost values in the list are clickable:\n\n- Click a **tag**, **correspondent**, **document type**, or **storage path** to\n  add it as a filter instantly.\n- Use the eye button on a row or card to peek at the document without leaving the\n  page.\n- Choose **Edit document** on a card to open it for editing.\n- Choose **More like this** on a card to find similar documents.\n- Double-click a row, or click a card, to open the document.\n\n## Keyboard shortcuts\n\n| Keys | What happens |\n| --- | --- |\n| `/` | Jump to the top-bar search |\n| `A` | **Select all** |\n| `P` | **Select page** |\n| `O` | Open the first document (or the first selected one) |\n| `Esc` | Clear the selection, or **Reset filters** |\n| `Ctrl` + `←` / `Ctrl` + `→` | Previous / next page |\n| `Shift` + `?` | Show the list of shortcuts |\n\n## Keeping a set of filters: saved views\n\nA **saved view** is a set of filters with a name. Use the **Views** button:\n\n- Pick a view from the menu to jump to it. The page title becomes the view's\n  name, and a small dot on the **Views** button reminds you when you have changed\n  the filters since.\n- **Save \"name\"** updates the current view with your new filters.\n- **Save as...** opens **Save current view**, where you give the view a **Name**\n  and decide whether to **Show in sidebar** and **Show on dashboard**. You can\n  also set who else may see and use it.\n- **All saved views** opens the management page, where views can be renamed,\n  reordered, and deleted.\n\nIf a view cannot be saved because a filter rule is not valid, an alert explains\nthat a **Filter rules error occurred while saving this view** and reports what\n**The error returned was**.\n\n!!! note\n\n    Views can hold sensitive combinations of filters, so they have their own\n    permissions. If **Save as...** is missing, you do not have permission to\n    create views — ask an owner or an administrator.\n\n## A quick example\n\nLayla needs every invoice from her electricity provider for the current year. She\nopens **Documents**, types the provider's name in the top-bar **Search**, and\nclicks **Filter documents** on the correspondent result, so the list is now\nfiltered by correspondent. She presses **U** to open the document type filter and\nticks \"Invoice\", opens **Dates**, chooses **This year** under **Created**, and\nchecks the count: it reads “38 documents (filtered)”.\n\nShe presses **Save as...**, names the view **\"Electricity 2026\"**, ticks\n**Show in sidebar**, and saves. From now on the view sits in the sidebar and\nalways shows the current year's invoices without her rebuilding the filters.\n","ar":"---\ntitle: تصفّح المستندات وتصفيتها والبحث فيها\n---\n\n# تصفّح المستندات وتصفيتها والبحث فيها\n\nصفحة **Documents** هي المكان الذي ستقضي فيه معظم وقتك. يشرح هذا الدليل شريط\nالأدوات فوق القائمة، والمرشّحات التي تضيّق نطاقها، وطرق الترتيب والعرض، وكيف\nتحفظ مجموعة مرشّحات مفيدة كعرض محفوظ.\n\n## الوصول إلى القائمة\n\nاختر **Documents** من الشريط الجانبي. وتعرض الصفحة دائمًا قائمة مُرشّحة —\nفـ Paperless-ngx يتذكّر *طريقة* نظرك إلى مستنداتك لا موقعك فقط، ولذلك تعود\nعادةً مباشرةً إلى العرض الذي استخدمته آخر مرة.\n\nوفوق القائمة شريط يحتوي ثلاث مجموعات من الأدوات: **Select:**، وأزرار العرض\nوالترتيب، و**Views**. وتحته يقع شريط المرشّحات.\n\n## تحديد المستندات\n\n| الأداة | ما تفعله |\n| --- | --- |\n| **Select: None** | تلغي التحديد |\n| **Select: Page** | تحدّد كل مستند في الصفحة الحالية |\n| **Select: All** | تحدّد كل مستند يطابق المرشّحات الحالية، لا الصفحة الظاهرة فقط |\n\nوبمجرد تحديد شيء ما، يحلّ شريط التعديل الجماعي (المشروح في\n[العمل على عدة مستندات معًا](bulk.ar.md)) محلّ شريط المرشّحات، ويصبح العدّاد\nفوق القائمة **Selected N of M documents** مع رابط **Clear selection** بجانبه.\n\n## اختيار ما يظهر في كل سطر\n\nاضغط **Show** لتحديد الحقول التي تريد رؤيتها: **Title** و**Created** و\n**Added** و**Tags** و**Correspondent** و**Document type** و**Storage path** و\n**Notes** و**Owner** و**Shared** و**ASN** و**Pages**. ويُحفظ اختيارك للمرة\nالقادمة.\n\nوتنقلك الأزرار الثلاثة الصغيرة بجانب **Show** بين طرق رسم النتائج:\n\n- **قائمة** (جدول يمكن الترتيب حسب أعمدته)،\n- **بطاقات صغيرة** (مربّعات مدمجة، مناسبة لاستعراض عدد كبير من المستندات)،\n- **بطاقات كبيرة** (صورة معاينة بتفاصيل أكثر — مفيدة لمستندات الصور).\n\n## الترتيب\n\nاضغط **Sort** واختر حقلًا. ويحدّد الزران في أعلى القائمة الاتجاه (A → Z أو\nZ → A). ويمكنك الترتيب حسب **ASN** و**Correspondent** و**Title** و\n**Document type** و**Created** و**Added** و**Modified** و**Notes** و**Owner**\nو**Pages**. وفي عرض القائمة يمكنك أيضًا الضغط على عنوان العمود للترتيب به.\nوعندما تبحث باستخدام **Advanced search** يظهر خيار إضافي هو **Search score**\nالذي يضع أفضل النتائج في المقدمة.\n\n## البحث\n\nأسرع طريقة للبحث هي مربّع **Search** في الشريط العلوي. وكل ما تكتبه هناك يمكن\nتحويله إلى مرشّح مستندات، ويحدّد إعداد **Full search links to** ما إذا كان\nالضغط على Enter يعطيك بحثًا في العنوان والمحتوى أم استعلامًا متقدّمًا.\n\nوفي صفحة **Documents** نفسها يبدأ شريط المرشّحات بمربّع نصّي يحدّد زرُه\nالأيسر ما تطابقه الكلمة المكتوبة:\n\n| الهدف | يطابق |\n| --- | --- |\n| **Title** | العنوان فقط |\n| **Title & content** | العنوان والنص المستخرج |\n| **ASN** | الرقم التسلسلي الأرشيفي |\n| **File type** | نوع الملف، مثل PDF أو صورة |\n| **Advanced search** | استعلام بحث كامل تكتبه بنفسك |\n\nوفي حالة **ASN** تظهر أيضًا كلمة قبل المربّع — **equals** أو **is empty** أو\n**is not empty** أو **greater than** أو **less than** — لتجد «كل مستند رقمه\nأعلى من 5000» دون كتابة استعلام.\n\n### التصفية\n\nإلى يمين المربّع النصّي توجد أزرار المرشّحات، وداخل كل زر مربّع **Filter …**\nللعثور على القيمة التي تريدها:\n\n- **Tags** و**Correspondent** و**Document type** و**Storage path**.\n- **Custom fields** — اختر حقلًا وشرطًا؛ واجمع عدة شروط بـ **All** أو **Any**.\n- **Dates** — رشّح حسب تاريخ **Created** أو **Added**، إمّا بتحديد **From** و\n  **To**، أو باختيار مدى سريع من **Relative dates**: **Within 1 week** و\n  **Within 1 month** و**Within 3 months** و**Within 1 year** و**This year** و\n  **This month** و**Today** و**Yesterday** و**Previous week** و\n  **Previous month** و**Previous quarter** و**Previous year**.\n- **Permissions** — **All** أو **My documents** أو **Shared with me** أو\n  **Shared by me** أو **Unowned** أو **Hide unowned**، أو شخص محدّد تختاره من\n  مربّع **Users**.\n\nويخبرك السطر فوق القائمة بعدد المستندات التي تنظر إليها، مع **(filtered)** عند\nتفعيل المرشّحات. ويمسح **Reset filters** كل شيء دفعة واحدة، وهو متاح أيضًا\nكرابط صغير بجانب العدّاد.\n\n!!! tip\n\n    بعد ظهور شريط المرشّحات يمكنك فتح المرشّحات الشائعة بمفتاح واحد:\n    **T** للوسوم، و**Y** للمراسل، و**U** لنوع المستند، و**I** لمسار التخزين.\n\n### ملاحظة عن كيفية اجتماع المرشّحات\n\nتُجمع مرشّحات الأزرار المختلفة بـ «و»: أي يجب أن يطابق المستند كلّها. وداخل\nالزر الواحد يمكن جمع القيم التي تؤشّر عليها بـ «all» أو «any» حسب الإعداد\nالمعروض في تلك القائمة.\n\n## التصفية من العناصر الظاهرة\n\nمعظم القيم في القائمة قابلة للضغط:\n\n- اضغط على **وسم** أو **مراسل** أو **نوع مستند** أو **مسار تخزين** لتضيفه\n  مرشّحًا فورًا.\n- استخدم زر العين في السطر أو البطاقة لإلقاء نظرة على المستند دون مغادرة\n  الصفحة.\n- اختر **Edit document** في البطاقة لفتح المستند للتعديل.\n- اختر **More like this** في البطاقة للعثور على مستندات مشابهة.\n- انقر نقرًا مزدوجًا على السطر، أو اضغط البطاقة، لفتح المستند.\n\n## اختصارات لوحة المفاتيح\n\n| المفاتيح | ما يحدث |\n| --- | --- |\n| `/` | الانتقال إلى بحث الشريط العلوي |\n| `A` | **Select all** |\n| `P` | **Select page** |\n| `O` | فتح أول مستند (أو أول مستند محدّد) |\n| `Esc` | إلغاء التحديد، أو **Reset filters** |\n| `Ctrl` + `←` / `Ctrl` + `→` | الصفحة السابقة / التالية |\n| `Shift` + `?` | عرض قائمة الاختصارات |\n\n## حفظ مجموعة مرشّحات: العروض المحفوظة\n\n**العرض المحفوظ** (saved view) هو مجموعة مرشّحات لها اسم. استخدم زر **Views**:\n\n- اختر عرضًا من القائمة للانتقال إليه. ويصبح عنوان الصفحة اسم العرض، وتذكّرك\n  نقطة صغيرة على زر **Views** عندما تغيّر المرشّحات بعده.\n- **Save \"name\"** يحدّث العرض الحالي بالمرشّحات الجديدة.\n- **Save as...** يفتح **Save current view** حيث تسمّي العرض في **Name** وتقرّر\n  **Show in sidebar** و**Show on dashboard**، ويمكنك أيضًا تحديد من غيره\n  يستطيع رؤيته واستخدامه.\n- **All saved views** يفتح صفحة الإدارة حيث يمكن إعادة تسمية العروض وإعادة\n  ترتيبها وحذفها.\n\nوإذا تعذّر حفظ العرض لكون إحدى قواعد المرشّح غير صحيحة، يظهر تنبيه يقول\n**Filter rules error occurred while saving this view** ويبيّن\n**The error returned was**.\n\n!!! note\n\n    قد تحتوي العروض على تركيبات حسّاسة من المرشّحات، لذا لها صلاحياتها\n    الخاصة. وإذا لم يظهر **Save as...** فأنت لا تملك صلاحية إنشاء العروض —\n    اطلب ذلك من المالك أو مدير النظام.\n\n## مثال سريع\n\nتحتاج ليلى كل فاتورة من مزوّد الكهرباء للسنة الحالية. تفتح **Documents**،\nوتكتب اسم المزوّد في **Search** في الشريط العلوي، وتضغط **Filter documents**\nعلى نتيجة المراسل، فتصبح القائمة مُرشّحة حسب المراسل. ثم تضغط **U** لفتح مرشّح\nنوع المستند وتؤشّر «Invoice»، وتفتح **Dates** وتختار **This year** تحت\n**Created**، وتتحقق من العدّاد فيقرأ «38 documents (filtered)».\n\nثم تضغط **Save as...** وتسمّي العرض **\"Electricity 2026\"** وتؤشّر\n**Show in sidebar** وتحفظ. ومن الآن يظهر العرض في الشريط الجانبي ويعرض دائمًا\nفواتير السنة الحالية دون إعادة بناء المرشّحات.\n"},{"id":"viewing","title":{"en":"Viewing a document","ar":"عرض مستند"},"fileEn":"documents/viewing.md","fileAr":"documents/viewing.ar.md","en":"---\ntitle: Viewing a Document\n---\n\n# Viewing a Document\n\nThe document detail page is where a single document is shown, read, checked, and\nsent on. This guide walks through the page itself, the viewer, the files you can\ndownload, and the actions available while you are looking at a document. The\nfields on the page have a guide of their own: [Editing Document Details](editing.md).\n\n## Opening a document\n\n- Double-click a row, or click a card, in the **Documents** list.\n- From the **Dashboard**, click a document in **Recently added** or in a saved\n  view widget.\n- Click **Open document** in the progress card that appears after an upload, or\n  in **Notifications**.\n\nThe page opens as an overlay on top of the list. Use **Close** (the ✕ button) or\npress `Esc` to return to exactly where you were.\n\n## What the page contains\n\nOn a wide screen the page has two halves: the editable fields on the left and the\npreview on the right. On a phone or tablet the preview moves into its own\n**Preview** tab.\n\nThe tabs along the top are:\n\n| Tab | What is in it |\n| --- | --- |\n| **Details** | The fields you can edit, such as title, dates, tags, and custom fields — see [Editing Document Details](editing.md) |\n| **Content** | The text that was extracted from the file, which you can edit |\n| **Metadata** | Technical facts: filenames, checksums, file sizes, and the details read from the file itself |\n| **Preview** | The document itself (only shown on small screens) |\n| **Notes** | Notes attached to the document — see [Notes and History](notes-history.md) |\n| **History** | Who changed what, and when — see [Notes and History](notes-history.md) |\n| **Permissions** | Who may see and change the document — see [Sharing and Permissions](sharing.md) |\n| **Duplicates** | Other documents with identical content, shown only when there are any |\n\n## Viewing the document\n\nThe preview shows the archived copy of the file when there is one, so what you\nread is what will be kept. Above it you will find:\n\n- A **Page** box with **of N** beside it, to jump straight to a page.\n- **–** and **+** buttons for zooming out and in.\n- A zoom menu offering **Page Fit** and percentage levels.\n\nTwo settings change how the preview behaves, both under\n**Settings → Documents → Document editing**: **Use PDF viewer provided by the\nbrowser**, which is faster for large PDFs but may not suit every browser, and\n**Default zoom**, which offers **Fit width** or **Fit page**. **Show document\nthumbnail during loading** puts a low-resolution copy on screen while the file is\nstill being fetched.\n\nIf your screen is small, the **Preview** tab holds the same viewer.\n\n!!! note\n\n    Your administrator decides which fields appear on this page under\n    **Settings → Documents**: the **Built-in fields to show** checkboxes control\n    the archive serial number, correspondent, document type, storage path, and\n    tags. **Uncheck fields to hide them on the document details page.**\n\n## Downloading\n\nThe **Download** button saves the archived copy, ready-formatted for long-term\nstorage. The small arrow beside it opens a menu with:\n\n- **Download original** — your untouched upload; only offered when the document\n  has both an original and an archived copy.\n- **Use formatted filename** — a checkbox that decides whether the saved file\n  keeps Paperless-ngx's tidy naming scheme or the original name.\n\nTo save an image instead of a document, right-click the preview.\n\n## The Actions menu\n\nEverything else lives behind the **Actions** button:\n\n| Action | What it does |\n| --- | --- |\n| **Reprocess** | Reads the file again to extract the text afresh — useful after correcting the OCR language or a title |\n| **More like this** | Searches for other documents that resemble this one |\n| **PDF Editor** | Opens the built-in page editor (see below) |\n| **Remove Password** | Saves an unprotected copy of a password-protected PDF; available to the owner once the password has been entered |\n| **Share Links** | Creates a public link — see [Sharing and Permissions](sharing.md) |\n| **Email** | Sends the document to an e-mail address — see [Sharing and Permissions](sharing.md) |\n\n**Delete** sits in the top bar rather than in the menu. It asks for confirmation\nand moves the document to the trash; see [Deleting and Restoring Documents](trash.md).\n\n## Versions\n\nThe **Versions** button above the preview manages the file history of a\ndocument. It shows the current version, and lets you:\n\n- **Add new version** — upload a replaced or corrected file, with an optional\n  **Label** such as “signed copy” to explain it.\n- Switch the preview to an earlier version to see what it looked like.\n- **Delete version**, with a confirmation prompt.\n\nA new version is uploaded first and then processed in the background; the menu\nreports **Uploading version...** and **Processing version...** while that\nhappens, and **Version upload failed.** if something goes wrong.\n\nThe document's own fields — title, tags, correspondent, document type, storage\npath, and custom fields — are not versioned. They always describe the whole\ndocument, which is why you can correct them once and have them apply to every\nversion.\n\n## The PDF Editor\n\nChoose **Actions → PDF Editor** to change the file itself: delete pages, rotate\nthem, split a document into several, and reorder them. Splitting is done by\nadding a **Split here** marker between pages, and the page tools include **Rotate\npage clockwise**, **Rotate page counter-clockwise**, **Delete page**, and their\n**selected pages** equivalents.\n\nWhen you finish editing, choose what should happen to the result:\n\n- **Create new document(s)**, so the edited file becomes a document of its own\n  (or several, if you split it); or\n- **Add document version**, so the edited file replaces the current version of\n  the document you are looking at.\n\nTwo checkboxes decide the details: **Copy metadata** carries the tags,\ncorrespondent, document type, and so on across to the new document, and **Delete\noriginal** removes the source document once the edit is saved.\n\nWhich of the two is preselected is controlled by\n**Settings → Documents → PDF Editor → Default editing mode**. Rotating a page\nasks you to confirm, and reminds you that **only PDFs will be rotated** — images\nare left as they are.\n\n## A quick example\n\nHana double-clicks a row in the **Documents** list, and the detail page opens on\ntop of it. The **Details** tab confirms she has the invoice she was looking for,\nso she switches to **Metadata** to read the filename the scan arrived with, and\nthen jumps to page 3 with the **Page** box above the preview to check a figure.\n\nThe invoice runs to twelve pages and the last two are blank scans. She chooses\n**Actions → PDF Editor**, deletes those two pages, and picks **Add document\nversion** with **Copy metadata** ticked, so the cleaned-up file becomes the newest\nversion of the same document while its title and tags stay as they were.\n**Versions** above the preview still lists the file she replaced, so nothing was\nlost. Before leaving she clicks **Download** and ticks **Use formatted\nfilename**, so her own copy lands in her folder under a tidy name.\n","ar":"---\ntitle: عرض مستند\n---\n\n# عرض مستند\n\nصفحة تفاصيل المستند هي المكان الذي يُعرض فيه المستند الواحد ويُقرأ ويُراجَع\nويُرسَل. يستعرض هذا الدليل الصفحة نفسها، والعارض، والملفات التي يمكن تنزيلها،\nوالإجراءات المتاحة أثناء النظر إلى مستند. ولحقول الصفحة دليل خاص بها:\n[تعديل تفاصيل المستند](editing.ar.md).\n\n## فتح مستند\n\n- انقر نقرًا مزدوجًا على سطر، أو اضغط بطاقة، في قائمة **Documents**.\n- من **Dashboard**، اضغط مستندًا في **Recently added** أو في أداة عرض محفوظ.\n- اضغط **Open document** في بطاقة التقدّم التي تظهر بعد الرفع، أو في\n  **Notifications**.\n\nوتُفتح الصفحة كطبقة فوق القائمة. استخدم **Close** (زر ✕) أو اضغط `Esc` للعودة\nإلى ما كنت فيه بالضبط.\n\n## ما تحتويه الصفحة\n\nفي الشاشة العريضة تنقسم الصفحة إلى نصفين: الحقول القابلة للتعديل في اليسار،\nوالمعاينة في اليمين. وفي الهاتف أو الجهاز اللوحي تنتقل المعاينة إلى بطاقة\n**Preview** خاصة بها.\n\nوالبطاقات (tabs) في الأعلى هي:\n\n| البطاقة | ما فيها |\n| --- | --- |\n| **Details** | الحقول التي تعدّلها، مثل العنوان والتواريخ والوسوم والحقول المخصّصة — راجع [تعديل تفاصيل المستند](editing.ar.md) |\n| **Content** | النص المستخرج من الملف، وهو قابل للتعديل |\n| **Metadata** | معلومات تقنية: أسماء الملفات وبصمات التحقق وأحجامها وتفاصيل مقروءة من الملف نفسه |\n| **Preview** | المستند نفسه (تظهر في الشاشات الصغيرة فقط) |\n| **Notes** | الملاحظات المرتبطة بالمستند — راجع [الملاحظات وسجل التغييرات](notes-history.ar.md) |\n| **History** | من غيّر ماذا ومتى — راجع [الملاحظات وسجل التغييرات](notes-history.ar.md) |\n| **Permissions** | من يستطيع رؤية المستند وتغييره — راجع [المشاركة والصلاحيات](sharing.ar.md) |\n| **Duplicates** | مستندات أخرى محتواها مطابق، وتظهر فقط عند وجودها |\n\n## عرض المستند\n\nتعرض المعاينة النسخة الأرشيفية من الملف إن وُجدت، فما تقرأه هو ما سيُحفظ. وفوقها\nتجد:\n\n- مربّع **Page** وبجانبه **of N** للانتقال مباشرةً إلى صفحة معيّنة.\n- زرّي **–** و**+** للتصغير والتكبير.\n- قائمة تكبير تعرض **Page Fit** ومستويات النسبة المئوية.\n\nوهناك إعدادان يغيّران سلوك المعاينة، وكلاهما في\n**Settings → Documents → Document editing**: الإعداد\n**Use PDF viewer provided by the browser** وهو أسرع للملفات الكبيرة لكنه قد لا\nيناسب كل المتصفّحات، والإعداد **Default zoom** الذي يعرض **Fit width** أو\n**Fit page**. أمّا **Show document thumbnail during loading** فيعرض نسخة\nمنخفضة الدقة على الشاشة ريثما يُجلب الملف.\n\nوإذا كانت شاشتك صغيرة فإن بطاقة **Preview** تحتوي العارض نفسه.\n\n!!! note\n\n    يحدّد مدير النظام الحقول الظاهرة في هذه الصفحة من **Settings → Documents**:\n    فمربّعات **Built-in fields to show** تتحكم بالرقم التسلسلي الأرشيفي والمراسل\n    ونوع المستند ومسار التخزين والوسوم. و**Uncheck fields to hide them on the\n    document details page.**\n\n## التنزيل\n\nيحفظ زر **Download** النسخة الأرشيفية مُهيّأة للحفظ طويل الأمد. ويفتح السهم\nالصغير بجانبه قائمة تحتوي:\n\n- **Download original** — ملفك الأصلي كما رفعته؛ ولا يظهر إلا إذا كان للمستند\n  أصل ونسخة أرشيفية معًا.\n- **Use formatted filename** — مربّع اختيار يحدّد ما إذا كان الملف المحفوظ\n  يحتفظ بنظام التسمية المرتّب في Paperless-ngx أم بالاسم الأصلي.\n\nولحفظ صورة بدلًا من مستند، انقر بزر الفأرة الأيمن على المعاينة.\n\n## قائمة الإجراءات\n\nكل ما تبقّى يوجد خلف زر **Actions**:\n\n| الإجراء | ما يفعله |\n| --- | --- |\n| **Reprocess** | يقرأ الملف مرة أخرى لاستخراج النص من جديد — مفيد بعد تصحيح لغة OCR أو العنوان |\n| **More like this** | يبحث عن مستندات أخرى تشبه هذا المستند |\n| **PDF Editor** | يفتح محرّر الصفحات المدمج (انظر أدناه) |\n| **Remove Password** | يحفظ نسخة غير محمية من ملف PDF محمي بكلمة مرور؛ ويُتاح للمالك بعد إدخال كلمة المرور |\n| **Share Links** | ينشئ رابطًا عامًا — راجع [المشاركة والصلاحيات](sharing.ar.md) |\n| **Email** | يرسل المستند إلى عنوان بريد إلكتروني — راجع [المشاركة والصلاحيات](sharing.ar.md) |\n\nأمّا **Delete** فيقع في الشريط العلوي لا في القائمة. ويطلب تأكيدًا ثم ينقل\nالمستند إلى المهملات؛ راجع [حذف المستندات واستعادتها](trash.ar.md).\n\n## الإصدارات\n\nيدير زر **Versions** فوق المعاينة سجل ملفات المستند. ويعرض الإصدار الحالي،\nويتيح لك:\n\n- **Add new version** — رفع ملف بديل أو مصحَّح، مع **Label** اختياري مثل\n  «signed copy» لشرحه.\n- تحويل المعاينة إلى إصدار أقدم لرؤية شكله السابق.\n- **Delete version** مع طلب تأكيد.\n\nويُرفع الإصدار الجديد أولًا ثم يُعالج في الخلفية؛ وتخبرك القائمة بـ\n**Uploading version...** و**Processing version...** أثناء ذلك، وبـ\n**Version upload failed.** إذا حدث خطأ.\n\nوحقول المستند نفسه — العنوان والوسوم والمراسل ونوع المستند ومسار التخزين\nوالحقول المخصّصة — لا تخضع للإصدارات. فهي تصف المستند كله دائمًا، ولذلك يمكنك\nتصحيحها مرة واحدة فتسري على كل الإصدارات.\n\n## محرّر PDF\n\nاختر **Actions → PDF Editor** لتغيير الملف نفسه: حذف صفحات وتدويرها وتقسيم\nمستند إلى عدة مستندات وإعادة ترتيبها. ويتم التقسيم بإضافة علامة\n**Split here** بين الصفحات، وتشمل أدوات الصفحة **Rotate page clockwise** و\n**Rotate page counter-clockwise** و**Delete page** وما يقابلها للصفحات\n**المحدّدة**.\n\nوعند الانتهاء من التحرير اختر ما ينبغي أن يحدث بالنتيجة:\n\n- **Create new document(s)** ليصبح الملف المحرَّر مستندًا مستقلًا (أو عدة\n  مستندات إن قسّمته)؛ أو\n- **Add document version** ليحلّ الملف المحرَّر محلّ الإصدار الحالي من المستند\n  الذي تنظر إليه.\n\nويحدّد مربّعان التفاصيل: **Copy metadata** ينقل الوسوم والمراسل ونوع المستند\nوغيرها إلى المستند الجديد، و**Delete original** يحذف المستند المصدر بعد حفظ\nالتحرير.\n\nويتحكم في أيّ الخيارين يكون محدّدًا مسبقًا الإعداد\n**Settings → Documents → PDF Editor → Default editing mode**. ويطلب تدوير صفحة\nتأكيدًا ويذكّرك بأنه **only PDFs will be rotated** — أي تبقى الصور كما هي.\n\n## مثال سريع\n\nتنقر هناء نقرًا مزدوجًا على سطر في قائمة **Documents**، فتُفتح صفحة التفاصيل\nفوقها. وتُطمئنها بطاقة **Details** إلى أنها الفاتورة التي تبحث عنها، فتبدّل إلى\n**Metadata** لتقرأ اسم الملف الذي وصل به المسح، ثم تنتقل إلى الصفحة الثالثة عبر\nمربّع **Page** فوق المعاينة لتتحقّق من رقم.\n\nوالفاتورة اثنتا عشرة صفحة، وآخر صفحتين مسح فارغ. فتختار\n**Actions → PDF Editor** وتحذف الصفحتين، وتختار **Add document version** مع\nتأشير **Copy metadata**، فيصبح الملف النظيف أحدث إصدار للمستند نفسه مع بقاء\nعنوانه ووسومه كما كانت. ويسرد زر **Versions** فوق المعاينة الملف الذي استبدلته،\nفلم يضِع شيء. وقبل أن تخرج تضغط **Download** وتؤشّر\n**Use formatted filename**، فتصل نسختها إلى مجلدها باسم مرتّب.\n"},{"id":"editing","title":{"en":"Editing document details","ar":"تعديل تفاصيل المستند"},"fileEn":"documents/editing.md","fileAr":"documents/editing.ar.md","en":"---\ntitle: Editing Document Details\n---\n\n# Editing Document Details\n\nVery little in Paperless-ngx is fixed for good. The text that was read from a\nfile, the title a scan arrived with, and the tags or correspondent that were\nguessed can all be corrected later — and the corrections are what make a\ndocument easy to find next time.\n\n!!! note\n\n    You can only change a document you are allowed to edit. If the fields will\n    not respond, see [Sharing and Permissions](sharing.md).\n\n## The Details tab\n\nOpen a document and stay on the **Details** tab. Everything on it describes the\ndocument as a whole, so a correction applies to all of its versions:\n\n| Field | What it holds |\n| --- | --- |\n| **Title** | The name you will search by. Start here when a scan arrives with a long filename. |\n| **Archive serial number** | The number you would write on the paper original — see [Barcodes and ASN](../advanced/barcodes-asn.md). |\n| **Created** | The date printed on the document itself. |\n| **Added** | The date the file entered Paperless-ngx. It is set for you. |\n| **Tags** | What the document is, so it can be filtered later. |\n| **Correspondent** | Who sent it. |\n| **Document type** | What kind of paperwork it is. |\n| **Storage path** | The folder the file belongs in, for later exporting. |\n| **Custom fields** | Your own fields, described in [Custom Fields and Metadata](../../usage.md). |\n\nFor **Tags**, **Correspondent**, **Document type**, and **Storage path** you can\neither pick something that already exists or type a new name and create it on\nthe spot, so nothing stops you from setting up an attribute while you work.\n\n## The Content tab\n\nThe **Content** tab holds the text that was read out of the file. It is meant for\ncorrection, and it is editable in a large plain text box:\n\n- Fix a word the reader got wrong, so searching for it finds the document.\n- Add a line that was missed, such as an amount or a reference number.\n- Clear the whole box when a document should not be searchable by its text.\n\nThe text you see there is what the search engine matches against, so a change\nhere affects searching, not the look of the file. To change the file itself, use\nthe **PDF Editor** described in [Viewing a Document](viewing.md).\n\n## Help while you fill the form in\n\nFour buttons above the form save typing:\n\n- **Suggest** asks the machine learning or AI features of your installation for a\n  title, tags, a correspondent, or a document type. The number on the button is\n  how many were found.\n- The arrow beside it (when your installation uses AI assistance) opens the menu\n  described as **Show suggestions**, with its results grouped under **Tags**,\n  **Document Types**, and **Correspondents**. Clicking a suggestion adds it to\n  the document; anything already assigned is left out, and when there is nothing\n  new the menu says **No novel suggestions**.\n- The **custom fields** button adds another field to the document.\n- The **preview** eye button lets you glance at the file while you fill the form\n  in.\n\n!!! tip\n\n    Suggestions are fetched for you automatically when the document still carries\n    an inbox tag, so a fresh import usually arrives with its suggestions already\n    counted.\n\n## Saving, discarding and moving on\n\n| Button | What it does |\n| --- | --- |\n| **Save** | Stores your changes and stays on the document |\n| **Save & next** | Stores your changes and opens the next document in the list |\n| **Save & close** | Stores your changes and returns to the list |\n| **Discard** | Drops your unsaved changes |\n\nThe buttons stay greyed out until something actually changes, and they work from\nthe keyboard too:\n\n| Keys | What happens |\n| --- | --- |\n| `Ctrl` + `S` | **Save document** |\n| `Ctrl` + `Shift` + `S` | **Save and close / next** |\n| `Esc` | **Close document** |\n| `Ctrl` + `←` / `Ctrl` + `→` | **Previous document** / **Next document** |\n\n## A quick example\n\nSam opens a scanned invoice and sees that the title is the scanner's filename.\nHe clicks **Suggest**, the button shows a count of three, and the menu proposes\nthe correspondent “Northwind Energy” and the tag “Invoice”; one click each adds\nthem. He types a proper title, answers **Created** with the date printed on the\ninvoice, then opens the **Content** tab and repairs two words the reader mangled —\n“tota1” and “arnount” — so that searching for the correct spelling will work\nlater. He presses `Ctrl` + `Shift` + `S` to save and jump straight to the next\ndocument.\n","ar":"---\ntitle: تعديل تفاصيل المستند\n---\n\n# تعديل تفاصيل المستند\n\nقليل جدًا في Paperless-ngx ثابت لا يتغيّر. فالنص المقروء من الملف، والعنوان الذي\nوصل به المسح، والوسوم أو المراسل الذي خُمّن — كل ذلك قابل للتصحيح لاحقًا،\nوالتصحيح هو ما يجعل المستند سهل العثور عليه في المرة القادمة.\n\n!!! note\n\n    لا يمكنك تعديل إلا مستندًا مسموحًا لك بتعديله. وإن لم تستجب الحقول فراجع\n    [المشاركة والصلاحيات](sharing.ar.md).\n\n## بطاقة التفاصيل\n\nافتح مستندًا وابقَ في بطاقة **Details**. وكل ما فيها يصف المستند ككل، لذلك يسري\nالتصحيح على جميع إصداراته:\n\n| الحقل | ما يحتويه |\n| --- | --- |\n| **Title** | الاسم الذي ستبحث به. ابدأ من هنا حين يصل المسح باسم ملف طويل. |\n| **Archive serial number** | الرقم الذي كنت ستكتبه على الأصل الورقي — راجع [الباركود ورقم ASN](../advanced/barcodes-asn.ar.md). |\n| **Created** | التاريخ المطبوع على المستند نفسه. |\n| **Added** | تاريخ دخول الملف إلى Paperless-ngx، وهو يُضبط تلقائيًا. |\n| **Tags** | ما هو المستند، حتى يمكن تصفيته لاحقًا. |\n| **Correspondent** | من أرسله. |\n| **Document type** | نوع المعاملة الورقية. |\n| **Storage path** | المجلد الذي ينتمي إليه الملف، لأجل التصدير لاحقًا. |\n| **الحقول المخصّصة** | حقولك الخاصة، وهي مشروحة في [الحقول المخصّصة والبيانات الوصفية](../../usage.md). |\n\nوفي **Tags** و**Correspondent** و**Document type** و**Storage path** يمكنك إمّا\nاختيار قيمة موجودة، وإمّا كتابة اسم جديد وإنشائه في الحال؛ فلا شيء يمنعك من\nإنشاء سمة أثناء عملك.\n\n## بطاقة المحتوى\n\nتحتوي بطاقة **Content** على النص المستخرج من الملف. والغرض منها التصحيح، وهي\nقابلة للتعديل في مربّع نص كبير:\n\n- صحّح كلمة أخطأ فيها القارئ، فيجد البحث المستند عند البحث عنها.\n- أضف سطرًا سقط، مثل مبلغ أو رقم مرجعي.\n- أفرغ المربّع كله إذا أردت ألّا يُبحث في المستند بنصّه.\n\nفالنص الظاهر هناك هو ما يطابقه محرّك البحث، أي أن التغيير فيه يؤثّر في البحث لا\nفي شكل الملف. ولتغيير الملف نفسه استخدم **محرّر PDF** المشروح في\n[عرض مستند](viewing.ar.md).\n\n## مساعدة أثناء ملء النموذج\n\nتوفّر أربعة أزرار فوق النموذج عليك الكتابة:\n\n- **Suggest** يطلب من ميزات التعلّم الآلي أو الذكاء الاصطناعي في تثبيتك عنوانًا\n  أو وسومًا أو مراسلًا أو نوع مستند. والرقم على الزر هو عدد ما وُجد.\n- والسهم بجانبه (حين يستخدم تثبيتك مساعدة الذكاء الاصطناعي) يفتح القائمة\n  الموصوفة بـ **Show suggestions**، ونتائجها مجمّعة تحت **Tags** و\n  **Document Types** و**Correspondents**. والنقر على اقتراح يضيفه إلى المستند؛\n  ويُستثنى كل ما هو مُسند بالفعل، وإذا لم يوجد جديد تقول القائمة\n  **No novel suggestions**.\n- زر **الحقول المخصّصة** يضيف حقلًا آخر إلى المستند.\n- زر العين للمعاينة يتيح لك إلقاء نظرة على الملف أثناء ملء النموذج.\n\n!!! tip\n\n    تُجلب الاقتراحات لك تلقائيًا حين يحمل المستند وسم بريد وارد (inbox)، لذا\n    يصل المستند المُستورد حديثًا واقتراحاته محسوبة سلفًا في الغالب.\n\n## الحفظ والإلغاء والانتقال\n\n| الزر | ما يفعله |\n| --- | --- |\n| **Save** | يحفظ تغييراتك ويبقيك في المستند |\n| **Save & next** | يحفظ تغييراتك ويفتح المستند التالي في القائمة |\n| **Save & close** | يحفظ تغييراتك ويعود إلى القائمة |\n| **Discard** | يُلغي تغييراتك غير المحفوظة |\n\nوتبقى الأزرار باهتة حتى يتغيّر شيء فعلًا، وهي متاحة من لوحة المفاتيح أيضًا:\n\n| المفاتيح | ما يحدث |\n| --- | --- |\n| `Ctrl` + `S` | **Save document** |\n| `Ctrl` + `Shift` + `S` | **Save and close / next** |\n| `Esc` | **Close document** |\n| `Ctrl` + `←` / `Ctrl` + `→` | **Previous document** / **Next document** |\n\n## مثال سريع\n\nيفتح سام فاتورة ممسوحة فيرى أن العنوان هو اسم ملف الماسح. يضغط **Suggest**،\nفيُظهر الزر عددًا هو ثلاثة، وتقترح القائمة المراسل «Northwind Energy» والوسم\n«Invoice»، وبنقرة واحدة لكل منهما يُضافان. يكتب عنوانًا مناسبًا، ويجيب على\n**Created** بتاريخ مطبوع على الفاتورة، ثم يفتح بطاقة **Content** ويصلح كلمتين\nشوّههما القارئ — «tota1» و«arnount» — حتى ينجح البحث بالتهجئة الصحيحة لاحقًا.\nثم يضغط `Ctrl` + `Shift` + `S` ليحفظ وينتقل مباشرة إلى المستند التالي.\n"},{"id":"notes-history","title":{"en":"Notes and history","ar":"الملاحظات والسجل"},"fileEn":"documents/notes-history.md","fileAr":"documents/notes-history.ar.md","en":"---\ntitle: Notes and History\n---\n\n# Notes and History\n\nPaperless-ngx can carry two kinds of annotation beside a document: **notes**,\nwhich you write to remind yourself or your colleagues of something, and\n**history**, which the system writes for you every time a document changes.\n\n## Notes\n\nOpen a document and choose the **Notes** tab. Each note shows its text and who\nwrote it and when.\n\n### Writing a note\n\n1. Click in the box that says **Enter note**.\n2. Type your note. Plain text is enough — a payment reference, a reminder that\n   the original was filed in a different folder, a question for a colleague.\n3. Confirm to add it. The note appears at the top of the list straight away and\n   the **Notes** tab gains a small badge with the total number of notes.\n\nA note can be deleted with **Delete note**, which asks you to confirm first.\n\nNotes are attached to the document, not to a file version, so they stay in place\nwhen a new version is uploaded.\n\n!!! note\n\n    Notes must be switched on by your administrator under\n    **Settings → Documents → Notes → Enable notes**. If the **Notes** tab is\n    missing, the feature is off. Writing notes also requires permission to change\n    the document; without it you can read notes but not add them.\n\n### Finding notes later\n\nAlthough notes are not part of the document's text, they are useful in the list:\ntick **Notes** under **Show** to see how many each document has, and pick\n**Notes** in the **Sort** menu to bring annotated documents to the top.\n\n## History\n\nOpen a document and choose the **History** tab to see every recorded change,\nnewest first. Each entry has three parts:\n\n| Part | Meaning |\n| --- | --- |\n| A relative time such as “3 days ago” | When it happened; hover over it to see the exact date and time |\n| A name, or **System** | Who made the change. **System** means Paperless-ngx did it automatically — while importing a file, running a workflow, or fetching mail |\n| A badge — **Create**, **Update**, or **Delete** | The kind of change |\n\nBelow that, the details of what changed are listed field by field: **Title**,\n**Created**, **Correspondent**, **Document type**, **Storage path** and your\ncustom fields show their new value, tag and document-type changes are listed as\nwhat was added or removed, and edits to the extracted text are shown as a short\nexcerpt.\n\nIf nothing has been recorded yet the tab simply says **No entries found.**\n\n!!! note\n\n    History is written by the optional auditing feature, which your\n    administrator turns on for the whole system. It is a record of what happened,\n    so it cannot be edited or deleted from the interface — and if the **History**\n    tab is missing, auditing is switched off.\n\n## A quick example\n\nYusuf scans the signed copy of a contract. On the **Details** tab he corrects the\ntitle. Before saving, he opens the **Notes** tab and adds a note: “Signed copy\nreceived 14 March, original posted to the lawyer.” He saves with `Ctrl` + `S`.\n\nA week later a colleague wonders who changed the title and when. She opens the\nsame document, chooses **History**, and finds an **Update** entry with Yusuf's\nname, the title's new value, and the time it was saved — then reads his note to\nfind out why.\n","ar":"---\ntitle: الملاحظات وسجل التغييرات\n---\n\n# الملاحظات وسجل التغييرات\n\nيستطيع Paperless-ngx حمل نوعين من التعليقات بجانب المستند: **الملاحظات**\n(notes) التي تكتبها لتذكير نفسك أو زملائك بشيء، و**سجل التغييرات** (history)\nالذي يكتبه النظام نيابةً عنك كلما تغيّر مستند.\n\n## الملاحظات\n\nافتح مستندًا واختر بطاقة **Notes**. ويعرض كل سطر نص الملاحظة ومن كتبها ومتى.\n\n### كتابة ملاحظة\n\n1. اضغط في المربّع الذي يقول **Enter note**.\n2. اكتب ملاحظتك. ويكفي النص العادي — مرجع دفعة مالية، أو تذكير بأن الأصل حُفظ\n   في مجلد آخر، أو سؤال لزميل.\n3. أكّد الإضافة. فتظهر الملاحظة في أعلى القائمة فورًا، وتكتسب بطاقة **Notes**\n   شارة صغيرة بعدد الملاحظات.\n\nويمكن حذف ملاحظة بـ **Delete note** الذي يطلب تأكيدًا أولًا.\n\nوترتبط الملاحظات بالمستند لا بإصدار الملف، فتبقى في مكانها عند رفع إصدار جديد.\n\n!!! note\n\n    يجب أن يُفعّل مدير النظام الملاحظات من\n    **Settings → Documents → Notes → Enable notes**. وإذا لم تظهر بطاقة\n    **Notes** فالميزة معطّلة. كما تتطلّب كتابة الملاحظات صلاحية تعديل المستند؛\n    ومن دونها يمكنك قراءة الملاحظات دون إضافتها.\n\n### العثور على الملاحظات لاحقًا\n\nرغم أن الملاحظات ليست جزءًا من نص المستند، فهي مفيدة في القائمة: أشّر\n**Notes** تحت **Show** لترى عدد الملاحظات في كل مستند، واختر **Notes** من قائمة\n**Sort** لتضع المستندات المشروحة في المقدمة.\n\n## سجل التغييرات\n\nافتح مستندًا واختر بطاقة **History** لترى كل تغيير مسجَّل، والأحدث أولًا. ويتكوّن\nكل سطر من ثلاثة أجزاء:\n\n| الجزء | معناه |\n| --- | --- |\n| وقت نسبي مثل «3 days ago» | متى حدث التغيير؛ ومرّر المؤشر عليه لترى التاريخ والوقت الدقيقين |\n| اسم، أو **System** | من أجرى التغيير. وتعني **System** أن Paperless-ngx فعل ذلك تلقائيًا — أثناء استيراد ملف أو تشغيل سير عمل أو جلب البريد |\n| شارة — **Create** أو **Update** أو **Delete** | نوع التغيير |\n\nوتُسرد تحت ذلك تفاصيل ما تغيّر حقلًا حقلًا: فـ **Title** و**Created** و\n**Correspondent** و**Document type** و**Storage path** وحقولك المخصّصة تعرض\nقيمتها الجديدة، وتُعرض تغييرات الوسوم وأنواع المستندات كإضافة أو إزالة، أما\nتعديلات النص المستخرج فتُعرض كمقتطف قصير.\n\nوإذا لم يُسجَّل شيء بعد فالبطاقة تقول ببساطة **No entries found.**\n\n!!! note\n\n    يُكتب سجل التغييرات بواسطة ميزة التدقيق الاختيارية التي يفعّلها مدير النظام\n    للنظام كله. وهو سجل لما حدث، ولذلك لا يمكن تعديله أو حذفه من الواجهة — وإذا\n    لم تظهر بطاقة **History** فالتدقيق معطّل.\n\n## مثال سريع\n\nيمسح يوسف النسخة الموقَّعة من عقد. وفي بطاقة **Details** يصحّح العنوان. وقبل\nالحفظ يفتح بطاقة **Notes** ويضيف ملاحظة: «وصلت النسخة الموقَّعة في 14 مارس،\nوأُرسل الأصل إلى المحامي.» ثم يحفظ بـ `Ctrl` + `S`.\n\nوبعد أسبوع تتساءل زميلة من غيّر العنوان ومتى. فتفتح المستند نفسه وتختار\n**History** فتجد سطر **Update** باسم يوسف وقيمة العنوان الجديدة ووقت الحفظ — ثم\nتقرأ ملاحظته لتعرف السبب.\n"},{"id":"bulk","title":{"en":"Working with many documents at once","ar":"العمل على عدة مستندات معًا"},"fileEn":"documents/bulk.md","fileAr":"documents/bulk.ar.md","en":"---\ntitle: Working with Many Documents at Once\n---\n\n# Working with Many Documents at Once\n\nFiling a batch of scanned receipts, tagging a year of invoices, or clearing out\nduplicates is much faster when you do it to a whole selection at once.\nPaperless-ngx calls this **bulk editing**.\n\n## Making a selection\n\nIn the **Documents** list, tick the box beside each document you want, or use the\n**Select:** menu above the list, which offers **Page** and **All** — and **None**\nto let go again. The count above the list shows what you have chosen, for example\n**Selected 12 of 340 documents**, and a **Clear selection** button starts you\nover.\n\nWhile something is selected, the filter bar at the top is replaced by the bulk\nediting bar.\n\n!!! tip\n\n    **Select: All** means \"everything the current filters match\", not just what\n    fits on screen. Filter first, then select all, and the operation applies to\n    every match — including documents on other pages.\n\n## The bulk editing bar\n\nFrom left to right the bar offers:\n\n1. **Edit:** followed by dropdowns for **Tags**, **Correspondent**,\n   **Document type**, **Storage path**, and **Custom fields**.\n2. **Permissions** — change who may see and change the selection.\n3. **Actions** — **Reprocess**, **Rotate**, and **Merge**.\n4. **Send** — **Create a share link bundle**, **Manage share link bundles**, and\n   **Email**.\n5. **Download** — save the selection as a ZIP file.\n6. **Delete** — move the selection to the trash.\n\n## Editing tags and other fields\n\nOpen a dropdown such as **Tags**. Because you are editing rather than filtering,\neach value has three states, and you cycle through them by clicking:\n\n| Clicks | Result |\n| --- | --- |\n| Once | The value will be **added** to every selected document |\n| Twice | The value will be **removed** from every selected document |\n| Three times | Back to no change |\n\nUse the box inside the dropdown — **Filter tags**, **Filter correspondents**, and\nso on — to find a value in a long list, or type a new name and click **Create** to\nmake it there and then. When you are done, click **Apply** at the bottom of the\ndropdown list.\n\nFor **Custom fields** there is an extra **Set values** button in the same\ndropdown, which lets you fill in the value of a custom field for the whole\nselection.\n\nIf there is any value marked for adding or removing, the blue **Apply** button\nglows; nothing is written to your documents until you click it.\n\n!!! note\n\n    Different values are not interchangeable: adding a tag never removes the\n    others. To replace a correspondent, for example, mark the old one for removal\n    and the new one for addition in the same pass.\n\n## Changing permissions\n\nClick **Permissions** to change who can see and edit the whole selection. The\ndialog is titled **Edit permissions for …** and lets you set the **Owner:** of the\ndocuments, and the **View** and **Edit** rights for individual people under\n**Users:** and for groups under **Groups:**. A note reminds you that **Edit\npermissions also grant viewing permissions**.\n\nThe **Merge with existing permissions** switch decides what happens to the\npermissions that are already there. With the switch on, the hint reads\n**Existing owner, user and group permissions will be merged with these settings.**\nWith it off, the hint warns that\n**Any and all existing owner, user and group permissions will be replaced.**\n\nConfirm with **Confirm**, or leave with **Cancel**. The button is only available\nwhen you own every document in the selection and may edit them all.\n\n## Actions on a selection\n\n| Action | What it does |\n| --- | --- |\n| **Reprocess** | Reads the selected files again; the archive files are rebuilt with the current settings |\n| **Rotate** | Adds rotated versions of the selected documents, which is mainly useful for sideways scans |\n| **Merge** | Combines two or more documents into one new document, which is then queued for processing |\n\n**Merge** needs at least two documents, and the merged result is a new document —\nthe originals are not modified unless you ask for that in the dialog, so you can\ndelete them afterwards. Merging starts with PDFs only; turn on the archive\nfallback switch if other file types should join in. **Rotate** only affects PDF\nfiles; images are left alone.\n\n## Sending and sharing a selection\n\nThe **Send** menu collects the actions that hand documents to somebody else:\n\n- **Create a share link bundle** — takes the whole selection and prepares a ZIP\n  file in the background, exposed as one public link. See\n  [Sharing and Permissions](sharing.md).\n- **Manage share link bundles** — a dialog for monitoring progress, copying\n  links, retrying failed bundles, and deleting bundles you no longer need.\n- **Email** — sends the selection as attachments, if your administrator has\n  configured e-mail sending.\n\nPreparing a bundle of 340 documents at once is rarely what you want, so the\n**Send** menu is only available for a hand-picked selection — not when you have\nchosen **Select: All**.\n\n## Downloading a selection\n\n**Download** packages everything you ticked into a single ZIP file. The small\narrow beside the button opens **Include:** where you choose **Archived files**,\n**Original files**, or both, and where you can tick **Use formatted filename**.\nLarge selections take a moment to prepare; the button shows a spinner while it\nworks.\n\n## What the confirmations say\n\nIf **Show confirmation dialogs** is switched on in\n**Settings → Documents → Bulk editing**, each risky operation asks first and\nexplains the consequences:\n\n- Tag changes get **Confirm tags assignment**, stating, for example,\n  *This operation will add the tag \"Invoices\" to 12 selected document(s).*\n  Confirm it with **Confirm**.\n- **Rotate confirm** shows the first selected document as a preview, with buttons\n  to turn it clockwise or anticlockwise in 90° steps and the note\n  *Note that only PDFs will be rotated.* The bold line reads\n  *This operation will add rotated versions of the 12 document(s).*\n- **Merge confirm** lists the documents in the order they will be merged — drag\n  the grip to change the order — and adds **Use metadata from:**\n  (**Regenerate all metadata** or one of the documents),\n  **Try to include archive version in merge for non-PDF files**, and\n  **Delete original documents after successful merge** (available only if you own\n  them all). The bold line is\n  *This operation will merge 12 selected documents into a new document.*\n- **Reprocess confirm** states\n  *The archive files will be re-generated with the current settings.* and\n  *This operation will permanently recreate the archive files for 12 selected\n  document(s).*\n\nConfirm rotation, merging, and reprocessing with **Proceed**. Afterwards, a\nnotification reports the result — *Merged document will be queued for\nconsumption.* after a merge, for instance.\n\nThe other setting in the same place, **Apply on close**, decides whether a\ndropdown applies its changes as soon as you close it or only when you click\n**Apply**.\n\n## Deleting a selection\n\n**Delete** moves everything you have selected to the trash. A dialog asks\n**Move 12 selected document(s) to the trash?** and reminds you that *Documents\ncan be restored prior to permanent deletion.* The confirm button is labelled\n**Move to trash**. Nothing is lost until the trash is emptied — see\n[Deleting and Restoring Documents](trash.md).\n\n## A quick example\n\nTariq has just scanned a shoebox of receipts: 96 documents, all with useless\ntitles. He filters the list by the document type “Receipt”, clicks\n**Select: All**, and opens the **Tags** dropdown. He clicks “2026” once to add\nit, then clicks “Unsorted” twice to remove it, and clicks **Apply**.\n\nNext he sets the correspondent for the whole batch — click once on “Utilities”,\n**Apply** — and confirms the dialog that tells him what is about to happen. Then\nhe ticks a dozen contracts that are not receipts and uses **Download** to keep a\nZIP copy for his accountant before moving the rest to the trash.\n","ar":"---\ntitle: العمل على عدة مستندات معًا\n---\n\n# العمل على عدة مستندات معًا\n\nأرشفة دفعة إيصالات ممسوحة، أو وسم فواتير سنة كاملة، أو تنظيف المستندات\nالمكرّرة — كل ذلك أسرع بكثير إذا نفّذته على مجموعة محدَّدة دفعة واحدة. ويسمّي\nPaperless-ngx ذلك **التعديل الجماعي** (bulk editing).\n\n## إنشاء مجموعة محدَّدة\n\nفي قائمة **Documents**، أشّر المربّع بجانب كل مستند تريده، أو استخدم قائمة\n**Select:** فوق القائمة، وهي تعرض **Page** و**All** و**None** للتراجع عن التحديد.\nويبيّن العدّاد فوق القائمة ما اخترته، مثل\n**Selected 12 of 340 documents**، وزر **Clear selection** يبدأ بك من جديد.\n\nوبينما يوجد تحديد، يحلّ شريط التعديل الجماعي محلّ شريط المرشّحات في الأعلى.\n\n!!! tip\n\n    تعني **Select: All** «كل ما تطابقه المرشّحات الحالية»، لا ما يظهر على الشاشة\n    فقط. رشّح أولًا ثم اختر الكل، فيسري الإجراء على كل المطابقات — بما في ذلك\n    المستندات في صفحات أخرى.\n\n## شريط التعديل الجماعي\n\nيقدّم الشريط من اليسار إلى اليمين:\n\n1. **Edit:** ثم قوائم منسدلة لـ **Tags** و**Correspondent** و**Document type**\n   و**Storage path** و**Custom fields**.\n2. **Permissions** — تغيير من يستطيع رؤية المجموعة وتغييرها.\n3. **Actions** — **Reprocess** و**Rotate** و**Merge**.\n4. **Send** — **Create a share link bundle** و**Manage share link bundles** و\n   **Email**.\n5. **Download** — حفظ المجموعة في ملف ZIP.\n6. **Delete** — نقل المجموعة إلى المهملات.\n\n## تعديل الوسوم والحقول الأخرى\n\nافتح قائمة مثل **Tags**. ولأنّك تعدّل لا ترشّح، فإن لكل قيمة ثلاث حالات\nتتنقّل بينها بالنقر:\n\n| النقرات | النتيجة |\n| --- | --- |\n| مرة واحدة | ستُضاف القيمة إلى كل مستند محدَّد |\n| مرتين | ستُزال القيمة من كل مستند محدَّد |\n| ثلاث مرات | العودة إلى عدم التغيير |\n\nواستخدم المربّع داخل القائمة — **Filter tags** أو **Filter correspondents**\nوما شابه — للعثور على قيمة في قائمة طويلة، أو اكتب اسمًا جديدًا واضغط\n**Create** لإنشائه في الحال. وعند الانتهاء اضغط **Apply** في أسفل القائمة.\n\nوفي حالة **Custom fields** يوجد زر إضافي هو **Set values** في القائمة نفسها،\nيتيح لك ملء قيمة حقل مخصّص لكل المجموعة.\n\nوإذا وُجدت أي قيمة مؤشَّرة للإضافة أو الإزالة يتوهّج زر **Apply** الأزرق؛ ولا\nيُكتب شيء في مستنداتك حتى تضغطه.\n\n!!! note\n\n    القيم المختلفة ليست بدائل لبعضها: فإضافة وسم لا تزيل الوسوم الأخرى. ولتبديل\n    مراسل مثلًا، أشّر القديم للإزالة والجديد للإضافة في المرة نفسها.\n\n## تغيير الصلاحيات\n\nاضغط **Permissions** لتغيير من يستطيع رؤية المجموعة كلها وتعديلها. عنوان النافذة\n**Edit permissions for …**، وفيها حقل **Owner:** وحقلان للقسمين **View**\n(فيه **Users:** و**Groups:**) و**Edit** (فيه **Users:** و**Groups:** أيضًا).\nوتذكّرك ملاحظة بأن **Edit permissions also grant viewing permissions**، وملاحظة\nأخرى بأنّ **Objects without an owner can be viewed and edited by all users**.\n\nويتحدّد مصير الصلاحيات الموجودة أصلًا بمفتاح\n**Merge with existing permissions**. فإن كان المفتاح مُفعّلًا قرأت التلميح\n**Existing owner, user and group permissions will be merged with these settings.**\nوإن كان مُعطّلًا حذّرك التلميح بأنّ\n**Any and all existing owner, user and group permissions will be replaced.**\n\nوأكّد بـ **Confirm** أو اخرج بـ **Cancel**. ولا يتاح الزر إلا إذا كنت تملك كل\nمستند في المجموعة وتستطيع تعديلها جميعًا.\n\n## إجراءات على مجموعة محدَّدة\n\n| الإجراء | ما يفعله |\n| --- | --- |\n| **Reprocess** | يقرأ الملفات المحدَّدة مرة أخرى؛ وتُعاد بناء الملفات الأرشيفية بالإعدادات الحالية |\n| **Rotate** | يضيف إصدارات مدوَّرة من المستندات المحدَّدة، وهو مفيد أساسًا للمسح الضوئي المائل |\n| **Merge** | يدمج مستندين أو أكثر في مستند جديد واحد يُدرَج بعد ذلك في قائمة المعالجة |\n\nويحتاج **Merge** إلى مستندين على الأقل، والنتيجة مستند جديد — فالأصول لا\nتُعدَّل إلا إذا طلبت ذلك من النافذة، ويمكنك حذفها بعدها إن أردت. ويبدأ الدمج\nبملفات PDF فقط؛ ففعّل مفتاح الأرشيف لتشارك أنواع أخرى. أمّا **Rotate** فيؤثر في\nملفات PDF فقط؛ والصور تبقى كما هي.\n\n## إرسال مجموعة ومشاركتها\n\nتجمع قائمة **Send** الإجراءات التي تُسلّم المستندات إلى جهة أخرى:\n\n- **Create a share link bundle** — تأخذ المجموعة كلها وتُهيّئ ملف ZIP في\n  الخلفية ويُعرض كرابط عام واحد. راجع [المشاركة والصلاحيات](sharing.ar.md).\n- **Manage share link bundles** — نافذة لمتابعة التقدّم ونسخ الروابط وإعادة\n  محاولة الحزم الفاشلة وحذف ما لم تعد تحتاجه.\n- **Email** — يرسل المجموعة كمرفقات، إذا كان مدير النظام قد هيّأ إرسال البريد.\n\nوتجهيز حزمة من 340 مستندًا دفعة واحدة أمر نادرًا ما يكون مطلوبًا، ولذلك لا تتاح\nقائمة **Send** إلا لمجموعة مختارة يدويًا — لا عند اختيار **Select: All**.\n\n## تنزيل مجموعة\n\nيحزم **Download** كل ما أشّرت عليه في ملف ZIP واحد. ويفتح السهم الصغير بجانب\nالزر قائمة **Include:** لتختار **Archived files** أو **Original files** أو\nكليهما، ولتؤشّر **Use formatted filename**. وتستغرق المجموعات الكبيرة لحظة\nللتجهيز؛ ويُظهر الزر مؤشّر انتظار أثناء ذلك.\n\n## ماذا تقول نوافذ التأكيد\n\nإذا كان **Show confirmation dialogs** مُفعّلًا في\n**Settings → Documents → Bulk editing**، يسأل كل إجراء ذي أثر أولًا ويوضّح\nالنتيجة:\n\n- تغييرات الوسوم تأتي مع نافذة **Confirm tags assignment** تقول مثلًا\n  *This operation will add the tag \"Invoices\" to 12 selected document(s).*\n  وأكّدها بـ **Confirm**.\n- وتعرض **Rotate confirm** أول مستند محدَّد كمعاينة، ومعه زرّان لتدويره مع عقارب\n  الساعة أو عكسها بخطوات 90°، وملاحظة *Note that only PDFs will be rotated.*\n  أمّا السطر الغامق فيقول\n  *This operation will add rotated versions of the 12 document(s).*\n- وتسرد **Merge confirm** المستندات بترتيب دمجها — اسحب المقبض لتغيير الترتيب —\n  وتضيف **Use metadata from:** (**Regenerate all metadata** أو أحد المستندات)\n  و**Try to include archive version in merge for non-PDF files**\n  و**Delete original documents after successful merge** (وهو متاح فقط إذا كنت\n  تملكها جميعًا). والسطر الغامق هو\n  *This operation will merge 12 selected documents into a new document.*\n- وتقول **Reprocess confirm**\n  *The archive files will be re-generated with the current settings.*\n  و*This operation will permanently recreate the archive files for 12 selected\n  document(s).*\n\nوأكّد التدوير والدمج وإعادة المعالجة بـ **Proceed**. وبعدها يخبرك إشعار بالنتيجة —\nمثل *Merged document will be queued for consumption.* بعد الدمج.\n\nأمّا الإعداد الآخر في المكان نفسه، **Apply on close**، فيحدّد ما إذا كانت القائمة\nالمنسدلة تطبّق تغييراتها بمجرد إغلاقها أم عند الضغط على **Apply** فقط.\n\n## حذف مجموعة\n\nينقل **Delete** كل ما حدّدته إلى المهملات. وتسأل نافذة التأكيد\n**Move 12 selected document(s) to the trash?** وتذكّرك بأنّ *Documents can be\nrestored prior to permanent deletion.* واسم زر التأكيد **Move to trash**. ولا\nيُفقد شيء حتى تُفرَّغ المهملات — راجع\n[حذف المستندات واستعادتها](trash.ar.md).\n\n## مثال سريع\n\nأكمل طارق مسح صندوق إيصالات: 96 مستندًا كلها بعناوين غير مفيدة. فيرشّح القائمة\nبنوع المستند «Receipt»، ويضغط **Select: All**، ويفتح قائمة **Tags**. فينقر\n«2026» مرة لإضافتها، ثم ينقر «Unsorted» مرتين لإزالتها، ويضغط **Apply**.\n\nثم يعيّن المراسل للدفعة كلها — نقرة واحدة على «Utilities» ثم **Apply** — ويؤكّد\nالنافذة التي تخبره بما سيحدث. وبعد ذلك يؤشّر اثني عشر عقدًا ليست إيصالات،\nويستخدم **Download** للاحتفاظ بنسخة ZIP لمحاسبه قبل نقل الباقي إلى المهملات.\n"},{"id":"trash","title":{"en":"Deleting and restoring documents","ar":"حذف المستندات واستعادتها"},"fileEn":"documents/trash.md","fileAr":"documents/trash.ar.md","en":"---\ntitle: Deleting and Restoring Documents\n---\n\n# Deleting and Restoring Documents\n\nNothing in Paperless-ngx disappears the moment you delete it. A deleted document\ngoes to the **Trash**, where it waits for a while so that a mistake can be undone.\n\n## Moving a document to the trash\n\nOpen the document and click **Delete** in the top bar. A confirmation dialog\nappears:\n\n- **Do you really want to move the document \"…\" to the trash?**\n- *Documents can be restored prior to permanent deletion.*\n- The confirm button is labelled **Move to trash**.\n\nWhen several documents have to go, select them in the list and use the **Delete**\nbutton in the bulk editing bar; see\n[Working with Many Documents at Once](bulk.md).\n\nOnce deleted, the document disappears from **Documents**, from saved views, and\nfrom the dashboard, and any **share link** pointing at it stops working. Anything\ndependent on it — a workflow that would have matched it, an e-mail rule — simply\nnever sees it again.\n\n!!! note\n\n    Deleting is not something you can do to somebody else's document. The\n    **Delete** button only appears when you have permission to delete the\n    document, so if it is missing you are looking at a document shared with you\n    rather than owned by you.\n\n## Opening the Trash\n\nChoose **Trash** in the sidebar under **Manage**. The page is described as\n*Manage trashed documents that are pending deletion*, and lists:\n\n| Column | Meaning |\n| --- | --- |\n| **Name** | The document's title, with an eye button to preview it |\n| **Remaining** | How many days are left before the document is deleted for good, shown as “N days” |\n| **Actions** | **Restore** and **Delete** for that one document |\n\nAt the bottom you will see a count such as “3 total documents in trash”, and how\nmany are currently selected. At the top of the page are four buttons:\n**Clear selection**, **Restore selected**, **Delete selected**, and\n**Empty trash**.\n\n!!! tip\n\n    The **Remaining** column is your safety net. If a document matters, restore\n    it before the days run out — the number comes from a delay your administrator\n    sets, 30 days by default.\n\n## Restoring\n\n- Click **Restore** beside a single document, or\n- tick the documents you want and click **Restore selected**.\n\nA message confirms that the document was restored. It reappears in your lists\nimmediately, with its tags, correspondent, document type, storage path, custom\nfields, notes, and history all untouched — a deleted document keeps its place in\nthe archive until the trash is emptied.\n\n## Deleting for good\n\n- **Delete** beside one document permanently removes that document.\n- **Delete selected** permanently removes the documents you have ticked.\n- **Empty trash** permanently removes everything in the trash.\n\nAll three ask for confirmation first, and the dialogs are blunt about the\nconsequences: *This operation will permanently delete this document* (or *the\nselected documents*, or *all documents in the trash*), and *This operation cannot\nbe undone*.\n\nAfterwards the database row is gone — including the document's history and its\nlinks to other data. If your administrator has configured a directory for\ndeleted files, the original and archived files are moved there rather than\nerased, which gives you one last chance to recover a file from disk. Ask an\nadministrator if you need to know whether that is switched on in your\ninstallation.\n\n## The automatic empty\n\nYou do not have to empty the trash yourself. A scheduled task removes documents\nwhose time has run out, which is why the **Remaining** column counts down. An\nadministrator controls both the delay and how often the task runs, so on some\ninstallations documents may sit in the trash slightly longer than the number\nshown.\n\n## A quick example\n\nMei deletes a delivery note that was scanned twice. The trash count becomes\n“1 total documents in trash” and the **Remaining** column reads “30 days”.\n\nTwo days later she notices the receipt she wanted is missing, and realises the\n“duplicate” she deleted had the handwritten delivery time on it. She opens\n**Trash**, finds the delivery note, and clicks **Restore**. The document comes\nback to the **Documents** list with its tags and notes intact, and she adds a\nnote explaining which copy is the good one.\n\nAt the end of the month she opens **Trash** once more, checks the two documents\nsitting there, decides neither is needed, and clicks **Empty trash**. The\nconfirmation warns that *This operation cannot be undone*, she confirms, and the\ntrash is finally empty.\n","ar":"---\ntitle: حذف المستندات واستعادتها\n---\n\n# حذف المستندات واستعادتها\n\nلا شيء في Paperless-ngx يختفي لحظة حذفه. فالمستند المحذوف ينتقل إلى\n**المهملات** (Trash) حيث يبقى فترة من الوقت حتى يمكن التراجع عن أي خطأ.\n\n## نقل مستند إلى المهملات\n\nافتح المستند واضغط **Delete** في الشريط العلوي. فتظهر نافذة تأكيد تقول:\n\n- **Do you really want to move the document \"…\" to the trash?**\n- *Documents can be restored prior to permanent deletion.*\n- واسم زر التأكيد **Move to trash**.\n\nوإذا كان عليك حذف عدة مستندات، حدّدها في القائمة واستخدم زر **Delete** في شريط\nالتعديل الجماعي؛ راجع [العمل على عدة مستندات معًا](bulk.ar.md).\n\nوبعد الحذف يختفي المستند من **Documents** ومن العروض المحفوظة ومن لوحة\nالمعلومات، كما يتوقف عمل أي **رابط مشاركة** يشير إليه. وكل ما يعتمد عليه —\nسير عمل كان سيطابقه أو قاعدة بريد — لن يراه بعد ذلك.\n\n!!! note\n\n    الحذف ليس إجراءً تنفّذه على مستند شخص آخر. فزر **Delete** لا يظهر إلا إذا\n    كنت تملك صلاحية حذف المستند؛ ولذلك إذا لم تجده فأنت تنظر إلى مستند مشترك\n    معك لا مستند تملكه.\n\n## فتح المهملات\n\nاختر **Trash** في الشريط الجانبي تحت **Manage**. ويوصَف الصفح بأنه\n*Manage trashed documents that are pending deletion*، ويعرض:\n\n| العمود | معناه |\n| --- | --- |\n| **Name** | عنوان المستند، مع زر عين لمعاينته |\n| **Remaining** | عدد الأيام المتبقية قبل حذف المستند نهائيًا، معروضًا بصيغة «N days» |\n| **Actions** | **Restore** و**Delete** لذلك المستند وحده |\n\nوفي الأسفل ترى عدّادًا مثل «3 total documents in trash» وعدد المحدَّد حاليًا. وفي\nأعلى الصفحة أربعة أزرار: **Clear selection** و**Restore selected** و\n**Delete selected** و**Empty trash**.\n\n!!! tip\n\n    عمود **Remaining** هو شبكة أمانك. فإن كان المستند مهمًّا فاستعده قبل انتهاء\n    الأيام — والرقم يأتي من مدة يضبطها مدير النظام، وهي 30 يومًا افتراضيًا.\n\n## الاستعادة\n\n- اضغط **Restore** بجانب مستند واحد، أو\n- أشّر المستندات التي تريدها ثم اضغط **Restore selected**.\n\nوتؤكّد لك رسالة أن المستند استُعيد. فيظهر في قوائمك فورًا، مع بقاء وسومه ومراسله\nونوع مستنده ومسار تخزينه وحقوله المخصّصة وملاحظاته وسجلّه كما هي — فالمستند\nالمحذوف يحتفظ بمكانه في الأرشيف حتى تُفرَّغ المهملات.\n\n## الحذف نهائيًا\n\n- **Delete** بجانب مستند واحد يحذف ذلك المستند نهائيًا.\n- **Delete selected** يحذف نهائيًا المستندات التي أشّرت عليها.\n- **Empty trash** يحذف نهائيًا كل ما في المهملات.\n\nوثلاثتها تطلب تأكيدًا أولًا، وتبيّن النوافذ النتيجة بصراحة:\n*This operation will permanently delete this document* (أو *the selected\ndocuments* أو *all documents in the trash*)، وأنّ *This operation cannot be\nundone*.\n\nوبعد ذلك يُحذف سجل المستند من قاعدة البيانات، بما في ذلك سجلّ تاريخه وارتباطاته\nببيانات أخرى. وإذا كان مدير النظام قد هيّأ مجلدًا للملفات المحذوفة، فإن الملفين\nالأصلي والأرشيفي يُنقلان إليه بدل إتلافهما، مما يمنحك فرصة أخيرة لاستعادة ملف\nمن القرص. اسأل مدير النظام إن أردت معرفة ما إذا كان ذلك مفعّلًا في تثبيتك.\n\n## التفريغ التلقائي\n\nلا يلزمك تفريغ المهملات بنفسك. فهناك مهمة مجدولة تحذف المستندات التي انتهت\nمدّتها، ولهذا يعدّ عمود **Remaining** تنازليًا. ويتحكم مدير النظام في المدة وفي\nعدد مرات تشغيل المهمة، ولذلك قد تبقى المستندات في بعض التثبيتات أطول قليلًا من\nالعدد المعروض.\n\n## مثال سريع\n\nتحذف مي إشعار تسليم سُوِّر مرتين. فيصبح عدّاد المهملات «1 total documents in\ntrash» ويقرأ عمود **Remaining** «30 days».\n\nوبعد يومين تلاحظ أن الإيصال الذي تريده مفقود، وتدرك أن «النسخة المكرّرة» التي\nحذفتها كانت تحمل وقت التسليم المكتوب بخط اليد. فتفتح **Trash** وتجد إشعار\nالتسليم وتضغط **Restore**. فيعود المستند إلى قائمة **Documents** بوسومه\nوملاحظاته سليمة، وتضيف ملاحظة تبيّن أيّ النسختين هي الأفضل.\n\nوفي نهاية الشهر تفتح **Trash** مرة أخرى، وتتفقّد المستندين الموجودين، وتقرّر أن\nلا حاجة لأيّ منهما، وتضغط **Empty trash**. فتحذّرها نافذة التأكيد بأن\n*This operation cannot be undone*، فتؤكّد، وتُفرَّغ المهملات أخيرًا.\n"},{"id":"sharing","title":{"en":"Sharing and permissions","ar":"المشاركة والصلاحيات"},"fileEn":"documents/sharing.md","fileAr":"documents/sharing.ar.md","en":"---\ntitle: Sharing and Permissions\n---\n\n# Sharing and Permissions\n\nThere are three ways to give somebody else access to a document, and they are\ngood for different things:\n\n| Way | Good for | Needs a Paperless-ngx account? |\n| --- | --- | --- |\n| Permissions on the document | Colleagues who use the same installation | Yes |\n| **Share Links** | A public link anybody can open | No |\n| **Email** | Sending a copy to somebody outside | No |\n\nWhichever you use, remember that a **share link** and an e-mailed copy are just\nfiles: once they are out, you cannot take them back. For an everyday overview of\nsharing, see [Sharing documents from Paperless-ngx](../../usage.md).\n\n## Sharing with people who have an account\n\nOpen a document and choose the **Permissions** tab. The form has three parts:\n\n- **Owner:** — the one person who owns the document. The owner's settings decide\n  who may edit and delete it. A note under the field says that\n  **Objects without an owner can be viewed and edited by all users**.\n- **View** — the **Users:** and **Groups:** who may open the document.\n- **Edit** — the **Users:** and **Groups:** who may change it, with a reminder\n  that **Edit permissions also grant viewing permissions**.\n\nPermissions are part of the document's own form, so you save them the same way as\nany other change, with **Save** or `Ctrl` + `S`.\n\n!!! note\n\n    An important default: **Objects without an owner can be viewed and edited by\n    all users.** If you never set an owner, everybody on the installation can see\n    and change the document. Set an owner whenever a document is not meant for\n    everyone.\n\n### Finding your shared documents\n\nThe **Permissions** filter in the document list is the fastest way to see what is\ngoing on:\n\n- **All** — everything you may see.\n- **My documents** — documents you own.\n- **Shared with me** — documents owned by somebody else that you can open.\n- **Shared by me** — documents you own that you have shared with others.\n- **Unowned** — documents with no owner at all, which everybody can see.\n- **Users** — pick one or more people to see what they have.\n- **Hide unowned** — a switch that leaves ownerless documents out of the results.\n\nYou can also tick **Owner** and **Shared** under **Show** to see both facts beside\neach document in the list.\n\n## Public share links for one document\n\nOpen the document and choose **Actions → Share Links**. The **Share Links** dialog\nlists every link that exists for this document; when there are none it says\n**No existing links**.\n\nEach link is shown as a ready-made address of the form\n`{paperless-url}/share/{slug}`, with:\n\n- A **Copy** button that puts the address on your clipboard and shows **Copied!**;\n- A **Share** button, on devices that offer sharing to other apps;\n- A **Delete** button for links you no longer want;\n- A badge with the time left, such as “7 days”, when the link expires.\n\nAt the bottom you choose how the new link should behave:\n\n| Setting | Options |\n| ---
