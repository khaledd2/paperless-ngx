 | --- |\n| **Share archive version** | On: the visitor downloads the archived copy. Off: the original file as you uploaded it |\n| **Expires** | **1 day**, **7 days**, **30 days**, or **Never** |\n\nPress **Create** to make the link; it appears in the list immediately.\n\nAnyone who has the address can open the file without signing in, so treat a share\nlink like a password. Once a link expires or is deleted, visitors are sent to the\nnormal sign-in page instead.\n\n!!! tip\n\n    If your installation sits behind a reverse proxy with its own authentication,\n    a share link may still ask for a password. Your administrator can create an\n    exception for the `/share/` path — see\n    [Sharing documents from Paperless-ngx](../../usage.md).\n\n## Share link bundles for a selection\n\nTo share several documents at once, select them in the document list and choose\n**Send → Create a share link bundle**. Paperless-ngx builds a ZIP file in the\nbackground and gives you one link for the whole archive.\n\nThe **Create share link bundle** dialog shows **Selected documents:** (with\n**+ N more…** when the selection is long), plus **Expires** and **File version**\n— **Share archive version (if available)**, or the original files. Press\n**Create link**, and the dialog reports the **Slug**, the **Status**, and\neventually the **Size**.\n\nTo monitor or tidy up bundles, choose **Send → Manage share link bundles**. The\n**Share link bundles** dialog lists them all with **Documents**, **Status**,\n**Size**, **Created**, **Expires**, **File version**, and **Actions** — where you\ncan **Copy share link**, **Retry** a failed bundle, or\n**Delete share link bundle**. It notes that **Status updates every few seconds\nwhile bundles are being prepared**, and says\n**No share link bundles currently exist.** when the list is empty.\n\nStatuses run through **Pending**, **Processing**, **Ready**, and **Failed**. A\nbundle is only worth sharing once it is **Ready**; if it ends up **Failed**,\n**Retry** builds it again.\n\n## E-mailing a document\n\nIf your administrator has configured sending, choose **Actions → Email** on a\ndocument (or **Send → Email** for a selection) to open the **Email** dialog:\n\n- **Email address(es)** — one or more recipients;\n- **Subject** and **Message** — a subject line and any covering text;\n- **Use archive version** — send the archived copy instead of the original file;\n- **Send email** — sends the message, and a notification confirms **Email sent**.\n\nThe dialog warns that **Some email servers may reject messages with large\nattachments.** If the send fails, the notification reports\n**Error emailing document** so you can try again with fewer attachments or the\noriginal file.\n\n## A quick example\n\nNadia needs to send a supplier the delivery note, an invoice, and a signed\ncontract. She first opens each document, uses the **Permissions** tab to give her\ncolleague Rami **View** rights, and saves.\n\nFor the supplier she needs no account at all, so she selects the three documents\nin the list, chooses **Send → Create a share link bundle**, sets **Expires** to\n**30 days**, and clicks **Create link**. The dialog shows **Pending**, then\n**Processing**, and finally **Ready**; she clicks **Copy share link** and pastes\nit into her e-mail.\n\nA month later she opens **Send → Manage share link bundles**, sees that the\nbundle has expired, and clicks **Delete share link bundle** so that nothing is\nleft lying around.\n","ar":"---\ntitle: المشاركة والصلاحيات\n---\n\n# المشاركة والصلاحيات\n\nهناك ثلاث طرق لمنح شخص آخر حقّ الوصول إلى مستند، ولكل واحدة استخدامها:\n\n| الطريقة | تصلح لـ | تحتاج حسابًا في Paperless-ngx؟ |\n| --- | --- | --- |\n| الصلاحيات على المستند | زملاء يستخدمون التثبيت نفسه | نعم |\n| **Share Links** | رابط عام يستطيع أي شخص فتحه | لا |\n| **Email** | إرسال نسخة إلى جهة خارجية | لا |\n\nوأيّها استخدمت، تذكّر أن **رابط المشاركة** والنسخة المرسلة بالبريد ليسا إلا\nملفّين: متى خرجا لم تستطع استعادتهما. ولمحة عامة عن المشاركة، راجع\n[مشاركة المستندات من Paperless-ngx](../../usage.md).\n\n## المشاركة مع من لديهم حساب\n\nافتح مستندًا واختر تبويب **Permissions**. وللنموذج ثلاثة أجزاء:\n\n- **Owner:** — الشخص الوحيد الذي يملك المستند، وبتعييناته يُحدَّد من يستطيع\n  تعديله وحذفه. وتحت الحقل ملاحظة تقول\n  **Objects without an owner can be viewed and edited by all users**.\n- **View** — **Users:** و**Groups:** ممّن يستطيعون فتح المستند.\n- **Edit** — **Users:** و**Groups:** ممّن يستطيعون تغييره، مع تذكير بأنّ\n  **Edit permissions also grant viewing permissions**.\n\nوالصلاحيات جزء من نموذج المستند نفسه، فتحفظها كما تحفظ أي تغيير آخر بـ **Save**\nأو `Ctrl` + `S`.\n\n!!! note\n\n    وهناك افتراض مهم: **Objects without an owner can be viewed and edited by all\n    users.** فإن لم تعيّن مالكًا، أمكن كل مستخدمي التثبيت رؤية المستند وتغييره.\n    فعيّن مالكًا كلما لم يكن المستند مخصّصًا للجميع.\n\n### العثور على المستندات المشتركة\n\nمرشّح **Permissions** في قائمة المستندات هو أسرع طريقة لمعرفة ما يجري:\n\n- **All** — كل ما يجوز لك رؤيته.\n- **My documents** — المستندات التي تملكها.\n- **Shared with me** — مستندات يملكها غيرك وتستطيع فتحها.\n- **Shared by me** — مستندات تملكها وشاركتها مع آخرين.\n- **Unowned** — مستندات بلا مالك مطلقًا، ويراها الجميع.\n- **Users** — اختر شخصًا أو أكثر لترى ما لديه.\n- **Hide unowned** — مفتاح يُخلي النتائج من المستندات بلا مالك.\n\nويمكنك أيضًا تأشير **Owner** و**Shared** تحت **Show** لرؤية هاتين المعلومتين\nبجانب كل مستند في القائمة.\n\n## روابط المشاركة العامة لمستند واحد\n\nافتح المستند واختر **Actions → Share Links**. وتسرد نافذة **Share Links** كل رابط\nموجود لهذا المستند؛ فإن لم يوجد شيء قالت **No existing links**.\n\nويُعرض كل رابط كعنوان جاهز بالصيغة `{paperless-url}/share/{slug}` ومعه:\n\n- زر **Copy** يضع العنوان في الحافظة ويُظهر **Copied!**؛\n- زر **Share**، على الأجهزة التي تتيح المشاركة مع تطبيقات أخرى؛\n- زر **Delete** للروابط التي لم تعد تريدها؛\n- شارة بالوقت المتبقّي، مثل «7 days»، عندما ينتهي الرابط.\n\nوفي الأسفل تختار سلوك الرابط الجديد:\n\n| الإعداد | الخيارات |\n| --- | --- |\n| **Share archive version** | مُفعّلًا: ينزّل الزائر النسخة الأرشيفية. مُعطّلًا: الملف الأصلي كما رفعته |\n| **Expires** | **1 day** أو **7 days** أو **30 days** أو **Never** |\n\nواضغط **Create** لإنشاء الرابط؛ فيظهر في القائمة فورًا.\n\nوكل من يملك العنوان يستطيع فتح الملف دون تسجيل دخول، فتعامل مع رابط المشاركة\nكما تتعامل مع كلمة سر. ومتى انتهى الرابط أو حُذف، يُحوَّل الزائر إلى صفحة تسجيل\nالدخول المعتادة.\n\n!!! tip\n\n    إذا كان تثبيتك خلف وكيل عكسي فيه مصادقة خاصة به، فقد يطلب رابط المشاركة كلمة\n    سر رغم ذلك. ويستطيع مدير النظام استثناء المسار `/share/` — راجع\n    [مشاركة المستندات من Paperless-ngx](../../usage.md).\n\n## حزم روابط المشاركة لمجموعة محدَّدة\n\nلمشاركة عدة مستندات دفعة واحدة، حدِّدها في قائمة المستندات واختر\n**Send → Create a share link bundle**. فيُهيّئ Paperless-ngx ملف ZIP في الخلفية\nويمنحك رابطًا واحدًا للأرشيف كله.\n\nوتُظهر نافذة **Create share link bundle** العنوان **Selected documents:** (ومعه\n**+ N more…** إن طالت المجموعة)، إضافة إلى **Expires** و**File version** —\n**Share archive version (if available)** أو الملفات الأصلية. واضغط\n**Create link**، فتُخبرك النافذة بالـ **Slug** و**Status** وبالـ **Size** في\nالنهاية.\n\nولمتابعة الحزم أو ترتيبها اختر **Send → Manage share link bundles**. وتسرد نافذة\n**Share link bundles** الحزم كلها بحقول **Documents** و**Status** و**Size**\nو**Created** و**Expires** و**File version** و**Actions**، حيث تستطيع\n**Copy share link** أو **Retry** لحزمة فاشلة أو **Delete share link bundle**.\nوتشير النافذة إلى أنّ **Status updates every few seconds while bundles are being\nprepared**، وتقول **No share link bundles currently exist.** عندما تكون القائمة\nفارغة.\n\nوتمرّ الحالة بـ **Pending** ثم **Processing** ثم **Ready** أو **Failed**. ولا\nجدوى من مشاركة حزمة قبل أن تصير **Ready**؛ وإن انتهت **Failed**، أعاد **Retry**\nبناءها.\n\n## إرسال مستند بالبريد\n\nإذا كان مدير النظام قد هيّأ الإرسال، اختر **Actions → Email** على مستند (أو\n**Send → Email** لمجموعة) لتُفتح نافذة **Email**:\n\n- **Email address(es)** — مستقبِل واحد أو أكثر؛\n- **Subject** و**Message** — سطر موضوع وأي نص مرافق؛\n- **Use archive version** — إرسال النسخة الأرشيفية بدل الملف الأصلي؛\n- **Send email** — يرسل الرسالة، ويؤكّد إشعار بأنّ **Email sent**.\n\nوتحذّر النافذة بأنّ **Some email servers may reject messages with large\nattachments.** وإن فشل الإرسال، ذكر الإشعار\n**Error emailing document** لتُعيد المحاولة بمرفقات أقل أو بالملف الأصلي.\n\n## مثال سريع\n\nتحتاج نادية أن ترسل إلى مورّد إشعار التسليم وفاتورة وعقدًا موقّعًا. فتبدأ بفتح\nكل مستند، وتستخدم تبويب **Permissions** لمنح زميلها رامي حقّ **View**، وتحفظ.\n\nوليس للمورّد حساب عندها أصلًا، فتحتار المستندات الثلاثة في القائمة، وتختار\n**Send → Create a share link bundle**، وتضبط **Expires** على **30 days**، وتضغط\n**Create link**. فتُظهر النافذة **Pending** ثم **Processing** وأخيرًا **Ready**؛\nفتضغط **Copy share link** وتلصق الرابط في رسالتها.\n\nوبعد شهر تفتح **Send → Manage share link bundles**، فترى أن الحزمة انتهت، وتضغط\n**Delete share link bundle** كي لا يبقى شيء معلّقًا.\n"}]},{"id":"attributes","title":{"en":"Attributes","ar":"الخصائص"},"items":[{"id":"tags","title":{"en":"Tags","ar":"الوسوم"},"fileEn":"attributes/tags.md","fileAr":"attributes/tags.ar.md","en":"---\ntitle: Tags\n---\n\n# Tags\n\nA **tag** is a label you stick onto documents so you can gather them together\nlater: **Invoice**, **Taxes**, **Warranty**, **To do**. A document can carry as\nmany tags as you like, and the same tag can sit on thousands of documents, so\ntags behave like folders you are allowed to be in several of at once.\n\nTags live under **Attributes → Tags** in the sidebar, and you can also create one\nwhile you are editing a document.\n\n## The Tags list\n\nThe page holds one row per tag, with this toolbar above it:\n\n| Part | What it does |\n| --- | --- |\n| **Filter by:** | Type part of a name to narrow the list to matching tags and their children. |\n| **Show:** | How many rows to list — **25**, **50**, or **100** — with the paging buttons beside it. |\n| **Select:** | **None**, **Page**, or **All**, for working on several tags at once. |\n| **Permissions** | Set the owner and the view/edit permissions of every selected tag. |\n| **Delete** | Delete every selected tag after a **Confirm delete**. |\n| **Create** | Opens the **Create new tag** dialog. |\n\nThe columns are **Name**, **Matching**, **Document count**, **Color**, and\n**Actions**:\n\n- **Name** — clicking a name opens the tag for editing.\n- **Matching** — the automatic matching rule, in short form, such as\n  **Automatic**, **None**, or **Any word: policy premium**.\n- **Document count** — how many documents currently carry the tag.\n- **Color** — a badge showing the tag's colour.\n- **Actions** — **Edit**, **Delete**, and, when the count is not zero,\n  **Documents** with the count, which opens the tag as a filter in the document\n  list. On a narrow screen these hide behind a three-dot menu.\n\nBelow the table, the line **N total tags** tells you how big the list is, and\n**(N selected)** appears while you have a selection.\n\n!!! note\n\n    Deleting a tag never deletes documents. It only takes the label off every\n    document that carried it.\n\n## Creating and editing a tag\n\n**Create** opens the **Create new tag** dialog; **Edit** opens **Edit tag**. Both\nhold the same fields:\n\n| Field | What it means |\n| --- | --- |\n| **Name** | What the tag is called, exactly as it will appear on documents. |\n| **Color** | The tag's colour, shown as a badge on every document that carries it. |\n| **Parent** | The tag this one sits under when you are building a hierarchy. Leave it empty for a top-level tag. |\n| **Inbox tag** | A special tag: **Inbox tags are automatically assigned to all consumed documents.** |\n| **Matching algorithm** | How Paperless-ngx should decide on its own to add this tag to new documents. |\n| **Matching pattern** | The word or words to look for. It appears only when the chosen algorithm needs one. |\n| **Case insensitive** | Whether the pattern ignores capital letters. |\n\nThe dialog closes with **Cancel** or saves with **Save**. Every attribute also has\nan owner and permissions; those are described in\n[Authentication, Users, Groups & Permissions](../getting-started/authentication.md).\n\n## Matching algorithms\n\n**Matching** is what lets Paperless-ngx tag a document for you as it arrives. The\nchoices in the **Matching algorithm** menu are:\n\n| Choice | Paperless-ngx adds the tag when… |\n| --- | --- |\n| **Automatic** (the default) | it has learned the answer from how you have tagged similar documents before. No pattern is needed. |\n| **Any word** | the document contains any one of the words you list, separated by spaces. |\n| **All words** | the document contains every one of the words you list. |\n| **Exact match** | the document contains your pattern exactly as written. |\n| **Regular expression** | the document matches a pattern you have written in the regular-expression language. |\n| **Fuzzy word** | the document contains a word similar to the one you gave, allowing small spelling differences. |\n| **None** | you want no automatic matching for this tag. |\n\nOnly **Automatic** and **None** hide the **Matching pattern** field. For the\nothers, whatever you type there is what gets looked for; tick **Case insensitive**\nto ignore capital letters.\n\n## Nested tags\n\nTags can be arranged in a tree by giving one tag a **Parent**:\n\n- A tag may sit up to five levels deep.\n- Adding a child tag to a document also adds all of its parents.\n- Removing a tag from a document also removes all of its children.\n- Giving an existing tag a **Parent** updates every document that already has it,\n  so the parent is added there too.\n\nIn the list, children appear indented under their parent. On a document, a tag\nbadge shows the whole chain, like **Files > Taxes > 2026**.\n\n## Putting tags on documents\n\nThere are three easy ways:\n\n- While editing a document, use the **Tags** field. Type to search, click a\n  suggestion to add it, and use the **+** button to create a brand new tag\n  without leaving the page.\n- Let matching do the work: give the tag a **Matching algorithm** and a\n  **Matching pattern**, and new documents are tagged as they arrive.\n- Tick several documents in the list and set the tag with bulk editing — see\n  [Working with Many Documents at Once](../documents/bulk.md).\n\nIn the document list you can also filter by tags: open the **Tags** filter button,\ntype in **Filter tags**, and tick the tags you want — see\n[Browsing, Filtering and Searching](../documents/browsing.md).\n\n## The Inbox tag\n\nAn **Inbox tag** is a tag used as a holding area. Because it is automatically\nassigned to every consumed document, it is an easy way to find what has just\narrived and work through it:\n\n1. Open **Attributes → Tags** and create a tag called, for example, **Inbox**.\n2. Tick **Inbox tag** and save.\n3. Filter the document list by that tag whenever you want to review new\n   documents, and remove the tag once a document has been dealt with.\n\n!!! tip\n\n    A document that still carries an inbox tag also has its suggestions worked\n    out for you, so its **Tags**, **Correspondent**, and **Document type** are\n    usually one click away — see\n    [Editing Document Details](../documents/editing.md).\n\n## A quick example\n\nRana organizes a household archive. She creates the top-level tags **Home**,\n**Work**, and **Car**, and under **Car** she adds **Insurance** and **Service**.\nFor **Insurance** she sets **Matching algorithm** to **Any word** and **Matching\npattern** to `policy premium`, so renewal letters are tagged as they arrive.\n\nLater she opens a letter that was missed. As she types in its **Tags** field,\n**Insurance** is offered; she picks it, and Paperless-ngx adds **Car** as well,\nbecause it is the parent. Back on **Attributes → Tags**, the **Document count**\nfor **Insurance** has gone up by one.\n","ar":"---\ntitle: الوسوم\n---\n\n# الوسوم (Tags)\n\n**الوسم (tag)** تسمية تُلصقها على المستندات لتجمعها لاحقًا: **Invoice**\nأو **Taxes** أو **Warranty** أو **To do**. ويمكن للمستند أن يحمل ما تشاء من\nالوسوم، ويمكن للوسم نفسه أن يقف على آلاف المستندات؛ فالوسوم إذًا تشبه مجلدات\nيُسمح لك بأن تكون في عدة منها في الوقت نفسه.\n\nتجد الوسوم تحت **السمات (Attributes) → Tags** في الشريط الجانبي، ويمكنك كذلك\nإنشاء وسم أثناء تعديل مستند.\n\n## قائمة الوسوم\n\nتعرض الصفحة سطرًا لكل وسم، ويعلوها هذا الشريط:\n\n| الجزء | ما يفعله |\n| --- | --- |\n| **Filter by:** | اكتب جزءًا من الاسم لتضيّق القائمة إلى الوسوم المطابقة وأبنائها. |\n| **Show:** | عدد الأسطر المعروضة — **25** أو **50** أو **100** — وأزرار التنقّل بين الصفحات بجانبها. |\n| **Select:** | **None** أو **Page** أو **All**، للعمل على عدة وسوم معًا. |\n| **Permissions** | تعيين المالك وصلاحيات العرض والتعديل لكل وسم محدَّد. |\n| **Delete** | حذف كل وسم محدَّد بعد تأكيد **Confirm delete**. |\n| **Create** | يفتح نافذة **Create new tag**. |\n\nوالأعمدة هي **Name** و**Matching** و**Document count** و**Color** و**Actions**:\n\n- **Name** — النقر على الاسم يفتح الوسم للتعديل.\n- **Matching** — قاعدة المطابقة التلقائية بصيغة مختصرة، مثل **Automatic** أو\n  **None** أو **Any word: policy premium**.\n- **Document count** — عدد المستندات التي تحمل الوسم حاليًا.\n- **Color** — شارة تُظهر لون الوسم.\n- **Actions** — **Edit** و**Delete**، وإذا لم يكن العدد صفرًا يظهر **Documents**\n  ومعه العدد، فيفتح الوسم كمرشّح في قائمة المستندات. وعلى الشاشات الضيقة تختفي\n  هذه الأزرار خلف قائمة النقاط الثلاث.\n\nوتحت الجدول يخبرك السطر **N total tags** بحجم القائمة، ويظهر **(N selected)**\nأثناء وجود تحديد.\n\n!!! note\n\n    حذف وسم لا يحذف المستندات أبدًا؛ إنه يزيل التسمية فقط من كل مستند كان\n    يحملها.\n\n## إنشاء وسم وتعديله\n\nيفتح **Create** نافذة **Create new tag**، ويفتح **Edit** نافذة **Edit tag**،\nوكلتاهما تحمل الحقول نفسها:\n\n| الحقل | ما يعنيه |\n| --- | --- |\n| **Name** | اسم الوسم كما سيظهر على المستندات تمامًا. |\n| **Color** | لون الوسم، ويُعرض شارةً على كل مستند يحمله. |\n| **Parent** | الوسم الذي يقع هذا تحته عند بناء تدرّج هرمي. اتركه فارغًا لوسم في المستوى الأعلى. |\n| **Inbox tag** | وسم خاص: **Inbox tags are automatically assigned to all consumed documents.** |\n| **Matching algorithm** | كيف يقرّر Paperless-ngx من تلقاء نفسه إضافة هذا الوسم إلى المستندات الجديدة. |\n| **Matching pattern** | الكلمة أو الكلمات التي يبحث عنها. ويظهر فقط حين تحتاج الخوارزمية المختارة إليه. |\n| **Case insensitive** | هل تتجاهل المطابقة الحروف الكبيرة والصغيرة. |\n\nوتُغلق النافذة بـ **Cancel** أو تُحفظ بـ **Save**. ولكل سمة أيضًا مالك\nوصلاحيات، وهي مشروحة في\n[المصادقة والمستخدمون والمجموعات والصلاحيات](../getting-started/authentication.ar.md).\n\n## خوارزميات المطابقة\n\n**المطابقة (matching)** هي ما يتيح لـ Paperless-ngx أن يضع الوسم عنك فور وصول\nالمستند. والخيارات في قائمة **Matching algorithm** هي:\n\n| الخيار | يضيف Paperless-ngx الوسم عندما… |\n| --- | --- |\n| **Automatic** (الافتراضي) | يتعلّم الجواب من طريقة وسمك لمستندات مشابهة سابقًا. ولا يحتاج إلى نمط. |\n| **Any word** | يحتوي المستند على أي كلمة من الكلمات التي تسردها، مفصولة بمسافات. |\n| **All words** | يحتوي المستند على كل الكلمات التي تسردها. |\n| **Exact match** | يحتوي المستند على نمطك كما كتبته تمامًا. |\n| **Regular expression** | يطابق المستند نمطًا كتبته بلغة التعبيرات النمطية (regular expressions). |\n| **Fuzzy word** | يحتوي المستند على كلمة قريبة من الكلمة التي أعطيتها، مع احتمال فروق إملائية صغيرة. |\n| **None** | لا تريد أي مطابقة تلقائية لهذا الوسم. |\n\nولا يُخفي حقل **Matching pattern** إلا الخياران **Automatic** و**None**. وفي ما\nعداهما، فما تكتبه هناك هو ما يُبحث عنه؛ وأشّر **Case insensitive** لتجاهل\nالحروف الكبيرة والصغيرة.\n\n## الوسوم المتداخلة\n\nيمكن ترتيب الوسوم شجرةً بإعطاء وسم حقل **Parent**:\n\n- يجوز أن يقع الوسم حتى خمسة مستويات في العمق.\n- إضافة وسم ابن إلى مستند تضيف معه كل آبائه.\n- إزالة وسم من مستند تزيل معه كل أبنائه.\n- إعطاء وسم موجود حقل **Parent** يحدّث كل مستند يحمله، فيُضاف الأب هناك أيضًا.\n\nوفي القائمة يظهر الأبناء مُزاحين تحت أبيهم. وعلى المستند تُظهر شارة الوسم\nالسلسلة كاملة، مثل **Files > Taxes > 2026**.\n\n## إسناد الوسوم إلى المستندات\n\nثلاث طرق سهلة:\n\n- أثناء تعديل مستند استخدم حقل **Tags**. اكتب لتبحث، وانقر اقتراحًا لتضيفه،\n  واستخدم زر **+** لإنشاء وسم جديد من دون مغادرة الصفحة.\n- دع المطابقة تعمل: أعطِ الوسم **Matching algorithm** و**Matching pattern**،\n  فتُوسم المستندات الجديدة فور وصولها.\n- أشّر عدة مستندات في القائمة وأسند الوسم بالتحرير الجماعي — راجع\n  [العمل على عدة مستندات معًا](../documents/bulk.ar.md).\n\nوفي قائمة المستندات يمكنك أيضًا الترشيح بالوسوم: افتح زر مرشّح **Tags** واكتب\nفي **Filter tags** وأشّر الوسوم التي تريد — راجع\n[تصفّح المستندات وتصفيتها والبحث فيها](../documents/browsing.ar.md).\n\n## وسم البريد الوارد (Inbox tag)\n\n**Inbox tag** وسم يُستخدم منطقة تجميع. ولأنه يُسند تلقائيًا إلى كل مستند\nمستهلك، فهو طريقة سهلة لمعرفة ما وصل للتوّ والعمل عليه:\n\n1. افتح **السمات (Attributes) → Tags** وأنشئ وسمًا باسم **Inbox** مثلًا.\n2. أشّر **Inbox tag** واحفظ.\n3. رشّح قائمة المستندات بذلك الوسم كلما أردت مراجعة المستندات الجديدة، وأزل\n   الوسم متى انتهيت من المستند.\n\n!!! tip\n\n    والمستند الذي لا يزال يحمل وسم بريد وارد تُحسب له اقتراحاته أيضًا، فيكون\n    **Tags** و**Correspondent** و**Document type** له على بعد نقرة في الغالب —\n    راجع [تعديل تفاصيل المستند](../documents/editing.ar.md).\n\n## مثال سريع\n\nتنظّم رنا أرشيفًا منزليًا. تنشئ الوسوم العليا **Home** و**Work** و**Car**،\nوتضيف تحت **Car** وسمَي **Insurance** و**Service**. ولوسم **Insurance** تضبط\n**Matching algorithm** على **Any word** و**Matching pattern** على\n`policy premium`، فتُوسم رسائل التجديد فور وصولها.\n\nوبعد مدة تفتح رسالة فاتها الوسم. وما إن تكتب في حقل **Tags** الخاص بها حتى\nيُعرض **Insurance**، فتختاره، فيضيف Paperless-ngx **Car** أيضًا لأنه الأب.\nوعند عودتها إلى **السمات (Attributes) → Tags** تجد **Document count** لوسم\n**Insurance** قد زاد واحدًا.\n"},{"id":"correspondents","title":{"en":"Correspondents","ar":"المراسلون"},"fileEn":"attributes/correspondents.md","fileAr":"attributes/correspondents.ar.md","en":"---\ntitle: Correspondents\n---\n\n# Correspondents\n\nA **correspondent** is the person, company, or institution a document came from\nor was sent to: a bank, an electricity supplier, an employer, a landlord, a\nclinic. Grouping documents by correspondent is one of the fastest ways to answer\n\"where is the last letter from the tax office?\".\n\nYou manage correspondents under **Attributes → Correspondents** in the sidebar,\nand you can also create one while editing a document.\n\n!!! tip\n\n    A correspondent is not the same thing as a tag. A correspondent answers\n    *who*, and each document has at most one; a tag answers *what it is about*,\n    and a document can have many.\n\n## The Correspondents list\n\nThe page shows one row per correspondent, with this toolbar above it:\n\n| Part | What it does |\n| --- | --- |\n| **Filter by:** | Type part of a name to narrow the list. |\n| **Show:** | How many rows to list — **25**, **50**, or **100** — with the paging buttons beside it. |\n| **Select:** | **None**, **Page**, or **All**, for working on several correspondents at once. |\n| **Permissions** | Set the owner and the view/edit permissions of every selected correspondent. |\n| **Delete** | Delete every selected correspondent after a **Confirm delete**. |\n| **Create** | Opens the **Create new correspondent** dialog. |\n\nThe columns are **Name**, **Matching**, **Document count**, **Last used**, and\n**Actions**:\n\n- **Name** — clicking a name opens the correspondent for editing.\n- **Matching** — the automatic matching rule in short form, such as\n  **Automatic**, **None**, or **Any word: city power**.\n- **Document count** — how many documents are currently filed under this\n  correspondent.\n- **Last used** — the date of the most recent document from this correspondent.\n- **Actions** — **Edit**, **Delete**, and, when the count is not zero,\n  **Documents** with the count, which opens the correspondent as a filter in the\n  document list. On a narrow screen these hide behind a three-dot menu.\n\nBelow the table, **N total correspondents** tells you how big the list is, and\n**(N selected)** appears while you have a selection.\n\nIn the **Confirm delete** dialog, **Associated documents will not be deleted.**\napplies here too: removing a correspondent never removes documents, it only\nclears the field on them.\n\n## Creating and editing a correspondent\n\n**Create** opens the **Create new correspondent** dialog; **Edit** opens **Edit\ncorrespondent**. A correspondent has fewer fields than a tag:\n\n| Field | What it means |\n| --- | --- |\n| **Name** | The name of the person, company, or institution, as it should appear on documents. |\n| **Matching algorithm** | How Paperless-ngx should decide on its own to set this correspondent on new documents. |\n| **Matching pattern** | The word or words to look for. It appears only when the chosen algorithm needs one. |\n| **Case insensitive** | Whether the pattern ignores capital letters. |\n\nThe **Matching algorithm** choices — **Automatic**, **Any word**, **All words**,\n**Exact match**, **Regular expression**, **Fuzzy word**, and **None** — work\nexactly as they do for tags, and are described under\n[Matching algorithms](tags.md#matching-algorithms).\n\nThe dialog closes with **Cancel** or saves with **Save**. Owners and permissions\nare described in\n[Authentication, Users, Groups & Permissions](../getting-started/authentication.md).\n\n## Using a correspondent on documents\n\n- While editing a document, use the **Correspondent** field. Type to search, or\n  write a new name and create it on the spot; leave it empty when no\n  correspondent applies.\n- Let matching do the work with a **Matching algorithm** and **Matching\n  pattern**.\n- Tick several documents in the list and set the correspondent with bulk editing\n  — see [Working with Many Documents at Once](../documents/bulk.md).\n- In the document list, open the **Correspondent** filter button, type in\n  **Filter correspondents**, and tick the ones you want — see\n  [Browsing, Filtering and Searching](../documents/browsing.md).\n\nSuggestions help here as well: when a document has just been imported, the\n**Suggest** button often proposes a correspondent for it — see\n[Editing Document Details](../documents/editing.md).\n\n## A quick example\n\nOmar opens **Attributes → Correspondents** and creates **City Power** with\n**Matching algorithm** set to **Any word** and **Matching pattern** set to\n`city power electricity`. From then on, each monthly bill is filed under the\nright correspondent the moment it is added.\n\nA month later he opens the list and reads the **Last used** column: it shows the\ncurrent month for **City Power**, while his old insurer has not appeared for\ntwo years. He clicks **Documents** on the **City Power** row, and the document\nlist shows every bill from that supplier.","ar":"---\ntitle: المراسلون\n---\n\n# المراسلون (Correspondents)\n\n**المراسل (correspondent)** هو الشخص أو الشركة أو المؤسسة التي صدر عنها المستند\nأو أُرسل إليها: بنك، أو شركة كهرباء، أو جهة عمل، أو مالك عقار، أو عيادة. وتجميع\nالمستندات حسب المراسل من أسرع الطرق للإجابة عن سؤال «أين آخر رسالة من دائرة\nالضرائب؟».\n\nتدير المراسلين من **السمات (Attributes) → Correspondents** في الشريط الجانبي،\nويمكنك أيضًا إنشاء مراسل أثناء تعديل مستند.\n\n!!! tip\n\n    المراسل ليس مثل الوسم. فالمراسل يجيب عن سؤال *مَن*، وللمستند مراسل واحد على\n    الأكثر؛ أما الوسم فيجيب عن *موضوع المستند*، ويمكن للمستند أن يحمل وسومًا\n    كثيرة.\n\n## قائمة المراسلين\n\nتعرض الصفحة سطرًا لكل مراسل، ويعلوها هذا الشريط:\n\n| الجزء | ما يفعله |\n| --- | --- |\n| **Filter by:** | اكتب جزءًا من الاسم لتضيّق القائمة. |\n| **Show:** | عدد الأسطر المعروضة — **25** أو **50** أو **100** — وأزرار التنقّل بين الصفحات بجانبها. |\n| **Select:** | **None** أو **Page** أو **All**، للعمل على عدة مراسلين معًا. |\n| **Permissions** | تعيين المالك وصلاحيات العرض والتعديل لكل مراسل محدَّد. |\n| **Delete** | حذف كل مراسل محدَّد بعد تأكيد **Confirm delete**. |\n| **Create** | يفتح نافذة **Create new correspondent**. |\n\nوالأعمدة هي **Name** و**Matching** و**Document count** و**Last used**\nو**Actions**:\n\n- **Name** — النقر على الاسم يفتح المراسل للتعديل.\n- **Matching** — قاعدة المطابقة التلقائية بصيغة مختصرة، مثل **Automatic** أو\n  **None** أو **Any word: city power**.\n- **Document count** — عدد المستندات المدرجة حاليًا تحت هذا المراسل.\n- **Last used** — تاريخ أحدث مستند من هذا المراسل.\n- **Actions** — **Edit** و**Delete**، وإذا لم يكن العدد صفرًا يظهر **Documents**\n  ومعه العدد، فيفتح المراسل كمرشّح في قائمة المستندات. وعلى الشاشات الضيقة\n  تختفي هذه الأزرار خلف قائمة النقاط الثلاث.\n\nوتحت الجدول يخبرك السطر **N total correspondents** بحجم القائمة، ويظهر\n**(N selected)** أثناء وجود تحديد.\n\nوفي نافذة **Confirm delete** تنطبق هنا أيضًا عبارة\n**Associated documents will not be deleted.**: فإزالة مراسل لا تحذف المستندات\nأبدًا، وإنما تُفرغ الحقل فيها فقط.\n\n## إنشاء مراسل وتعديله\n\nيفتح **Create** نافذة **Create new correspondent**، ويفتح **Edit** نافذة\n**Edit correspondent**. وللمراسل حقول أقل من الوسم:\n\n| الحقل | ما يعنيه |\n| --- | --- |\n| **Name** | اسم الشخص أو الشركة أو المؤسسة كما ينبغي أن يظهر على المستندات. |\n| **Matching algorithm** | كيف يقرّر Paperless-ngx من تلقاء نفسه تعيين هذا المراسل للمستندات الجديدة. |\n| **Matching pattern** | الكلمة أو الكلمات التي يبحث عنها. ويظهر فقط حين تحتاج الخوارزمية المختارة إليه. |\n| **Case insensitive** | هل تتجاهل المطابقة الحروف الكبيرة والصغيرة. |\n\nوخيارات **Matching algorithm** — **Automatic** و**Any word** و**All words**\nو**Exact match** و**Regular expression** و**Fuzzy word** و**None** — تعمل كما\nتعمل في الوسوم تمامًا، وهي مشروحة في\n[خوارزميات المطابقة](tags.ar.md).\n\nوتُغلق النافذة بـ **Cancel** أو تُحفظ بـ **Save**. والمالك والصلاحيات مشروحان في\n[المصادقة والمستخدمون والمجموعات والصلاحيات](../getting-started/authentication.ar.md).\n\n## استخدام المراسل على المستندات\n\n- أثناء تعديل مستند استخدم حقل **Correspondent**. اكتب لتبحث، أو اكتب اسمًا\n  جديدًا وأنشئه في الحال؛ واتركه فارغًا إذا لم ينطبق أي مراسل.\n- دع المطابقة تعمل بـ **Matching algorithm** و**Matching pattern**.\n- أشّر عدة مستندات في القائمة وأسند المراسل بالتحرير الجماعي — راجع\n  [العمل على عدة مستندات معًا](../documents/bulk.ar.md).\n- وفي قائمة المستندات افتح زر مرشّح **Correspondent** واكتب في\n  **Filter correspondents** وأشّر من تريد — راجع\n  [تصفّح المستندات وتصفيتها والبحث فيها](../documents/browsing.ar.md).\n\nوتساعد الاقتراحات هنا أيضًا: فحين يكون المستند قد استُورد للتوّ، يقترح زر\n**Suggest** عليه مراسلًا في الغالب — راجع\n[تعديل تفاصيل المستند](../documents/editing.ar.md).\n\n## مثال سريع\n\nيفتح عمر **السمات (Attributes) → Correspondents** وينشئ مراسل **City Power**\nمع ضبط **Matching algorithm** على **Any word** و**Matching pattern** على\n`city power electricity`. ومنذ ذلك الحين تُدرج كل فاتورة شهرية تحت المراسل\nالصحيح فور إضافتها.\n\nوبعد شهر يفتح القائمة ويقرأ عمود **Last used**، فيجد الشهر الحالي أمام\n**City Power**، بينما لم يظهر شركة التأمين القديمة منذ سنتين. فينقر\n**Documents** في سطر **City Power**، فتعرض قائمة المستندات كل فاتورة من ذلك\nالمورّد."},{"id":"document-types","title":{"en":"Document types","ar":"أنواع المستندات"},"fileEn":"attributes/document-types.md","fileAr":"attributes/document-types.ar.md","en":"---\ntitle: Document Types\n---\n\n# Document Types\n\nA **document type** says what kind of paperwork a document is: an invoice, a\ncontract, a receipt, an insurance policy, a payslip. It answers a different\nquestion from a tag — a tag is about the topic, a document type is about the\nform — and each document can have only one.\n\nNot every document needs a type. Some things are hard to classify, and a type\nused once is rarely worth creating. Types earn their place when they help you\nfind a group of documents again.\n\nYou manage them under **Attributes → Document types** in the sidebar, and you\ncan also create one while editing a document.\n\n## The Document types list\n\nThe page shows one row per type, with this toolbar above it:\n\n| Part | What it does |\n| --- | --- |\n| **Filter by:** | Type part of a name to narrow the list. |\n| **Show:** | How many rows to list — **25**, **50**, or **100** — with the paging buttons beside it. |\n| **Select:** | **None**, **Page**, or **All**, for working on several types at once. |\n| **Permissions** | Set the owner and the view/edit permissions of every selected type. |\n| **Delete** | Delete every selected type after a **Confirm delete**. |\n| **Create** | Opens the **Create new document type** dialog. |\n\nThe columns are **Name**, **Matching**, **Document count**, and **Actions**:\n\n- **Name** — clicking a name opens the type for editing.\n- **Matching** — the automatic matching rule in short form, such as\n  **Automatic**, **None**, or **All words: invoice payment**.\n- **Document count** — how many documents currently have this type.\n- **Actions** — **Edit**, **Delete**, and, when the count is not zero,\n  **Documents** with the count, which opens the type as a filter in the document\n  list. On a narrow screen these hide behind a three-dot menu.\n\nBelow the table, **N total document types** tells you how big the list is, and\n**(N selected)** appears while you have a selection.\n\nIn the **Confirm delete** dialog, **Associated documents will not be deleted.**\napplies here too: removing a type never removes documents, it only clears the\nfield on them.\n\n## Creating and editing a document type\n\n**Create** opens the **Create new document type** dialog; **Edit** opens **Edit\ndocument type**. The fields are:\n\n| Field | What it means |\n| --- | --- |\n| **Name** | The name of the type, as it should appear on documents — for example **Invoice**. |\n| **Matching algorithm** | How Paperless-ngx should decide on its own to set this type on new documents. |\n| **Matching pattern** | The word or words to look for. It appears only when the chosen algorithm needs one. |\n| **Case insensitive** | Whether the pattern ignores capital letters. |\n\nThe **Matching algorithm** choices — **Automatic**, **Any word**, **All words**,\n**Exact match**, **Regular expression**, **Fuzzy word**, and **None** — work\nexactly as they do for tags, and are described under\n[Matching algorithms](tags.md#matching-algorithms).\n\nThe dialog closes with **Cancel** or saves with **Save**. Owners and permissions\nare described in\n[Authentication, Users, Groups & Permissions](../getting-started/authentication.md).\n\n## Using a document type on documents\n\n- While editing a document, use the **Document type** field. Type to search, or\n  write a new name and create it on the spot; leave it empty when no type fits.\n- Let matching do the work with a **Matching algorithm** and **Matching\n  pattern**.\n- Tick several documents in the list and set the type with bulk editing — see\n  [Working with Many Documents at Once](../documents/bulk.md).\n- In the document list, open the **Document type** filter button, type in\n  **Filter document types**, and tick the ones you want — see\n  [Browsing, Filtering and Searching](../documents/browsing.md).\n\nYou can also search by type from the top bar with a query such as\n`type:invoice contract`, which finds documents whose type is **invoice** and\nwhose text contains \"contract\".\n\n## A quick example\n\nLayla decides to separate her household paperwork by form. She creates the types\n**Invoice**, **Contract**, **Receipt**, and **Policy**. For **Invoice** she sets\n**Matching algorithm** to **Any word** and **Matching pattern** to\n`invoice amount due`, so incoming bills are classified as they arrive.\n\nShe then filters the document list by the **Invoice** type and saves the result\nas the saved view **\"All invoices\"**. Next time she needs one, she does not have\nto remember the correspondent or the month — the type is enough.","ar":"---\ntitle: أنواع المستندات\n---\n\n# أنواع المستندات (Document types)\n\nيحدّد **نوع المستند (document type)** ماهية المعاملة الورقية: فاتورة، أو عقد،\nأو إيصال، أو بوليصة تأمين، أو قسيمة راتب. وهو يجيب عن سؤال غير الذي يجيب عنه\nالوسم: فالوسم يتعلّق بالموضوع، والنوع يتعلّق بالشكل؛ وللمستند نوع واحد فقط.\n\nولا تحتاج كل المستندات إلى نوع. فبعض الأشياء يصعب تصنيفها، والنوع الذي\nيُستخدم مرة واحدة قلّما يستحق الإنشاء. وإنما يستحق النوع مكانه حين يعينك على\nالعثور على مجموعة مستندات مرة أخرى.\n\nتدير الأنواع من **السمات (Attributes) → Document types** في الشريط الجانبي،\nويمكنك أيضًا إنشاء نوع أثناء تعديل مستند.\n\n## قائمة أنواع المستندات\n\nتعرض الصفحة سطرًا لكل نوع، ويعلوها هذا الشريط:\n\n| الجزء | ما يفعله |\n| --- | --- |\n| **Filter by:** | اكتب جزءًا من الاسم لتضيّق القائمة. |\n| **Show:** | عدد الأسطر المعروضة — **25** أو **50** أو **100** — وأزرار التنقّل بين الصفحات بجانبها. |\n| **Select:** | **None** أو **Page** أو **All**، للعمل على عدة أنواع معًا. |\n| **Permissions** | تعيين المالك وصلاحيات العرض والتعديل لكل نوع محدَّد. |\n| **Delete** | حذف كل نوع محدَّد بعد تأكيد **Confirm delete**. |\n| **Create** | يفتح نافذة **Create new document type**. |\n\nوالأعمدة هي **Name** و**Matching** و**Document count** و**Actions**:\n\n- **Name** — النقر على الاسم يفتح النوع للتعديل.\n- **Matching** — قاعدة المطابقة التلقائية بصيغة مختصرة، مثل **Automatic** أو\n  **None** أو **All words: invoice payment**.\n- **Document count** — عدد المستندات التي تحمل هذا النوع حاليًا.\n- **Actions** — **Edit** و**Delete**، وإذا لم يكن العدد صفرًا يظهر **Documents**\n  ومعه العدد، فيفتح النوع كمرشّح في قائمة المستندات. وعلى الشاشات الضيقة تختفي\n  هذه الأزرار خلف قائمة النقاط الثلاث.\n\nوتحت الجدول يخبرك السطر **N total document types** بحجم القائمة، ويظهر\n**(N selected)** أثناء وجود تحديد.\n\nوفي نافذة **Confirm delete** تنطبق هنا أيضًا عبارة\n**Associated documents will not be deleted.**: فإزالة نوع لا تحذف المستندات\nأبدًا، وإنما تُفرغ الحقل فيها فقط.\n\n## إنشاء نوع مستند وتعديله\n\nيفتح **Create** نافذة **Create new document type**، ويفتح **Edit** نافذة\n**Edit document type**. والحقول هي:\n\n| الحقل | ما يعنيه |\n| --- | --- |\n| **Name** | اسم النوع كما ينبغي أن يظهر على المستندات — مثل **Invoice**. |\n| **Matching algorithm** | كيف يقرّر Paperless-ngx من تلقاء نفسه تعيين هذا النوع للمستندات الجديدة. |\n| **Matching pattern** | الكلمة أو الكلمات التي يبحث عنها. ويظهر فقط حين تحتاج الخوارزمية المختارة إليه. |\n| **Case insensitive** | هل تتجاهل المطابقة الحروف الكبيرة والصغيرة. |\n\nوخيارات **Matching algorithm** — **Automatic** و**Any word** و**All words**\nو**Exact match** و**Regular expression** و**Fuzzy word** و**None** — تعمل كما\nتعمل في الوسوم تمامًا، وهي مشروحة في\n[خوارزميات المطابقة](tags.ar.md).\n\nوتُغلق النافذة بـ **Cancel** أو تُحفظ بـ **Save**. والمالك والصلاحيات مشروحان في\n[المصادقة والمستخدمون والمجموعات والصلاحيات](../getting-started/authentication.ar.md).\n\n## استخدام نوع المستند على المستندات\n\n- أثناء تعديل مستند استخدم حقل **Document type**. اكتب لتبحث، أو اكتب اسمًا\n  جديدًا وأنشئه في الحال؛ واتركه فارغًا إذا لم يناسب أي نوع.\n- دع المطابقة تعمل بـ **Matching algorithm** و**Matching pattern**.\n- أشّر عدة مستندات في القائمة وأسند النوع بالتحرير الجماعي — راجع\n  [العمل على عدة مستندات معًا](../documents/bulk.ar.md).\n- وفي قائمة المستندات افتح زر مرشّح **Document type** واكتب في\n  **Filter document types** وأشّر من تريد — راجع\n  [تصفّح المستندات وتصفيتها والبحث فيها](../documents/browsing.ar.md).\n\nويمكنك أيضًا البحث بالنوع من الشريط العلوي باستعلام مثل\n`type:invoice contract`، فيجد المستندات التي نوعها **invoice** ويحتوي نصّها\nعلى \"contract\".\n\n## مثال سريع\n\nتقرّر ليلى فصل أوراق منزلها حسب الشكل. تنشئ الأنواع **Invoice** و**Contract**\nو**Receipt** و**Policy**. وللنوع **Invoice** تضبط **Matching algorithm** على\n**Any word** و**Matching pattern** على `invoice amount due`، فتُصنَّف الفواتير\nالواردة فور وصولها.\n\nثم ترشّح قائمة المستندات بنوع **Invoice** وتحفظ النتيجة كعرض محفوظ باسم\n**\"All invoices\"**. وفي المرة القادمة لا تحتاج إلى تذكّر المراسل ولا الشهر؛\nيكفيها النوع."},{"id":"storage-paths","title":{"en":"Storage paths","ar":"مسارات التخزين"},"fileEn":"attributes/storage-paths.md","fileAr":"attributes/storage-paths.ar.md","en":"---\ntitle: Storage Paths\n---\n\n# Storage Paths\n\nA **storage path** is a rule that decides where a document's file is placed\ninside the archive on disk. It changes the *file*, not the app: a document with\na storage path looks and behaves exactly like any other document in the list,\nbut its file is filed in a folder structure you chose.\n\nStorage paths are useful when one flat pile of files is not enough — for\nexample when you want statements sorted by year and bank, and insurance letters\nin their own folder. Each document can have one storage path, and a storage path\nis optional. When no storage path applies, Paperless-ngx falls back to its\nnormal naming rule.\n\nYou manage them under **Attributes → Storage paths** in the sidebar.\n\n!!! note\n\n    Changing a storage path moves the files that use it. It does not change any\n    document's details, and it does not delete anything.\n\n## The Storage paths list\n\nThe page shows one row per storage path, with this toolbar above it:\n\n| Part | What it does |\n| --- | --- |\n| **Filter by:** | Type part of a name to narrow the list. |\n| **Show:** | How many rows to list — **25**, **50**, or **100** — with the paging buttons beside it. |\n| **Select:** | **None**, **Page**, or **All**, for working on several storage paths at once. |\n| **Permissions** | Set the owner and the view/edit permissions of every selected storage path. |\n| **Delete** | Delete every selected storage path after a **Confirm delete**. |\n| **Create** | Opens the **Create new storage path** dialog. |\n\nThe columns are **Name**, **Matching**, **Document count**, **Path**, and\n**Actions**:\n\n- **Name** — clicking a name opens the storage path for editing.\n- **Matching** — the automatic matching rule in short form, such as\n  **Automatic**, **None**, or **Any word: insurance**.\n- **Document count** — how many documents currently use this storage path.\n- **Path** — the pattern itself, shortened when it is long.\n- **Actions** — **Edit**, **Delete**, and, when the count is not zero,\n  **Documents** with the count, which opens the storage path as a filter in the\n  document list. On a narrow screen these hide behind a three-dot menu.\n\nBelow the table, **N total storage paths** tells you how big the list is, and\n**(N selected)** appears while you have a selection.\n\nIn the **Confirm delete** dialog, **Associated documents will not be deleted.**\napplies here too: removing a storage path never removes documents, it only\nclears the field on them.\n\n## Creating and editing a storage path\n\n**Create** opens the **Create new storage path** dialog; **Edit** opens **Edit\nstorage path**. The fields are:\n\n| Field | What it means |\n| --- | --- |\n| **Name** | The name you will recognise the storage path by, such as **By Year**. |\n| **Path** | The pattern that builds the folder and file name. See below. |\n| **Matching algorithm** | How Paperless-ngx should decide on its own to use this storage path for new documents. |\n| **Matching pattern** | The word or words to look for. It appears only when the chosen algorithm needs one. |\n| **Case insensitive** | Whether the pattern ignores capital letters. |\n\nThe **Matching algorithm** choices — **Automatic**, **Any word**, **All words**,\n**Exact match**, **Regular expression**, **Fuzzy word**, and **None** — work\nexactly as they do for tags, and are described under\n[Matching algorithms](tags.md#matching-algorithms).\n\nThe dialog closes with **Cancel** or saves with **Save**. Owners and permissions\nare described in\n[Authentication, Users, Groups & Permissions](../getting-started/authentication.md).\n\n## Building a path from placeholders\n\nThe **Path** field is a pattern rather than a fixed folder name. You write it\nwith ordinary folder separators and as many lines as you like, and you drop in\n**placeholders** — names in double curly braces — wherever a value should come\nfrom the document. For example:\n\n```\n{{ created_year }}/{{ correspondent }}/{{ title }}\n```\n\nA 2026 invoice from **My Bank** titled **Statement January** then lands in the\n**My Bank** folder inside a **2026** folder.\n\nThe placeholders you are most likely to want are:\n\n| Placeholder | Fills in |\n| --- | --- |\n| `{{ title }}` | The document's title. |\n| `{{ correspondent }}` | The correspondent's name, or \"none\". |\n| `{{ document_type }}` | The document type's name, or \"none\". |\n| `{{ tag_list }}` | A comma-separated list of the document's tags. |\n| `{{ created }}` | The full creation date, such as `2026-03-14`. |\n| `{{ created_year }}`, `{{ created_month }}`, `{{ created_day }}` | The year, month (01–12), and day (01–31) of the creation date. |\n| `{{ created_month_name }}` | The month's name, such as `March`. |\n| `{{ added }}`, `{{ added_year }}`, `{{ added_month }}`, `{{ added_day }}` | The same parts, but for the date the document was added. |\n| `{{ asn }}` | The document's archive serial number, or \"none\". |\n| `{{ original_name }}` | The original file name, without its extension. |\n| `{{ owner_username }}` | The user name of the document's owner, or \"none\". |\n\nA folder that ends up empty is skipped, and characters that are not allowed in\nfile names — such as `:`, `\\`, and `/` — are replaced with dashes. If two\ndocuments would end up with the same name, Paperless-ngx appends `_01`, `_02`,\nand so on.\n\n!!! tip\n\n    Keep the pattern short. Very long paths made of many placeholders can run\n    into the maximum path length of your operating system, in which case the\n    document keeps its previous location.\n\n## Testing a path before you save\n\nAbove the matching fields, the **Preview** section lets you try the pattern out\non a real document:\n\n1. Open **Preview**.\n2. In the **Search for a document** box, type at least two characters and pick a\n   document from the results.\n3. The card shows the folder and file name the pattern would produce for it.\n\nWhen the box is empty the card says **No document selected**; if the pattern\ncannot be used, it says **Path test failed**. Fix the pattern and pick the\ndocument again to retry.\n\n## Using a storage path on documents\n\n- While editing a document, use the **Storage path** field. Its empty value is\n  shown as **Default**, which means the normal naming rule applies.\n- Let matching do the work with a **Matching algorithm** and **Matching\n  pattern**.\n- Tick several documents in the list and set the storage path with bulk editing\n  — see [Working with Many Documents at Once](../documents/bulk.md).\n- In the document list, open the **Storage path** filter button, type in\n  **Filter storage paths**, and tick the ones you want — see\n  [Browsing, Filtering and Searching](../documents/browsing.md).\n\n## A quick example\n\nSami wants his bank statements in one shape and his insurance letters in\nanother. He creates two storage paths:\n\n| Name | Path |\n| --- | --- |\n| **By Year** | `{{ created_year }}/{{ correspondent }}/{{ title }}` |\n| **Insurances** | `Insurances/{{ correspondent }}/{{ created_year }}-{{ created_month }}-{{ created_day }} {{ title }}` |\n\nFor **Insurances** he sets **Matching algorithm** to **Any word** and **Matching\npattern** to `policy premium claim`. He opens **Preview**, searches for an old\npolicy letter, and sees the exact name it would receive; happy with it, he saves.\n\nA statement from **My Bank** now lands in `2026/My Bank/Statement January.pdf`,\nwhile a renewal letter is filed as\n`Insurances/Healthcare 123/2026-01-01 Renewal Notice.pdf`.","ar":"---\ntitle: مسارات التخزين\n---\n\n# مسارات التخزين (Storage paths)\n\n**مسار التخزين (storage path)** قاعدة تحدّد أين يوضع ملف المستند داخل الأرشيف\nعلى القرص. وهو يغيّر *الملف* لا التطبيق: فالمستند الذي له مسار تخزين يبدو\nويتصرّف مثل أي مستند آخر في القائمة تمامًا، لكن ملفّه يُرتَّب في بنية مجلدات\nاخترتها أنت.\n\nوتفيد مسارات التخزين حين لا تكفي كومة ملفات واحدة مسطّحة — مثلًا حين تريد كشوف\nالحساب مرتّبة بالسنة والبنك، ورسائل التأمين في مجلد خاص بها. ولكل مستند مسار\nتخزين واحد، والمسار اختياري. وحين لا ينطبق أي مسار تخزين يعود Paperless-ngx\nإلى قاعدة التسمية العادية.\n\nتدير المسارات من **السمات (Attributes) → Storage paths** في الشريط الجانبي.\n\n!!! note\n\n    تغيير مسار تخزين ينقل الملفات التي تستخدمه. وهو لا يغيّر أي تفصيل من\n    تفاصيل المستند، ولا يحذف شيئًا.\n\n## قائمة مسارات التخزين\n\nتعرض الصفحة سطرًا لكل مسار تخزين، ويعلوها هذا الشريط:\n\n| الجزء | ما يفعله |\n| --- | --- |\n| **Filter by:** | اكتب جزءًا من الاسم لتضيّق القائمة. |\n| **Show:** | عدد الأسطر المعروضة — **25** أو **50** أو **100** — وأزرار التنقّل بين الصفحات بجانبها. |\n| **Select:** | **None** أو **Page** أو **All**، للعمل على عدة مسارات معًا. |\n| **Permissions** | تعيين المالك وصلاحيات العرض والتعديل لكل مسار محدَّد. |\n| **Delete** | حذف كل مسار محدَّد بعد تأكيد **Confirm delete**. |\n| **Create** | يفتح نافذة **Create new storage path**. |\n\nوالأعمدة هي **Name** و**Matching** و**Document count** و**Path** و**Actions**:\n\n- **Name** — النقر على الاسم يفتح مسار التخزين للتعديل.\n- **Matching** — قاعدة المطابقة التلقائية بصيغة مختصرة، مثل **Automatic** أو\n  **None** أو **Any word: insurance**.\n- **Document count** — عدد المستندات التي تستخدم هذا المسار حاليًا.\n- **Path** — النمط نفسه، مختصرًا إذا طال.\n- **Actions** — **Edit** و**Delete**، وإذا لم يكن العدد صفرًا يظهر **Documents**\n  ومعه العدد، فيفتح مسار التخزين كمرشّح في قائمة المستندات. وعلى الشاشات\n  الضيقة تختفي هذه الأزرار خلف قائمة النقاط الثلاث.\n\nوتحت الجدول يخبرك السطر **N total storage paths** بحجم القائمة، ويظهر\n**(N selected)** أثناء وجود تحديد.\n\nوفي نافذة **Confirm delete** تنطبق هنا أيضًا عبارة\n**Associated documents will not be deleted.**: فإزالة مسار تخزين لا تحذف\nالمستندات أبدًا، وإنما تُفرغ الحقل فيها فقط.\n\n## إنشاء مسار تخزين وتعديله\n\nيفتح **Create** نافذة **Create new storage path**، ويفتح **Edit** نافذة\n**Edit storage path**. والحقول هي:\n\n| الحقل | ما يعنيه |\n| --- | --- |\n| **Name** | الاسم الذي تعرف به مسار التخزين، مثل **By Year**. |\n| **Path** | النمط الذي يبني اسم المجلد والملف. راجع أدناه. |\n| **Matching algorithm** | كيف يقرّر Paperless-ngx من تلقاء نفسه استخدام هذا المسار للمستندات الجديدة. |\n| **Matching pattern** | الكلمة أو الكلمات التي يبحث عنها. ويظهر فقط حين تحتاج الخوارزمية المختارة إليه. |\n| **Case insensitive** | هل تتجاهل المطابقة الحروف الكبيرة والصغيرة. |\n\nوخيارات **Matching algorithm** — **Automatic** و**Any word** و**All words**\nو**Exact match** و**Regular expression** و**Fuzzy word** و**None** — تعمل كما\nتعمل في الوسوم تمامًا، وهي مشروحة في\n[خوارزميات المطابقة](tags.ar.md).\n\nوتُغلق النافذة بـ **Cancel** أو تُحفظ بـ **Save**. والمالك والصلاحيات مشروحان في\n[المصادقة والمستخدمون والمجموعات والصلاحيات](../getting-started/authentication.ar.md).\n\n## بناء المسار من العناصر البديلة\n\nحقل **Path** نمط لا اسم مجلد ثابت. تكتبه بفواصل المجلدات المعتادة وبأي عدد من\nالأسطر، وتُدرج فيه **عناصر بديلة (placeholders)** — أسماء بين قوسين معقوفين\nمزدوجين — حيث ينبغي أن تأتي القيمة من المستند. مثلًا:\n\n```\n{{ created_year }}/{{ correspondent }}/{{ title }}\n```\n\nفتُرتَّب فاتورة من **My Bank** سنة 2026 بعنوان **Statement January** في مجلد\n**My Bank** داخل مجلد **2026**.\n\nوأكثر العناصر البديلة التي قد تحتاجها:\n\n| العنصر البديل | ما يملؤه |\n| --- | --- |\n| `{{ title }}` | عنوان المستند. |\n| `{{ correspondent }}` | اسم المراسل، أو \"none\". |\n| `{{ document_type }}` | اسم نوع المستند، أو \"none\". |\n| `{{ tag_list }}` | قائمة وسوم المستند مفصولة بفواصل. |\n| `{{ created }}` | تاريخ الإنشاء الكامل، مثل `2026-03-14`. |\n| `{{ created_year }}` و`{{ created_month }}` و`{{ created_day }}` | سنة الإنشاء وشهره (01–12) ويومه (01–31). |\n| `{{ created_month_name }}` | اسم الشهر، مثل `March`. |\n| `{{ added }}` و`{{ added_year }}` و`{{ added_month }}` و`{{ added_day }}` | الأجزاء نفسها، لكن لتاريخ إضافة المستند. |\n| `{{ asn }}` | الرقم التسلسلي للأرشيف، أو \"none\". |\n| `{{ original_name }}` | اسم الملف الأصلي من دون امتداده. |\n| `{{ owner_username }}` | اسم مستخدم مالك المستند، أو \"none\". |\n\nويُتخطّى أي مجلد ينتهي فارغًا، وتُستبدل الحروف غير المسموح بها في أسماء الملفات\n— مثل `:` و`\\` و`/` — بشرطات. وإذا انتهى مستندان إلى الاسم نفسه، يضيف\nPaperless-ngx اللاحقة `_01` ثم `_02` وهكذا.\n\n!!! tip\n\n    اجعل النمط قصيرًا. فالمسارات الطويلة جدًا المكوّنة من عناصر بديلة كثيرة قد\n    تتجاوز الحد الأقصى لطول المسار في نظام تشغيلك، وفي هذه الحال يحتفظ المستند\n    بموقعه السابق.\n\n## تجربة المسار قبل الحفظ\n\nفوق حقول المطابقة يتيح لك قسم **Preview** تجربة النمط على مستند حقيقي:\n\n1. افتح **Preview**.\n2. في مربّع **Search for a document** اكتب حرفين على الأقل واختر مستندًا من\n   النتائج.\n3. تعرض البطاقة اسم المجلد والملف الذي سينتج عن النمط لهذا المستند.\n\nوحين يكون المربّع فارغًا تقول البطاقة **No document selected**، وإذا تعذّر\nاستخدام النمط قالت **Path test failed**. أصلح النمط واختر المستند مرة أخرى\nللمحاولة من جديد.\n\n## استخدام مسار التخزين على المستندات\n\n- أثناء تعديل مستند استخدم حقل **Storage path**. وتظهر قيمته الفارغة باسم\n  **Default**، أي أن قاعدة التسمية العادية هي المطبَّقة.\n- دع المطابقة تعمل بـ **Matching algorithm** و**Matching pattern**.\n- أشّر عدة مستندات في القائمة وأسند مسار التخزين بالتحرير الجماعي — راجع\n  [العمل على عدة مستندات معًا](../documents/bulk.ar.md).\n- وفي قائمة المستندات افتح زر مرشّح **Storage path** واكتب في\n  **Filter storage paths** وأشّر من تريد — راجع\n  [تصفّح المستندات وتصفيتها والبحث فيها](../documents/browsing.ar.md).\n\n## مثال سريع\n\nيريد سامي أن تكون كشوف حساب بنكه على شكل، ورسائل تأمينه على شكل آخر. فينشئ\nمسارَي تخزين:\n\n| الاسم | المسار |\n| --- | --- |\n| **By Year** | `{{ created_year }}/{{ correspondent }}/{{ title }}` |\n| **Insurances** | `Insurances/{{ correspondent }}/{{ created_year }}-{{ created_month }}-{{ created_day }} {{ title }}` |\n\nولمسار **Insurances** يضبط **Matching algorithm** على **Any word** و\n**Matching pattern** على `policy premium claim`. ثم يفتح **Preview** ويبحث عن\nرسالة بوليصة قديمة فيرى الاسم الذي ستحمله بالضبط؛ وإذ يعجبه ذلك يحفظ.\n\nفينتهي كشف من **My Bank** في `2026/My Bank/Statement January.pdf`، بينما تُرتَّب\nرسالة تجديد باسم\n`Insurances/Healthcare 123/2026-01-01 Renewal Notice.pdf`.\n"},{"id":"custom-fields","title":{"en":"Custom fields","ar":"الحقول المخصّصة"},"fileEn":"attributes/custom-fields.md","fileAr":"attributes/custom-fields.ar.md","en":"---\ntitle: Custom Fields\n---\n\n# Custom Fields\n\nEverything up to here — tags, correspondents, document types, storage paths —\nis a fixed kind of information. A **custom field** is the opposite: it is a\nfield you invent for the things Paperless-ngx does not know about. An account\nnumber, a warranty end date, a policy holder, a link to the related contract,\nthe amount that is still outstanding — if you need to record it, you can add a\nfield for it.\n\nOnce a custom field exists, it behaves like any other document detail: you fill\nit in on a document, you see it in the list, and you can filter and search by it.\n\nYou manage fields under **Attributes → Custom fields** in the sidebar.\n\n## The Custom fields list\n\nThe page is a simple table with the columns **Name**, **Data Type**, and\n**Actions**, and the button **Add Field** at the top right:\n\n- **Name** — clicking a field's name opens it for editing.\n- **Data Type** — what kind of value the field holds, such as **Text**,\n  **Date**, or **Monetary**.\n- **Actions** — **Edit**, **Delete**, and, when the field is in use,\n  **Documents** with the count, which opens every document that has a value in\n  the field. On a narrow screen these hide behind a three-dot menu.\n\nWhen nothing has been defined yet, the page says **No fields defined.**\n\nDeleting a field is permanent. **Delete** opens the **Confirm delete field**\ndialog, which warns **This operation will permanently delete this field.** and\n**This operation cannot be undone.** before you press **Proceed**.\n\n## Data types\n\nThe **Data type** is chosen when a field is created and then fixed for good —\nthe dialog says **Data type cannot be changed after a field is created**. If you\npick the wrong one, create a new field and delete the old one.\n\n| Data type | Holds | Entered as |\n| --- | --- | --- |\n| **Text** | A short piece of text. | A normal text box. |\n| **Long Text** | A longer passage, such as a note or a clause. | A multi-line box. |\n| **Date** | A single date. | A date picker. |\n| **Boolean** | A yes/no fact. | A tick box. |\n| **Integer** | A whole number. | A number box. |\n| **Number** | A number that may have decimals. | A number box. |\n| **Monetary** | An amount of money. | An amount box, with the field's currency. |\n| **Url** | A web address. | A text box; the value becomes a clickable link. |\n| **Document Link** | One or more other documents in Paperless-ngx. | A document search box; the values show as links. |\n| **Select** | One value from a list you define. | A dropdown. |\n\nChoosing **Monetary** adds one more field to the dialog:\n\n| Field | What it means |\n| --- | --- |\n| **Default Currency** | The three-character currency code to show with amounts, such as `USD` or `EUR`. Leave it empty to use your language's own currency. |\n\nChoosing **Select** adds the option list. Press **Add option** for each value\nyou want in the dropdown, type its label, and use **Delete** to remove one. Long\noption lists are worked through a page at a time.\n\n## Creating and editing a custom field\n\n**Add Field** opens the **Create new custom field** dialog; **Edit** opens **Edit\ncustom field**. Both hold:\n\n| Field | What it means |\n| --- | --- |\n| **Name** | The field's name as it will appear on documents, such as **Account number**. |\n| **Data type** | What kind of value the field holds, from the table above. |\n| **Default Currency** | (Monetary only) the currency code to use by default. |\n| **Add option** | (Select only) adds a value to the list of choices. |\n\nThe dialog closes with **Cancel** or saves with **Save**.\n\n!!! note\n\n    Custom fields have no owner or per-field permissions of their own.\n    Whether you may create, change, or delete field definitions comes from your\n    account's permissions — see\n    [Authentication, Users, Groups & Permissions](../getting-started/authentication.md) — while\n    who may see a particular value is decided by the permissions on the document\n    that carries it.\n\n## Putting custom fields on documents\n\nOpen a document, and use the **Custom Fields** button above the **Details** form\nto add a field to it:\n\n1. Click **Custom Fields**, or type in **Search fields** to narrow the list; each\n   entry shows the field's name and its data type.\n2. Click a field to add it. To make a brand new one without leaving the page,\n   click **Create new field**, type a name, and press the keyboard shortcut shown\n   in the menu.\n3. Fill the new field in on the form. The kind of input matches the data type —\n   a date picker for **Date**, a tick box for **Boolean**, and so on.\n4. Remove a field from the document with the trash button beside it. This clears\n   the value on this document only; the field itself is untouched.\n\nCustom fields are part of the document's details, so you save them the same way\nas any other change, with **Save** or `Ctrl` + `S` — see\n[Editing Document Details](../documents/editing.md). To set the same field on\nmany documents at once, use the **Custom fields** filter in the bulk editing bar\ndescribed in [Working with Many Documents at Once](../documents/bulk.md).\n\n## Filtering and searching by custom fields\n\nCustom field values are part of what the search engine reads, so simply typing a\nvalue in the top bar usually finds the document. When you want to be precise:\n\n- In the document list, open the **Custom fields** filter button. Choose a field,\n  an operator, and a value, then add more conditions and join them with **All**,\n  **Any**, or **Not**.\n- The operators on offer depend on the data type, and include **Exists**,\n  **Is null**, **Equal to**, **Contains (case-insensitive)**, **Greater than**,\n  **Greater than or equal to**, **Less than**, **Less than or equal to**,\n  **Contains**, **In**, and **Range**.\n- In the top bar you can name the field directly, as in\n  `custom_fields.name:\"Account number\" custom_fields.value:12345`.\n\nA filter made of custom fields is called a **Custom fields query** when it is\nsaved as a view.\n\n## A quick example\n\nNour keeps track of home maintenance. She opens **Attributes → Custom fields**,\nclicks **Add Field**, and creates:\n\n- **Contract Number**, of type **Text**;\n- **Coverage Ends**, of type **Date**;\n- **Premium**, of type **Monetary**, with **Default Currency** set to `EUR`;\n- **Policy Holder**, of type **Select**, with the options **Nour**, **Sami**,\n  and **Both**.\n\nOn each insurance document she clicks **Custom Fields** and adds **Contract\nNumber**, **Coverage Ends**, and **Premium**, then fills them in. Months later she\nopens the **Custom fields** filter, picks **Coverage Ends**, chooses\n**Less than or equal to**, and answers with a date a month away: the list shows\nexactly the policies that are about to run out.","ar":"---\ntitle: الحقول المخصّصة\n---\n\n# الحقول المخصّصة (Custom fields)\n\nكل ما سبق — الوسوم والمراسلون وأنواع المستندات ومسارات التخزين — أنواع ثابتة من\nالمعلومات. أما **الحقل المخصّص (custom field)** فهو عكس ذلك: حقل تخترعه للأشياء\nالتي لا يعرفها Paperless-ngx. رقم حساب، أو تاريخ انتهاء ضمان، أو اسم حامل\nالبوليصة، أو رابط العقد المتصل، أو المبلغ المتبقي — إن احتجت إلى تسجيله فيمكنك\nإضافة حقل له.\n\nومتى وُجد الحقل المخصّص تصرّف مثل أي تفصيل آخر من تفاصيل المستند: تملؤه على\nالمستند، وتراه في القائمة، وتستطيع الترشيح والبحث به.\n\nتدير الحقول من **السمات (Attributes) → Custom fields** في الشريط الجانبي.\n\n## قائمة الحقول المخصّصة\n\nالصفحة جدول بسيط بأعمدة **Name** و**Data Type** و**Actions**، وفي أعلى اليمين\nزر **Add Field**:\n\n- **Name** — النقر على اسم الحقل يفتحه للتعديل.\n- **Data Type** — نوع القيمة التي يحملها الحقل، مثل **Text** أو **Date**\n  أو **Monetary**.\n- **Actions** — **Edit** و**Delete**، وإذا كان الحقل مستخدمًا يظهر **Documents**\n  ومعه العدد، فيفتح كل مستند له قيمة في هذا الحقل. وعلى الشاشات الضيقة تختفي\n  هذه الأزرار خلف قائمة النقاط الثلاث.\n\nوحين لا يكون قد عُرّف أي حقل بعد تقول الصفحة **No fields defined.**\n\nوحذف الحقل نهائي. فزر **Delete** يفتح نافذة **Confirm delete field**، وهي\nتنبّهك: **This operation will permanently delete this field.** و\n**This operation cannot be undone.** قبل أن تضغط **Proceed**.\n\n## أنواع البيانات\n\nيُختار **Data type** عند إنشاء الحقل ثم يثبت نهائيًا؛ وتقول النافذة\n**Data type cannot be changed after a field is created**. فإن اخترت النوع الخطأ\nفأنشئ حقلًا جديدًا واحذف القديم.\n\n| نوع البيانات | ما يحمله | طريقة إدخاله |\n| --- | --- | --- |\n| **Text** | نصّ قصير. | مربّع نص عادي. |\n| **Long Text** | فقرة أطول، مثل ملاحظة أو بند. | مربّع متعدد الأسطر. |\n| **Date** | تاريخ واحد. | منتقي تاريخ. |\n| **Boolean** | حقيقة بنعم/لا. | مربّع تأشير. |\n| **Integer** | عدد صحيح. | مربّع أرقام. |\n| **Number** | عدد قد يحمل كسورًا عشرية. | مربّع أرقام. |\n| **Monetary** | مبلغ مالي. | مربّع مبلغ، بعملة الحقل. |\n| **Url** | عنوان ويب. | مربّع نص؛ وتصبح القيمة رابطًا قابلًا للنقر. |\n| **Document Link** | مستند أو أكثر داخل Paperless-ngx. | مربّع بحث عن مستند؛ وتظهر القيم روابط. |\n| **Select** | قيمة واحدة من قائمة تحدّدها. | قائمة منسدلة. |\n\nواختيار **Monetary** يضيف حقلًا آخر إلى النافذة:\n\n| الحقل | ما يعنيه |\n| --- | --- |\n| **Default Currency** | رمز العملة المكوّن من ثلاثة أحرف ليُعرض مع المبالغ، مثل `USD` أو `EUR`. اتركه فارغًا لاستخدام عملة لغتك. |\n\nواختيار **Select** يضيف قائمة الخيارات. اضغط **Add option** لكل قيمة تريدها في\nالقائمة المنسدلة، واكتب تسميتها، واستخدم **Delete** لإزالة واحدة. وتُستعرض\nالقوائم الطويلة صفحةً صفحة.\n\n## إنشاء حقل مخصّص وتعديله\n\nيفتح **Add Field** نافذة **Create new custom field**، ويفتح **Edit** نافذة\n**Edit custom field**. وكلتاهما تحمل:\n\n| الحقل | ما يعنيه |\n| --- | --- |\n| **Name** | اسم الحقل كما سيظهر على المستندات، مثل **Account number**. |\n| **Data type** | نوع القيمة التي يحملها الحقل، من الجدول أعلاه. |\n| **Default Currency** | (للنوع Monetary فقط) رمز العملة المستخدم افتراضيًا. |\n| **Add option** | (للنوع Select فقط) يضيف قيمة إلى قائمة الخيارات. |\n\nوتُغلق النافذة بـ **Cancel** أو تُحفظ بـ **Save**.\n\n!!! note\n\n    ليس للحقول المخصّصة مالك ولا صلاحيات خاصة بها. أما إمكان إنشاء تعريفات\n    الحقول أو تغييرها أو حذفها فيأتي من صلاحيات حسابك — راجع\n    [المصادقة والمستخدمون والمجموعات والصلاحيات](../getting-started/authentication.ar.md) — بينما\n    يُحدَّد من يرى قيمة معيّنة بصلاحيات المستند الذي يحملها.\n\n## إسناد الحقول المخصّصة إلى المستندات\n\nافتح مستندًا، واستخدم زر **Custom Fields** فوق نموذج **Details** لإضافة حقل\nإليه:\n\n1. اضغط **Custom Fields**، أو اكتب في **Search fields** لتضيّق القائمة؛ ويعرض\n   كل سطر اسم الحقل ونوع بياناته.\n2. انقر حقلًا لإضافته. وإن أردت إنشاء حقل جديد من دون مغادرة الصفحة فاضغط\n   **Create new field**، واكتب اسمًا، ثم اضغط اختصار لوحة المفاتيح المعروض في\n   القائمة.\n3. املأ الحقل الجديد في النموذج. ونوع الإدخال يوافق نوع البيانات — منتقي تاريخ\n   للنوع **Date**، ومربّع تأشير للنوع **Boolean**، وهكذا.\n4. أزل حقلًا من المستند بزر سلة المهملات بجانبه. وهذا يفرّغ القيمة في هذا\n   المستند فقط؛ أما الحقل نفسه فلا يُمَس.\n\nوالحقول المخصّصة جزء من تفاصيل المستند، فتحفظها كما تحفظ أي تغيير آخر بـ\n**Save** أو `Ctrl` + `S` — راجع\n[تعديل تفاصيل المستند](../documents/editing.ar.md). ولتعيين الحقل نفسه على\nمستندات كثيرة معًا استخدم مرشّح **Custom fields** في شريط التحرير الجماعي\nالمشروح في [العمل على عدة مستندات معًا](../documents/bulk.ar.md).\n\n## الترشيح والبحث بالحقول المخصّصة\n\nقيم الحقول المخصّصة جزء مما يقرؤه محرّك البحث، فمجرد كتابة قيمة في الشريط\nالعلوي يجد المستند في الغالب. وإن أردت الدقة:\n\n- في قائمة المستندات افتح زر مرشّح **Custom fields**. اختر حقلًا ومعاملًا\n  وقيمة، ثم أضف شروطًا أخرى واجمعها بـ **All** أو **Any** أو **Not**.\n- والمعاملات المتاحة تتوقف على نوع البيانات، ومنها **Exists** و**Is null**\n  و**Equal to** و**Contains (case-insensitive)** و**Greater than**\n  و**Greater than or equal to** و**Less than** و**Less than or equal to**\n  و**Contains** و**In** و**Range**.\n- وفي الشريط العلوي يمكنك تسمية الحقل صراحةً، مثل\n  `custom_fields.name:\"Account number\" custom_fields.value:12345`.\n\nويُسمّى المرشّح المكوّن من حقول مخصّصة **Custom fields query** حين يُحفظ عرضًا.\n\n## مثال سريع\n\nتتابع نور صيانة المنزل. تفتح **السمات (Attributes) → Custom fields** وتضغط\n**Add Field** وتنشئ:\n\n- **Contract Number** من نوع **Text**؛\n- **Coverage Ends** من نوع **Date**؛\n- **Premium** من نوع **Monetary** مع ضبط **Default Currency** على `EUR`؛\n- **Policy Holder** من نوع **Select** بخيارات **Nour** و**Sami** و**Both**.\n\nوعلى كل مستند تأمين تضغط **Custom Fields** وتضيف **Contract Number**\nو**Coverage Ends** و**Premium** ثم تملؤها. وبعد أشهر تفتح مرشّح\n**Custom fields**، وتختار **Coverage Ends**، وتختار\n**Less than or equal to**، وتجيب بتاريخ يبعد شهرًا: فتعرض القائمة بالضبط\nالبوليصات التي أوشكت على الانتهاء.\n"}]},{"id":"automation","title":{"en":"Automation","ar":"الأتمتة"},"items":[{"id":"saved-views","title":{"en":"Saved views","ar":"العروض المحفوظة"},"fileEn":"automation/saved-views.md","fileAr":"automation/saved-views.ar.md","en":"---\ntitle: Saved Views\n---\n\n# Saved Views\n\nA **saved view** is a named set of filters, sorting, columns and layout that you\nkeep and reuse. Instead of rebuilding \"invoices from this year, newest first\"\nevery morning, you save it once and open it with a single click from the\n**Views** menu, the sidebar, or the dashboard.\n\nYou can create a view from the documents list (see\n[Browsing, Filtering and Searching](../documents/browsing.md)); the **Saved Views**\npage under **Manage** is where you look after the ones you already have.\n\n## The Saved Views page\n\nChoose **Saved Views** under **Manage** in the sidebar. The page header reads\n*Customize the views of your documents.* Every view you are allowed to see has\nits own row in the list, with these controls:\n\n| Field | What it means |\n| --- | --- |\n| **Name** | What the view is called, everywhere it appears — the menu, the sidebar, the dashboard, and as the page title when you open it. |\n| **Show on dashboard** | Whether the view gets its own card on the **Dashboard**. |\n| **Show in sidebar** | Whether the view is listed in the sidebar under the **Saved views** heading. |\n| **Documents page size** | How many documents the list shows per page when you open this view. |\n| **Display as** | How the results are drawn: **Table**, **Small Cards**, or **Large Cards**. |\n| **Show** | Which fields each row displays. Leave it at **Default** to follow the installation's standard set. |\n| **Actions** | **Permissions**, which sets the owner and who may view or change the view, and **Delete**. |\n\nTwo things are worth noticing on this page:\n\n- The line under the columns, **Note: ordering is not preserved**, is about the\n  **Show** list: the order in which you arrange the fields there is not kept, so\n  only the choice of fields matters.\n- The page compares what you have changed against what was stored. **Save**\n  stays greyed out until something is different, and **Cancel** puts everything\n  back the way it was.\n\nWith no views at all the page simply says **No saved views defined.**, which is\nyour cue to go to the documents list and create one.\n\n!!! note\n\n    Deleting a view never deletes documents. It only removes the shortcut.\n\n## The Views menu in the document list\n\nThe day-to-day way to work with views is the **Views** button above the\ndocuments list:\n\n- The menu lists every view you can use. Picking one jumps straight to it, and\n  the page title becomes the view's name.\n- **Save \"…\"** writes your current filters back into the view you are looking\n  at. It only appears when you opened the list from a view you are allowed to\n  change.\n- **Save as...** opens the **Save current view** dialog to make a new view.\n- **All saved views** opens the management page described above.\n- A small dot on the **Views** button reminds you that you have changed the\n  filters, the sorting, or the columns since the view was last saved.\n\nA view remembers the filters, the sorting, the columns and the layout — not a\nlist of documents. Open it tomorrow and it shows what matches the rules *then*,\nwhich is why a view called \"This year\" always stays current.\n\n## Creating a view from the document list\n\n1. Open **Documents** and build the list you want: search, tick filters, choose\n   a sort order, and pick the columns you like.\n2. Open the **Views** menu and choose **Save as...**.\n3. In the **Save current view** dialog:\n   - Give it a **Name**.\n   - Tick **Show in sidebar** and/or **Show on dashboard** if you want the\n     shortcut handy.\n   - Set the owner and who else may use it, if you like.\n4. Click **Save**.\n\nIf one of the filters is not something a view can store, the dialog shows the\nalert **Filter rules error occurred while saving this view** and reports what\n**The error returned was**, so you can fix the filter and try again.\n\n## Where views appear\n\n| Place | What you get |\n| --- | --- |\n| **Views** menu in the documents list | Every view you can use, by name |\n| Sidebar, under **Saved views** | The views you ticked **Show in sidebar** for |\n| **Dashboard** | One card per view you ticked **Show on dashboard** for, which you can reorder by dragging |\n| **Saved Views** page | Every view you are allowed to see, with all of its settings |\n\nOnce a view is open it behaves exactly like the documents list — you can select,\nedit, download, and share the documents in it as usual.\n\n## Sharing a view\n\nViews are objects with their own owner and permissions, so they can be shared\nindependently of the documents inside them:\n\n- **Permissions** opens the usual owner, **View**, and **Edit** form.\n- Open the dialog and you will see the reminder\n  **Note: Sharing saved views does not share the underlying documents.** Whoever\n  you share a view with still only sees the documents *they* are allowed to see;\n  the view just saves them the work of rebuilding the filters.\n- If **Save as...** is missing from the **Views** menu, you do not have\n  permission to add views — ask an owner or an administrator.\n\n!!! warning\n\n    Because a view is only a filter, sharing one is a convenience, not a\n    security decision. Give people access to the documents themselves with\n    [permissions or share links](../documents/sharing.md).\n\n## A quick example\n\nOmar runs the accounts for a small workshop. Every morning he needs the\ninvoices that arrived since his last check.\n\nHe opens **Documents**, opens the filter for **Document type** and ticks\n\"Invoice\", opens **Dates** and chooses **Last 7 days** under **Added**, then\nopens **Sort** and picks **Added** newest first. He clicks **Views → Save\nas...**, names it **\"Invoices this week\"**, ticks **Show in sidebar**, and saves.\n\nThe view now sits in the sidebar. When his colleague Salma needs the same list,\nOmar opens **Manage → Saved Views**, clicks **Permissions** on\n**\"Invoices this week\"**, and grants her **View**. Salma sees the view in her\n**Views** menu, but only ever the invoices she is herself allowed to open.\n","ar":"---\ntitle: العروض المحفوظة\n---\n\n# العروض المحفوظة (Saved Views)\n\n**العرض المحفوظ (saved view)** مجموعة مُسمّاة من المرشّحات والترتيب والأعمدة\nوطريقة العرض تحتفظ بها وتعيد استخدامها. فبدل أن تعيد بناء «فواتير هذه السنة،\nالأحدث أولًا» كل صباح، تحفظها مرة واحدة وتفتحها بنقرة من قائمة **Views** أو من\nالشريط الجانبي أو من لوحة المعلومات.\n\nيمكنك إنشاء عرض من قائمة المستندات (راجع\n[تصفّح المستندات وتصفيتها والبحث فيها](../documents/browsing.ar.md))، أما صفحة\n**Saved Views** تحت **Manage** فهي المكان الذي تعتني فيه بالعروض التي لديك.\n\n## صفحة Saved Views\n\nاختر **Saved Views** تحت **Manage** في الشريط الجانبي. ويقول ترويسة الصفحة\n*Customize the views of your documents.* ولكل عرض مسموح لك برؤيته سطر خاص في\nالقائمة، وفيها هذه العناصر:\n\n| الحقل | ما يعنيه |\n| --- | --- |\n| **Name** | اسم العرض كما يظهر في كل مكان: القائمة، والشريط الجانبي، ولوحة المعلومات، وعنوان الصفحة عند فتح العرض. |\n| **Show on dashboard** | هل يحصل العرض على بطاقة خاصة به في **لوحة المعلومات (Dashboard)**. |\n| **Show in sidebar** | هل يُدرج العرض في الشريط الجانبي تحت عنوان **Saved views**. |\n| **Documents page size** | عدد المستندات التي تعرضها القائمة في كل صفحة عند فتح هذا العرض. |\n| **Display as** | طريقة رسم النتائج: **Table** أو **Small Cards** أو **Large Cards**. |\n| **Show** | الحقول التي يعرضها كل سطر. اتركه على **Default** لتتبع المجموعة القياسية في التثبيت. |\n| **Actions** | **Permissions** لتعيين المالك ومن يجوز له رؤية العرض أو تغييره، و**Delete**. |\n\nويستحق أمران الانتباه في هذه الصفحة:\n\n- السطر أسفل الأعمدة **Note: ordering is not preserved** يتعلق بقائمة **Show**:\n  فالترتيب الذي ترتّب به الحقول هناك لا يُحفظ، وما يهم هو اختيار الحقول فقط.\n- تقارن الصفحة ما غيّرته بما كان محفوظًا. فيبقى **Save** باهتًا حتى يتغيّر شيء،\n  ويعيد **Cancel** كل شيء إلى ما كان عليه.\n\nوحين لا توجد عروض أصلًا تقول الصفحة **No saved views defined.**، وهذه إشارتك إلى\nالذهاب إلى قائمة المستندات لإنشاء عرض.\n\n!!! note\n\n    حذف عرض لا يحذف المستندات أبدًا؛ إنه يزيل الاختصار فقط.\n\n## قائمة Views في قائمة المستندات\n\nالطريقة اليومية للتعامل مع العروض هي زر **Views** أعلى قائمة المستندات:\n\n- تسرد القائمة كل عرض يمكنك استخدامه. واختيار أحدها ينقلك إليه مباشرة، فيصير\n  عنوان الصفحة اسم العرض.\n- **Save \"…\"** يكتب مرشّحاتك الحالية في العرض الذي تنظر إليه. ولا يظهر إلا حين\n  فتحت القائمة من عرض مسموح لك بتغييره.\n- **Save as...** يفتح نافذة **Save current view** لإنشاء عرض جديد.\n- **All saved views** يفتح صفحة الإدارة المشروحة أعلاه.\n- نقطة صغيرة على زر **Views** تنبّهك إلى أنك غيّرت المرشّحات أو الترتيب أو\n  الأعمدة منذ آخر حفظ للعرض.\n\nيحفظ العرض المرشّحات والترتيب والأعمدة وطريقة العرض، لا قائمة مستندات. افتحه غدًا\nفسيعرض ما يطابق القواعد *حينها*، ولهذا يبقى عرض اسمه «هذه السنة» حديثًا دائمًا.\n\n## إنشاء عرض من قائمة المستندات\n\n1. افتح **المستندات (Documents)** وابنِ القائمة التي تريدها: ابحث، وأشّر\n   المرشّحات، واختر ترتيبًا، وحدّد الأعمدة التي تعجبك.\n2. افتح قائمة **Views** واختر **Save as...**.\n3. في نافذة **Save current view**:\n   - أعطِ العرض حقل **Name**.\n   - أشّر **Show in sidebar** و/أو **Show on dashboard** إن أردت الاختصار قريبًا.\n   - عيّن المالك ومن يجوز له استخدامه إن شئت.\n4. انقر **Save**.\n\nوإن كان أحد المرشّحات شيئًا لا يستطيع العرض تخزينه، تعرض النافذة التنبيه\n**Filter rules error occurred while saving this view** وتقول لك **The error\nreturned was**، فتصلح المرشّح وتعيد المحاولة.\n\n## أين تظهر العروض\n\n| المكان | ما تحصل عليه |\n| --- | --- |\n| قائمة **Views** في قائمة المستندات | كل عرض يمكنك استخدامه، بالاسم |\n| الشريط الجانبي، تحت **Saved views** | العروض التي أشّرت لها **Show in sidebar** |\n| **لوحة المعلومات (Dashboard)** | بطاقة لكل عرض أشّرت له **Show on dashboard**، ويمكنك إعادة ترتيب البطاقات بالسحب |\n| صفحة **Saved Views** | كل عرض مسموح لك برؤيته، مع كل إعداداته |\n\nوما إن يُفتح العرض حتى يتصرف كقائمة المستندات تمامًا: يمكنك تحديد مستنداته\nوتعديلها وتنزيلها ومشاركتها كالمعتاد.\n\n## مشاركة عرض\n\nالعروض كائنات لها مالكها وصلاحياتها، فيمكن مشاركتها مستقلة عن المستندات التي\nداخلها:\n\n- **Permissions** يفتح النموذج المعتاد للمالك و**View** و**Edit**.\n- افتح النافذة فتجد التذكير\n  **Note: Sharing saved views does not share the underlying documents.** فمن\n  تشاركه العرض لا يرى إلا المستندات المسموح له هو برؤيتها؛ والعرض يوفر عليه\n  عناء إعادة بناء المرشّحات فقط.\n- وإن غاب **Save as...** من قائمة **Views** فأنت لا تملك صلاحية إضافة عروض؛\n  اطلبها من مالك أو من مدير (administrator).\n\n!!! warning\n\n    لأن العرض مرشّح فقط، فمشاركته تسهيل لا قرار أمني. امنح الأشخاص صلاحية\n    الوصول إلى المستندات نفسها بـ\n    [الصلاحيات أو روابط المشاركة](../documents/sharing.ar.md).\n\n## مثال سريع\n\nيدير عمر حسابات ورشة صغيرة. ويحتاج كل صباح إلى الفواتير التي وصلت منذ آخر مرة\nتفقّد فيها.\n\nيفتح **المستندات (Documents)**، ويفتح مرشّح **Document type** ويؤشّر\n\"Invoice\"، ويفتح **Dates** ويختار **Last 7 days** تحت **Added**، ثم يفتح\n**Sort** ويختار **Added** بالأحدث أولًا. ينقر **Views → Save as...** ويسمّيه\n**\"Invoices this week\"**، ويؤشّر **Show in sidebar**، ويحفظ.\n\nصار العرض في الشريط الجانبي. وحين تحتاج زميلته سلمى القائمة نفسها، يفتح عمر\n**Manage → Saved Views** وينقر **Permissions** على\n**\"Invoices this week\"** ويمنحها **View**. فترى سلمى العرض في قائمة **Views**\nلديها، لكن لا ترى منه إلا الفواتير المسموح لها هي بفتحها.\n\n"},{"id":"workflows","title":{"en":"Workflows","ar":"سير العمل"},"fileEn":"automation/workflows.md","fileAr":"automation/workflows.ar.md","en":"---\ntitle: Workflows\n---\n\n# Workflows\n\nA **workflow** is a rule that watches the document pipeline and does something\nwhen it sees what it is looking for: it can set the title, tags, correspondent,\ndocument type, storage path, owner and permissions; it can take information away\nagain; and it can send the document by e-mail, post it to a web address, try to\nunlock it, or move it to the trash.\n\nEach workflow has three parts:\n\n| Part | What it decides |\n| --- | --- |\n| **Trigger** | *When* the workflow runs, and which documents it applies to |\n| **Actions** | What the workflow does, in order, when it runs |\n| **Settings** | Its name, its position among the other workflows, and whether it is switched on |\n\nWorkflows live under **Workflows** in the sidebar. The page header describes\nthem as *Use workflows to cus
