<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paperless-ngx — User Guides</title>
  <style>
    :root {
      --bg: #f4f7f5;
      --surface: #ffffff;
      --surface-2: #edf2ef;
      --border: #dbe3de;
      --text: #20332a;
      --muted: #5b6c63;
      --primary: #2e7d32;
      --primary-strong: #1b5e20;
      --primary-soft: #e5f1e6;
      --on-primary: #ffffff;
      --code-bg: #eef2f0;
      --code-border: #dde5e0;
      --link: #2e7d32;
      --shadow: 0 1px 3px rgba(16, 40, 26, 0.10);
      --shadow-lg: 0 8px 24px rgba(16, 40, 26, 0.16);
      --note-bg: #e8f2fb; --note-border: #3d7fb0; --note-fg: #1f3a4d;
      --tip-bg: #e7f4e9;  --tip-border: #2e7d32;  --tip-fg: #1f3a2a;
      --warn-bg: #fdf3e0; --warn-border: #d89b2f; --warn-fg: #5c4513;
      --danger-bg: #fdeaea; --danger-border: #c84444; --danger-fg: #5c1f1f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121814;
        --surface: #1a231d;
        --surface-2: #202a23;
        --border: #2c382f;
        --text: #e6ece8;
        --muted: #a7b3ab;
        --primary: #66bb6a;
        --primary-strong: #81c784;
        --primary-soft: #1d2e20;
        --on-primary: #0f1a11;
        --code-bg: #222c25;
        --code-border: #2e3a32;
        --link: #81c784;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 10px 28px rgba(0, 0, 0, 0.5);
        --note-bg: #14262f; --note-border: #4f97c6; --note-fg: #d3e7f3;
        --tip-bg: #15281a;  --tip-border: #66bb6a;  --tip-fg: #d4ecd7;
        --warn-bg: #2b2413; --warn-border: #d8ab4f; --warn-fg: #f3e4c0;
        --danger-bg: #2b1717; --danger-border: #d95a5a; --danger-fg: #f3d3d3;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.65;
    }
    .app { display: flex; flex-direction: column; min-height: 100vh; }
    .topbar {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-right: 4px; }
    .brand-logo { width: 26px; height: 26px; color: var(--primary); flex: none; }
    .brand-name { font-weight: 700; font-size: 17px; letter-spacing: .2px; }
    .brand-sub { color: var(--muted); font-size: 13px; display: block; line-height: 1.1; }
    .search-wrap {
      position: relative; flex: 1; max-width: 520px; margin-left: auto; margin-right: auto;
    }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
    .search-wrap input {
      width: 100%; padding: 9px 12px 9px 36px;
      border: 1px solid var(--border); border-radius: 999px;
      background: var(--surface-2); color: var(--text); font-size: 14.5px;
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .lang-toggle { display: flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; flex: none; }
    .lang-toggle button {
      border: 0; background: transparent; color: var(--muted);
      padding: 8px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    }
    .lang-toggle button.active { background: var(--primary); color: var(--on-primary); }
    .icon-btn { display: none; border: 0; background: transparent; color: var(--text); cursor: pointer; padding: 6px; border-radius: 8px; }
    .icon-btn:hover { background: var(--surface-2); }
    .icon-btn svg { width: 22px; height: 22px; display: block; }

    /* layout */
    .layout { display: flex; flex: 1; min-height: 0; }
    .sidebar {
      width: 300px; flex: none; background: var(--surface);
      border-inline-end: 1px solid var(--border);
      overflow-y: auto; position: sticky; top: 57px; height: calc(100vh - 57px);
    }
    .sidebar-scroll { padding: 12px 10px 48px; }
    .nav-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 8px;
      color: var(--text); text-decoration: none; font-size: 14px;
      cursor: pointer; border-inline-start: 3px solid transparent;
    }
    .nav-item:hover { background: var(--surface-2); }
    .nav-item.active { background: var(--primary-soft); color: var(--primary-strong); font-weight: 600; border-inline-start-color: var(--primary); }
    .nav-item.home { font-weight: 700; margin-bottom: 8px; }
    .nav-item .nav-label { line-height: 1.35; }
    .nav-section { margin: 4px 0; }
    .nav-section-header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      width: 100%; padding: 9px 10px; border: 0; background: transparent;
      color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .5px; cursor: pointer; text-align: inherit; border-radius: 8px;
    }
    .nav-section-header:hover { background: var(--surface-2); }
    .nav-section-title { flex: 1; }
    .chevron { transition: transform .15s; font-size: 10px; }
    .nav-section.collapsed .chevron { transform: rotate(-90deg); }
    .nav-section.collapsed .nav-section-body { display: none; }
    .nav-section-body .nav-item { padding-inline-start: 22px; }

    /* content */
    .content-wrap { flex: 1; min-width: 0; display: flex; justify-content: center; }
    .content { width: 100%; max-width: 860px; padding: 32px 40px 96px; min-width: 0; }
    .content h1 { font-size: 30px; line-height: 1.2; margin: 0 0 18px; letter-spacing: -.3px; }
    .content h2 { font-size: 22px; margin: 40px 0 14px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .content h3 { font-size: 17px; margin: 28px 0 10px; }
    .content p { margin: 14px 0; }
    .content a { color: var(--link); text-decoration: none; }
    .content a:hover { text-decoration: underline; }
    .content a.ext::after { content: " \2197 "; font-size: .8em; opacity: .7; }
    .content code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      background: var(--code-bg); border: 1px solid var(--code-border);
      border-radius: 5px; padding: 1px 6px; font-size: .88em;
    }
    .content pre {
      background: var(--code-bg); border: 1px solid var(--code-border);
      border-radius: 8px; padding: 14px 16px; overflow-x: auto;
    }
    .content pre code { background: transparent; border: 0; padding: 0; font-size: 13.5px; }
    .content hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }
    .table-wrap { overflow-x: auto; margin: 16px 0; border: 1px solid var(--border); border-radius: 8px; }
    .content table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
    .content th, .content td { text-align: start; padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .content thead th { background: var(--surface-2); font-weight: 700; }
    .content tbody tr:last-child td { border-bottom: 0; }
    .content tbody tr:nth-child(even) td { background: var(--surface-2); }
    .content ul, .content ol { margin: 12px 0; padding-inline-start: 26px; }
    .content li { margin: 5px 0; }
    .content li > p { margin: 5px 0; }

    /* admonitions */
    .admonition { border-radius: 8px; border: 1px solid; border-inline-start-width: 4px; margin: 18px 0; overflow: hidden; }
    .admonition-title { font-weight: 700; padding: 9px 14px; font-size: 14.5px; text-transform: uppercase; letter-spacing: .4px; }
    .admonition-body { padding: 12px 14px; font-size: 15px; }
    .admonition-body > :first-child { margin-top: 0; }
    .admonition-body > :last-child { margin-bottom: 0; }
    .admonition.note { background: var(--note-bg); border-color: var(--note-border); }
    .admonition.note .admonition-title { color: var(--note-fg); }
    .admonition.tip, .admonition.success, .admonition.example { background: var(--tip-bg); border-color: var(--tip-border); }
    .admonition.tip .admonition-title, .admonition.success .admonition-title, .admonition.example .admonition-title { color: var(--tip-fg); }
    .admonition.warning, .admonition.attention, .admonition.caution { background: var(--warn-bg); border-color: var(--warn-border); }
    .admonition.warning .admonition-title, .admonition.attention .admonition-title, .admonition.caution .admonition-title { color: var(--warn-fg); }
    .admonition.danger, .admonition.error, .admonition.failure, .admonition.bug { background: var(--danger-bg); border-color: var(--danger-border); }
    .admonition.danger .admonition-title, .admonition.error .admonition-title, .admonition.failure .admonition-title, .admonition.bug .admonition-title { color: var(--danger-fg); }
    .admonition.info, .admonition.question, .admonition.quote, .admonition.abstract, .admonition.todo { background: var(--note-bg); border-color: var(--note-border); }
    .admonition.info .admonition-title, .admonition.question .admonition-title, .admonition.quote .admonition-title, .admonition.abstract .admonition-title, .admonition.todo .admonition-title { color: var(--note-fg); }

    /* pager */
    .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); }
    .pager-btn { color: var(--link); text-decoration: none; font-weight: 600; font-size: 14px; }
    .pager-btn:hover { text-decoration: underline; }
    .pager-btn.next { margin-inline-start: auto; text-align: end; }

    /* search results dropdown */
    .search-results {
      position: fixed; top: 57px; left: 50%; transform: translateX(-50%);
      width: min(560px, calc(100vw - 24px)); max-height: 70vh; overflow-y: auto;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: var(--shadow-lg); z-index: 60; padding: 6px;
    }
    .sr-item { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--text); }
    .sr-item:hover, .sr-item:focus { background: var(--surface-2); }
    .sr-section { display: block; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
    .sr-title { display: block; font-weight: 600; font-size: 14.5px; margin: 2px 0; color: var(--primary-strong); }
    .sr-snippet { display: block; font-size: 13px; color: var(--muted); }
    .sr-empty { padding: 14px; color: var(--muted); font-size: 14px; }
    .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 39; }

    @media (max-width: 900px) {
      .icon-btn { display: block; }
      .sidebar {
        position: fixed; top: 0; inset-inline-start: 0; bottom: 0; height: 100vh; z-index: 50;
        transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow-lg);
      }
      [dir="rtl"] .sidebar { transform: translateX(100%); }
      body.sidebar-open .sidebar { transform: translateX(0); }
      body.sidebar-open .sidebar-backdrop { display: block; }
      .content { padding: 24px 20px 80px; }
      .brand-sub { display: none; }
    }
  </style>
</head>

        <svg class="brand-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8z"/></svg>

  <script>
  const GUIDES_DATA = {"title":{"en":"User Guides","ar":"أدلّة المستخدمين"},"home":{"title":{"en":"User Guides","ar":"أدلّة المستخدمين"},"en":"# User Guides\n\nThis page is the index of the end-user and administrator guides. Every guide is\navailable in **English** and **Arabic**; use the two links in each row to switch\nbetween them.\n\n## Getting Started\n\n| Topic | English | العربية |\n| --- | --- | --- |\n| **Overview** — what Paperless-ngx is and the concepts behind it (documents, tags, correspondents, document types, storage paths, custom fields, saved views, versions). | [Read](getting-started/overview.md) | [اقرأ](getting-started/overview.ar.md) |\n| **Dashboard & navigation** — the dashboard widgets, the top bar and its search, the sidebar, and a map of the app. | [Read](getting-started/dashboard.md) | [اقرأ](getting-started/dashboard.ar.md) |\n| **Authentication, users, groups & permissions** — signing in, accounts, and what people are allowed to see and do. | [Read](getting-started/authentication.md) | [اقرأ](getting-started/authentication.ar.md) |\n\n## Documents\n\n| Topic | English | العربية |\n| --- | --- | --- |\n| **Adding documents** — uploading and consuming files, the upload dialog, and what happens while a document is being processed. | [Read](documents/adding.md) | [اقرأ](documents/adding.ar.md) |\n| **Browsing, filtering and searching** — the document list, its columns, filters, sorting, and search syntax. | [Read](documents/browsing.md) | [اقرأ](documents/browsing.ar.md) |\n| **Viewing a document** — opening a document, the viewer, versions, and downloading. | [Read](documents/viewing.md) | [اقرأ](documents/viewing.ar.md) |\n| **Editing document details** — correcting the title, dates, tags, correspondent, document type, storage path, custom fields, and the extracted text. | [Read](documents/editing.md) | [اقرأ](documents/editing.ar.md) |\n| **Notes and history** — notes on a document, and the record of who changed what. | [Read](documents/notes-history.md) | [اقرأ](documents/notes-history.ar.md) |\n| **Deleting and restoring documents** — the trash, restoring a document, and emptying the trash for good. | [Read](documents/trash.md) | [اقرأ](documents/trash.ar.md) |\n| **Working with many documents at once** — selecting, bulk editing, permissions, reprocessing, rotating, merging, sending, downloading, and deleting. | [Read](documents/bulk.md) | [اقرأ](documents/bulk.ar.md) |\n| **Sharing and permissions** — owners, view and edit permissions, public share links, share link bundles, and e-mail. | [Read](documents/sharing.md) | [اقرأ](documents/sharing.ar.md) |\n\n## Attributes\n\n| Topic | English | العربية |\n| --- | --- | --- |\n| **Tags** — labels on documents: their colours, hierarchy, inbox tag, and automatic matching. | [Read](attributes/tags.md) | [اقرأ](attributes/tags.ar.md) |\n| **Correspondents** — the people, companies, and institutions documents come from. | [Read](attributes/correspondents.md) | [اقرأ](attributes/correspondents.ar.md) |\n| **Document types** — what kind of paperwork a document is. | [Read](attributes/document-types.md) | [اقرأ](attributes/document-types.ar.md) |\n| **Storage paths** — rules for where a document's file is filed inside the archive. | [Read](attributes/storage-paths.md) | [اقرأ](attributes/storage-paths.ar.md) |\n| **Custom fields** — your own fields for text, dates, numbers, amounts, links, and choices. | [Read](attributes/custom-fields.md) | [اقرأ](attributes/custom-fields.ar.md) |\n\n## Automation\n\n| Topic | English | العربية |\n| --- | --- | --- |\n| **Saved views** — keeping a set of filters as a named view, and showing it in the sidebar or on the dashboard. | [Read](automation/saved-views.md) | [اقرأ](automation/saved-views.ar.md) |\n| **Workflows** — automating the document pipeline with triggers and actions. | [Read](automation/workflows.md) | [اقرأ](automation/workflows.ar.md) |\n| **Mail** — importing documents from e-mail: accounts, rules, and processed mail. | [Read](automation/mail.md) | [اقرأ](automation/mail.ar.md) |\n\n## Administration & Monitoring\n\n| Topic | English | العربية |\n| --- | --- | --- |\n| **Settings** — the appearance, document, permission and notification options that each person chooses for their own account. | [Read](administration/settings.md) | [اقرأ](administration/settings.ar.md) |\n| **System status** — the health report of the installation: environment, database, task queue, and health checks. | [Read](administration/system-status.md) | [اقرأ](administration/system-status.ar.md) |\n| **Logs** — reading the application, mail and background-worker logs when something goes wrong. | [Read](administration/logs.md) | [اقرأ](administration/logs.ar.md) |\n| **Tasks** — monitoring what the system was asked to do: sections, filters, results, and dismissing tasks. | [Read](administration/tasks.md) | [اقرأ](administration/tasks.ar.md) |\n| **Backup and restore** — what a complete backup must contain, the built-in export and import, and what is not a backup. | [Read](administration/backup.md) | [اقرأ](administration/backup.ar.md) |\n\n## Optional & Advanced\n\n| Topic | English | العربية |\n| --- | --- | --- |\n| **AI features** — the chat in the top bar that answers questions about your documents, and AI-assisted suggestions, with the options administrators control. | [Read](advanced/ai.md) | [اقرأ](advanced/ai.ar.md) |\n| **Barcodes and ASN** — the archive serial number, reading numbers and separators from printed barcodes, and splitting a stack of scans. | [Read](advanced/barcodes-asn.md) | [اقرأ](advanced/barcodes-asn.ar.md) |\n| **The consume folder** — the folder the installation watches: how files get in, what it accepts, subfolders as tags, and what a failed import looks like. | [Read](advanced/consume-folder.md) | [اقرأ](advanced/consume-folder.ar.md) |\n\n!!! note\n\n    Looking for how to install or configure the server? See\n    [Setup](../setup.md), [Configuration](../configuration.md), and\n    [Administration](../administration.md).\n","ar":"\n# أدلّة المستخدمين\n\nهذه الصفحة فهرس أدلّة المستخدمين والمديرين. كل دليل متوفّر بـ **الإنجليزية** و**العربية**؛ استخدم الرابطين في كل سطر للتنقّل بينهما.\n\n## البدء (Getting Started)\n\n| الموضوع | English | العربية |\n| --- | --- | --- |\n| **نظرة عامة** — ما هو Paperless-ngx والمفاهيم التي يقوم عليها (المستندات، الوسوم، المراسلون، أنواع المستندات، مسارات التخزين، الحقول المخصصة، العروض المحفوظة، الإصدارات). | [Read](getting-started/overview.md) | [اقرأ](getting-started/overview.ar.md) |\n| **لوحة المعلومات والتنقّل** — أدوات لوحة المعلومات، والشريط العلوي وبحثه، والشريط الجانبي، وخريطة التطبيق. | [Read](getting-started/dashboard.md) | [اقرأ](getting-started/dashboard.ar.md) |\n| **المصادقة والمستخدمون والمجموعات والصلاحيات** — تسجيل الدخول والحسابات وما يُسمح للأشخاص برؤيته وفعله. | [Read](getting-started/authentication.md) | [اقرأ](getting-started/authentication.ar.md) |\n\n## المستندات (Documents)\n\n| الموضوع | English | العربية |\n| --- | --- | --- |\n| **إضافة المستندات** — رفع الملفات ومعالجتها، ونافذة الرفع، وما يجري أثناء معالجة المستند. | [Read](documents/adding.md) | [اقرأ](documents/adding.ar.md) |\n| **تصفّح المستندات وتصفيتها والبحث فيها** — قائمة المستندات وأعمدتها ومرشّحاتها وترتيبها وصيغة البحث. | [Read](documents/browsing.md) | [اقرأ](documents/browsing.ar.md) |\n| **عرض مستند** — فتح المستند والعارض والإصدارات والتنزيل. | [Read](documents/viewing.md) | [اقرأ](documents/viewing.ar.md) |\n| **تعديل تفاصيل المستند** — تصحيح العنوان والتواريخ والوسوم والمراسل ونوع المستند ومسار التخزين والحقول المخصّصة والنص المستخرج. | [Read](documents/editing.md) | [اقرأ](documents/editing.ar.md) |\n| **الملاحظات وسجل التغييرات** — الملاحظات على المستند وسجلّ من غيّر ماذا. | [Read](documents/notes-history.md) | [اقرأ](documents/notes-history.ar.md) |\n| **حذف المستندات واستعادتها** — المهملات واستعادة مستند وتفريغ المهملات نهائيًا. | [Read](documents/trash.md) | [اقرأ](documents/trash.ar.md) |\n| **العمل على عدة مستندات معًا** — التحديد والتعديل الجماعي والصلاحيات وإعادة المعالجة والتدوير والدمج والإرسال والتنزيل والحذف. | [Read](documents/bulk.md) | [اقرأ](documents/bulk.ar.md) |\n| **المشاركة والصلاحيات** — المالك وصلاحيات العرض والتعديل وروابط المشاركة العامة وحزم روابط المشاركة والبريد. | [Read](documents/sharing.md) | [اقرأ](documents/sharing.ar.md) |\n\n## الخصائص (Attributes)\n\n| الموضوع | English | العربية |\n| --- | --- | --- |\n| **الوسوم** — التسميات على المستندات: ألوانها وتدرّجها الهرمي ووسم البريد الوارد ومطابقتها التلقائية. | [Read](attributes/tags.md) | [اقرأ](attributes/tags.ar.md) |\n| **المراسلون** — الأشخاص والشركات والمؤسسات التي تصدر عنها المستندات. | [Read](attributes/correspondents.md) | [اقرأ](attributes/correspondents.ar.md) |\n| **أنواع المستندات** — ماهية المعاملة الورقية. | [Read](attributes/document-types.md) | [اقرأ](attributes/document-types.ar.md) |\n| **مسارات التخزين** — قواعد المكان الذي يُرتَّب فيه ملف المستند داخل الأرشيف. | [Read](attributes/storage-paths.md) | [اقرأ](attributes/storage-paths.ar.md) |\n| **الحقول المخصّصة** — حقولك الخاصة للنصوص والتواريخ والأرقام والمبالغ والروابط والاختيارات. | [Read](attributes/custom-fields.md) | [اقرأ](attributes/custom-fields.ar.md) |\n\n## الأتمتة (Automation)\n\n| الموضوع | English | العربية |\n| --- | --- | --- |\n| **العروض المحفوظة** — حفظ مجموعة مرشّحات في عرض مُسمّى، وإظهاره في الشريط الجانبي أو على لوحة المعلومات. | [Read](automation/saved-views.md) | [اقرأ](automation/saved-views.ar.md) |\n| **سير العمل** — أتمتة مسار معالجة المستند بالمُشغّلات والإجراءات. | [Read](automation/workflows.md) | [اقرأ](automation/workflows.ar.md) |\n| **البريد** — استيراد المستندات من البريد الإلكتروني: الحسابات والقواعد والبريد المعالَج. | [Read](automation/mail.md) | [اقرأ](automation/mail.ar.md) |\n\n## الإدارة والمراقبة (Administration & Monitoring)\n\n| الموضوع | English | العربية |\n| --- | --- | --- |\n| **الإعدادات** — خيارات المظهر والمستندات والصلاحيات والإشعارات التي يختارها كل شخص لحسابه. | [Read](administration/settings.md) | [اقرأ](administration/settings.ar.md) |\n| **حالة النظام** — تقرير صحة التثبيت: البيئة وقاعدة البيانات وقائمة المهام وفحوص الصحة. | [Read](administration/system-status.md) | [اقرأ](administration/system-status.ar.md) |\n| **السجلات** — قراءة سجلات التطبيق والبريد والعمّال في الخلفية عند وقوع خطأ. | [Read](administration/logs.md) | [اقرأ](administration/logs.ar.md) |\n| **المهام** — متابعة ما طُلب من النظام فعله: الأقسام والمرشّحات والنتائج وإخفاء المهام. | [Read](administration/tasks.md) | [اقرأ](administration/tasks.ar.md) |\n| **النسخ الاحتياطي والاستعادة** — ما يجب أن تشمله النسخة الكاملة، والتصدير والاستيراد المدمجان، وما ليس نسخًا احتياطيًا. | [Read](administration/backup.md) | [اقرأ](administration/backup.ar.md) |\n\n## اختياري ومتقدّم (Optional & Advanced)\n\n| الموضوع | English | العربية |\n| --- | --- | --- |\n| **ميزات الذكاء الاصطناعي** — المحادثة في الشريط العلوي التي تجيب عن أسئلتك حول مستنداتك، والاقتراحات المعزّزة بالذكاء الاصطناعي، مع الخيارات التي يضبطها المدراء. | [Read](advanced/ai.md) | [اقرأ](advanced/ai.ar.md) |\n| **الباركود ورقم ASN** — رقم التسلسل الأرشيفي، وقراءة الأرقام والفاصل من الباركودات المطبوعة، وفصل رزمة المسوحات. | [Read](advanced/barcodes-asn.md) | [اقرأ](advanced/barcodes-asn.ar.md) |\n| **مجلّد المعالجة** — المجلّد الذي يراقبه التثبيت: كيف تصل الملفات إليه، وما يقبله، والمجلّدات الفرعية كوسوم، وكيف يبدو الاستيراد الفاشل. | [Read](advanced/consume-folder.md) | [اقرأ](advanced/consume-folder.ar.md) |\n\n!!! note\n\n    تبحث عن كيفية تثبيت الخادم أو تهيئته؟ راجع [الإعداد (Setup)](../setup.md) و[التهيئة (Configuration)](../configuration.md) و[الإدارة (Administration)](../administration.md).\n"},"sections":[{"id":"getting-started","title":{"en":"Getting Started","ar":"البدء"},"items":[{"id":"overview","title":{"en":"Overview","ar":"نظرة عامة"},"fileEn":"getting-started/overview.md","fileAr":"getting-started/overview.ar.md","en":"---\ntitle: Understanding Paperless-ngx\n---\n\n# What is Paperless-ngx?\n\nPaperless-ngx is a document management system. It takes the paper that comes\ninto your life — letters, invoices, contracts, receipts, statements — and turns\nit into a searchable, organized digital archive that lives on your own server.\n\nInstead of filing paper in folders and binders, you keep everything in one\nplace and let Paperless-ngx do the heavy lifting: it reads the text of your\ndocuments, stores them safely, and helps you find any of them again in seconds.\n\nThis page explains the main ideas you need before you start using the system.\nIt is written for everyday users and for the person who administers the\ninstallation.\n\n## What you can do with Paperless-ngx\n\n- **Add documents** by uploading them, by dragging and dropping them, or by\n  letting the system pick them up automatically from a watched folder.\n- **Organize documents** with tags, correspondents, document types, storage\n  paths, and custom fields.\n- **Find anything** with full-text search, filters, and saved views.\n- **Edit documents** one at a time or many at once with bulk editing.\n- **Share documents** with public share links.\n- **Automate** how documents are processed with workflows and mail rules.\n\n## The main areas of the app\n\nThe web interface is organized into a few main areas. You move between them\nusing the sidebar on the left.\n\n| Area | What it is for |\n| --- | --- |\n| **Dashboard** | Your starting page. Shows helpful widgets, statistics, and any saved views you choose to display. |\n| **Documents** | The list of all documents, with filtering, searching, sorting, and bulk actions. |\n| **Document detail** | A single document: its preview, its metadata, its notes, and its history. |\n| **Attributes** | The lists of tags, correspondents, document types, storage paths, and custom fields. |\n| **Saved Views** | Manage the views you have created. |\n| **Workflows** | Rules that react to events and act on documents automatically. |\n| **Mail** | E-mail accounts and rules for importing documents automatically. |\n| **Trash** | Documents you have deleted, where they can be restored. |\n| **Administration** | Settings, system configuration, users and groups, tasks, and logs. |\n\n!!! tip\n\n    New to the app? The **Dashboard** offers a short guided tour. You can start\n    it from the welcome message on the dashboard, or from **Settings**.\n\n## Core concepts\n\n### Documents\n\nA **document** is one item in your archive: a scanned page, an uploaded PDF, a\nphoto of a receipt, and so on. Each document has a preview and a set of\ndetails you can search and filter by.\n\nThe most important details of a document are:\n\n| Detail | Meaning |\n| --- | --- |\n| **Title** | The name of the document. You can change it at any time. |\n| **Content** | The text that was read from the document. This is what the search engine looks through. |\n| **Correspondent** | The person, company, or institution the document came from or was sent to. |\n| **Document type** | What kind of document it is, such as an invoice, contract, or letter. |\n| **Tags** | Labels you attach to group documents together. |\n| **Storage path** | Where the document's file is stored inside the archive. |\n| **Date created** | The date the document was originally issued, signed, or written. |\n| **Date added** | The date the document was added to Paperless-ngx. The system sets this; you should not need to change it. |\n| **Archive serial number (ASN)** | The number that links a digital document to its place in your physical binders. |\n| **Custom fields** | Extra details you define yourself, such as an account number or a warranty end date. |\n| **Owner and permissions** | Who the document belongs to and who else is allowed to view or change it. |\n\nA document can also have **versions**. Think of versions as file history: a new\nversion can be added when the file itself is replaced or updated, while the\ndocument's details (tags, correspondent, and so on) stay the same. By default,\nsearch and preview use the latest version. See\n[Versions](#versions) below.\n\n### Tags\n\nA **tag** is a label you assign to documents. Tags work like more flexible\nfolders: one document can carry several tags, and one tag can group any number\nof documents.\n\n- Tags can have a **parent** tag, so you can build a hierarchy (for example\n  \"Finance\" with a child \"Taxes\"). A hierarchy can be up to five levels deep.\n- When you add a tag to a document, its parent tags are added automatically.\n  When you remove a tag, its child tags are removed as well.\n- A tag can have a **color** so it stands out in the document list.\n- A tag can be set to be assigned **automatically** to new documents that match\n  certain words. See [Automation](#automation) below.\n\n### Correspondents\n\nA **correspondent** is the person, institution, or company that a document\noriginates from or is sent to. Assigning the right correspondent makes it easy\nto pull up \"everything from my bank\" or \"everything from this client\". A\ncorrespondent can also be assigned automatically to new documents, like a tag.\n\n### Document types\n\nA **document type** describes what a document *is*, for example an invoice, a\nbank statement, a contract, or a letter. Document types help you separate\ndocuments that look similar but mean different things. Like tags and\ncorrespondents, a document type can be assigned automatically.\n\n### Storage paths\n\nA **storage path** is the location where the document's file is saved inside\nyour archive. Storage paths let you keep related files together on disk — for\nexample, all invoices in one folder and all contracts in another — without\nhaving to move files yourself. The system applies the storage path when it\nstores the document.\n\n!!! note\n\n    Storage paths affect where files are kept. In most installations the exact\n    folder layout has already been chosen for you, so you can often leave this\n    field empty and let the default apply.\n\n### Custom fields\n\nA **custom field** is an extra piece of information that you decide you want to\ntrack for your documents, such as an insurance policy number, a project code,\nor a renewal date. An administrator creates the custom field once, and then\neveryone can fill it in on each document.\n\nEach custom field has a **data type**, which decides what kind of value it can\nhold:\n\n| Data type | What it holds |\n| --- | --- |\n| **Text** | A short line of text. |\n| **Long Text** | A longer, multi-line amount of text. |\n| **Number** | A decimal number. |\n| **Integer** | A whole number. |\n| **Monetary** | An amount of money, with a currency. |\n| **Date** | A calendar date. |\n| **Boolean** | A simple yes/no (true/false) choice. |\n| **Url** | A web address. |\n| **Select** | One choice from a list of options you define. |\n| **Document Link** | A link to another document in Paperless-ngx. |\n\n!!! note\n\n    A custom field's data type is set when it is created and cannot be changed\n    afterwards.\n\n### Saved views\n\nA **saved view** is a stored set of filters. Once you have narrowed the document\nlist down to exactly what you want — for example \"Invoices from 2026, newest\nfirst\" — you can save that combination as a view. A saved view can then be\nshown on the **Dashboard**, in the **sidebar**, or both, so your most useful\nviews are always one click away.\n\n### Ownership and permissions\n\nEvery document and every attribute (a tag, a correspondent, and so on) can have\nan **owner** and a set of **permissions**. The owner is the user the item\nbelongs to, and permissions decide which other users or groups can **view** or\n**change** the item. An item with no owner is visible to everyone.\n\nThis is covered in detail in\n[Authentication, Users, Groups & Permissions](authentication.md).\n\n## Versions\n\nA document can have more than one **version** of its file. This is useful when\na file is corrected or replaced but you want to keep the record of the change,\nsimilar to file history.\n\n- Each version has its own file and its own extracted text.\n- The document's details — tags, correspondent, document type, storage path,\n  and custom fields — stay with the document and are shared by all versions.\n- By default, search and document preview show the **latest** version.\n- In the document detail page you can select a version to preview, download,\n  and read its text, or to check its file information.\n- Deleting a non-latest version keeps the document and simply falls back to the\n  latest remaining version.\n\n## How documents get into Paperless-ngx\n\nThere are several ways to add documents:\n\n- **Upload** them from the dashboard or the documents list.\n- **Drag and drop** files anywhere in the app.\n- Let the system **consume** files placed in a watched folder (the *consume\n  folder*).\n- Let the system **import** documents from a connected e-mail account.\n\nWhichever route you use, Paperless-ngx reads the text of the document, creates\na long-term archive copy, and tries to match tags, a correspondent, a document\ntype, and a storage path automatically based on what you have done before.\n\n## Automation\n\nPaperless-ngx can do a lot of the organizing for you:\n\n- **Matching** lets a tag, correspondent, document type, or storage path be\n  assigned automatically to new documents when certain words appear.\n- **Workflows** run actions automatically when documents are added, updated, or\n  when other events happen.\n- **Mail rules** import documents from e-mail and can sort them as they arrive.\n\nThese are covered in their own guides.\n\n## A quick example\n\nSuppose you receive a monthly electricity bill as a PDF.\n\n1. You drag the PDF onto the **Dashboard**. Paperless-ngx reads its text and\n   stores it.\n2. Because you have set up a matching rule, the document is automatically given\n   the tag **\"Utilities\"** and the correspondent **\"City Power\"**.\n3. You open the document and set its **Document type** to **\"Invoice\"** and its\n   **Date created** to the billing date.\n4. You add a custom field called **\"Account number\"** and fill it in.\n5. In the documents list you filter by the tag **\"Utilities\"**, set the sort to\n   newest first, and save the result as a view called **\"Utility bills\"**.\n6. You tick **Show on dashboard** for that view, so next month's bill is easy to\n   find the moment you sign in.\n\n\n","ar":"---\ntitle: فهم Paperless-ngx\n---\n\n# ما هو Paperless-ngx؟\n\n‏Paperless-ngx نظام لإدارة المستندات. يأخذ الأوراق التي تصل إلى حياتك — الرسائل والفواتير والعقود والإيصالات وكشوف الحساب — ويحوّلها إلى أرشيف رقمي منظَّم وقابل للبحث يعيش على خادمك الخاص.\n\nبدلًا من حفظ الأوراق في مجلدات وملفات ورقية، تُبقي كل شيء في مكان واحد وتدع Paperless-ngx يقوم بالعمل الشاق: يقرأ نص مستنداتك، ويحفظها بأمان، ويساعدك على العثور على أي منها في ثوانٍ.\n\nتشرح هذه الصفحة الأفكار الأساسية التي تحتاجها قبل البدء باستخدام النظام. وهي موجّهة للمستخدمين العاديين ولمن يدير التركيب (installation).\n\n## ما يمكنك فعله باستخدام Paperless-ngx\n\n- **إضافة المستندات** برفعها، أو بسحبها وإفلاتها، أو بترك النظام يلتقطها تلقائيًا من مجلد مراقَب.\n- **تنظيم المستندات** بالوسوم والمراسلين وأنواع المستندات ومسارات التخزين والحقول المخصصة.\n- **العثور على أي شيء** بالبحث النصي الكامل والمرشّحات والعروض المحفوظة.\n- **تعديل المستندات** واحدًا واحدًا أو دفعة واحدة عبر التحرير الجماعي.\n- **مشاركة المستندات** بروابط مشاركة عامة.\n- **أتمتة** طريقة معالجة المستندات عبر سير العمل وقواعد البريد.\n\n## المجالات الرئيسية في التطبيق\n\nتتضمّن واجهة الويب بضعة مجالات رئيسية. تتنقّل بينها باستخدام الشريط الجانبي على اليسار.\n\n| المجال | الغرض منه |\n| --- | --- |\n| **لوحة المعلومات (Dashboard)** | صفحتك الرئيسية. تعرض أدوات مفيدة وإحصاءات وأي عروض محفوظة تختار إظهارها. |\n| **المستندات (Documents)** | قائمة كل المستندات، مع الترشيح والبحث والترتيب والإجراءات الجماعية. |\n| **تفاصيل المستند (Document detail)** | مستند واحد: معاينته وبياناته وملاحظاته وسجلّه. |\n| **السمات (Attributes)** | قوائم الوسوم والمراسلين وأنواع المستندات ومسارات التخزين والحقول المخصصة. |\n| **العروض المحفوظة (Saved Views)** | إدارة العروض التي أنشأتها. |\n| **سير العمل (Workflows)** | قواعد تتفاعل مع الأحداث وتتصرّف في المستندات تلقائيًا. |\n| **البريد (Mail)** | حسابات البريد وقواعده لاستيراد المستندات تلقائيًا. |\n| **سلة المحذوفات (Trash)** | المستندات التي حذفتها، حيث يمكن استعادتها. |\n| **الإدارة (Administration)** | الإعدادات وتهيئة النظام والمستخدمون والمجموعات والمهام والسجلات. |\n\n!!! tip\n\n    جديد على التطبيق؟ تقدّم **لوحة المعلومات (Dashboard)** جولة إرشادية قصيرة. يمكنك بدؤها من رسالة الترحيب في لوحة المعلومات، أو من **الإعدادات (Settings)**.\n\n## المفاهيم الأساسية\n\n### المستندات\n\n**المستند (document)** هو عنصر واحد في أرشيفك: صفحة ممسوحة ضوئيًا، أو ملف PDF مرفوع، أو صورة إيصال، وهكذا. لكل مستند معاينة ومجموعة من التفاصيل يمكنك البحث والترشيح حسبها.\n\nأهم تفاصيل المستند هي:\n\n| التفصيل | المعنى |\n| --- | --- |\n| **العنوان (Title)** | اسم المستند. يمكنك تغييره في أي وقت. |\n| **المحتوى (Content)** | النص المقروء من المستند. هذا ما يبحث فيه محرّك البحث. |\n| **المراسل (Correspondent)** | الشخص أو الشركة أو المؤسسة التي صدر عنها المستند أو أُرسل إليها. |\n| **نوع المستند (Document type)** | نوع المستند، مثل فاتورة أو عقد أو رسالة. |\n| **الوسوم (Tags)** | تسميات ترفقها لتجميع المستندات معًا. |\n| **مسار التخزين (Storage path)** | المكان الذي يُحفظ فيه ملف المستند داخل الأرشيف. |\n| **تاريخ الإنشاء (Date created)** | التاريخ الذي صدر أو وُقّع أو كُتب فيه المستند أصلًا. |\n| **تاريخ الإضافة (Date added)** | التاريخ الذي أُضيف فيه المستند إلى Paperless-ngx. يضبطه النظام؛ ولا يُفترض أن تحتاج إلى تغييره. |\n| **الرقم التسلسلي للأرشيف (ASN)** | الرقم الذي يربط المستند الرقمي بمكانه في ملفاتك الورقية. |\n| **الحقول المخصصة (Custom fields)** | تفاصيل إضافية تعرّفها بنفسك، مثل رقم حساب أو تاريخ انتهاء ضمان. |\n| **المالك والصلاحيات (Owner and permissions)** | مَن ينتمي إليه المستند ومَن يُسمح له بعرضه أو تعديله. |\n\nيمكن أن يملك المستند أيضًا **إصدارات (versions)**. اعتبر الإصدارات بمثابة سجل الملف: يمكن إضافة إصدار جديد عند استبدال الملف نفسه أو تحديثه، بينما تبقى تفاصيل المستند (الوسوم والمراسل وهكذا) كما هي. افتراضيًا، يستخدم البحث والمعاينة أحدث إصدار. راجع قسم «الإصدارات» أدناه.\n\n### الوسوم\n\n**الوسم (tag)** تسمية تُسندها إلى المستندات. تعمل الوسوم كمجلدات أكثر مرونة: يمكن للمستند الواحد أن يحمل عدة وسوم، ويمكن للوسم الواحد أن يجمّع أي عدد من المستندات.\n\n- يمكن أن يملك الوسم وسمًا **أبًا (parent)**، فتبني تدرّجًا هرميًا (مثل \"المالية\" وبداخله \"الضرائب\"). ويبلغ عمق التدرّج خمسة مستويات كحد أقصى.\n- عند إضافة وسم إلى مستند، تُضاف وسومه الأب تلقائيًا. وعند إزالة وسم، تُزال وسومه الأبناء أيضًا.\n- يمكن أن يملك الوسم **لونًا (color)** ليبرز في قائمة المستندات.\n- يمكن ضبط الوسم ليُسند **تلقائيًا** إلى المستندات الجديدة المطابقة لكلمات معيّنة. راجع قسم «الأتمتة» أدناه.\n\n### المراسلون\n\n**المراسل (correspondent)** هو الشخص أو المؤسسة أو الشركة التي يصدر عنها المستند أو يُرسل إليها. ويجعل إسناد المراسل الصحيح من السهل استدعاء \"كل ما ورد من مصرفي\" أو \"كل ما ورد من هذا العميل\". ويمكن أيضًا إسناد المراسل تلقائيًا إلى المستندات الجديدة، مثل الوسم.\n\n### أنواع المستندات\n\nيصف **نوع المستند (document type)** ماهية المستند، مثل فاتورة أو كشف حساب مصرفي أو عقد أو رسالة. وتساعد أنواع المستندات على فصل المستندات المتشابهة في الشكل والمختلفة في المعنى. وكما في الوسوم والمراسلين، يمكن إسناد نوع المستند تلقائيًا.\n\n### مسارات التخزين\n\n**مسار التخزين (storage path)** هو المكان الذي يُحفظ فيه ملف المستند داخل أرشيفك. تتيح لك مسارات التخزين إبقاء الملفات ذات الصلة معًا على القرص — مثلًا كل الفواتير في مجلد وكل العقود في مجلد آخر — دون أن تنقل الملفات بنفسك. ويطبّق النظام مسار التخزين عند حفظ المستند.\n\n!!! note\n\n    تؤثّر مسارات التخزين في مكان حفظ الملفات. وفي معظم التركيبات يكون تخطيط المجلدات الدقيق مختارًا لك مسبقًا، لذا يمكنك غالبًا ترك هذا الحقل فارغًا ليطبّق الافتراضي.\n\n### الحقول المخصصة\n\n**الحقل المخصص (custom field)** قطعة معلومات إضافية تقرّر أنك تريد تتبّعها لمستنداتك، مثل رقم بوليصة تأمين أو رمز مشروع أو تاريخ تجديد. ينشئ المدير الحقل المخصص مرة واحدة، ثم يمكن للجميع تعبئته في كل مستند.\n\nلكل حقل مخصص **نوع بيانات (data type)** يحدّد نوع القيمة التي يمكن أن يحملها:\n\n| نوع البيانات | ما يحمله |\n| --- | --- |\n| **نص (Text)** | سطر نصي قصير. |\n| **نص طويل (Long Text)** | نص أطول من عدة أسطر. |\n| **رقم (Number)** | عدد عشري. |\n| **عدد صحيح (Integer)** | عدد صحيح دون كسور. |\n| **مبلغ مالي (Monetary)** | مبلغ من المال مع عملة. |\n| **تاريخ (Date)** | تاريخ تقويمي. |\n| **منطقي (Boolean)** | خيار بسيط نعم/لا (صحيح/خطأ). |\n| **رابط (Url)** | عنوان ويب. |\n| **اختيار (Select)** | اختيار واحد من قائمة خيارات تعرّفها أنت. |\n| **رابط مستند (Document Link)** | رابط إلى مستند آخر في Paperless-ngx. |\n\n!!! note\n\n    يُضبط نوع بيانات الحقل المخصص عند إنشائه ولا يمكن تغييره بعد ذلك.\n\n### العروض المحفوظة\n\n**العرض المحفوظ (saved view)** مجموعة مرشّحات مخزَّنة. بعد أن تضيّق قائمة المستندات إلى ما تريد بالضبط — مثلًا \"فواتير 2026، الأحدث أولًا\" — يمكنك حفظ تلك المجموعة كعرض. ويمكن بعد ذلك إظهار العرض المحفوظ على **لوحة المعلومات (Dashboard)** أو في **الشريط الجانبي (sidebar)** أو كليهما، فتبقى عروضك الأكثر فائدة على بُعد نقرة واحدة.\n\n### الملكية والصلاحيات\n\nيمكن أن يملك كل مستند وكل سمة (وسم أو مراسل وهكذا) **مالكًا (owner)** ومجموعة **صلاحيات (permissions)**. المالك هو المستخدم الذي ينتمي إليه العنصر، وتحدّد الصلاحيات أي مستخدمين أو مجموعات أخرى يمكنهم **عرض (view)** العنصر أو **تعديله (change)**. والعنصر الذي ليس له مالك يكون مرئيًا للجميع.\n\nهذا مشروح بالتفصيل في [المصادقة والمستخدمون والمجموعات والصلاحيات](authentication.ar.md).\n\n## الإصدارات\n\nيمكن أن يملك المستند أكثر من **إصدار (version)** من ملفه. وهذا مفيد عند تصحيح ملف أو استبداله مع الرغبة في الاحتفاظ بسجل التغيير، على غرار سجل الملف.\n\n- لكل إصدار ملفه الخاص ونصه المستخرج الخاص.\n- تبقى تفاصيل المستند — الوسوم والمراسل ونوع المستند ومسار التخزين والحقول المخصصة — مع المستند وتتشاركها كل الإصدارات.\n- افتراضيًا، يعرض البحث ومعاينة المستند أحدث إصدار.\n- في صفحة تفاصيل المستند يمكنك اختيار إصدار لمعاينته وتنزيله وقراءة نصه، أو للاطّلاع على معلومات ملفه.\n- حذف إصدار غير أحدث يُبقي المستند ويعود ببساطة إلى أحدث إصدار متبقٍّ.\n\n## كيف تصل المستندات إلى Paperless-ngx\n\nتوجد عدة طرق لإضافة المستندات:\n\n- **رفعها (Upload)** من لوحة المعلومات أو قائمة المستندات.\n- **سحبها وإفلاتها (Drag and drop)** في أي مكان من التطبيق.\n- ترك النظام **يستهلك (consume)** الملفات الموضوعة في مجلد مراقَب (مجلد *الاستهلاك*).\n- ترك النظام **يستورد (import)** المستندات من حساب بريد إلكتروني موصول.\n\nوأيًّا كانت الطريقة، يقرأ Paperless-ngx نص المستند، وينشئ نسخة أرشيفية طويلة الأمد، ويحاول مطابقة الوسوم والمراسل ونوع المستند ومسار التخزين تلقائيًا بناءً على ما فعلته سابقًا.\n\n## الأتمتة\n\nيستطيع Paperless-ngx القيام بالكثير من التنظيم نيابةً عنك:\n\n- **المطابقة (Matching)** تتيح إسناد وسم أو مراسل أو نوع مستند أو مسار تخزين تلقائيًا إلى المستندات الجديدة عند ظهور كلمات معيّنة.\n- **سير العمل (Workflows)** يشغّل إجراءات تلقائيًا عند إضافة مستندات أو تحديثها أو عند وقوع أحداث أخرى.\n- **قواعد البريد (Mail rules)** تستورد المستندات من البريد الإلكتروني ويمكنها ترتيبها لحظة وصولها.\n\nوهذه مشروحة في أدلّتها الخاصة.\n\n## مثال سريع\n\nلنفترض أنك تستلم فاتورة كهرباء شهرية بصيغة PDF.\n\n1. تسحب ملف PDF إلى **لوحة المعلومات (Dashboard)**. يقرأ Paperless-ngx نصه ويحفظه.\n2. لأنك أعددت قاعدة مطابقة، يُمنح المستند تلقائيًا وسم **\"المرافق\"** ومراسل **\"شركة الكهرباء المدينة\"**.\n3. تفتح المستند وتضبط **نوع المستند (Document type)** على **\"فاتورة\"** و **تاريخ الإنشاء (Date created)** على تاريخ الفاتورة.\n4. تضيف حقلًا مخصصًا باسم **\"رقم الحساب\"** وتعبّئه.\n5. في قائمة المستندات ترشّح حسب وسم **\"المرافق\"**، وتضبط الترتيب على الأحدث أولًا، وتحفظ النتيجة كعرض باسم **\"فواتير المرافق\"**.\n6. تضع علامة على **إظهار على لوحة المعلومات (Show on dashboard)** لذلك العرض، فيصبح العثور على فاتورة الشهر القادم سهلًا لحظة تسجيل دخولك.\n\n\n"},{"id":"dashboard","title":{"en":"Dashboard & navigation","ar":"لوحة المعلومات والتنقّل"},"fileEn":"getting-started/dashboard.md","fileAr":"getting-started/dashboard.ar.md","en":"---\ntitle: The Dashboard and Navigating the Interface\n---\n\n# The Dashboard and Navigating the Interface\n\nWhen you sign in to Paperless-ngx you land on the **Dashboard**. From there you\nmove around the app using the **sidebar** on the left and the **top bar** across\nthe top. This guide explains what each part does and how to get where you want\nto go.\n\n## The top bar\n\nThe bar across the top of every page stays with you wherever you go. From left\nto right it contains:\n\n- **The logo and app name** — clicking them always takes you back to the\n  **Dashboard**.\n- **Search** — the global search box, described below.\n- **The AI assistant button** — appears only if an administrator has turned on\n  the AI features. It opens a chat you can ask questions about your documents.\n  See [AI Features](../advanced/ai.md).\n- **Notifications** — a bell-shaped button that shows background events and\n  messages, such as documents that have finished being processed or errors that\n  need your attention.\n- **Your account menu** — your name (or avatar) opens a menu with:\n    - **My Profile** — change your display name, e-mail, password, and\n      two-factor authentication.\n    - **Settings** — open the application settings.\n    - **Logout** — sign out.\n    - **Documentation** — open the online documentation in a new tab.\n\n### Search\n\nThe **Search** box finds things as you type. Results are grouped by type, in\nthis order: **Documents**, **Saved Views**, **Tags**, **Correspondents**,\n**Document types**, **Storage paths**, **Users**, **Groups**, **Custom fields**,\n**Mail accounts**, **Mail rules**, and **Workflows**. If nothing matches, it\nshows **No results**.\n\nEach result offers buttons that do the most useful thing for that item — for\nexample:\n\n- **Open** a document, a saved view, a workflow, or a custom field.\n- **Download** a document.\n- **Filter documents** by a tag, correspondent, document type, or storage path.\n\nIf you press the search button instead of picking a result, you run a full\nsearch. The **Full search links to** setting (under **Global search** in\n**Settings**) decides what that button does: either **Title and content\nsearch**, which opens your documents list filtered by the words you typed, or\n**Advanced search**, which opens it as a full query you can extend.\n\n## The dashboard\n\nThe **Dashboard** is your home page. A greeting at the top welcomes you by\nname, when a display name has been set. The page is made up of flexible\n**widgets**: the main column holds a card for each saved view you have chosen to\nshow here, and the column on the right holds the **Upload documents** and\n**Statistics** widgets. On a narrow screen the widgets stack into a single\ncolumn.\n\n### Upload documents\n\nThe **Upload documents** widget starts adding documents to Paperless-ngx.\nClick it to choose files, or simply **drag and drop** files onto any page of the\napp. You can also drop files into the watched *consume folder* if your\ninstallation uses one.\n\nWhile documents are being processed, a small status card appears in the corner\nshowing progress, any errors, and a link to **Open document** once a document is\nready. **Dismiss completed** clears the finished messages.\n\n### Saved view widgets\n\nAny **saved view** you choose to show on the dashboard appears as its own card.\nA saved view is a stored set of filters — for example \"Inbox\", \"Unpaid\ninvoices\", or \"Recent contracts\".\n\n- The card's title is the name of the saved view, and it shows how many\n  documents match.\n- **Show all** opens that view in the full documents list.\n- You can **reorder** the cards by dragging them by their handle, and the new\n  order is saved for you.\n- If you have not created any saved views yet, the dashboard shows a hint\n  linking to the documents list, where views are created.\n\n!!! note\n\n    To control whether a view appears on the dashboard or in the sidebar, open\n    **Manage → Saved Views** and tick **Show on dashboard** and/or\n    **Show in sidebar** for that view.\n\n### Statistics\n\nThe **Statistics** widget summarizes your archive. Depending on your\npermissions it can include:\n\n- **Documents in inbox** — documents not yet filed under a view; clicking it\n  opens them.\n- **Total documents** — how many documents you have.\n- **Total characters** — how much searchable text is stored.\n- **Current ASN** — the highest archive serial number in use.\n- A breakdown of **file types**.\n- Counts for **Tags**, **Correspondents**, **Document Types**, and\n  **Storage Paths**, each linking to its list.\n\n### The first-time tour\n\nThe first time you sign in, a welcome message offers a quick guided tour of the\napp, ending with a thank-you. You can start it with **Start the tour**; it walks\nyou through the dashboard, uploading, the documents list, filtering, saved\nviews, attributes, mail, workflows, tasks, and settings. A button is also\navailable in **Settings** if you want to take the tour later.\n\n## The sidebar\n\nThe sidebar on the left is how you move around the app. Its sections appear in\nthis order:\n\n### Dashboard and Documents\n\n- **Dashboard** — return to your home page at any time.\n- **Documents** — open the list of every document you are allowed to see.\n\n### Saved views\n\nEvery saved view you have chosen to show **in the sidebar** is listed here under\nthe heading **Saved views**. Click one to open it. A small badge can show how\nmany documents match each view; you can turn that count on or off with\n**Show document counts in sidebar saved views** in **Settings**.\n\nWhile you are on the **Manage → Saved Views** page, you can **drag** the sidebar\nviews to change their order. The order is saved for you.\n\n### Open documents\n\nWhen you open a document for editing, it stays listed in the sidebar under\n**Open documents**. This is handy for jumping between several documents without\nlosing your place. **Close all** closes them together.\n\n### Manage\n\nThe **Manage** section holds the things you use to organize your archive:\n\n- **Attributes** — the lists of **Tags**, **Correspondents**,\n  **Document types**, **Storage paths**, and **Custom fields**. Each is a\n  management list where you can add, edit, delete, search, and set permissions.\n- **Saved Views** — create, rename, reorder, delete, and choose where each view\n  appears.\n- **Workflows** — automatic rules that respond to events.\n- **Mail** — e-mail accounts and **Mail rules** for importing documents.\n- **Trash** — documents you have deleted, where they can be restored.\n\n### Administration\n\nThe **Administration** section is for the person who runs the installation (some\nitems need special permissions):\n\n- **Settings** — personal and application-wide preferences.\n- **Configuration** — the administrator view of how the system is set up.\n- **Users & Groups** — manage accounts, groups, and permissions.\n- **Tasks** — background work, what needs attention, and what recently\n  completed.\n- **Logs** — system messages, for administrators only.\n- **About** and **Documentation** — version information and a link to the\n  online documentation.\n\n### A slim sidebar\n\nIf you prefer more room for your documents, you can switch the sidebar to a\n**slim** version showing icons only. Turn on **Use \"slim\" sidebar (icons only)**\nin **Settings**. You can also collapse or expand the sidebar with the small\narrow button at its top.\n\n## A map of the app\n\n| Where to go | What you can do there |\n| --- | --- |\n| **Dashboard** | Upload documents, see statistics, open your saved-view widgets. |\n| **Documents** | Browse, search, filter, sort, and bulk-edit documents. |\n| **A single document** | Preview it, edit its details, read and write notes, see its history, download or share it. |\n| **Attributes** | Manage tags, correspondents, document types, storage paths, and custom fields. |\n| **Saved Views** | Manage your saved filters and where they appear. |\n| **Workflows** | Build automatic rules for your documents. |\n| **Mail** | Connect e-mail accounts and write rules that import documents. |\n| **Trash** | Restore or permanently remove deleted documents. |\n| **Settings** | Change how the app looks and behaves for you. |\n| **Users & Groups** | (Administrators) manage people and access. |\n\n## A quick example\n\nAna signs in for the first time and finds the welcome message on the\n**Dashboard**. She clicks **Start the tour**, follows it through the app, and\nfinishes knowing where everything lives.\n\nShe opens the **Search** box, types the name of her bank, and clicks\n**Filter documents** on the result. The documents list shows every document\nfrom that correspondent. She narrows it further to the current year, saves the\nresult as a view called **\"Bank 2026\"**, and ticks **Show on dashboard**.\n\nBack on the **Dashboard**, the new **Bank 2026** card is waiting. She drags it\nto the top, so it is the first thing she sees whenever she signs in.\n\n\n","ar":"---\ntitle: لوحة المعلومات والتنقّل في الواجهة\n---\n\n# لوحة المعلومات والتنقّل في الواجهة\n\nعند تسجيل دخولك إلى Paperless-ngx تهبط على **لوحة المعلومات (Dashboard)**. ومن هناك تتنقّل في التطبيق باستخدام **الشريط الجانبي (sidebar)** على اليسار و**الشريط العلوي (top bar)** في الأعلى. يشرح هذا الدليل وظيفة كل جزء وكيف تصل إلى ما تريد.\n\n## الشريط العلوي\n\nالشريط الممتد أعلى كل صفحة يبقى معك أينما ذهبت. ويضم من اليسار إلى اليمين:\n\n- **الشعار واسم التطبيق** — النقر عليهما يعيدك دائمًا إلى **لوحة المعلومات (Dashboard)**.\n- **البحث (Search)** — مربّع البحث الشامل، المشروح أدناه.\n- **زر المساعد الذكي (AI assistant)** — يظهر فقط إذا فعّل المدير ميزات الذكاء الاصطناعي. يفتح محادثة يمكنك سؤاله فيها عن مستنداتك. راجع [ميزات الذكاء الاصطناعي (AI Features)](../advanced/ai.ar.md).\n- **الإشعارات (Notifications)** — زر على شكل جرس يعرض الأحداث والرسائل التي تجري في الخلفية، مثل المستندات التي انتهت معالجتها أو الأخطاء التي تحتاج انتباهك.\n- **قائمة حسابك** — يفتح اسمك (أو صورتك) قائمة تضم:\n    - **ملفي الشخصي (My Profile)** — تغيير اسم العرض والبريد الإلكتروني وكلمة المرور والمصادقة الثنائية.\n    - **الإعدادات (Settings)** — فتح إعدادات التطبيق.\n    - **تسجيل الخروج (Logout)** — إنهاء الجلسة.\n    - **التوثيق (Documentation)** — فتح التوثيق الإلكتروني في علامة تبويب جديدة.\n\n### البحث\n\nيجد مربّع **البحث (Search)** الأشياء أثناء كتابتك. وتُجمَّع النتائج حسب النوع بهذا الترتيب: **المستندات (Documents)** و**العروض المحفوظة (Saved Views)** و**الوسوم (Tags)** و**المراسلون (Correspondents)** و**أنواع المستندات (Document types)** و**مسارات التخزين (Storage paths)** و**المستخدمون (Users)** و**المجموعات (Groups)** و**الحقول المخصصة (Custom fields)** و**حسابات البريد (Mail accounts)** و**قواعد البريد (Mail rules)** و**سير العمل (Workflows)**. وإذا لم يطابق شيء، تعرض **لا نتائج (No results)**.\n\nويقدّم كل نتيجة أزرارًا تفعل أنفع شيء لذلك العنصر، مثلًا:\n\n- **فتح (Open)** مستند أو عرض محفوظ أو سير عمل أو حقل مخصص.\n- **تنزيل (Download)** مستند.\n- **ترشيح المستندات (Filter documents)** حسب وسم أو مراسل أو نوع مستند أو مسار تخزين.\n\nوإذا ضغطت زر البحث بدل اختيار نتيجة، فإنك تجري بحثًا كاملًا. ويحدّد إعداد **روابط البحث الكامل تشير إلى (Full search links to)** — تحت **البحث الشامل (Global search)** في **الإعدادات (Settings)** — ما يفعله ذلك الزر: إما **بحث العنوان والمحتوى (Title and content search)** الذي يفتح قائمة مستنداتك مرشَّحة بالكلمات التي كتبتها، وإما **البحث المتقدّم (Advanced search)** الذي يفتحها كاستعلام كامل يمكنك توسيعه.\n\n## لوحة المعلومات\n\n**لوحة المعلومات (Dashboard)** هي صفحتك الرئيسية. ترحيب في الأعلى يناديك باسمك عند ضبط اسم عرض. وتتكوّن الصفحة من **أدوات (widgets)** مرنة: العمود الرئيسي يحمل بطاقة لكل عرض محفوظ اخترت إظهاره هنا، والعمود الأيمن يحمل أداتَي **رفع المستندات (Upload documents)** و**الإحصاءات (Statistics)**. وعلى الشاشة الضيقة تتراصّ الأدوات في عمود واحد.\n\n### رفع المستندات\n\nتبدأ أداة **رفع المستندات (Upload documents)** إضافة المستندات إلى Paperless-ngx. اضغط عليها لاختيار الملفات، أو ببساطة **اسحب الملفات وأفلتها** في أي صفحة من التطبيق. ويمكنك أيضًا إفلات الملفات في مجلد *الاستهلاك* المراقَب إذا كانت تركيبتك تستخدمه.\n\nوأثناء معالجة المستندات تظهر بطاقة حالة صغيرة في الزاوية تعرض التقدّم وأي أخطاء، ورابط **فتح المستند (Open document)** بمجرد جهوزية مستند. ويمسح **إغلاق الرسائل المكتملة (Dismiss completed)** الرسائل المنتهية.\n\n### أدوات العروض المحفوظة\n\nيظهر كل **عرض محفوظ (saved view)** تختار إظهاره على لوحة المعلومات كبطاقة خاصة به. والعرض المحفوظ مجموعة مرشّحات مخزَّنة — مثلًا \"الوارد\" أو \"الفواتير غير المدفوعة\" أو \"العقود الأخيرة\".\n\n- عنوان البطاقة هو اسم العرض المحفوظ، وتعرض شارة عدد المستندات المطابقة.\n- **عرض الكل (Show all)** يفتح ذلك العرض في قائمة المستندات الكاملة.\n- يمكنك **إعادة ترتيب** البطاقات بسحبها من مقبضها، ويُحفَظ الترتيب الجديد لك.\n- إذا لم تكن قد أنشأت أي عرض محفوظ بعد، تعرض لوحة المعلومات تلميحًا يربط بقائمة المستندات، حيث تُنشأ العروض.\n\n!!! note\n\n    للتحكّم في ظهور عرض ما على لوحة المعلومات أو في الشريط الجانبي، افتح **الإدارة (Manage) ← العروض المحفوظة (Saved Views)** وضع علامة على **إظهار على لوحة المعلومات (Show on dashboard)** و/أو **إظهار في الشريط الجانبي (Show in sidebar)** لذلك العرض.\n\n### الإحصاءات\n\nتلخّص أداة **الإحصاءات (Statistics)** أرشيفك. وحسب صلاحياتك يمكن أن تضم:\n\n- **المستندات في الوارد (Documents in inbox)** — المستندات غير المُدرجة بعد تحت عرض معيّن؛ والنقر عليها يفتحها.\n- **إجمالي المستندات (Total documents)** — عدد المستندات لديك.\n- **إجمالي الأحرف (Total characters)** — مقدار النص القابل للبحث المخزَّن.\n- **الرقم التسلسلي الحالي (Current ASN)** — أعلى رقم تسلسلي للأرشيف قيد الاستخدام.\n- تفصيل حسب **أنواع الملفات**.\n- أعداد **الوسوم (Tags)** و**المراسلين (Correspondents)** و**أنواع المستندات (Document Types)** و**مسارات التخزين (Storage Paths)**، وكل منها يربط بقائمته.\n\n### الجولة عند أول استخدام\n\nعند تسجيل دخولك للمرة الأولى، تعرض رسالة ترحيب جولة إرشادية سريعة في التطبيق تنتهي بكلمة شكر. ويمكنك بدؤها بـ **ابدأ الجولة (Start the tour)**؛ وهي تأخذك عبر لوحة المعلومات والرفع وقائمة المستندات والترشيح والعروض المحفوظة والسمات والبريد وسير العمل والمهام والإعدادات. ويتوفّر أيضًا زر في **الإعدادات (Settings)** إذا أردت أخذ الجولة لاحقًا.\n\n## الشريط الجانبي\n\nالشريط الجانبي على اليسار هو وسيلتك للتنقّل في التطبيق. وتظهر أقسامه بهذا الترتيب:\n\n### لوحة المعلومات والمستندات\n\n- **لوحة المعلومات (Dashboard)** — العودة إلى صفحتك الرئيسية في أي وقت.\n- **المستندات (Documents)** — فتح قائمة كل مستند يُسمح لك برؤيته.\n\n### العروض المحفوظة\n\nيُدرَج هنا تحت عنوان **العروض المحفوظة (Saved views)** كل عرض محفوظ اخترت إظهاره **في الشريط الجانبي**. اضغط على أحدها لفتحه. ويمكن لشارة صغيرة أن تعرض عدد المستندات المطابقة لكل عرض؛ ويمكنك تشغيل هذا العدّ أو إيقافه بـ **إظهار أعداد المستندات في عروض الشريط الجانبي (Show document counts in sidebar saved views)** في **الإعدادات (Settings)**.\n\nوبينما أنت في صفحة **الإدارة (Manage) ← العروض المحفوظة (Saved Views)** يمكنك **سحب** عروض الشريط الجانبي لتغيير ترتيبها. ويُحفَظ الترتيب لك.\n\n### المستندات المفتوحة\n\nعند فتح مستند لتعديله، يبقى مُدرَجًا في الشريط الجانبي تحت **المستندات المفتوحة (Open documents)**. وهذا مفيد للتنقّل بين عدة مستندات دون أن تفقد مكانك. ويغلق **إغلاق الكل (Close all)** كل هذه المستندات معًا.\n\n### الإدارة\n\nيضم قسم **الإدارة (Manage)** ما تستخدمه لتنظيم أرشيفك:\n\n- **السمات (Attributes)** — قوائم **الوسوم (Tags)** و**المراسلين (Correspondents)** و**أنواع المستندات (Document types)** و**مسارات التخزين (Storage paths)** و**الحقول المخصصة (Custom fields)**. وكل منها قائمة إدارية يمكنك فيها الإضافة والتعديل والحذف والبحث وضبط الصلاحيات.\n- **العروض المحفوظة (Saved Views)** — إنشاء العروض وإعادة تسميتها وإعادة ترتيبها وحذفها واختيار مكان ظهور كل عرض.\n- **سير العمل (Workflows)** — قواعد تلقائية تتفاعل مع الأحداث.\n- **البريد (Mail)** — حسابات البريد الإلكتروني و**قواعد البريد (Mail rules)** لاستيراد المستندات.\n- **سلة المحذوفات (Trash)** — المستندات التي حذفتها، حيث يمكن استعادتها.\n\n### الإدارة العامة\n\nقسم **الإدارة العامة (Administration)** مخصّص لمن يدير التركيب (وبعض العناصر تحتاج صلاحيات خاصة):\n\n- **الإعدادات (Settings)** — تفضيلاتك الشخصية والتفضيلات العامة للتطبيق.\n- **التهيئة (Configuration)** — عرض المدير لكيفية إعداد النظام.\n- **المستخدمون والمجموعات (Users & Groups)** — إدارة الحسابات والمجموعات والصلاحيات.\n- **المهام (Tasks)** — الأعمال التي تجري في الخلفية وما يحتاج انتباهًا وما اكتمل حديثًا.\n- **السجلات (Logs)** — رسائل النظام، للمديرين فقط.\n- **حول (About)** و**التوثيق (Documentation)** — معلومات الإصدار ورابط إلى التوثيق الإلكتروني.\n\n### شريط جانبي رفيع\n\nإذا كنت تفضّل مساحة أكبر لمستنداتك، يمكنك تحويل الشريط الجانبي إلى نسخة **رفيعة (slim)** تعرض الأيقونات فقط. شغّل **استخدام الشريط الجانبي \"الرفيع\" (أيقونات فقط)** في **الإعدادات (Settings)**. ويمكنك أيضًا طيّ الشريط الجانبي أو فتحه بزر السهم الصغير في أعلاه.\n\n## خريطة التطبيق\n\n| إلى أين تذهب | ما يمكنك فعله هناك |\n| --- | --- |\n| **لوحة المعلومات (Dashboard)** | رفع المستندات، ورؤية الإحصاءات، وفتح أدوات عروضك المحفوظة. |\n| **المستندات (Documents)** | تصفّح المستندات والبحث فيها وترشيحها وترتيبها وتحريرها جماعيًا. |\n| **مستند واحد** | معاينته وتعديل تفاصيله وقراءة ملاحظاته وكتابتها والاطّلاع على سجلّه وتنزيله أو مشاركته. |\n| **السمات (Attributes)** | إدارة الوسوم والمراسلين وأنواع المستندات ومسارات التخزين والحقول المخصصة. |\n| **العروض المحفوظة (Saved Views)** | إدارة مرشّحاتك المحفوظة وأماكن ظهورها. |\n| **سير العمل (Workflows)** | بناء قواعد تلقائية لمستنداتك. |\n| **البريد (Mail)** | وصل حسابات البريد وكتابة قواعد تستورد المستندات. |\n| **سلة المحذوفات (Trash)** | استعادة المستندات المحذوفة أو إزالتها نهائيًا. |\n| **الإعدادات (Settings)** | تغيير شكل التطبيق وسلوكه بالنسبة لك. |\n| **المستخدمون والمجموعات (Users & Groups)** | (للمديرين) إدارة الأشخاص والوصول. |\n\n## مثال سريع\n\nتسجّل آنا الدخول لأول مرة فتجد رسالة الترحيب على **لوحة المعلومات (Dashboard)**. تضغط **ابدأ الجولة (Start the tour)** وتتابعها في التطبيق، وتنتهي وهي تعرف مكان كل شيء.\n\nتفتح مربّع **البحث (Search)**، وتكتب اسم مصرفها، وتضغط **ترشيح المستندات (Filter documents)** في النتيجة. فتعرض قائمة المستندات كل مستند وارد من ذلك المراسل. تضيّقها أكثر إلى السنة الحالية، وتحفظ النتيجة كعرض باسم **\"المصرف 2026\"**، وتضع علامة على **إظهار على لوحة المعلومات (Show on dashboard)**.\n\nوبالعودة إلى **لوحة المعلومات**، تكون بطاقة **\"المصرف 2026\"** الجديدة في انتظارها. فتسحبها إلى الأعلى لتكون أول ما تراه كلما سجّلت الدخول.\n\n\n"},{"id":"authentication","title":{"en":"Authentication, users, groups & permissions","ar":"المصادقة والمستخدمون والمجموعات والصلاحيات"},"fileEn":"getting-started/authentication.md","fileAr":"getting-started/authentication.ar.md","en":"---\ntitle: Understanding Authentication, Users, Groups & Permissions\n---\n\n# Authentication, Users, Groups & Permissions\n\nThis guide explains the whole authentication system: how people sign in to\nPaperless-ngx, how accounts are created, and what users are allowed to see and\ndo once they are signed in. It is written for everyday users and for the person\nwho manages the system.\n\n# Part 1 — Signing in\n\n## Ways to sign in\n\nPaperless-ngx supports several ways to sign in, depending on how the system has\nbeen set up.\n\n### Username and password\n\nThe simplest way to sign in is with a username and password. This is available\nby default, unless an administrator has turned it off in favor of single\nsign-on.\n\n### Single sign-on (SSO) and social accounts\n\nThe system can be connected to an external sign-in provider, such as Google,\nGitHub, or an organization's OpenID Connect provider. Users then sign in with\nthat existing account instead of a local password.\n\n### Two-factor authentication (2FA)\n\nFor extra security, a user can enable two-factor authentication. After entering\ntheir password, they are asked for a second, time-based code (usually from an\nauthenticator app on their phone).\n\n!!! note\n\n    Only the user themself — or a superuser — can disable two-factor\n    authentication.\n\n### Other sign-in options (administrators only)\n\nThere are a few additional, less common sign-in methods that an administrator\ncan enable:\n\n- **Automatic sign-in** — a specific account is signed in automatically. This is\n  only suitable for trusted, private installations.\n- **Remote-user sign-in** — sign-in is handled by an external system (such as a\n  reverse proxy) that passes the user's identity to Paperless-ngx.\n\n!!! warning\n\n    These advanced methods can bypass the normal sign-in process, so they\n    should only be used on private, trusted installations.\n\n## Creating accounts\n\nDepending on the system settings, new accounts can be created in two ways:\n\n- **Self sign-up** — an administrator can allow people to create their own\n  account. This can be enabled for regular accounts and/or for SSO/social\n  accounts.\n- **Created by an administrator** — an administrator creates an account\n  manually for each person.\n\nWhen a new account is created, it can automatically be added to one or more\n**default groups**, so new users start with the right permissions immediately.\n\n!!! note\n\n    If email is configured, new accounts may be asked to verify their email\n    address. If no email server is configured, this step is skipped.\n\n## Staying signed in\n\n- **Remember me** — by default a session is remembered, so users stay signed in\n  even after closing the browser. The system can instead be set to end the\n  session when the browser closes.\n- **Session length** — an administrator can set how long a sign-in session\n  lasts before the user must sign in again.\n- **Logging out** — users can always sign out manually. An administrator can\n  also choose a page to redirect to after signing out (for example, back to the\n  SSO provider's sign-out page).\n\n# Part 2 — Users, groups & permissions\n\nOnce someone is signed in, permissions decide what they can see and do.\n\n## The basics\n\n- **Users** are the accounts people use to sign in.\n- **Groups** are collections of users. Instead of setting up each person\n  individually, you give a whole group the same permissions once.\n- **Permissions** decide what each user (or group) is allowed to see and do.\n\n## Types of users\n\n| Type | What it can do |\n| --- | --- |\n| **Regular user** | Can only do what their permissions allow. |\n| **Admin** | Same as a regular user, plus access to system status, logs, and the administrative backend. |\n| **Superuser** | Has **full access** to everything. A superuser is granted all permissions and can view all objects, regardless of any other settings. |\n\n## User accounts\n\nWhen you create or edit a user, you will see these options:\n\n- **Username** — the name used to sign in.\n- **Email** and **Password**.\n- **First name** and **Last name** — used for display.\n- **Active** — an inactive account cannot sign in.\n- **Admin** — access to system status, logs, and the administrative backend.\n- **Superuser** — grants all permissions and the ability to view all objects.\n- **Groups** — the groups this user belongs to.\n- **Two-factor authentication** — an optional extra security step at sign-in.\n- **Permissions** — the individual permissions granted to this user.\n\n!!! note\n\n    Only a superuser can grant or remove **Admin** or **Superuser** status, and\n    only a superuser can edit or delete another superuser.\n\n## Groups\n\nA group is simply a named set of permissions. When a user joins a group, they\nautomatically receive all of that group's permissions.\n\nGroups are the easiest way to manage many people at once: create groups such as\n\"Accounting\" or \"Reviewers\", assign each group the permissions it needs, and\nthen add people to the right groups.\n\nA user's **effective** permissions are the combination of:\n\n- the permissions granted to them **directly**, and\n- the permissions they **inherit** from their groups.\n\n## Permissions\n\nPermissions work at two levels.\n\n### General permissions — what you can do everywhere\n\nThese permissions control general abilities across the whole application, for\nexample:\n\n- view, add, edit, or delete **documents**;\n- view, add, edit, or delete **tags**, **correspondents**, **document types**,\n  **storage paths**, and other objects;\n- manage **users** and **groups**;\n- manage **workflows**, **mail rules**, **saved views**, **custom fields**, and\n  more.\n\nThere are also two special permissions:\n\n- **View global statistics** — see overall object counts.\n- **View system status** — see system status information.\n\n### Object-level permissions — access to a specific item\n\nMost things in Paperless-ngx (a document, a tag, a correspondent, and so on)\ncan have their own individual access settings. This lets you decide *who* can\naccess *that particular item*.\n\nEach item can have:\n\n- an **owner** — the user the item belongs to, and\n- a list of **users and groups** who are allowed to **view** it and/or\n  **change** it.\n\nThere are only two object-level permissions:\n\n- **View** — the person can see the item.\n- **Change** — the person can edit the item.\n\n!!! note\n\n    Granting **Change** automatically also grants **View** — someone who can\n    edit an item can always see it.\n\n## How access is decided\n\nFor any given item, you can access it if **any** of the following is true:\n\n1. You are its **owner**.\n2. It has **no owner** (it is shared/public), in which case everyone can access\n   it.\n3. You have been **explicitly granted** View or Change permission on it, either\n   directly or through one of your groups.\n\nAdditional rules to remember:\n\n- **Superusers** can always see and change everything, regardless of owners or\n  permissions.\n- **Items with no owner** are visible to everyone.\n- Only the item's **owner or a superuser** can change who has access to it (for\n  example, change its owner, or its View/Change permissions).\n\n## Where to manage this in the app\n\n- **Users & Groups** — open **Settings → Users & Groups** to create and edit\n  users and groups, and to assign their general permissions.\n- **A single item** — when you edit a document (or a tag, correspondent,\n  document type, storage path, etc.), look for the **Permissions** section to\n  set its owner and its View/Change permissions.\n- **Many items at once** — the **bulk edit** feature can apply the same owner\n  and permissions to many documents or objects in one step.\n\n## A quick example\n\nSuppose three people use your Paperless-ngx: Alice, Bob, and Carol.\n\n1. You create a group called **\"Team\"** and give it permission to **view** and\n   **add** documents.\n2. You add Alice and Bob to the **\"Team\"** group.\n3. You make Carol a **superuser** so she can manage everything.\n\nLater, you upload a sensitive document and set its **owner** to Alice. You also\ngrant the **\"Team\"** group **View** permission on it.\n\nNow:\n\n- **Alice** can view and edit the document (she owns it).\n- **Bob** can view the document (through the group permission).\n- **Carol** can view and edit it (she is a superuser).\n- Anyone else **cannot** see the document at all.\n\n\n","ar":"---\ntitle: فهم المصادقة والمستخدمين والمجموعات والصلاحيات\n---\n\n# المصادقة والمستخدمون والمجموعات والصلاحيات\n\nيشرح هذا الدليل نظام المصادقة كاملًا: كيف يسجّل الأشخاص الدخول إلى Paperless-ngx، وكيف تُنشأ الحسابات، وما يُسمح للمستخدمين برؤيته أو فعله بعد تسجيل الدخول. وهو موجّه للمستخدمين العاديين ولمن يدير النظام.\n\n# الجزء الأول — تسجيل الدخول\n\n## طرق تسجيل الدخول\n\nيدعم Paperless-ngx عدة طرق لتسجيل الدخول، حسب إعداد النظام.\n\n### اسم المستخدم وكلمة المرور\n\nأبسط طريقة لتسجيل الدخول هي استخدام اسم مستخدم وكلمة مرور. وهي متاحة افتراضيًا، ما لم يعطّلها مدير النظام لصالح الدخول الموحّد (SSO).\n\n### الدخول الموحّد (SSO) والحسابات الاجتماعية\n\nيمكن ربط النظام بمزوّد دخول خارجي، مثل Google أو GitHub أو مزوّد OpenID Connect الخاص بمؤسستك. عندها يسجّل المستخدمون الدخول باستخدام ذلك الحساب الموجود بدلًا من كلمة مرور محلية.\n\n### المصادقة الثنائية (2FA)\n\nلمزيد من الأمان، يمكن للمستخدم تفعيل المصادقة الثنائية. بعد إدخال كلمة المرور، يُطلب منه رمز ثانٍ يعتمد على الوقت (عادة من تطبيق مصادقة على هاتفه).\n\n!!! note\n\n    لا يمكن تعطيل المصادقة الثنائية إلا بواسطة المستخدم نفسه — أو بواسطة مشرف عام (superuser).\n\n### خيارات دخول أخرى (للمديرين فقط)\n\nتوجد بعض طرق الدخول الإضافية الأقل شيوعًا التي يمكن للمدير تفعيلها:\n\n- **الدخول التلقائي** — يُسجَّل حساب معيّن دخوله تلقائيًا. وهذا مناسب فقط للتركيبات الخاصة الموثوقة.\n- **الدخول عبر المستخدم البعيد (Remote-user)** — يتولّى نظام خارجي (مثل وكيل عكسي reverse proxy) عملية تسجيل الدخول ويمرر هوية المستخدم إلى Paperless-ngx.\n\n!!! warning\n\n    يمكن لهذه الطرق المتقدمة تجاوز عملية تسجيل الدخول العادية، لذا يجب استخدامها فقط في التركيبات الخاصة الموثوقة.\n\n## إنشاء الحسابات\n\nحسب إعدادات النظام، يمكن إنشاء الحسابات الجديدة بطريقتين:\n\n- **التسجيل الذاتي** — يمكن للمدير السماح للأشخاص بإنشاء حساباتهم بأنفسهم. ويمكن تفعيل ذلك للحسابات العادية و/أو لحسابات SSO/الحسابات الاجتماعية.\n- **إنشاء يدوي بواسطة المدير** — ينشئ المدير حسابًا لكل شخص يدويًا.\n\nعند إنشاء حساب جديد، يمكن إضافته تلقائيًا إلى **مجموعة أو مجموعات افتراضية**، فيبدأ المستخدمون الجدد بالصلاحيات الصحيحة فورًا.\n\n!!! note\n\n    إذا كان البريد الإلكتروني مُعدًّا، قد يُطلب من الحسابات الجديدة التحقق من عنوان بريدها الإلكتروني. وإذا لم يكن هناك خادم بريد مُعد، تُتخطى هذه الخطوة.\n\n## البقاء مسجَّل الدخول\n\n- **تذكّرني** — افتراضيًا تُتذكَّر الجلسة، فيبقى المستخدمون مسجَّلي الدخول حتى بعد إغلاق المتصفح. ويمكن ضبط النظام بدلًا من ذلك لإنهاء الجلسة عند إغلاق المتصفح.\n- **مدة الجلسة** — يمكن للمدير تحديد مدة استمرار جلسة تسجيل الدخول قبل أن يضطر المستخدم لتسجيل الدخول مرة أخرى.\n- **تسجيل الخروج** — يمكن للمستخدمين دائمًا تسجيل الخروج يدويًا. كما يمكن للمدير اختيار صفحة يُعاد التوجيه إليها بعد تسجيل الخروج (مثلًا، العودة إلى صفحة تسجيل الخروج الخاصة بمزوّد SSO).\n\n# الجزء الثاني — المستخدمون والمجموعات والصلاحيات\n\nبعد أن يسجّل شخص ما دخوله، تحدد الصلاحيات ما يمكنه رؤيته أو فعله.\n\n## الأساسيات\n\n- **المستخدمون** هم الحسابات التي يسجّل بها الأشخاص الدخول.\n- **المجموعات** هي تجميعات للمستخدمين. بدلًا من إعداد كل شخص على حدة، تمنح مجموعة كاملة نفس الصلاحيات مرة واحدة.\n- **الصلاحيات** تحدد ما يُسمح لكل مستخدم (أو مجموعة) برؤيته أو فعله.\n\n## أنواع المستخدمين\n\n| النوع | ما يمكنه فعله |\n| --- | --- |\n| **مستخدم عادي** | لا يمكنه سوى ما تسمح به صلاحياته. |\n| **مدير (Admin)** | كمستخدم عادي، بالإضافة إلى الوصول إلى حالة النظام والسجلات والواجهة الإدارية. |\n| **مشرف عام (Superuser)** | يتمتع بوصول **كامل** إلى كل شيء. يملك المشرف العام جميع الصلاحيات ويمكنه رؤية كل الكائنات بغض النظر عن أي إعدادات أخرى. |\n\n## حسابات المستخدمين\n\nعند إنشاء مستخدم أو تعديله، سترى الخيارات التالية:\n\n- **اسم المستخدم (Username)** — الاسم المستخدم لتسجيل الدخول.\n- **البريد الإلكتروني (Email)** و **كلمة المرور (Password)**.\n- **الاسم الأول (First name)** و **اسم العائلة (Last name)** — يُستخدمان للعرض.\n- **نشط (Active)** — الحساب غير النشط لا يمكنه تسجيل الدخول.\n- **مدير (Admin)** — الوصول إلى حالة النظام والسجلات والواجهة الإدارية.\n- **مشرف عام (Superuser)** — يمنح جميع الصلاحيات والقدرة على رؤية كل الكائنات.\n- **المجموعات (Groups)** — المجموعات التي ينتمي إليها هذا المستخدم.\n- **المصادقة الثنائية (Two-factor authentication)** — خطوة أمان إضافية اختيارية عند تسجيل الدخول.\n- **الصلاحيات (Permissions)** — الصلاحيات الفردية الممنوحة لهذا المستخدم.\n\n!!! note\n\n    لا يمكن سوى مشرف عام منح أو سحب حالة **المدير (Admin)** أو **المشرف العام (Superuser)**، ولا يمكن تعديل أو حذف مشرف عام آخر إلا بواسطة مشرف عام.\n\n## المجموعات\n\nالمجموعة هي ببساطة مجموعة صلاحيات تحمل اسمًا. عندما ينضم مستخدم إلى مجموعة، يحصل تلقائيًا على جميع صلاحيات تلك المجموعة.\n\nتُعد المجموعات أسهل طريقة لإدارة عدد كبير من الأشخاص دفعة واحدة: أنشئ مجموعات مثل \"المحاسبة\" أو \"المراجعون\"، وامنح كل مجموعة الصلاحيات التي تحتاجها، ثم أضف الأشخاص إلى المجموعات المناسبة.\n\nالصلاحيات **الفعلية** للمستخدم هي مجموع:\n\n- الصلاحيات الممنوحة له **مباشرة**، و\n- الصلاحيات التي **يرثها** من مجموعاته.\n\n## الصلاحيات\n\nتعمل الصلاحيات على مستويين.\n\n### الصلاحيات العامة — ما يمكنك فعله في كل مكان\n\nتتحكم هذه الصلاحيات في قدرات عامة عبر التطبيق كله، مثل:\n\n- عرض أو إضافة أو تعديل أو حذف **المستندات**؛\n- عرض أو إضافة أو تعديل أو حذف **الوسوم** و **المراسلين** و **أنواع المستندات** و **مسارات التخزين** وكائنات أخرى؛\n- إدارة **المستخدمين** و **المجموعات**؛\n- إدارة **سير العمل** و **قواعد البريد** و **العروض المحفوظة** و **الحقول المخصصة** وغيرها.\n\nكما توجد صلاحيتان خاصتان:\n\n- **عرض الإحصاءات العامة** — رؤية أعداد الكائنات الإجمالية.\n- **عرض حالة النظام** — رؤية معلومات حالة النظام.\n\n### صلاحيات مستوى العنصر — الوصول إلى عنصر محدد\n\nيمكن لمعظم الأشياء في Paperless-ngx (مستند أو وسم أو مراسل وما إلى ذلك) أن تملك إعدادات وصول خاصة بها. هذا يتيح لك تحديد *من* يمكنه الوصول إلى *ذلك العنصر تحديدًا*.\n\nيمكن لكل عنصر أن يملك:\n\n- **مالكًا (owner)** — المستخدم الذي ينتمي إليه العنصر، و\n- قائمة من **المستخدمين والمجموعات** المسموح لهم بـ **عرضه** و/أو **تعديله**.\n\nتوجد صلاحيتان فقط على مستوى العنصر:\n\n- **عرض (View)** — يستطيع الشخص رؤية العنصر.\n- **تعديل (Change)** — يستطيع الشخص تعديل العنصر.\n\n!!! note\n\n    منح صلاحية **التعديل (Change)** يمنح تلقائيًا صلاحية **العرض (View)** — أي أن من يستطيع تعديل عنصر يمكنه رؤيته دائمًا.\n\n## كيف يُحدَّد الوصول\n\nبالنسبة لأي عنصر، يمكنك الوصول إليه إذا تحقق **أيٌّ** مما يلي:\n\n1. أنت **مالكه**.\n2. **لا يملك مالكًا** (عنصر مشترك/عام)، وعندها يمكن للجميع الوصول إليه.\n3. تم **منحك صراحةً** صلاحية العرض أو التعديل عليه، مباشرة أو عبر إحدى مجموعاتك.\n\nقواعد إضافية يجب تذكرها:\n\n- يستطيع **المشرف العام (Superuser)** دائمًا رؤية وتعديل كل شيء، بغض النظر عن المالكين أو الصلاحيات.\n- **العناصر التي ليس لها مالك** مرئية للجميع.\n- لا يمكن تغيير من يحق له الوصول إلى عنصر (مثل تغيير مالكه أو صلاحيات العرض/التعديل الخاصة به) إلا بواسطة **مالك العنصر أو مشرف عام**.\n\n## أين تُدار هذه الأمور في التطبيق\n\n- **المستخدمون والمجموعات** — افتح **الإعدادات ← المستخدمون والمجموعات** لإنشاء وتعديل المستخدمين والمجموعات، ولمنح صلاحياتهم العامة.\n- **عنصر واحد** — عند تعديل مستند (أو وسم أو مراسل أو نوع مستند أو مسار تخزين... إلخ)، ابحث عن قسم **الصلاحيات (Permissions)** لتعيين مالكه وصلاحيات العرض/التعديل الخاصة به.\n- **عناصر كثيرة دفعة واحدة** — تتيح ميزة **التحرير الجماعي** تطبيق المالك نفسه والصلاحيات نفسها على العديد من المستندات أو الكائنات في خطوة واحدة.\n\n## مثال سريع\n\nلنفترض أن ثلاثة أشخاص يستخدمون Paperless-ngx لديك: أليس وبوب وكارول.\n\n1. تنشئ مجموعة باسم **\"الفريق\"** وتمنحها صلاحية **عرض** و **إضافة** المستندات.\n2. تضيف أليس وبوب إلى مجموعة **\"الفريق\"**.\n3. تجعل كارول **مشرفًا عامًا** لتتمكن من إدارة كل شيء.\n\nلاحقًا، ترفع مستندًا حساسًا وتعيِّن **مالكه** إلى أليس، وتمنح مجموعة **\"الفريق\"** صلاحية **عرض** عليه.\n\nالآن:\n\n- تستطيع **أليس** عرض المستند وتعديله (لأنها مالكتُه).\n- يستطيع **بوب** عرض المستند (عبر صلاحية المجموعة).\n- تستطيع **كارول** عرضه وتعديله (لأنها مشرف عام).\n- لا يستطيع أي شخص آخر رؤية المستند إطلاقًا.\n\n\n"}]},{"id":"documents","title":{"en":"Documents","ar":"المستندات"},"items":[{"id":"adding","title":{"en":"Adding documents","ar":"إضافة المستندات"},"fileEn":"documents/adding.md","fileAr":"documents/adding.ar.md","en":"---\ntitle: Adding Documents\n---\n\n# Adding Documents\n\nEverything in Paperless-ngx starts with a file. This guide shows the different\nways to get files into your archive, what happens to them afterwards, and how to\ndeal with the things that can go wrong.\n\n## Ways to add a document\n\n| Way | Best for | Where to find it |\n| --- | --- | --- |\n| **Upload documents** | Adding one or a few files by hand | The widget on the **Dashboard** |\n| **Drag and drop** | Quickly adding files you already have open on your computer | Any page of the app |\n| Watched folder | Scanners and software that save files into a shared folder | Set up by your administrator |\n| **Mail** | Bills and statements that arrive by e-mail | The **Mail** section of the sidebar |\n\n### Upload from the dashboard\n\nOn
