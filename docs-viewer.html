tomize the behavior of Paperless-ngx when events\n'trigger' a workflow.*\n\n!!! note\n\n    Workflows are shared: everyone who can open the page sees the same list.\n    Workflows can also set owners and permissions, so treat them as an\n    administrative feature — see\n    [Who can change workflows](#who-can-change-workflows) below.\n\n## The Workflows page\n\nThe list has one row per workflow:\n\n| Column | Meaning |\n| --- | --- |\n| **Name** | Click the name to edit the workflow. |\n| **Sort order** | The number that decides the order workflows run in — lower first. |\n| **Status** | A switch reading **Enabled** or **Disabled**. Flick it to turn the workflow on or off without deleting it. |\n| **Triggers** | A short summary of the trigger types, such as \"Consumption Started\" or \"Document Added, Scheduled\". |\n| **Actions** | **Edit**, **Delete**, and **Copy**. |\n\n**Add Workflow** opens an empty workflow; **Copy** makes a duplicate called\n\"*name* (copy)\" and opens it for editing, which is the quickest way to build a\nsimilar rule. If the list is empty it says **No workflows defined.**\n\nDeleting asks for confirmation first: **Confirm delete workflow**, followed by\n**This operation will permanently delete this workflow.** and **This operation\ncannot be undone.**, and the confirm button is **Proceed**.\n\n## Triggers\n\nA trigger answers two questions: which event are we reacting to, and which\ndocuments does it apply to. Open the **Triggers** section in the workflow dialog\nand click **Add Trigger** (**Trigger Workflow On:**). Every trigger starts with\na **Trigger type**:\n\n| Trigger type | Runs… |\n| --- | --- |\n| **Consumption Started** | *before* a document is stored, while it is still being read. File name, source, path and mail rule are known; the extracted text and the automatic tags are not yet available. |\n| **Document Added** | *after* a new document has been stored, with its text extracted and its tags, correspondent and document type worked out. |\n| **Document Updated** | whenever somebody changes an existing document. |\n| **Scheduled** | on a fixed day relative to a date on the document — useful for reminders and deadlines. |\n\nA workflow can hold several triggers; it runs when **any** of them matches.\n\n### What you can filter on\n\nUnder the trigger type you can narrow down which documents qualify:\n\n- **Filter filename** — applies to documents whose file name matches, with\n  wildcards allowed, for example `*.pdf` or `*invoice*`. It is not\n  case-sensitive.\n- With **Consumption Started** you also get:\n  - **Filter sources** — **Consume Folder**, **API Upload**, **Mail Fetch**, or\n    **Web UI**.\n  - **Filter path** — the folder the file arrived from, with `*` wildcards\n    allowed.\n  - **Filter mail rule** — only documents that came in through a particular\n    mail rule.\n- With **Document Added**, **Document Updated**, and **Scheduled** you also get\n  **Content matching algorithm** and, when the choice needs one, **Content\n  matching pattern** and **Case insensitive** — the same idea as tag matching,\n  but applied to the text of the document. The choices are **Any word**,\n  **All words**, **Exact match**, **Regular expression**, **Fuzzy word**, and\n  **None**.\n\nThe line above the filters, **Trigger for documents that match *all* filters\nspecified below.**, is the rule: a document must satisfy every filter on the\ntrigger.\n\n### Advanced Filters\n\nBelow the basic filters, **Add filter** builds extra conditions on the document's\nown attributes. Each filter is a pair: pick what to test on the left, then the\nvalue on the right. The available tests are:\n\n| Test | Matches |\n| --- | --- |\n| **Has any of these tags** | Documents carrying at least one of the tags you pick |\n| **Has all of these tags** | Documents carrying every one of the tags you pick |\n| **Does not have these tags** | Documents carrying none of the tags you pick |\n| **Has correspondent** | Documents from one particular correspondent |\n| **Has any of these correspondents** | Documents from any of several correspondents |\n| **Does not have correspondents** | Documents from none of the correspondents you pick |\n| **Has document type** | Documents of one particular type |\n| **Has any of these document types** | Documents of any of several types |\n| **Does not have document types** | Documents of none of the types you pick |\n| **Has storage path** | Documents filed under one particular storage path |\n| **Has any of these storage paths** | Documents filed under any of several storage paths |\n| **Does not have storage paths** | Documents filed under none of the paths you pick |\n| **Matches custom field query** | Documents whose custom fields satisfy a query you build |\n\nA filter you no longer want is removed with its **Delete** button. Advanced\nfilters are only offered for **Document Added**, **Document Updated** and\n**Scheduled** triggers; with none defined the section says **No advanced\nworkflow filters defined.**\n\n### Scheduled settings\n\nA **Scheduled** trigger asks a different question: not \"which document arrived\"\nbut \"which documents have reached a date\". For those triggers you set:\n\n| Field | What it means |\n| --- | --- |\n| **Offset days** | How far from the date to run. Positive values trigger after the date, negative values before. |\n| **Relative to** | Which date to count from: **Added**, **Created**, **Modified**, or **Custom Field**. |\n| **Custom field** | Which date field to use, when **Relative to** is **Custom Field**. |\n| **Recurring** | Whether the trigger repeats instead of firing once. |\n| **Recurring interval days** | How often it repeats, when **Recurring** is ticked. |\n\n## Actions\n\nOpen the **Actions** section and click **Add Action** (**Apply Actions:**).\nEvery action begins with an **Action type**:\n\n| Action type | What it does |\n| --- | --- |\n| **Assignment** | Fills in or replaces information on the document. |\n| **Removal** | Takes information off the document. |\n| **Email** | Sends the document by e-mail. |\n| **Webhook** | Posts a message to a web address you give. |\n| **Password removal** | Tries passwords against a protected PDF so it can be read. |\n| **Move to trash** | Moves the document to the trash. |\n\nA workflow can hold as many actions as you like, and they run from top to\nbottom; there is a handle on the left of each action so you can drag them into\nthe order you want.\n\n### Assignment\n\n| Field | What it sets |\n| --- | --- |\n| **Assign title** | A new title, which may contain placeholders so the name is built from the document's own details. |\n| **Assign tags**, **Assign document type**, **Assign correspondent**, **Assign storage path** | The matching attribute on the document. |\n| **Assign custom fields** | Which custom fields the document should carry. |\n| **Assign owner** | The user the document belongs to. |\n| **Assign view permissions**, **Assign edit permissions** | The **Users:** and **Groups:** who may open, or change, the document. As elsewhere, **Edit permissions also grant viewing permissions**. |\n\n**Assign title**, **Email subject** and **Email body** may contain placeholders\nthat are filled in from the document itself. A few that work with every trigger:\n\n| Placeholder | Fills in |\n| --- | --- |\n| `{{correspondent}}` | The correspondent assigned to the document |\n| `{{document_type}}` | The document type assigned to the document |\n| `{{owner_username}}` | The owner of the document |\n| `{{added_year}}`, `{{added_month}}`, `{{added_day}}`, `{{added_time}}` | Parts of the date the document was added |\n| `{{original_filename}}` | The original file name, without its extension |\n| `{{filename}}` | The document's current file name, without its extension |\n\nWith **Document Added** and **Document Updated** triggers the date the document\nwas created is available too, as `{{created_year}}` and the like, together with\n`{{doc_url}}` and `{{doc_id}}`.\n\n### Removal\n\nRemoval takes things off a document. Each block has a **Remove all** switch\nbeside it, so you can either clear everything of that kind or name exactly what\nto take away:\n\n- **Remove tags**, **Remove correspondents**, **Remove document types**,\n  **Remove storage paths**, **Remove custom fields**.\n- **Remove owners** — clears the owner.\n- **Remove permissions** — with separate **View permissions** and\n  **Edit permissions** blocks, each with **Users:** and **Groups:**.\n\n### Email, Webhook, Password removal and Move to trash\n\n| Action | Fields |\n| --- | --- |\n| **Email** | **Email subject**, **Email body**, **Email recipients** (several addresses separated by commas), and **Attach document**. Subject and body may use placeholders. |\n| **Webhook** | **Webhook url**, the body as **Webhook params** (key-and-value pairs) or as plain **Webhook body**, the **Webhook headers**, whether to **Send webhook payload as JSON**, and **Include document**. |\n| **Password removal** | **Passwords**, one per line. The workflow tries them in order until one succeeds. Passwords are stored in plain text, so use with caution. |\n| **Move to trash** | Nothing to fill in — the document is moved to the trash at the end of the run, where it can still be restored until the trash is emptied. |\n\n!!! warning\n\n    **Move to trash** always runs last, wherever it sits in the list, and no\n    further workflow runs on that document afterwards. The same applies to\n    e-mail and webhook actions: an action that reaches outside Paperless-ngx\n    cannot be undone.\n\n## How workflows combine\n\n- The **Sort order** numbers decide the sequence, lowest first. Workflows run\n  one after another.\n- For **Assignment**, a later workflow overrides an earlier one — except for\n  values that can hold several entries, such as tags, custom fields and\n  permissions, which are merged instead of replaced.\n- A later workflow always sees the changes the earlier ones made, so one\n  workflow can set a tag and the next can react to it.\n\n## Who can change workflows\n\nWorkflows are powerful, so they have their own permissions: a user needs the\nright to add, change, or delete workflows before the matching buttons appear.\nEveryone who can open the **Workflows** page sees the whole list, because\nworkflows belong to the installation rather than to a person.\n\n!!! note\n\n    Because workflows can set owners and permissions, a workflow is an easy way\n    to give a whole class of documents the same access rules. If documents from\n    the consume folder arrive without an owner, a workflow is the usual place to\n    fix that. See\n    [Authentication, Users, Groups & Permissions](../getting-started/authentication.md).\n\n## A quick example\n\nPriya runs the office of a small charity. Every invoice that arrives by e-mail\nshould be tagged, filed, and given a sensible title without anyone touching it.\n\nShe opens **Workflows** and clicks **Add Workflow**. She names it\n**Incoming invoices**, leaves **Enabled** on and sets **Sort order** to 1.\n\nUnder **Triggers** she adds a **Consumption Started** trigger and sets\n**Filter sources** to **Mail Fetch** and **Filter filename** to `*.pdf`.\n\nUnder **Actions** she adds an **Assignment** action with **Assign title** set to\n`Invoice {{added_year}} {{original_filename}}`, **Assign tags** set to *Invoice*\nand *To review*, **Assign document type** set to *Invoice*, and **Assign owner**\nset to herself.\n\nShe saves the workflow. The next invoice that arrives by e-mail, a file named\n*Northern Power March*, is stored with the title \"Invoice 2026 Northern Power\nMarch\", tagged *Invoice* and *To review*, typed as *Invoice*, and owned by Priya\n— with no manual work at all.\n\n","ar":"---\ntitle: سير العمل\n---\n\n# سير العمل (Workflows)\n\n**سير العمل (workflow)** قاعدة تراقب مسار معالجة المستند وتفعل شيئًا حين ترى ما\nتبحث عنه: فيمكنه تعيين العنوان والوسوم والمراسل ونوع المستند ومسار التخزين\nوالمالك والصلاحيات، ويمكنه نزع المعلومات مرة أخرى، ويمكنه إرسال المستند بالبريد\nأو نشره على عنوان ويب أو محاولة فك قفله أو نقله إلى المهملات.\n\nولكل سير عمل ثلاثة أجزاء:\n\n| الجزء | ما يقرّره |\n| --- | --- |\n| **Trigger** | *متى* يعمل سير العمل، وأي المستندات ينطبق عليها |\n| **Actions** | ما يفعله سير العمل، بالترتيب، عند تشغيله |\n| **Settings** | اسمه، وموضعه بين بقية الـ workflows، وهل هو مشغَّل |\n\nوتجد الـ workflows تحت **Workflows** في الشريط الجانبي، وتصفها ترويسة الصفحة\nبأنها *Use workflows to customize the behavior of Paperless-ngx when events\n'trigger' a workflow.*\n\n!!! note\n\n    الـ workflows مشتركة: فكل من يستطيع فتح الصفحة يرى القائمة نفسها. ولأنها\n    تستطيع تعيين المالكين والصلاحيات، فتعامل معها كخاصية إدارية — راجع قسم\n    «من يستطيع تغيير الـ Workflows» أدناه.\n\n## صفحة Workflows\n\nتضم القائمة سطرًا لكل سير عمل:\n\n| العمود | المعنى |\n| --- | --- |\n| **Name** | انقر الاسم لتعديل سير العمل. |\n| **Sort order** | الرقم الذي يقرّر ترتيب تشغيل الـ workflows — الأصغر أولًا. |\n| **Status** | مفتاح يقول **Enabled** أو **Disabled**. حرّكه لتشغيل سير العمل أو إيقافه من دون حذفه. |\n| **Triggers** | ملخّص قصير لأنواع المُشغّلات، مثل \"Consumption Started\" أو \"Document Added, Scheduled\". |\n| **Actions** | **Edit** و**Delete** و**Copy**. |\n\nويفتح **Add Workflow** سير عمل فارغًا، ويصنع **Copy** نسخة باسم\n«*الاسم* (copy)» يفتحها للتعديل، وهي أسرع طريقة لبناء قاعدة مشابهة. وإن كانت\nالقائمة فارغة قالت **No workflows defined.**\n\nويطلب الحذف تأكيدًا أولًا: **Confirm delete workflow**، ثم\n**This operation will permanently delete this workflow.** و\n**This operation cannot be undone.**، وزر التأكيد هو **Proceed**.\n\n## المُشغّلات (Triggers)\n\nيجيب المُشغّل عن سؤالين: أي حدث نتفاعل معه، وأي المستندات ينطبق عليها. افتح قسم\n**Triggers** في نافذة سير العمل وانقر **Add Trigger** (أي\n**Trigger Workflow On:**). ويبدأ كل مُشغّل بحقل **Trigger type**:\n\n| نوع المُشغّل | يعمل… |\n| --- | --- |\n| **Consumption Started** | *قبل* تخزين المستند، وهو لا يزال يُقرأ. فيُعرف اسم الملف والمصدر والمسار وقاعدة البريد، أما النص المستخرج والوسوم التلقائية فليست متاحة بعد. |\n| **Document Added** | *بعد* تخزين مستند جديد، بعد استخراج نصه واستنتاج وسومه ومراسله ونوعه. |\n| **Document Updated** | كلما عدّل أحدهم مستندًا موجودًا. |\n| **Scheduled** | في يوم محدّد نسبةً إلى تاريخ على المستند — مفيد للتذكيرات والمواعيد النهائية. |\n\nويمكن لسير العمل أن يحمل عدة مُشغّلات، ويعمل حين يطابق **أيٌّ** منها.\n\n### ما يمكنك الترشيح به\n\nتحت نوع المُشغّل يمكنك تضييق المستندات المؤهَّلة:\n\n- **Filter filename** — ينطبق على المستندات التي يطابق اسم ملفها النمط، مع\n  السماح بالرموز البديلة مثل `*.pdf` أو `*invoice*`. وهو لا يفرّق بين الحروف\n  الكبيرة والصغيرة.\n- ومع **Consumption Started** تحصل أيضًا على:\n  - **Filter sources** — **Consume Folder** أو **API Upload** أو **Mail Fetch**\n    أو **Web UI**.\n  - **Filter path** — المجلد الذي وصل منه الملف، مع السماح بالرمز البديل `*`.\n  - **Filter mail rule** — المستندات التي وصلت عبر قاعدة بريد معيّنة فقط.\n- ومع **Document Added** و**Document Updated** و**Scheduled** تحصل أيضًا على\n  **Content matching algorithm**، وعندما يحتاج الخيار إليه:\n  **Content matching pattern** و**Case insensitive** — وهي الفكرة نفسها في\n  مطابقة الوسوم، لكن مطبّقة على نص المستند. والخيارات هي **Any word** و\n  **All words** و**Exact match** و**Regular expression** و**Fuzzy word** و\n  **None**.\n\nوالسطر أعلى المرشّحات، **Trigger for documents that match *all* filters\nspecified below.**، هو القاعدة: على المستند أن يستوفي كل مرشّح في المُشغّل.\n\n### المرشّحات المتقدّمة (Advanced Filters)\n\nأسفل المرشّحات الأساسية يبني **Add filter** شروطًا إضافية على سمات المستند\nنفسها. وكل مرشّح زوج: اختر ما يُختبر على اليسار، ثم القيمة على اليمين. والاختبارات\nالمتاحة هي:\n\n| الاختبار | يطابق |\n| --- | --- |\n| **Has any of these tags** | المستندات التي تحمل وسمًا واحدًا على الأقل من الوسوم التي تختارها |\n| **Has all of these tags** | المستندات التي تحمل كل الوسوم التي تختارها |\n| **Does not have these tags** | المستندات التي لا تحمل أيًّا من الوسوم التي تختارها |\n| **Has correspondent** | المستندات الصادرة عن مراسل واحد بعينه |\n| **Has any of these correspondents** | المستندات الصادرة عن أي من عدة مراسلين |\n| **Does not have correspondents** | المستندات الصادرة عن أي من المراسلين المختارين |\n| **Has document type** | المستندات من نوع واحد بعينه |\n| **Has any of these document types** | المستندات من أي من عدة أنواع |\n| **Does not have document types** | المستندات من أي من الأنواع المختارة |\n| **Has storage path** | المستندات المرتّبة تحت مسار تخزين واحد بعينه |\n| **Has any of these storage paths** | المستندات المرتّبة تحت أي من عدة مسارات |\n| **Does not have storage paths** | المستندات المرتّبة تحت أي من المسارات المختارة |\n| **Matches custom field query** | المستندات التي تستوفي حقولها المخصّصة استعلامًا تبنيه |\n\nويُزال المرشّح الذي لم تعد تريده بزرّ **Delete** الخاص به. ولا تُعرض المرشّحات\nالمتقدّمة إلا لمُشغّلات **Document Added** و**Document Updated** و**Scheduled**،\nوحين لا يوجد أي منها يقول القسم **No advanced workflow filters defined.**\n\n### إعدادات Scheduled\n\nيطرح مُشغّل **Scheduled** سؤالًا مختلفًا: لا «أي مستند وصل»، بل «أي المستندات\nبلغت تاريخًا». ولهذه المُشغّلات تضبط:\n\n| الحقل | ما يعنيه |\n| --- | --- |\n| **Offset days** | كم يبعد التشغيل عن التاريخ. القيم الموجبة تعمل بعد التاريخ، والسالبة قبله. |\n| **Relative to** | من أي تاريخ تُحسب المدة: **Added** أو **Created** أو **Modified** أو **Custom Field**. |\n| **Custom field** | أي حقل تاريخ يُستخدم، حين يكون **Relative to** هو **Custom Field**. |\n| **Recurring** | هل يتكرّر المُشغّل بدل أن يعمل مرة واحدة. |\n| **Recurring interval days** | كل كم يوم يتكرّر، حين يكون **Recurring** مؤشَّرًا. |\n\n## الإجراءات (Actions)\n\nافتح قسم **Actions** وانقر **Add Action** (أي **Apply Actions:**). ويبدأ كل\nإجراء بحقل **Action type**:\n\n| نوع الإجراء | ما يفعله |\n| --- | --- |\n| **Assignment** | يملأ معلومات المستند أو يستبدلها. |\n| **Removal** | ينزع معلومات من المستند. |\n| **Email** | يرسل المستند بالبريد الإلكتروني. |\n| **Webhook** | ينشر رسالة على عنوان ويب تعطيه. |\n| **Password removal** | يجرّب كلمات مرور على ملف محمي ليصبح مقروءًا. |\n| **Move to trash** | ينقل المستند إلى المهملات. |\n\nويمكن لسير العمل أن يحمل ما تشاء من الإجراءات، وهي تعمل من الأعلى إلى الأسفل،\nوفي يسار كل إجراء مقبض تسحب منه لترتيبها كما تريد.\n\n### الإسناد (Assignment)\n\n| الحقل | ما يعيّنه |\n| --- | --- |\n| **Assign title** | عنوانًا جديدًا، وقد يحتوي عناصر بديلة فيُبنى الاسم من تفاصيل المستند نفسها. |\n| **Assign tags** و**Assign document type** و**Assign correspondent** و**Assign storage path** | السمة المقابلة على المستند. |\n| **Assign custom fields** | الحقول المخصّصة التي ينبغي أن يحملها المستند. |\n| **Assign owner** | المستخدم الذي يملك المستند. |\n| **Assign view permissions** و**Assign edit permissions** | **Users:** و**Groups:** المسموح لهم بفتح المستند أو تغييره. وكما في كل مكان: **Edit permissions also grant viewing permissions**. |\n\nوقد تحتوي **Assign title** و**Email subject** و**Email body** على عناصر بديلة\nتُملأ من المستند نفسه. وهذه بعضها، وهي تعمل مع كل مُشغّل:\n\n| العنصر البديل | ما يُملأ به |\n| --- | --- |\n| `{{correspondent}}` | المراسل المعيَّن للمستند |\n| `{{document_type}}` | نوع المستند المعيَّن للمستند |\n| `{{owner_username}}` | مالك المستند |\n| `{{added_year}}` و`{{added_month}}` و`{{added_day}}` و`{{added_time}}` | أجزاء من تاريخ إضافة المستند |\n| `{{original_filename}}` | اسم الملف الأصلي من دون امتداده |\n| `{{filename}}` | اسم ملف المستند الحالي من دون امتداده |\n\nومع مُشغّلَي **Document Added** و**Document Updated** يتاح كذلك تاريخ إنشاء\nالمستند بصيغة `{{created_year}}` ونحوها، مع `{{doc_url}}` و`{{doc_id}}`.\n\n### النزع (Removal)\n\nينزع الـ Removal أشياء من المستند. ولكل كتلة مفتاح **Remove all** بجانبها، فإما\nأن تمسح كل ما هو من ذلك النوع، وإما أن تسمّي بالضبط ما تريد نزعه:\n\n- **Remove tags** و**Remove correspondents** و**Remove document types** و\n  **Remove storage paths** و**Remove custom fields**.\n- **Remove owners** — يمسح المالك.\n- **Remove permissions** — مع كتل منفصلة لـ **View permissions** و\n  **Edit permissions**، ولكل منهما **Users:** و**Groups:**.\n\n### Email وWebhook وPassword removal وMove to trash\n\n| الإجراء | الحقول |\n| --- | --- |\n| **Email** | **Email subject** و**Email body** و**Email recipients** (عناوين عدة مفصولة بفواصل) و**Attach document**. ويجوز أن يستخدم الموضوع والنص العناصر البديلة. |\n| **Webhook** | **Webhook url**، والنص إما كـ **Webhook params** (أزواج مفتاح وقيمة) وإما كـ **Webhook body** نصًّا، و**Webhook headers**، وهل **Send webhook payload as JSON**، و**Include document**. |\n| **Password removal** | **Passwords**، كلمة في كل سطر. ويجرّبها سير العمل بالترتيب حتى تنجح إحداها. وكلمات المرور محفوظة كنص صريح، فاستخدمها بحذر. |\n| **Move to trash** | لا شيء يُملأ — يُنقل المستند إلى المهملات في نهاية التشغيل، حيث يبقى قابلًا للاستعادة حتى تُفرَّغ المهملات. |\n\n!!! warning\n\n    يعمل **Move to trash** أخيرًا دائمًا، أيًّا كان موضعه في القائمة، ولا يعمل\n    بعدها أي سير عمل على ذلك المستند. ويُقال الأمر نفسه عن إجراءَي البريد\n    والـ webhook: فالإجراء الذي يصل إلى خارج Paperless-ngx لا يمكن التراجع عنه.\n\n## كيف تتكامل الـ Workflows\n\n- أرقام **Sort order** تقرّر التسلسل، الأصغر أولًا. وتعمل الـ workflows واحدًا\n  بعد الآخر.\n- في **Assignment** يتجاوز سير العمل اللاحق السابق — باستثناء القيم التي تحمل\n  عدة عناصر، مثل الوسوم والحقول المخصّصة والصلاحيات، فهي تُدمج بدل أن تُستبدل.\n- ويرى سير العمل اللاحق دائمًا التغييرات التي أحدثها السابق، فيمكن لسير عمل أن\n  يعيّن وسمًا ولسير العمل التالي أن يتفاعل معه.\n\n## من يستطيع تغيير الـ Workflows\n\nالـ workflows قوية، ولها صلاحياتها الخاصة: فلا بد للمستخدم من حق إضافة سير عمل\nأو تغييره أو حذفه قبل أن تظهر الأزرار المقابلة. وكل من يستطيع فتح صفحة\n**Workflows** يرى القائمة كاملة، لأن الـ workflows تخصّ التثبيت لا شخصًا بعينه.\n\n!!! note\n\n    ولأن الـ workflows تستطيع تعيين المالكين والصلاحيات، فهي وسيلة سهلة لمنح\n    فئة كاملة من المستندات قواعد وصول واحدة. وإن وصلت مستندات من مجلد المراقبة\n    من دون مالك، فسير العمل هو المكان المعتاد لإصلاح ذلك. راجع\n    [المصادقة والمستخدمون والمجموعات والصلاحيات](../getting-started/authentication.ar.md).\n\n## مثال سريع\n\nتدير بريا مكتب جمعية خيرية صغيرة. وكل فاتورة تصل بالبريد الإلكتروني ينبغي أن\nتُوسم وتُرتَّب ويُعطى لها عنوان معقول من دون أن يمسّها أحد.\n\nتفتح **Workflows** وتنقر **Add Workflow**. تسمّيه **Incoming invoices**،\nوتترك **Enabled** مفعّلًا، وتضع **Sort order** على 1.\n\nوتحت **Triggers** تضيف مُشغّل **Consumption Started**، وتضع **Filter sources**\nعلى **Mail Fetch** و**Filter filename** على `*.pdf`.\n\nوتحت **Actions** تضيف إجراء **Assignment** مع **Assign title** على\n`Invoice {{added_year}} {{original_filename}}`، و**Assign tags** على\n*Invoice* و*To review*، و**Assign document type** على *Invoice*، و**Assign\nowner** على نفسها.\n\nثم تحفظ سير العمل. فأول فاتورة تصل بالبريد الإلكتروني، وهي ملف باسم\n*Northern Power March*، تُخزَّن بعنوان \"Invoice 2026 Northern Power March\"،\nوتحمل وسمَي *Invoice* و*To review*، ونوعها *Invoice*، ومالكها بريا — بلا أي\nعمل يدوي.\n\n"},{"id":"mail","title":{"en":"Mail","ar":"البريد"},"fileEn":"automation/mail.md","fileAr":"automation/mail.ar.md","en":"---\ntitle: Mail\n---\n\n# Mail\n\nPaperless-ngx can read a mailbox for you and turn what it finds there into\ndocuments. You give it an account to watch, tell it which messages count with a\nrule, and it does the filing — tagging, naming, and deciding where each document\nbelongs — without anybody dragging files around.\n\nMail lives under **Mail** in the sidebar. The page is titled **Mail Settings**\nand described as *Manage e-mail accounts and rules for automatically importing\ndocuments.* Everything comes in two layers:\n\n| Layer | What it is |\n| --- | --- |\n| **Mail accounts** | The mailboxes Paperless-ngx is allowed to sign in to. |\n| **Mail rules** | What to do with the messages found in an account. |\n\nAn account on its own does nothing; the rules decide which messages become\ndocuments and what happens to them afterwards.\n\n!!! note\n\n    Mail is fetched in the background on a schedule — every 10 minutes by\n    default — so there is nothing to press to keep it working. You can also ask\n    for one account to be checked straight away with **Process Mail**, see\n    below.\n\n## Mail accounts\n\nThe **Mail accounts** section lists one row per account:\n\n| Column | Meaning |\n| --- | --- |\n| **Name** | The name you gave the account. Click it to edit. |\n| **Server** | The mail server the account connects to. |\n| **Username** | The username used to sign in. |\n| **Actions** | **Edit**, **Permissions**, **Delete**, and **Process Mail**. |\n\n- **Add Account** opens the **Create new mail account** dialog.\n- **Connect Gmail Account** and **Connect Outlook Account** appear when the\n  installation has been set up for them, and they sign in to Google or Microsoft\n  for you instead of you typing a server and port.\n- **Process Mail** checks that account right away instead of waiting for the\n  next automatic run. A message confirms it with *Processing mail account\n  \"…\"*.\n- If there are no accounts yet the list says **No mail accounts defined.**\n\nDeleting asks for confirmation first, and — as with everything in\nPaperless-ngx — a deleted account is gone for good.\n\n### The mail account dialog\n\n**Add Account** opens **Create new mail account**; **Edit** opens **Edit mail\naccount**. Both hold the same fields:\n\n| Field | What it means |\n| --- | --- |\n| **Name** | A label for the account, so you can recognise it in the rules. |\n| **IMAP Server** | The address of the mail server. |\n| **IMAP Port** | The port to connect on. |\n| **IMAP Security** | **SSL**, **STARTTLS**, or **No encryption**. |\n| **Username** | The sign-in name for the mailbox. |\n| **Password** | The sign-in password. |\n| **Password is token** | Tick this when the password is a token used for authentication, as some providers require. |\n| **Character Set** | The text encoding, **UTF-8** by default. |\n\nBefore saving you can press **Test**. The dialog reports back either\n**Successfully connected to the mail server** or **Unable to connect to the\nmail server**, which saves you from a rule that can never run because the\naccount cannot sign in. The dialog closes with **Cancel** or saves with **Save**.\n\n!!! warning\n\n    A mail account usually needs access to your whole mailbox, so give it a\n    password or token made for the purpose if your provider allows it. Everyone\n    who is allowed to change mail accounts can use the account, so keep that\n    permission to people you trust.\n\n## Mail rules\n\nA **mail rule** decides which messages in an account become documents, and what\nhappens to those messages afterwards. The **Mail rules** section lists one row\nper rule:\n\n| Column | Meaning |\n| --- | --- |\n| **Name** | The rule's name. Click it to edit. |\n| **Sort Order** | The number that decides the order rules are tried in — lower first. |\n| **Account** | The mail account the rule reads. |\n| **Status** | A switch reading **Enabled** or **Disabled**. |\n| **Processed Mail** | A button, **View Processed Mail**, opening the record of messages this rule has handled. |\n| **Actions** | **Edit**, **Permissions**, **Delete**, and **Copy**. |\n\n**Add Rule** opens **Create new mail rule**; **Copy** duplicates a rule (named\n\"*name* (copy)\") so you can adapt it. With no rules at all the list says\n**No mail rules defined.**\n\n### Choosing which mail the rule reads\n\n| Field | What it means |\n| --- | --- |\n| **Name** | A label for the rule. |\n| **Account** | Which mail account this rule belongs to. |\n| **Enabled** | Whether the rule runs. |\n| **Order** | The order rules are tried in. |\n| **Stop further processing** | When the rule queues a document, stop and do not try the rules below it on the same message. Useful when one message should match exactly one rule. |\n| **Folder** | The mailbox folder to read, **INBOX** by default. Subfolders are separated by a delimiter, often a dot or a slash, which varies by mail server. |\n| **Maximum age (days)** | Ignore messages older than this many days. Leave it empty to read everything in the folder. |\n| **Filter from** | Only messages whose sender matches this text. |\n| **Filter to** | Only messages whose recipient matches this text. |\n| **Filter subject** | Only messages whose subject contains this text. |\n| **Filter body** | Only messages whose body contains this text. |\n\nThe line above the filters reminds you how they combine: **Paperless will only\nprocess mails that match *all* of the criteria specified below.** An empty filter\nsimply does not apply.\n\n### What gets turned into a document\n\n| Field | What it means |\n| --- | --- |\n| **Consumption scope** | **Only process attachments** (the default), **Process message as .eml**, or **Process message as .eml and attachments separately**. |\n| **Attachment type** | **Only process attachments**, or **Process all files, including 'inline' attachments**. Use the second when a document is embedded in the message body rather than attached. |\n| **PDF layout** | How a converted message is laid out: **System default**, **Text, then HTML**, **HTML, then text**, **HTML only**, or **Text only**. |\n| **Include only files matching** | An optional list of file names or wildcards to accept, for example `*.pdf` or `*invoice*`. Several patterns can be separated by commas, and matching is not case-sensitive. |\n| **Exclude files matching** | An optional list of file names or wildcards to skip, in the same style. Use it to leave signatures and logos out of the archive. |\n\n### What happens to the message afterwards\n\n**Action** decides what happens to the message once it has been processed. The\nfootnote under the field is the rule: it is **Only performed if the mail is\nprocessed.**\n\n| Action | Effect |\n| --- | --- |\n| **Delete** | Removes the message from the mailbox. |\n| **Move to specified folder** | Moves the message to a folder you name in **Action parameter**. |\n| **Mark as read, don't process read mails** | Marks the message as read, and skips messages that are already read. |\n| **Flag the mail, don't process flagged mails** | Sets the important flag, and skips messages that already carry it. |\n| **Tag the mail with specified tag, don't process tagged mails** | Adds a tag you name in **Action parameter**, and skips messages that already carry it. |\n\nWith **Move to specified folder** or **Tag the mail with specified tag…** an\nextra field, **Action parameter**, appears for the folder name or the tag. Not\nevery mail server supports tags; where a provider uses colours instead, a colour\nname can be given in the form `apple:green` — see the note about Apple Mail in\n[Incoming e-mail](../../usage.md#incoming-mail).\n\n### Naming and filing the new document\n\n| Field | What it means |\n| --- | --- |\n| **Assign title from** | **Use subject as title**, **Use attachment filename as title**, or **Do not assign title from this rule**. |\n| **Assign owner from rule** | Tick to make the rule's owner the owner of the document. Untick when an owner should be set some other way. |\n| **Assign tags** | Tags to put on every document from this rule. |\n| **Assign document type** | The document type to apply. |\n| **Assign correspondent from** | **Do not assign a correspondent**, **Use mail address**, **Use name (or mail address if not available)**, or **Use correspondent selected below**. |\n| **Assign correspondent** | The correspondent to use, when the choice above is **Use correspondent selected below**. |\n\nThe dialog closes with **Cancel** or saves with **Save**.\n\n!!! tip\n\n    **Assign tags** is the trick that makes mail rules pay off. Pair it with\n    **Stop further processing**, and a fallback rule that catches everything\n    unrecognised, and every message is either filed where you expect it or\n    waiting in a pile you can find with a saved view.\n\n## Processed mail\n\nFor every message a rule has handled, Paperless-ngx remembers the message's\nidentity so that it is never imported twice — reading a message in your mail\nclient, or leaving the message in the folder, does not cause a duplicate.\n\n**View Processed Mail** opens that record for a rule. The table has a checkbox\nper row and these columns:\n\n| Column | Meaning |\n| --- | --- |\n| **Subject** | The subject of the message. |\n| **Received** | When the message arrived. |\n| **Processed** | When Paperless-ngx handled it. |\n| **Status** | A green tick for success, a red warning for failure, or a dash for anything else. |\n| **Error** | The reason, when something went wrong. Hover over it to read the whole message. |\n\n**Clear** drops the current selection and **Delete selected** forgets the chosen\nentries. If nothing is listed the dialog says **No processed email messages\nfound.**\n\n!!! warning\n\n    **Delete selected** is how you ask Paperless-ngx to treat a message as new\n    again. The next mail check will import it a second time, so only remove an\n    entry when you actually want the message reprocessed.\n\n## What happens when mail is checked\n\n1. Paperless-ngx signs in to each **mail account**.\n2. In the folder named by each enabled rule, it looks at messages that match all\n   of the rule's criteria and that it has not seen before.\n3. Matched attachments — or the message itself, depending on **Consumption\n   scope** — are added to the archive and processed like any other document, so\n   text is extracted and automatic matching applies.\n4. The rule's **Assign…** settings choose the title, tags, document type and\n   correspondent.\n5. The rule's **Action** is then performed on the message, so it does not come\n   back next time.\n\nBecause the archive only ever reads from the mailbox, a message that was not\nwanted can simply be left where it is. But if the password changes, or the\nserver cannot be reached, nothing is imported until an administrator fixes it —\nwhich is what the **Processed Mail** record and its **Error** column are for.\n\n## A quick example\n\nMercury Supplies scans invoices to `invoices@mercury.example`, and the accountant\nFarid wants them in the archive without any handling.\n\nHe opens **Mail**, clicks **Add Account**, and enters the mailbox's **Name**,\n**IMAP Server**, **Username** and **Password**, then presses **Test**. The dialog\nreports **Successfully connected to the mail server**, so he saves.\n\nUnder **Mail rules** he clicks **Add Rule** and names it **Supplier invoices**.\nHe sets **Account** to the new mailbox, **Folder** to **INVOICES**, **Filter\nsubject** to `invoice`, **Consumption scope** to **Only process attachments**,\n**Assign title from** to **Use attachment filename as title**, **Assign tags** to\n*Invoice* and *To pay*, and **Assign correspondent from** to **Use name (or mail\naddress if not available)**. For **Action** he chooses **Move to specified\nfolder** and types **Processed** in **Action parameter**.\n\nHe saves the rule. From then on, supplier invoices are imported with a sensible\ntitle and the right tags, and their messages are tidied into the **Processed**\nfolder. When he wants to check what happened, he clicks **View Processed Mail**\non the rule.\n\n","ar":"---\ntitle: البريد\n---\n\n# البريد (Mail)\n\nيستطيع Paperless-ngx أن يقرأ صندوق بريد نيابة عنك ويحوّل ما يجده فيه إلى مستندات.\nتعطيه حسابًا يراقبه، وتخبره بقاعدة أي الرسائل تُحتسب، فيتولى هو الترتيب —\nالوسم والتسمية وتحديد مكان كل مستند — من دون أن يسحب أحد الملفات هنا وهناك.\n\nويجد البريد تحت **Mail** في الشريط الجانبي. وعنوان الصفحة **Mail Settings**\nووصفها *Manage e-mail accounts and rules for automatically importing documents.*\nويأتي كل شيء في طبقتين:\n\n| الطبقة | ما هي |\n| --- | --- |\n| **Mail accounts** | صناديق البريد المسموح لـ Paperless-ngx بتسجيل الدخول إليها. |\n| **Mail rules** | ما يُفعل بالرسائل الموجودة في الحساب. |\n\nوالحساب وحده لا يفعل شيئًا؛ فالقواعد هي التي تقرّر أي الرسائل تصير مستندات وما\nيجري لها بعد ذلك.\n\n!!! note\n\n    يُجلب البريد في الخلفية وفق جدول زمني — كل 10 دقائق افتراضيًا — فلا يوجد زرّ\n    تضغطه ليبقى العمل جاريًا. ويمكنك كذلك أن تطلب فحص حساب واحد فورًا بـ\n    **Process Mail**، راجع أدناه.\n\n## حسابات البريد (Mail accounts)\n\nيسرد قسم **Mail accounts** حسابًا في كل سطر:\n\n| العمود | المعنى |\n| --- | --- |\n| **Name** | الاسم الذي أعطيته للحساب. انقره لتعديله. |\n| **Server** | خادم البريد الذي يتصل به الحساب. |\n| **Username** | اسم المستخدم المستعمل في تسجيل الدخول. |\n| **Actions** | **Edit** و**Permissions** و**Delete** و**Process Mail**. |\n\n- يفتح **Add Account** نافذة **Create new mail account**.\n- ويظهر **Connect Gmail Account** و**Connect Outlook Account** حين يكون التثبيت\n  مُهيَّأً لهما، فيسجّلان الدخول إلى Google أو Microsoft بدلًا من أن تكتب أنت\n  الخادم والمنفذ.\n- ويفحص **Process Mail** ذلك الحساب فورًا بدل انتظار الدورة التلقائية التالية،\n  وتؤكد ذلك رسالة *Processing mail account \"…\"*.\n- وإن لم تكن هناك حسابات بعد قالت القائمة **No mail accounts defined.**\n\nويطلب الحذف تأكيدًا أولًا، وكما هو الحال في كل شيء في Paperless-ngx، فالحساب\nالمحذوف ذهب إلى غير رجعة.\n\n### نافذة حساب البريد\n\nيفتح **Add Account** نافذة **Create new mail account**، ويفتح **Edit** نافذة\n**Edit mail account**. وكلتاهما تحمل الحقول نفسها:\n\n| الحقل | ما يعنيه |\n| --- | --- |\n| **Name** | تسمية للحساب حتى تعرفه في القواعد. |\n| **IMAP Server** | عنوان خادم البريد. |\n| **IMAP Port** | المنفذ الذي يتم الاتصال عليه. |\n| **IMAP Security** | **SSL** أو **STARTTLS** أو **No encryption**. |\n| **Username** | اسم الدخول إلى صندوق البريد. |\n| **Password** | كلمة مرور الدخول. |\n| **Password is token** | أشّره حين تكون كلمة المرور رمزًا (token) يُستخدم للمصادقة، كما يشترط بعض المزوّدين. |\n| **Character Set** | ترميز النص، و**UTF-8** هو الافتراضي. |\n\nوقبل الحفظ يمكنك الضغط على **Test**. فتردّ النافذة إما\n**Successfully connected to the mail server** وإما\n**Unable to connect to the mail server**، فتوفر عليك قاعدة لا يمكن أن تعمل أبدًا\nلأن الحساب لا يستطيع تسجيل الدخول. وتُغلق النافذة بـ **Cancel** أو تُحفظ بـ\n**Save**.\n\n!!! warning\n\n    يحتاج حساب البريد عادةً إلى الوصول إلى صندوقك كله، فأعطه كلمة مرور أو رمزًا\n    مصنوعًا لهذا الغرض إن كان مزوّدك يسمح بذلك. فكل من يُسمح له بتغيير حسابات\n    البريد يستطيع استخدام الحساب، فاحصر هذه الصلاحية في من تثق بهم.\n\n## قواعد البريد (Mail rules)\n\nتقرّر **قاعدة البريد (mail rule)** أي الرسائل في الحساب تصير مستندات، وما يجري\nلتلك الرسائل بعد ذلك. ويسرد قسم **Mail rules** قاعدة في كل سطر:\n\n| العمود | المعنى |\n| --- | --- |\n| **Name** | اسم القاعدة. انقره لتعديلها. |\n| **Sort Order** | الرقم الذي يقرّر ترتيب تجريب القواعد — الأصغر أولًا. |\n| **Account** | حساب البريد الذي تقرأ منه القاعدة. |\n| **Status** | مفتاح يقول **Enabled** أو **Disabled**. |\n| **Processed Mail** | زرّ **View Processed Mail** يفتح سجل الرسائل التي عالجتها هذه القاعدة. |\n| **Actions** | **Edit** و**Permissions** و**Delete** و**Copy**. |\n\nويفتح **Add Rule** نافذة **Create new mail rule**، وينسخ **Copy** قاعدة (باسم\n«*الاسم* (copy)») لتكيّفها كما تريد. وإن لم تكن هناك قواعد قالت القائمة\n**No mail rules defined.**\n\n### اختيار البريد الذي تقرأه القاعدة\n\n| الحقل | ما يعنيه |\n| --- | --- |\n| **Name** | تسمية للقاعدة. |\n| **Account** | حساب البريد الذي تنتمي إليه القاعدة. |\n| **Enabled** | هل تعمل القاعدة. |\n| **Order** | الترتيب الذي تُجرَّب به القواعد. |\n| **Stop further processing** | حين تُدرج القاعدة مستندًا، توقّف ولا تجرّب القواعد التي تحتها على الرسالة نفسها. مفيد حين ينبغي أن تطابق الرسالة قاعدة واحدة بالضبط. |\n| **Folder** | مجلد البريد الذي يُقرأ، و**INBOX** هو الافتراضي. وتُفصل المجلدات الفرعية بفاصل، غالبًا نقطة أو شرطة مائلة، ويختلف ذلك بحسب خادم البريد. |\n| **Maximum age (days)** | تجاهل الرسائل الأقدم من هذا العدد من الأيام. اتركه فارغًا لقراءة كل ما في المجلد. |\n| **Filter from** | الرسائل التي يطابق مرسلها هذا النص فقط. |\n| **Filter to** | الرسائل التي يطابق مستلمها هذا النص فقط. |\n| **Filter subject** | الرسائل التي يحتوي موضوعها على هذا النص فقط. |\n| **Filter body** | الرسائل التي يحتوي نصّها على هذا النص فقط. |\n\nويذكّرك السطر أعلى المرشّحات بكيفية اجتماعها: **Paperless will only process\nmails that match *all* of the criteria specified below.** والمرشّح الفارغ لا\nيُحتسب أصلًا.\n\n### ما يتحوّل إلى مستند\n\n| الحقل | ما يعنيه |\n| --- | --- |\n| **Consumption scope** | **Only process attachments** (الافتراضي)، أو **Process message as .eml**، أو **Process message as .eml and attachments separately**. |\n| **Attachment type** | **Only process attachments**، أو **Process all files, including 'inline' attachments**. استخدم الثاني حين يكون المستند مضمّنًا في متن الرسالة لا مرفقًا بها. |\n| **PDF layout** | كيف تُعرض الرسالة المحوَّلة: **System default** أو **Text, then HTML** أو **HTML, then text** أو **HTML only** أو **Text only**. |\n| **Include only files matching** | قائمة اختيارية بأسماء ملفات أو رموز بديلة تُقبل، مثل `*.pdf` أو `*invoice*`. ويمكن فصل عدة أنماط بفواصل، والمطابقة لا تفرّق بين الحروف الكبيرة والصغيرة. |\n| **Exclude files matching** | قائمة اختيارية بأسماء ملفات أو رموز بديلة تُتجاهل، بالطريقة نفسها. استخدمها لاستثناء التوقيعات والشعارات من الأرشيف. |\n\n### ما يجري للرسالة بعد ذلك\n\nيقرّر **Action** ما يحدث للرسالة بعد معالجتها. والحاشية تحت الحقل هي القاعدة:\nفهو **Only performed if the mail is processed.**\n\n| الإجراء | الأثر |\n| --- | --- |\n| **Delete** | يحذف الرسالة من صندوق البريد. |\n| **Move to specified folder** | ينقل الرسالة إلى مجلد تسمّيه في **Action parameter**. |\n| **Mark as read, don't process read mails** | يضع علامة القراءة على الرسالة، ويتجاهل الرسائل المقروءة أصلًا. |\n| **Flag the mail, don't process flagged mails** | يضع علامة الأهمية، ويتجاهل الرسائل التي تحملها أصلًا. |\n| **Tag the mail with specified tag, don't process tagged mails** | يضيف وسمًا تسمّيه في **Action parameter**، ويتجاهل الرسائل التي تحمله أصلًا. |\n\nومع **Move to specified folder** أو **Tag the mail with specified tag…** يظهر\nحقل إضافي هو **Action parameter** لاسم المجلد أو للوسم. ولا تدعم كل خوادم\nالبريد الوسوم؛ وحين يستخدم المزوّد ألوانًا بدلًا منها، يمكن إعطاء اسم لون\nبالصيغة `apple:green` — راجع الملاحظة عن Apple Mail في\n[البريد الوارد](../../usage.md#incoming-mail).\n\n### تسمية المستند الجديد وترتيبه\n\n| الحقل | ما يعنيه |\n| --- | --- |\n| **Assign title from** | **Use subject as title** أو **Use attachment filename as title** أو **Do not assign title from this rule**. |\n| **Assign owner from rule** | أشّره ليكون مالك القاعدة مالك المستند. وألغِ تأشيره حين ينبغي تعيين المالك بطريقة أخرى. |\n| **Assign tags** | الوسوم التي تُوضع على كل مستند من هذه القاعدة. |\n| **Assign document type** | نوع المستند الذي يُطبَّق. |\n| **Assign correspondent from** | **Do not assign a correspondent** أو **Use mail address** أو **Use name (or mail address if not available)** أو **Use correspondent selected below**. |\n| **Assign correspondent** | المراسل المستخدَم، حين يكون الخيار أعلاه **Use correspondent selected below**. |\n\nوتُغلق النافذة بـ **Cancel** أو تُحفظ بـ **Save**.\n\n!!! tip\n\n    حقل **Assign tags** هو الحيلة التي تجعل قواعد البريد تُثمر. اقرنه بـ\n    **Stop further processing** وبقاعدة احتياطية تلتقط كل ما لم يُعرف، فتصير كل\n    رسالة إما مرتَّبة حيث تتوقع، وإما منتظرة في كومة تجدها بعرض محفوظ.\n\n## البريد المعالَج (Processed mail)\n\nلكل رسالة عالجتها قاعدة، يتذكّر Paperless-ngx هويتها فلا تُستورَد مرتين أبدًا؛\nفقراءة الرسالة في برنامج بريدك، أو تركها في المجلد، لا تسبّب تكرارًا.\n\nويفتح **View Processed Mail** ذلك السجل لقاعدة. وفي الجدول مربّع اختيار لكل سطر\nوهذه الأعمدة:\n\n| العمود | المعنى |\n| --- | --- |\n| **Subject** | موضوع الرسالة. |\n| **Received** | متى وصلت الرسالة. |\n| **Processed** | متى عالجها Paperless-ngx. |\n| **Status** | علامة صحّ خضراء للنجاح، أو تحذير أحمر للفشل، أو شرطة لأي حال أخرى. |\n| **Error** | السبب، حين يحدث خطأ. مرّر المؤشر عليه لتقرأ الرسالة كاملة. |\n\nويسقط **Clear** التحديد الحالي، وينسى **Delete selected** السجلات المختارة. وإن\nلم يكن هناك شيء مسرود قالت النافذة **No processed email messages found.**\n\n!!! warning\n\n    **Delete selected** هو طريقتك لتطلب من Paperless-ngx أن يعتبر الرسالة جديدة\n    مرة أخرى. وستستوردها دورة فحص البريد التالية مرة ثانية، فلا تزل سجلًا إلا\n    حين تريد فعلًا إعادة معالجة الرسالة.\n\n## ما يحدث عند فحص البريد\n\n1. يسجّل Paperless-ngx الدخول إلى كل **حساب بريد (mail account)**.\n2. وفي المجلد الذي تسمّيه كل قاعدة مفعّلة، ينظر في الرسائل التي تطابق كل\n   معايير القاعدة ولم يرها من قبل.\n3. وتُضاف المرفقات المطابقة — أو الرسالة نفسها، بحسب **Consumption scope** —\n   إلى الأرشيف وتُعالج كأي مستند آخر، فيُستخرج النص وتُطبَّق المطابقة التلقائية.\n4. وتختار إعدادات **Assign…** في القاعدة العنوان والوسوم ونوع المستند\n   والمراسل.\n5. ثم يُنفَّذ **Action** الخاص بالقاعدة على الرسالة، فلا تعود في المرة القادمة.\n\nولأن الأرشيف يقرأ من صندوق البريد فقط، فما لم يُرَد من الرسائل يمكن تركه حيث\nهو. لكن إن تغيّرت كلمة المرور، أو تعذّر الوصول إلى الخادم، فلن يُستورَد شيء حتى\nيصلحه مدير (administrator) — وهذا ما يخدمه سجل **Processed Mail** وعمود\n**Error** فيه.\n\n## مثال سريع\n\nتمسح شركة Mercury Supplies فواتيرها إلى `invoices@mercury.example`، ويريد\nالمحاسب فريد أن تصل إلى الأرشيف من دون أي تعامل يدوي.\n\nيفتح **Mail** وينقر **Add Account**، ويُدخل **Name** لصندوق البريد و\n**IMAP Server** و**Username** و**Password**، ثم يضغط **Test**. فتقول النافذة\n**Successfully connected to the mail server**، فيحفظ.\n\nوتحت **Mail rules** ينقر **Add Rule** ويسمّيها **Supplier invoices**. ويضع\n**Account** على صندوق البريد الجديد، و**Folder** على **INVOICES**، و**Filter\nsubject** على `invoice`، و**Consumption scope** على **Only process\nattachments**، و**Assign title from** على **Use attachment filename as title**،\nو**Assign tags** على *Invoice* و*To pay*، و**Assign correspondent from** على\n**Use name (or mail address if not available)**. وللـ **Action** يختار\n**Move to specified folder** ويكتب **Processed** في **Action parameter**.\n\nثم يحفظ القاعدة. ومنذ ذلك الحين تُستورَد فواتير المورّدين بعنوان معقول وبالوسوم\nالصحيحة، وتُرتب رسائلها في مجلد **Processed**. وحين يريد التحقق مما جرى، ينقر\n**View Processed Mail** على القاعدة.\n\n"}]},{"id":"administration","title":{"en":"Administration & Monitoring","ar":"الإدارة والمراقبة"},"items":[{"id":"settings","title":{"en":"Settings","ar":"الإعدادات"},"fileEn":"administration/settings.md","fileAr":"administration/settings.ar.md","en":"---\ntitle: Settings\n---\n\n# Settings\n\n**Settings** is where each person tailors the interface to themselves. You find\nit in the sidebar under **Administration**, and the page describes itself as\n*Options to customize appearance, notifications and more. Settings apply to the\n**current user only**.*\n\nThat last sentence is the important one: nothing on this page changes the archive\nfor anybody else. Two people can sign in to the same installation and see\ncompletely different colours, languages and page sizes, and neither of them\ndisturbs the other.\n\nThe settings are kept with your account, so they follow you to any computer or\nbrowser you sign in from.\n\n## The page at a glance\n\nThe header carries up to three buttons:\n\n| Button | What it does |\n| --- | --- |\n| **Start tour** | A short guided walkthrough that points at the main parts of the interface. |\n| **System Status** | Opens the health report of the installation — see [System Status](system-status.md). A green tick on the button means all is well; a red mark means something needs attention. |\n| **Open Django Admin** | Only administrators see this. It opens the technical administration interface of the installation in a new tab, and is only needed for advanced work. |\n\nBelow the header the settings are grouped into four tabs: **General**,\n**Documents**, **Permissions**, and **Notifications**.\n\nAt the bottom of every tab sit **Cancel** and **Save**. Both stay greyed out\nuntil you have actually changed something, which is also how you can tell whether\nyour work is already stored:\n\n- **Save** stores the tab you are on and shows the message *Settings were saved\n  successfully.*\n- If a change only takes effect after the page is reloaded, the message becomes\n  *Settings were saved successfully. Reload is required to apply some changes.*\n  and offers a **Reload now** action.\n- **Cancel** puts everything back the way it was.\n- If storing fails, the message is **An error occurred while saving settings.**\n\n!!! note\n\n    Appearance changes — dark mode and the theme colour — are shown straight\n    away as you change them, so you can see what you are choosing. They are only\n    kept if you press **Save**; leaving the page without saving restores the old\n    look.\n\n## General\n\n### Appearance\n\n| Setting | What it changes |\n| --- | --- |\n| **Display language** | The language of the whole interface. Leave it at **Use system language** to follow your browser, or pick a language from the list — the English name is shown next to each translation. |\n| **Date display** | Which country's conventions are used for dates. **Use date format of display language** follows the interface language; every other choice shows a sample date so you can compare. |\n| **Date format** | How a date is written, with a live example of today's date for each choice: **Short**, **Medium**, or **Long**. |\n| **Sidebar** | The single option **Use 'slim' sidebar (icons only)** shrinks the sidebar to a strip of icons, which leaves more room for the document list or viewer. |\n| **Dark mode** | **Use system settings** follows your computer's light/dark choice. Untick it to choose yourself with **Enable dark mode**. **Invert thumbnails in dark mode** flips pale document previews so they are not glaring on a dark background. |\n| **Theme Color** | The accent colour of the interface. **Reset** returns it to the installation's own colour. |\n\n!!! note\n\n    Changing **Display language** shows the reminder **You need to reload the\n    page after applying a new language.** — press **Save**, then reload.\n\n### Global search\n\n| Setting | What it changes |\n| --- | --- |\n| **Do not include advanced search results** | Keeps the suggestions under the search box to the plain title-and-content search. |\n| **Full search links to** | Where the **Full search** link takes you: **Title and content search**, or **Advanced search** with its filter rules. |\n\n### Update checking\n\n**Enable update checking** lets Paperless-ngx compare itself with the latest\npublished release. The question mark beside it explains the details: the\ninstallation asks the public release catalogue of the project whether a newer\nversion exists — installing that version is still a manual job for whoever\nmaintains the server — and *No tracking data is collected by the app in any way.*\n\nTurning this on is one of the changes that needs a reload.\n\n### Saved Views\n\n| Setting | What it changes |\n| --- | --- |\n| **Show warning when closing saved views with unsaved changes** | Asks before you leave a changed view, so a filter change is not lost by accident. |\n| **Show document counts in sidebar saved views** | Puts the number of matching documents next to each view in the sidebar. |\n\n## Documents\n\n### Documents\n\n**Items per page** sets how many documents a list shows at a time — 10, 25, 50,\nor 100. Saved views can override this for themselves; see\n[Saved Views](../automation/saved-views.md).\n\n### Document editing\n\n| Setting | What it changes |\n| --- | --- |\n| **Use PDF viewer provided by the browser** | Shows PDFs with the viewer built into your browser instead of the one Paperless-ngx provides. Usually faster for large documents, but not every browser handles it well. |\n| **Default zoom** | How a document is opened: **Fit width** or **Fit page**. It applies only to the Paperless-ngx PDF viewer. |\n| **Automatically remove inbox tag(s) on save** | When you edit a document and save it, the inbox tag is cleared for you — the usual way of saying \"I have dealt with this one\". |\n| **Show document thumbnail during loading** | Shows a preview of the page while the full document is still arriving, instead of an empty space. |\n| **Built-in fields to show** | Tick or untick **Archive serial number**, **Correspondent**, **Document type**, **Storage path** and **Tags**. As the page says, *Uncheck fields to hide them on the document details page.* |\n\n### Bulk editing\n\n| Setting | What it changes |\n| --- | --- |\n| **Show confirmation dialogs** | Asks you to confirm before a bulk change is applied. |\n| **Apply on close** | Applies a bulk edit as soon as you close the window, instead of waiting for a button. |\n\n### PDF Editor\n\n**Default editing mode** chooses what the PDF editor does when you open it:\n**Create new document(s)**, or **Add document version** to the document you are\nalready looking at.\n\n### Notes\n\n**Enable notes** turns the notes feature on or off for your account, so you can\nhide it if you never annotate documents.\n\n## Permissions\n\nThis tab does not change who may see what. It sets the permissions that are\npre-filled for you when *you* create something in the web interface — the page\nsays so itself: *Settings apply to this user account for objects (Tags, Mail\nRules, etc. but not documents) created via the web UI.*\n\n| Field | What it means |\n| --- | --- |\n| **Default Owner** | Who owns the new objects. Left empty, the note under the field applies: *Objects without an owner can be viewed and edited by all users*. |\n| **Default View Permissions** | The **Users:** and **Groups:** who may see the new objects. |\n| **Default Edit Permissions** | The **Users:** and **Groups:** who may change them. The reminder under the fields is worth remembering: *Edit permissions also grant viewing permissions*. |\n\nDocuments are deliberately not covered here: a document's permissions are\ndecided on the document itself — see\n[Sharing and permissions](../documents/sharing.md).\n\n!!! tip\n\n    If you keep a tidy archive, setting **Default Owner** to yourself is the\n    usual choice, because objects you create then belong to you instead of\n    belonging to nobody.\n\n## Notifications\n\nThe **Document processing** switches decide which messages reach the bell menu —\nthe **Notifications** list in the top bar, where **Clear All** empties it and an\nempty list says **No notifications**:\n\n| Setting | What it tells you about |\n| --- | --- |\n| **Show notifications when new documents are detected** | A new file has been noticed and is waiting to be processed. |\n| **Show notifications when document processing completes successfully** | A document finished and is ready. |\n| **Show notifications when document processing fails** | A document could not be processed. |\n| **Suppress notifications on dashboard** | *This will suppress all messages about document processing status on the dashboard.* |\n\n!!! warning\n\n    Turning off the failure notifications is tempting in a busy installation,\n    but those are the messages that tell you a document never made it into the\n    archive. If you silence them, check [Tasks](tasks.md) now and then instead —\n    the tasks that need attention are counted there.\n\n## A quick example\n\nSalma works in Arabic all day but has to read a lot of English invoices, and she\nfinds the large document previews hard on her eyes in the evening.\n\nShe opens **Settings**. On **General** she leaves **Display language** at\n**Use system language**, sets **Date display** to her own region and chooses\n**Long** as the **Date format** so the dates in the details panel are\nunmistakable. Under **Dark mode** she leaves **Use system settings** ticked and\nturns on **Invert thumbnails in dark mode**. She picks a green **Theme Color**.\n\nOn **Documents** she sets **Items per page** to **25** so there is less\nscrolling, ticks **Automatically remove inbox tag(s) on save** so her inbox\nempties itself as she works, and unticks **Tags** under **Built-in fields to\nshow** because she prefers to see the tags only when she opens a document.\n\nOn the **Notifications** tab she unticks **Show notifications when new documents\nare detected** to quieten the bell, then presses **Save** and sees *Settings were\nsaved successfully.* The next time she signs in from her laptop, all of it is\nstill there.\n","ar":"---\ntitle: الإعدادات\n---\n\n# الإعدادات (Settings)\n\n**Settings** هي المكان الذي يُهيّئ فيه كل شخص الواجهة على ذوقه. تجدها في الشريط\nالجانبي تحت **Administration**، وتصف الصفحة نفسها بأنها\n*Options to customize appearance, notifications and more. Settings apply to the\n**current user only**.*\n\nهذه الجملة الأخيرة هي المهمّة: لا شيء في هذه الصفحة يغيّر الأرشيف عند الآخرين.\nيمكن لشخصين تسجيل الدخول إلى التثبيت نفسه ورؤية ألوان ولغات وأحجام صفحات مختلفة\nتمامًا، من دون أن يُزعج أحدهما الآخر.\n\nوتُحفظ الإعدادات مع حسابك، فترافقك إلى أي حاسوب أو متصفّح تسجّل الدخول منه.\n\n## نظرة سريعة على الصفحة\n\nيحمل رأس الصفحة حتى ثلاثة أزرار:\n\n| الزر | ما يفعله |\n| --- | --- |\n| **Start tour** | جولة قصيرة موجّهة تُشير إلى الأجزاء الرئيسية في الواجهة. |\n| **System Status** | يفتح تقرير صحة التثبيت — راجع [حالة النظام (System Status)](system-status.md). وجود علامة صحّ خضراء على الزر يعني أن كل شيء سليم، والعلامة الحمراء تعني أن شيئًا يحتاج انتباهك. |\n| **Open Django Admin** | يراه المدراء فقط. يفتح واجهة الإدارة التقنية للتثبيت في تبويب جديد، ولا يُحتاج إليه إلا في الأعمال المتقدّمة. |\n\nوتحت الرأس تُوزَّع الإعدادات على أربع تبويبات: **General** و**Documents**\nو**Permissions** و**Notifications**.\n\nوفي أسفل كل تبويب يقع **Cancel** و**Save**. ويبقى الاثنان باهتَين حتى تغيّر شيئًا\nفعلًا، وهذا أيضًا دليلٌ على أن عملك محفوظ من قبل:\n\n- يخزّن **Save** التبويب الذي أنت فيه ويعرض رسالة\n  *Settings were saved successfully.*\n- وإذا كان التغيير لا يسري إلا بعد إعادة تحميل الصفحة، تصير الرسالة\n  *Settings were saved successfully. Reload is required to apply some changes.*\n  مع زرّ **Reload now**.\n- ويُعيد **Cancel** كل شيء إلى ما كان عليه.\n- وإذا فشل التخزين جاءت الرسالة **An error occurred while saving settings.**\n\n!!! note\n\n    تُعرض تغييرات المظهر — الوضع الليلي ولون السمة — فورًا أثناء تغييرها، لترى ما\n    تختاره بعينك. لكنها لا تُحفظ إلا إذا ضغطت **Save**؛ ومغادرة الصفحة بلا حفظ\n    تُعيد المظهر القديم.\n\n## عام (General)\n\n### المظهر (Appearance)\n\n| الإعداد | ما يغيّره |\n| --- | --- |\n| **Display language** | لغة الواجهة كلها. اتركه على **Use system language** ليتابع متصفّحك، أو اختر لغة من القائمة — ويظهر الاسم بالإنجليزية بجانب كل ترجمة. |\n| **Date display** | اصطلاحات أي بلد تُستعمل في التواريخ. يتابع **Use date format of display language** لغة الواجهة، ويعرض كل خيار آخر تاريخًا نموذجيًا لتقارن بينها. |\n| **Date format** | طريقة كتابة التاريخ، مع مثال حيّ لتاريخ اليوم أمام كل خيار: **Short** أو **Medium** أو **Long**. |\n| **Sidebar** | الخيار الوحيد **Use 'slim' sidebar (icons only)** يقلّص الشريط الجانبي إلى شريط أيقونات رفيع، فيترك مساحة أكبر لقائمة المستندات أو للعارض. |\n| **Dark mode** | يتابع **Use system settings** اختيار حاسوبك بين الفاتح والداكن. أزل العلامة لتختار بنفسك بـ **Enable dark mode**. ويقلب **Invert thumbnails in dark mode** معاينات المستندات الفاتحة حتى لا تُبهِر العين على خلفية داكنة. |\n| **Theme Color** | اللون المميّز للواجهة. ويُعيده **Reset** إلى لون التثبيت الأصلي. |\n\n!!! note\n\n    تغيير **Display language** يُظهر التذكير **You need to reload the page after\n    applying a new language.** — اضغط **Save** ثم أعد التحميل.\n\n### البحث الشامل (Global search)\n\n| الإعداد | ما يغيّره |\n| --- | --- |\n| **Do not include advanced search results** | يقصر الاقتراحات تحت صندوق البحث على البحث البسيط في العنوان والمحتوى. |\n| **Full search links to** | إلى أين يوصل رابط **Full search**: **Title and content search**، أو **Advanced search** بقواعد تصفيته. |\n\n### التحقّق من التحديثات (Update checking)\n\nيتيح **Enable update checking** لـ Paperless-ngx أن يقارن نفسه بأحدث إصدار\nمنشور. وتشرح علامة الاستفهام بجانبه التفاصيل: يسأل التثبيت فهرس الإصدارات العام\nالخاص بالمشروع هل يوجد إصدار أحدث — ويبقى تثبيت ذلك الإصدار مهمة يدوية يقوم بها\nمن يدير الخادم — و*No tracking data is collected by the app in any way.*\n\nوتشغيل هذا الخيار من التغييرات التي تحتاج إلى إعادة تحميل.\n\n### العروض المحفوظة (Saved Views)\n\n| الإعداد | ما يغيّره |\n| --- | --- |\n| **Show warning when closing saved views with unsaved changes** | يسألك قبل مغادرة عرض تغيّر، فلا يضيع تغيير المرشّح من غير قصد. |\n| **Show document counts in sidebar saved views** | يضع عدد المستندات المطابقة بجانب كل عرض في الشريط الجانبي. |\n\n## المستندات (Documents)\n\n### المستندات (Documents)\n\nيحدّد **Items per page** عدد المستندات التي تعرضها القائمة في المرة الواحدة —\n10 أو 25 أو 50 أو 100. ويمكن للعروض المحفوظة أن تتجاوز ذلك لنفسها؛ راجع\n[العروض المحفوظة (Saved Views)](../automation/saved-views.md).\n\n### تحرير المستند (Document editing)\n\n| الإعداد | ما يغيّره |\n| --- | --- |\n| **Use PDF viewer provided by the browser** | يعرض ملفات PDF بالعارض المدمج في متصفّحك بدلًا من العارض الذي يوفّره Paperless-ngx. أسرع عادةً مع المستندات الكبيرة، لكن ليست كل المتصفّحات تجيده. |\n| **Default zoom** | كيف يُفتح المستند: **Fit width** أو **Fit page**. وهو يسري على عارض PDF الخاص بـ Paperless-ngx وحده. |\n| **Automatically remove inbox tag(s) on save** | عند تحرير مستند وحفظه يُمسح وسم البريد الوارد عنك — وهي الطريقة المعتادة للقول «فرغت من هذا المستند». |\n| **Show document thumbnail during loading** | يعرض معاينة للصفحة أثناء وصول المستند كاملًا، بدلًا من مساحة فارغة. |\n| **Built-in fields to show** | ضع علامة أو أزلها عن **Archive serial number** و**Correspondent** و**Document type** و**Storage path** و**Tags**. وكما تقول الصفحة: *Uncheck fields to hide them on the document details page.* |\n\n### التعديل الجماعي (Bulk editing)\n\n| الإعداد | ما يغيّره |\n| --- | --- |\n| **Show confirmation dialogs** | يسألك التأكيد قبل تطبيق التغيير الجماعي. |\n| **Apply on close** | يطبّق التعديل الجماعي فور إغلاق النافذة بدل انتظار زرّ. |\n\n### محرّر PDF (PDF Editor)\n\nيختار **Default editing mode** ما يفعله محرّر PDF عند فتحه: **Create new\ndocument(s)**، أو **Add document version** إلى المستند الذي تنظر إليه الآن.\n\n### الملاحظات (Notes)\n\nيشغّل **Enable notes** ميزة الملاحظات في حسابك أو يوقفها، فتُخفيها إن كنت لا\nتكتب ملاحظات على المستندات أبدًا.\n\n## الصلاحيات (Permissions)\n\nلا تغيّر هذه التبويبة من يرى ماذا. إنها تحدّد الصلاحيات المملوءة مسبقًا لك عندما\nتُنشئ *أنت* شيئًا في واجهة الويب — وتقول الصفحة ذلك بنفسها: *Settings apply to\nthis user account for objects (Tags, Mail Rules, etc. but not documents) created\nvia the web UI.*\n\n| الحقل | معناه |\n| --- | --- |\n| **Default Owner** | مَن يملك الكائنات الجديدة. وإذا تُرك فارغًا سرت الملاحظة تحت الحقل: *Objects without an owner can be viewed and edited by all users*. |\n| **Default View Permissions** | المستخدمون **Users:** والمجموعات **Groups:** المسموح لهم برؤية الكائنات الجديدة. |\n| **Default Edit Permissions** | المستخدمون **Users:** والمجموعات **Groups:** المسموح لهم بتغييرها. وملاحظة تحت الحقول تستحق التذكّر: *Edit permissions also grant viewing permissions*. |\n\nوالمستندات مستثناة من هذا قصدًا: فتُحدَّد صلاحيات المستند على المستند نفسه —\nراجع [المشاركة والصلاحيات (Sharing and permissions)](../documents/sharing.md).\n\n!!! tip\n\n    إن كنت تحرص على ترتيب الأرشيف، فتعيين **Default Owner** على نفسك هو الخيار\n    المعتاد، لأن الكائنات التي تُنشئها تصير ملكك بدل أن تصير بلا مالك.\n\n## الإشعارات (Notifications)\n\nتحدّد مفاتيح **Document processing** أي الرسائل تصل إلى قائمة الجرس — أي قائمة\n**Notifications** في الشريط العلوي، حيث يُفرغها **Clear All** وتقول القائمة\nالفارغة **No notifications**:\n\n| الإعداد | عمّ يخبرك |\n| --- | --- |\n| **Show notifications when new documents are detected** | لوحظ ملف جديد وهو في انتظار المعالجة. |\n| **Show notifications when document processing completes successfully** | انتهى مستند وصار جاهزًا. |\n| **Show notifications when document processing fails** | تعذّرت معالجة مستند. |\n| **Suppress notifications on dashboard** | *This will suppress all messages about document processing status on the dashboard.* |\n\n!!! warning\n\n    إيقاف إشعارات الفشل مغري في تثبيت مزدحم، لكنها الرسائل التي تخبرك بأن مستندًا\n    لم يصل إلى الأرشيف قط. وإن أسكتّها فراجع [المهام (Tasks)](tasks.md) من وقت إلى\n    آخر بدلًا منها — فالمهام التي تحتاج انتباهك تُعَدّ هناك.\n\n## مثال سريع\n\nتعمل سلمى بالعربية طوال يومها، لكن عليها أن تقرأ كثيرًا من الفواتير الإنجليزية،\nويُتعب نظرها في المساء حجم معاينات المستندات الكبيرة.\n\nتفتح **Settings**. في **General** تترك **Display language** على **Use system\nlanguage**، وتضبط **Date display** على منطقتها، وتختار **Long** في **Date\nformat** حتى تكون التواريخ في لوحة التفاصيل واضحة لا تلتبس. وفي **Dark mode**\nتترك **Use system settings** معلَّمًا وتُشغّل **Invert thumbnails in dark mode**.\nوتختار **Theme Color** أخضر.\n\nوفي **Documents** تضبط **Items per page** على **25** فيقلّ التمرير، وتعلّم\n**Automatically remove inbox tag(s) on save** فيُفرغ صندوق واردها نفسه أثناء\nعملها، وتزيل العلامة عن **Tags** تحت **Built-in fields to show** لأنها تفضّل\nرؤية الوسوم فقط عند فتح المستند.\n\nوفي تبويبة **Notifications** تُزيل العلامة عن **Show notifications when new\ndocuments are detected** لتهدأ قائمة الجرس، ثم تضغط **Save** فيظهر\n*Settings were saved successfully.* وتبقى هذه الإعدادات كلها موجودة في المرّة\nالقادمة التي تسجّل فيها الدخول من حاسوبها المحمول.\n"},{"id":"system-status","title":{"en":"System status","ar":"حالة النظام"},"fileEn":"administration/system-status.md","fileAr":"administration/system-status.ar.md","en":"---\ntitle: System Status\n---\n\n# System Status\n\n**System Status** is the health report of the installation, in one window. It\nanswers the question \"is everything working, and what has the system been doing\nlately?\" without digging through anywhere else.\n\nYou open it from the header of the [Settings](settings.md) page, with the\n**System Status** button. The button carries a small badge:\n\n| Badge | Meaning |\n| --- | --- |\n| A green tick | Everything the report covers is working. |\n| A red mark | At least one item is failing — the database, the background services, the search index, the classifier, the sanity checker, or the live connection to the browser. |\n\nThe button appears for administrators, and for anyone who has been granted\npermission to view system status. If you cannot see it, that is the reason.\n\nThe report is in four cards — **Environment**, **Database**, **Tasks Queue**, and\n**Health** — and ends with a **Copy** button.\n\n## Environment\n\n| Item | What it tells you |\n| --- | --- |\n| **Paperless-ngx Version** | The version of the installation. If the interface and the server are not the same version, a small warning triangle appears; click it to see the **Frontend version** and the **Backend version** side by side. |\n| **Install Type** | How the installation is run. |\n| **Server OS** | The operating system of the computer the archive runs on. |\n| **Media Storage** | A bar and two figures: how much room the documents have left, and how much there is in total. |\n\n## Database\n\n| Item | What it tells you |\n| --- | --- |\n| **Type** | Which kind of database is in use. |\n| **Status** | **OK** with a green tick, or a red mark. Click it to see the address it is talking to, or the address together with the error. |\n| **Migration Status** | **Up to date** with a green tick, or a number with **Pending** and an amber warning. Click it to see the **Latest Migration** applied and the list of **Pending Migrations**. |\n\n!!! note\n\n    **Pending Migrations** normally means the installation has been updated but\n    the update has not been finished. It is a job for whoever maintains the\n    server, not something to fix from the web interface.\n\n## Tasks Queue\n\nThe two background services that carry out the work — for example processing\nincoming documents or running scheduled workflows — are listed here:\n\n| Item | What it tells you |\n| --- | --- |\n| **Redis Status** | **OK** or a red mark. Click it to see the address, or the address with the error. |\n| **Celery Status** | **OK** or a red mark. Click it to see the address, or the error. |\n| **Recent Task Activity (_n_ days)** | A small summary: **Total**, **Successful**, **Failed**, and **Pending**, or **No recent tasks** when nothing has run. |\n\nFor the tasks themselves — which document, when, and what went wrong — use\n[Tasks](tasks.md).\n\n## Health\n\n| Item | What it tells you |\n| --- | --- |\n| **Search Index** | **OK** or an error. Click it to see the **Last Updated** time. If the search index is not working, documents still exist, but searching will not find them. |\n| **Classifier** | The part of the system that learns how you file documents. **OK**, a warning, or an error, with the **Last Trained** time in the popover. |\n| **Sanity Checker** | A periodic check that looks for damaged documents and other inconsistencies. **OK**, a warning, or an error, with the **Last Run** time in the popover. |\n| **WebSocket Connection** | **OK** while the live link between the browser and the server is up, or **Error** when it has dropped. This is the link that lets progress updates appear by themselves. |\n| **AI Index** | Only shown when the optional AI features are switched on. **OK**, a warning, or an error, with the **Last Run** time. See [AI Features](../advanced/ai.md). |\n\n!!! note \"About the amber warning\"\n\n    An amber warning triangle means the item is working, but its last result is\n    more than a day old. For the **Classifier** and the **AI Index** that is\n    worth looking into; for the **Sanity Checker**, which normally runs about\n    once a week, it is the ordinary state between runs.\n\n## Re-running a check\n\nSome entries carry a **Run Task** button with a play symbol: the **Classifier**,\nthe **Sanity Checker**, and the **AI Index**. Pressing it asks the installation\nto do that work again right away, and a small spinner appears while it runs. The\nbuttons are only shown to superusers, because they set off work on the server.\n\nEverything else in the report is read-only.\n\n## Reading the report\n\nEvery entry is a small button. Press it (or hover) and a popover explains the\nvalue: the address being used, the time of the last run, or the error that was\nreported.\n\n| Status | Looks like |\n| --- | --- |\n| **OK** | A green tick. |\n| **WARNING** | An amber triangle — working, but something is worth a look. |\n| **ERROR** | A red triangle — this part is failing. |\n| **DISABLED** | A grey dash — this part is deliberately not in use. |\n\nIf something is failing, the two places to look next are [Logs](logs.md) for the\ndetails, and [Tasks](tasks.md) for the work that did not finish.\n\n**Copy** puts the whole report on your clipboard as plain text, which is the\nquickest way to hand the numbers to whoever maintains your server or to attach\nthem to a support request.\n\n## A quick example\n\nThe archive at Huda's office has felt slow for two days.\n\nShe opens **Settings** and notices that the **System Status** button carries a\nred mark instead of its usual green tick. She presses it. **Environment** and\n**Database** are fine — **Media Storage** shows plenty of room left, and the\nmigration column says **Up to date**. In **Tasks Queue** the **Redis Status** is\n**OK** but **Celery Status** shows a red mark; pressing it reveals an error\ninstead of an address. Under **Health**, the **Search Index** is fine, so once\nthe queue is running again the search will be current.\n\nThe background workers have stopped, which is why nothing is being processed and\nwhy the report looks unwell. She presses **Copy**, sends the report to her\nserver administrator, and opens [Tasks](tasks.md), where the pending\ndocument-processing entries explain why the new scans never appeared.\n\n## Statistics\n\nNumbers about the contents of the archive — how many documents arrived, how they\nare distributed across tags and correspondents — are not part of this window.\nThey live on the **Dashboard**; see\n[Dashboard & navigation](../getting-started/dashboard.md).\n","ar":"---\ntitle: حالة النظام\n---\n\n# حالة النظام (System Status)\n\n**System Status** هو تقرير صحة التثبيت في نافذة واحدة. يجيب عن السؤال «هل كل شيء\nيعمل، وماذا كان النظام يفعل في الفترة الأخيرة؟» من دون البحث في مكان آخر.\n\nتفتحه من رأس صفحة [الإعدادات (Settings)](settings.md) بزرّ **System Status**.\nويحمل الزرّ شارة صغيرة:\n\n| الشارة | معناها |\n| --- | --- |\n| علامة صحّ خضراء | كل ما يشمله التقرير يعمل. |\n| علامة حمراء | بند واحد على الأقل فاشل — قاعدة البيانات، أو الخدمات العاملة في الخلفية، أو فهرس البحث، أو المصنّف، أو مدقّق السلامة، أو الاتصال الحيّ بالمتصفّح. |\n\nويظهر الزرّ للمدراء، ولمن مُنح صلاحية عرض حالة النظام. وإن لم ترَه فهذا هو السبب.\n\nويقع التقرير في أربع بطاقات — **Environment** و**Database** و**Tasks Queue**\nو**Health** — وينتهي بزرّ **Copy**.\n\n## البيئة (Environment)\n\n| البند | ما يخبرك به |\n| --- | --- |\n| **Paperless-ngx Version** | إصدار التثبيت. وإن لم تكن الواجهة والخادم بالإصدار نفسه ظهر مثلّث تحذير صغير؛ انقره لترى **Frontend version** و**Backend version** جنبًا إلى جنب. |\n| **Install Type** | طريقة تشغيل التثبيت. |\n| **Server OS** | نظام التشغيل في الحاسوب الذي يعمل عليه الأرشيف. |\n| **Media Storage** | شريط ورقمان: كم مساحة بقي للمستندات، وكم المساحة الكلية. |\n\n## قاعدة البيانات (Database)\n\n| البند | ما يخبرك به |\n| --- | --- |\n| **Type** | نوع قاعدة البيانات المستعملة. |\n| **Status** | **OK** مع علامة صحّ خضراء، أو علامة حمراء. انقره لترى العنوان الذي يتحدث إليه، أو العنوان مع الخطأ. |\n| **Migration Status** | **Up to date** مع علامة صحّ خضراء، أو رقم مع **Pending** وتحذير كهرماني. انقره لترى **Latest Migration** المطبَّق وقائمة **Pending Migrations**. |\n\n!!! note\n\n    تعني **Pending Migrations** عادةً أن التثبيت حُدِّث لكن التحديث لم يكتمل. وهي\n    مهمة من يدير الخادم، لا شيء يُصلح من واجهة الويب.\n\n## قائمة المهام (Tasks Queue)\n\nتُسرد هنا الخدمتان العاملتان في الخلفية واللتان تنفّذان العمل — مثل معالجة\nالمستندات الواردة أو تشغيل سير العمل المجدول:\n\n| البند | ما يخبرك به |\n| --- | --- |\n| **Redis Status** | **OK** أو علامة حمراء. انقره لترى العنوان، أو العنوان مع الخطأ. |\n| **Celery Status** | **OK** أو علامة حمراء. انقره لترى العنوان، أو الخطأ. |\n| **Recent Task Activity (_n_ days)** | ملخّص صغير: **Total** و**Successful** و**Failed** و**Pending**، أو **No recent tasks** إن لم يجرِ شيء. |\n\nولمعرفة المهام نفسها — أي مستند، ومتى، وما الذي فشل — استعمل\n[المهام (Tasks)](tasks.md).\n\n## الصحة (Health)\n\n| البند | ما يخبرك به |\n| --- | --- |\n| **Search Index** | **OK** أو خطأ. انقره لترى وقت **Last Updated**. وإن لم يعمل فهرس البحث بقيت المستندات موجودة، لكن البحث لن يعثر عليها. |\n| **Classifier** | الجزء الذي يتعلّم طريقة ترتيبك للمستندات. **OK** أو تحذير أو خطأ، مع وقت **Last Trained** في النافذة المنبثقة. |\n| **Sanity Checker** | فحص دوري يبحث عن المستندات التالفة وغيرها من التناقضات. **OK** أو تحذير أو خطأ، مع وقت **Last Run** في النافذة المنبثقة. |\n| **WebSocket Connection** | **OK** ما دام الرابط الحيّ بين المتصفّح والخادم قائمًا، أو **Error** إذا انقطع. وهو الرابط الذي يجعل تحديثات التقدّم تظهر من تلقاء نفسها. |\n| **AI Index** | لا يظهر إلا إذا كانت ميزات الذكاء الاصطناعي الاختيارية مشغّلة. **OK** أو تحذير أو خطأ، مع وقت **Last Run**. راجع [ميزات الذكاء الاصطناعي (AI Features)](../advanced/ai.ar.md). |\n\n!!! note \"عن التحذير الكهرماني\"\n\n    يعني مثلّث التحذير الكهرماني أن البند يعمل، لكن نتيجته الأخيرة أقدم من يوم.\n    وهذا في **Classifier** و**AI Index** يستحق النظر؛ أما في **Sanity Checker**،\n    الذي يعمل عادةً نحو مرّة في الأسبوع، فهو الحال المعتاد بين تشغيلين.\n\n## إعادة تشغيل فحص (Re-running a check)\n\nتحمل بعض البنود زرّ **Run Task** مع رمز تشغيل: **Classifier** و**Sanity Checker**\nو**AI Index**. والضغط عليه يطلب من التثبيت إعادة ذلك العمل فورًا، ويظهر مؤشّر\nدوران صغير أثناء تنفيذه. ولا تُعرض هذه الأزرار إلا للمستخدمين الأعلى صلاحية\n(Superuser)، لأنها تُطلق عملًا على الخادم.\n\nوكل ما عدا ذلك في التقرير للقراءة فقط.\n\n## قراءة التقرير (Reading the report)\n\nكل بند زرّ صغير. انقره (أو مرّر المؤشّر عليه) فتظهر نافذة صغيرة تشرح القيمة:\nالعنوان المستعمل، أو وقت آخر تشغيل، أو الخطأ الذي أُبلغ عنه.\n\n| الحالة | كيف تبدو |\n| --- | --- |\n| **OK** | علامة صحّ خضراء. |\n| **WARNING** | مثلّث كهرماني — يعمل، لكن شيئًا فيه يستحق النظر. |\n| **ERROR** | مثلّث أحمر — هذا الجزء فاشل. |\n| **DISABLED** | شرطة رمادية — هذا الجزء موقوف قصدًا. |\n\nوإذا كان شيء فاشلًا، فالمكانان التاليان هما [السجلات (Logs)](logs.md) للتفاصيل،\nو[المهام (Tasks)](tasks.md) للعمل الذي لم يكتمل.\n\nويضع **Copy** التقرير كله في الحافظة كنصّ عادي، وهي أسرع طريقة لتسليم الأرقام\nإلى من يدير خادمك أو لإرفاقها بطلب دعم.\n\n## مثال سريع\n\nبدا الأرشيف في مكتب هدى بطيئًا منذ يومين.\n\nتفتح **Settings** فتلاحظ أن زرّ **System Status** يحمل علامة حمراء بدل علامة الصحّ\nالخضراء المعتادة. فتضغطه. **Environment** و**Database** سليمان — **Media\nStorage** يُظهر مساحة كبيرة متبقية، وعمود الترحيلات يقول **Up to date**. وفي\n**Tasks Queue** يكون **Redis Status** بـ **OK**، لكن **Celery Status** يحمل\nعلامة حمراء؛ والضغط عليه يكشف خطأً بدل عنوان. وفي **Health** يكون **Search\nIndex** سليمًا، فمتى عادت القائمة إلى العمل صار البحث محدَّثًا.\n\nلقد توقّف العمّال العاملون في الخلفية، ولهذا لا شيء يُعالَج ولهذا يبدو التقرير\nمريضًا. فتضغط **Copy** وترسل التقرير إلى مدير خادمها، وتفتح\n[المهام (Tasks)](tasks.md) حيث تشرح بنود معالجة المستندات المعلّقة سبب عدم ظهور\nالمسحات الجديدة.\n\n## الإحصاءات (Statistics)\n\nالأرقام المتعلّقة بمحتوى الأرشيف — كم مستندًا وصل، وكيف يتوزّع على الوسوم\nوالمراسلين — ليست جزءًا من هذه النافذة. إنها في **Dashboard**؛ راجع\n[لوحة المعلومات والتنقّل (Dashboard & navigation)](../getting-started/dashboard.md).\n"},{"id":"logs","title":{"en":"Logs","ar":"السجلات"},"fileEn":"administration/logs.md","fileAr":"administration/logs.ar.md","en":"---\ntitle: Logs\n---\n\n# Logs\n\n**Logs** lets you read what the installation has been writing down while it\nworks. It is the first place to look when something did not happen the way you\nexpected and you want to know why. It sits in the sidebar under\n**Administration** and describes itself as *Review the log files for the\napplication and for email checking.*\n\n!!! note\n\n    **Logs** is shown to administrators only. If the sidebar has no **Logs** entry,\n    your account does not have the right to read them.\n\n## The three logs\n\nEach log is a separate tab across the top of the page, named after the log it\nshows. Only the logs that exist on your installation get a tab.\n\n| Tab | What is written there |\n| --- | --- |\n| **paperless.log** | The main record of the application: documents being consumed and filed, workflows and rules being applied, and any errors along the way. |\n| **mail.log** | What happened each time a mail account was checked: which messages were looked at, which were imported, and which were refused or failed. |\n| **celery.log** | The background workers that carry out the work — consuming files, sending mail, running scheduled jobs and the periodic checks. |\n\n## The controls\n\n| Control | What it does |\n| --- | --- |\n| **Show** _number_ **lines** | How much of the log to read, counted from the newest line backwards. The starting value is 5000, and you can step it up or down in hundreds. |\n| **Auto refresh** | On by default. The page re-reads the log every few seconds, so new lines appear on their own while you watch. |\n| **Jump to bottom** | A floating button that appears as soon as you scroll away from the newest line. Pressing it returns you to the end and starts following along again. |\n\nWhile a log is being fetched the page says **Loading...**.\n\n!!! tip\n\n    The newest entries are at the bottom of the page. If you are chasing a\n    problem that happened at a known moment, turn **Auto refresh** off first so\n    the page stops moving under your cursor, and lower the *
